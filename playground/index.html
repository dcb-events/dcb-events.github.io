  if (mode !== 'type') list.sort((a, b) => (a.key === '') - (b.key === '') || a.key.localeCompare(b.key));
  return list;
}

// The tags a projection watch is folded over, rendered the way an
// event carries them – so the lanes it follows can say so.
function watchedTags(model) {
  const found = new Set();
  for (const watch of session.pinned) {
    if (watch.kind !== 'projection') continue;
    for (const tag of Object.values(watch.tags || {})) {
      const type = tag && identifierTypeOf(model, tag.tagType);
      if (type && tag.tagValue !== null && tag.tagValue !== undefined) found.add(renderTag(type, String(tag.tagValue)));
    }
  }
  return found;
}

// The pointer never owns a lane – the whole page gets rebuilt under it
// on every move, which would drop a capture set on one element.
// Tracking through `window` survives that: each move measures the live
// track and turns the pointer's x into a position on the log.
function scrubToPointer(e, goTo) {
  const track = document.querySelector('.slanes .strack');
  if (!track) return false;
  const r = track.getBoundingClientRect();
  if (e.clientX < r.left - 8) return false;
  goTo(Math.round((e.clientX - r.left) / sandboxPitch()));
  return true;
}

// Follows the pointer across the window until the drag ends – a
// release, or a cancel: a touch that turns into a scroll never sends
// `pointerup`, and the listeners stayed on the window for good.
function trackPointer(onMove) {
  const stop = () => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', stop);
    window.removeEventListener('pointercancel', stop);
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', stop);
  window.addEventListener('pointercancel', stop);
}

function sandboxTimeline(model) {
  const total = session.log.length;
  const position = sessionPosition();
  const goTo = (next) => {
    const at = Math.max(0, Math.min(total, next));
    if (at === position) return;
    session.at = at === total ? null : at;
    saveSession();
    render();
  };
  const mode = state.sandboxLanes;
  const startDrag = (e) => {
    if (e.button !== 0 || !scrubToPointer(e, goTo)) return;
    trackPointer((ev) => scrubToPointer(ev, goTo));
  };

  // The step the playhead is inside – its events are the ones the page
  // above is about, so they are banded across every lane.
  const current = sessionStepAt(position);
  const pitch = sandboxPitch();
  const compact = mode === 'compact';
  const at = (n) => `${n * pitch}px`;
  const watched = mode === 'type' ? new Set() : watchedTags(model);
  const mark = (i) => {
    const event = session.log[i];
    const icon = eventIcon(model, event.type);
    const step = session.steps.find((s) => i >= s.from && i < s.to);
    const followed = compact && tagsOfEvent(model, event.type, event.data).some((tag) => watched.has(tag));
    return [h('span', {
      class: 'smark' + fallbackIconClass(icon)
        + (i >= position ? ' upcoming' : current && i >= current.from ? ' current' : ''),
      style: `left:${at(i + 0.5)}`,
      // Its position in the store, for a read in the Store column to
      // light up (`sandboxHighlight`).
      'data-at': String(i + 1),
      title: `${i + 1} · ${readable(event.type)}`
        + (Object.keys(event.data || {}).length ? ' · ' + payloadText(event.data) : '')
        + (step ? ' – from ' + readable(step.command) : ''),
    }, icon),
    followed ? h('span', { class: 'swatched' + (i >= position ? ' upcoming' : ''), style: `left:${at(i + 0.5)}` }) : null];
  };
  const ticks = [];
  for (let n = SANDBOX_RULER; n <= total; n += SANDBOX_RULER) ticks.push(n);

  // What the playhead is just after, said in words – the marks are
  // icons, and the one that matters should not need a hover.
  const last = position ? session.log[position - 1] : null;
  const lastIcon = last && eventIcon(model, last.type);
  const lastStep = last && session.steps.find((s) => position - 1 >= s.from && position - 1 < s.to);

  const lanesButton = (value, label) => h('button', {
    class: 'btn tiny', type: 'button', 'aria-pressed': mode === value ? 'true' : 'false',
    onclick: () => { state.sandboxLanes = value; render(); },
  }, label);

  return h('section', { class: 'sbx-dock', 'aria-label': 'Timeline' },
    h('div', { class: 'sbx-transport' },
      h('span', { class: 'sbx-title' }, 'Timeline'),
      h('button', {
        class: 'btn tiny', type: 'button', disabled: position === 0, title: 'Back one event',
        onclick: () => goTo(position - 1),
      }, '◀'),
      h('button', {
        class: 'btn tiny', type: 'button', disabled: position === total, title: 'On one event',
        onclick: () => goTo(position + 1),
      }, '▶'),
      h('span', { class: 'small' }, `${position} of ${total}`),
      current ? h('span', { class: 'muted small' },
        `· step ${session.steps.indexOf(current) + 1} of ${session.steps.length}`) : null,
      last ? h('span', { class: 'sbx-at' },
        h('span', { class: 'chip event' },
          h('i', { class: 'ic' + fallbackIconClass(lastIcon) }, lastIcon), readable(last.type)),
        tagsOfEvent(model, last.type, last.data).map((tag) => h('code', { class: 'muted' }, tag)),
        lastStep ? h('span', { class: 'muted small' }, 'from ' + readable(lastStep.command)) : null)
        : h('span', { class: 'grow' }),
      h('span', { class: 'sbx-lanes', role: 'group', 'aria-label': 'Lanes' },
        h('span', { class: 'muted small' }, 'Lanes'),
        lanesButton('compact', 'compact'),
        lanesButton('tag', 'by tag'),
        lanesButton('type', 'by event type'))),
    total
      ? h('div', {
          class: 'slanes', tabindex: '0', role: 'slider',
          'aria-label': 'Position in the run',
          'aria-orientation': 'horizontal', 'aria-valuemin': '0', 'aria-valuemax': String(total),
          'aria-valuenow': String(position), 'aria-valuetext': `${position} of ${total}`,
          title: 'Drag, click, or use the arrow keys to move through the run',
          onpointerdown: startDrag,
          onscroll: (e) => {
            sandboxLanesView.left = e.currentTarget.scrollLeft;
            sandboxLanesView.top = e.currentTarget.scrollTop;
          },
          onkeydown: (e) => {
            if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(position - 1); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); goTo(position + 1); }
            else if (e.key === 'Home') { e.preventDefault(); goTo(0); }
            else if (e.key === 'End') { e.preventDefault(); goTo(total); }
          },
        },
          h('div', {
            class: 'slanes-in' + (compact ? ' compact' : ''),
            style: `--pitch:${pitch}px;--n:${total};--pos:${position}`,
          },
            h('span', { class: 'splayed' }),
            current ? h('span', {
              class: 'sband',
              style: `--a:${current.from};--w:${Math.min(current.to, position) - current.from}`,
            }) : null,
            h('div', { class: 'slane ruler' },
              h('span', { class: 'slabel' }),
              h('span', { class: 'strack' },
                ticks.map((n) => h('span', { class: 'stick', style: `left:${at(n)}` }, String(n))))),
            sandboxLanes(model, mode).map((lane) => h('div', { class: 'slane' },
              h('span', {
                class: 'slabel' + (watched.has(lane.key) ? ' watched' : ''),
                title: compact ? null : (typeof lane.label === 'string' ? lane.label : readable(lane.key))
                  + ` – ${lane.events.length} event${lane.events.length === 1 ? '' : 's'}`,
              }, lane.label),
              h('span', { class: 'strack' }, lane.events.map(mark)))),
            h('span', { class: 'splayhead' })))
      : h('div', { class: 'empty sbx-none' }, 'Nothing has happened yet.'));
}

// A repaint rebuilds the lanes, which would put them back at the left
// edge on every move. So the scroll is kept here and put back, and a
// playhead that has moved out of view is brought back to the middle –
// never while someone is looking along the run with the playhead
// staying where it is.
const sandboxLanesView = { left: 0, top: 0, position: -1 };
function keepLanesInView() {
  const lanes = document.querySelector('.slanes');
  const label = lanes && lanes.querySelector('.slabel');
  if (!label) return;
  const view = sandboxLanesView;
  lanes.scrollTop = view.top;
  lanes.scrollLeft = view.left;
  const position = sessionPosition();
  if (position !== view.position) {
    view.position = position;
    const pitch = sandboxPitch();
    const x = position * pitch;
    const width = lanes.clientWidth - label.offsetWidth;
    if (x < lanes.scrollLeft + pitch || x > lanes.scrollLeft + width - pitch) {
      lanes.scrollLeft = Math.max(0, x - width / 2);
    }
  }
  view.left = lanes.scrollLeft;
  view.top = lanes.scrollTop;
}

// ---------- what the current step saw ----------
//
// The boundary is re-derived rather than remembered. A definition
// edited while a session is open changes what this shows, which is the
// point of having both open at once – and if the edit means the
// command would no longer go through, that is worth being told rather
// than being shown a boundary that no longer applies.
function sandboxDecision(model) {
  const position = sessionPosition();
  const step = sessionStepAt(position);
  if (!step) {
    return h('div', { class: 'card' },
      h('div', { class: 'empty' }, 'Nothing has happened yet.'));
  }

  let result;
  try {
    result = evaluateCommand(model, session.log.slice(0, step.from), step.command, step.args);
  } catch (error) {
    return h('div', { class: 'card', style: 'border-color:var(--danger)' },
      h('div', { class: 'small' },
        readable(step.command) + ' can no longer be worked out here: ' + evaluationFailure(error)));
  }

  const stale = result.outcome === 'rejected'
    ? h('div', { class: 'card', style: 'border-color:var(--danger);margin-bottom:8px' },
        h('div', { class: 'small' },
          'This went through when it was done, and would be refused now: '
          + (result.failedRule.rejection ? `\u201c${result.failedRule.rejection}\u201d (${result.failedRule.text})`
            : result.failedRule.text)
          + '. Everything after it on the timeline followed from it.'))
    : null;

  const reads = Object.entries(result.reads || {});
  return h('div', {},
    stale,
    reads.length
      ? reads.map(([alias, read]) => read.kind === 'projection'
        ? h('div', { class: 'card sc-line' },
            pinButton(projectionWatch(read.projection, read.tags, read.arguments)),
            h('span', { class: 'k' }, alias + ' – '),
            h('span', { class: 't' }, readable(read.projection)),
            h('span', { class: 'k' }, '  ' + initialValueWords(read.value)))
        : h('div', { class: 'card' },
            h('div', { class: 'sc-line' },
              h('span', { class: 'k' }, alias + ' – '),
              h('span', { class: 't' }, readable(read.entity)),
              read.fanned ? h('span', { class: 'k' }, `  (${read.instances.length})`) : null),
            // The declared absence, seen happening: the read bound
            // nothing, and every rule over it stepped aside.
            read.absent
              ? h('div', { class: 'sc-line' },
                  h('span', { class: 'k' }, '  bound nothing – its identifier is unset (null)'))
              : null,
            read.instances.map((instance) => h('div', { class: 'sc-line' },
              pinButton(entityWatch(read.entity + ':' + instance.id)),
              h('span', { class: 't' }, instance.id),
              h('span', { class: 'k' }, '  ' + payloadText(instance.properties))))))
      : h('div', { class: 'card' }, h('div', { class: 'empty' }, 'It looked at nothing.')));
}

function pinButton(watch) {
  const on = isPinned(watch);
  return h('button', {
    class: 'pin' + (on ? ' on' : ''),
    title: on ? 'Stop watching this one' : 'Watch this one wherever you are on the timeline',
    onclick: () => togglePinned(watch),
  }, on ? '★' : '☆');
}

function entityWatch(tag) { return { kind: 'entity', tag }; }
// A watched read: a value for each tag the projection declares –
// `[{name, type, value}]` as a run reports them, or already named tag
// literals – kept by name as tag literals, the spelling the code view
// shows (`CourseId("c1")`), and the arguments.
function projectionWatch(projection, tags, args) {
  const named = {};
  if (Array.isArray(tags)) {
    for (const tag of tags) named[tag.name] = { tagType: tag.type, tagValue: tag.value };
  } else {
    for (const [name, tag] of Object.entries(tags || {})) named[name] = { tagType: tag.tagType, tagValue: tag.tagValue };
  }
  return { kind: 'projection', projection, tags: named, arguments: args || {} };
}

// What a watch is folded as – the read the evaluator takes.
function watchRead(watch) {
  const tags = {};
  for (const [name, tag] of Object.entries(watch.tags || {})) tags[name] = tag && tag.tagValue;
  return { tags, args: watch.arguments || {} };
}

// One watched projection, folded at the position being looked at.
function projectionWatchCard(model, watch) {
  const projection = model['projection-definitions'][watch.projection];
  // The query this watch actually runs, with the watched values in it –
  // not `<courseId>` but `course:c1`. The sandbox is the one place the
  // arguments are concrete, so it is the one place the query can be
  // shown the way the store would receive it.
  // A derived projection runs its operands' queries, each under its own
  // tags (`foldedReads`), so it shows one line per projection it folds.
  const queryIcon = projection ? (() => {
    const read = watchRead(watch);
    let queries;
    try {
      queries = foldedReads(model, { projection: watch.projection, tags: read.tags }).map(({ read: folded }) => {
        const tags = {};
        for (const [name, value] of Object.entries(folded.tags || {})) {
          tags[name] = operandSource(value) === 'tag-literal' ? value.tagValue : value;
        }
        const target = model['projection-definitions'][folded.projection];
        return {
          tags: projectionQueryTags(model, folded.projection, { tags, args: read.args }),
          types: uniq(((target && target.handlers) || []).map((x) => x && x.event).filter(Boolean)).sort(),
        };
      });
    } catch (error) { return null; }
    // A derived projection folds each operand on its own: a call each.
    return queryPopover('watch:' + watchKey(watch), 'what this watch queries',
      h('div', { class: 'dq' }, ...queries.map((query, i) => queryBox([query], 'query',
        queries.length > 1 ? `call ${i + 1} of ${queries.length}` : '1 call'))));
  })() : null;
  const head = (...rest) => h('div', { class: 'card' },
    h('div', { class: 'sc-line' },
      pinButton(watch),
      h('span', { class: 't' }, readable(watch.projection)),
      Object.keys(watch.tags || {}).length
        ? h('span', { class: 'k' }, '  tagged ' + Object.values(watch.tags).map(operandText).join(', '))
        : h('span', { class: 'k' }, '  the whole log'),
      Object.keys(watch.arguments || {}).length
        ? h('span', { class: 'k' }, '  with ' + payloadText(watch.arguments))
        : null,
      queryIcon),
    ...rest);

  if (!projection) return head(h('div', { class: 'sc-line' }, h('span', { class: 'k' }, '  gone from this model')));

  const held = foldWatch(model, watch);
  if (held.error) {
    return head(h('div', { class: 'sc-line' }, h('span', { class: 'k' }, '  – ' + held.error)));
  }

  // A script that `exposes` one field keeps the rest of its record as
  // bookkeeping a condition never sees – hidden from the *boundary*,
  // not from the person watching the script work. So under the value a
  // reader gets, the watch also shows the whole record it came from.
  const script = scriptOf(projection);
  const inside = script && script.exposes !== undefined
    ? foldWatch(model, watch, foldProjectionState)
    : null;
  return head(
    h('div', { class: 'sc-line' }, h('span', { class: 'val' }, initialValueWords(held.value))),
    inside ? h('div', { class: 'sc-line' },
      h('span', { class: 'k' }, '  keeping '),
      h('span', { class: 'k' }, inside.error
        ? '– ' + inside.error
        : (inside.value !== null && typeof inside.value === 'object' && !Array.isArray(inside.value)
          ? payloadText(inside.value)
          : JSON.stringify(inside.value)))) : null);
}

function foldWatch(model, watch, fold, log = sessionVisible()) {
  try {
    return { value: (fold || foldProjection)(model, log, watch.projection, watchRead(watch)) };
  } catch (error) {
    return { error: evaluationFailure(error) };
  }
}

// The card for whatever kind of thing is being watched.
function watchCard(model, watch) {
  return watch.kind === 'projection'
    ? projectionWatchCard(model, watch)
    : instanceStateCard(model, watch.tag);
}

// One instance's full current state, as a card – the same rendering
// whether it got here by being pinned or by having been read.
function instanceStateCard(model, tag) {
  const held = sessionInstanceState(model, tag);
  if (!held) {
    return h('div', { class: 'card' },
      h('div', { class: 'sc-line' }, pinButton(entityWatch(tag)),
        h('span', { class: 'k' }, tag + ' – gone from this model')));
  }
  return h('div', { class: 'card' },
    h('div', { class: 'sc-line' },
      pinButton(entityWatch(tag)),
      h('span', { class: 't' }, readable(held.entity) + ' ' + held.id)),
    held.properties.map((property) => h('div', { class: 'sc-line' },
      h('span', { class: 'k' }, '  ' + propertyWords(property.name) + ' '),
      property.error
        ? h('span', { class: 'k' }, '– ' + property.error)
        : h('span', {}, JSON.stringify(property.value)))));
}

// ---------- what is watched ----------
//
// The panel's first tab, and the one it opens on: a watch is the thing
// you came to see change. Tiles in a grid that fills the panel's width,
// so many of them stay one screen. Each tile is the card a watch has
// always been, plus two things only a board of them can afford: whether
// the step at the playhead changed it, and its value over the whole
// run, squeezed to the tile's width – a glance at its shape, where the
// timeline above is the run at full length.
function sandboxWatched(model) {
  const names = Object.keys(model['projection-definitions']).sort();
  return h('div', { class: 'sbx-watched' },
    state.watchDraft && names.length ? watchProjectionAdder(model, names) : null,
    session.pinned.length
      ? h('div', { class: 'sbx-tiles' }, session.pinned.map((watch) => watchTile(model, watch)))
      : h('div', { class: 'muted small' }, 'Nothing watched. ☆ a read in Decision, or + Watch, to follow it here at every point of the run.'));
}

// How many watches the step at the playhead changed – said on the tab,
// so a change is noticed without opening it.
function watchesChangedByStep(model) {
  const step = sessionStepAt(sessionPosition());
  if (!step) return 0;
  return session.pinned.filter((watch) => {
    const before = watchValueAt(model, watch, session.log.slice(0, step.from));
    const now = watchValueAt(model, watch, sessionVisible());
    return before && now && before.key !== now.key;
  }).length;
}

// What one watch reads as after `log` – comparable as `key`, plottable
// as `num` when it is a number (a list, by its length).
function watchValueAt(model, watch, log) {
  let value;
  if (watch.kind === 'projection') {
    if (!model['projection-definitions'][watch.projection]) return null;
    const held = foldWatch(model, watch, null, log);
    if (held.error) return { key: '\0' + held.error, words: '–', num: null };
    value = held.value;
  } else {
    const held = sessionInstanceState(model, watch.tag, log);
    if (!held) return null;
    value = Object.fromEntries(held.properties.map((p) => [p.name, p.error ? '\0' + p.error : p.value]));
  }
  return {
    key: JSON.stringify(value === undefined ? null : value),
    words: watch.kind === 'projection' ? initialValueWords(value) : payloadText(value),
    num: typeof value === 'number' ? value : Array.isArray(value) ? value.length : null,
  };
}

// The value at the end of every step – the run a history line draws.
// Folding from zero at each boundary is quadratic in the run, so it is
// done once per log, model and watch rather than once per repaint:
// scrubbing repaints on every pointer move and changes none of them.
const watchSeriesCache = { model: null, log: null, length: -1, byKey: new Map() };
function watchSeries(model, watch) {
  const cache = watchSeriesCache;
  if (cache.model !== model || cache.log !== session.log || cache.length !== session.log.length) {
    Object.assign(cache, { model, log: session.log, length: session.log.length, byKey: new Map() });
  }
  const key = watchKey(watch);
  if (!cache.byKey.has(key)) {
    const at = [0, ...session.steps.map((s) => s.to)];
    cache.byKey.set(key, at.map((n) => ({ at: n, value: watchValueAt(model, watch, session.log.slice(0, n)) })));
  }
  return cache.byKey.get(key);
}

// The line under a tile. A number is drawn as a level that holds
// between steps; anything else as a tick wherever it changed. Null, or
// a fold that failed, is no value rather than a different kind of one:
// it breaks the level, so a projection that starts at null and becomes
// a number is drawn from where it does. The part already played is
// drawn in the projection colour, the rest faint, and the playhead at
// the same fraction of the run.
function watchHistory(model, watch) {
  const total = session.log.length;
  if (!total) return null;
  const series = watchSeries(model, watch).filter((p) => p.value);
  if (!series.length) return null;
  const position = sessionPosition();
  const x = (n) => (n / total * 100).toFixed(2);
  const nums = series.map((p) => p.value.num);
  const gap = (p) => p.value.num === null && (p.value.key === 'null' || p.value.key[0] === '\0');
  let played = '';
  let rest = '';
  if (nums.some((n) => n !== null) && series.every((p) => p.value.num !== null || gap(p))) {
    const known = nums.filter((n) => n !== null);
    const lo = Math.min(...known);
    const span = Math.max(...known) - lo || 1;
    const y = (n) => (21 - (n - lo) / span * 18).toFixed(2);
    // One run of levels per stretch of numbers, each ending where the
    // next point has no value, or at the end of the log.
    const runs = [];
    series.forEach((p, i) => {
      if (nums[i] === null) return;
      if (!i || nums[i - 1] === null) runs.push([]);
      const run = runs[runs.length - 1];
      if (run.length) run.push([p.at, nums[i - 1]]);
      run.push([p.at, nums[i]]);
      if (i === series.length - 1) run.push([total, nums[i]]);
      else if (nums[i + 1] === null) run.push([series[i + 1].at, nums[i]]);
    });
    const line = (pts, cls) => pts.length > 1
      ? `<polyline class="${cls}" points="${pts.map(([n, v]) => x(n) + ',' + y(v)).join(' ')}"/>` : '';
    for (const run of runs) {
      const upTo = run.filter(([n]) => n <= position);
      const last = upTo[upTo.length - 1];
      rest += line(run, 'rest');
      played += line(last && upTo.length < run.length ? [...upTo, [position, last[1]]] : upTo, 'played');
    }
  } else {
    series.forEach((p, i) => {
      if (!i || p.value.key === series[i - 1].value.key) return;
      const tick = `<line class="${p.at <= position ? 'played' : 'rest'}" x1="${x(p.at)}" x2="${x(p.at)}" y1="4" y2="21"/>`;
      if (p.at <= position) played += tick; else rest += tick;
    });
    rest = `<line class="rest" x1="0" x2="100" y1="21" y2="21"/>` + rest;
  }
  return h('span', { class: 'sbx-hist', 'aria-hidden': 'true' },
    svg(`<svg viewBox="0 0 100 24" preserveAspectRatio="none">${rest}${played}`
      + `<line class="head" x1="${x(position)}" x2="${x(position)}" y1="0" y2="24"/></svg>`));
}

function watchTile(model, watch) {
  const card = watchCard(model, watch);
  card.classList.add('sbx-tile');
  const position = sessionPosition();
  const step = sessionStepAt(position);
  if (step) {
    const before = watchValueAt(model, watch, session.log.slice(0, step.from));
    const now = watchValueAt(model, watch, sessionVisible());
    const changed = before && now && before.key !== now.key;
    if (changed) card.classList.add('changed');
    card.appendChild(h('div', { class: 'sbx-delta' + (changed ? ' changed' : '') },
      changed ? 'was ' + before.words : `unchanged by step ${session.steps.indexOf(step) + 1}`));
  }
  const history = watchHistory(model, watch);
  if (history) card.appendChild(history);
  return card;
}

// Picking a projection to watch, and the arguments to watch it at. The
// arguments are values typed in, exactly as a scenario's are – there is
// no command here to draw an operand from.
function watchProjectionAdder(model, names) {
  if (!state.watchDraft) return null;

  const draft = state.watchDraft;
  const projection = model['projection-definitions'][draft.projection];
  const slots = projectionSlots(projection);
  const where = { root: () => state.watchDraft, suggest: (type) => sessionIdentifiers(model, type) };
  // One value per tag the projection declares, kept in step with it.
  const declared = projectionTagParams(projection);
  const held = draft.tags && typeof draft.tags === 'object' && !Array.isArray(draft.tags) ? draft.tags : {};
  draft.tags = {};
  for (const tag of declared) {
    const value = held[tag.name];
    draft.tags[tag.name] = { tagType: tag.tagType, tagValue: value && value.tagValue !== undefined ? value.tagValue : '' };
  }

  return h('div', { class: 'card sc-step', style: 'margin-bottom:12px;max-width:640px' },
    h('div', { class: 'row' },
      pick(names.map((n) => [n, readable(n)]), draft.projection, (v) => {
        state.watchDraft = { projection: v, tags: blankScenarioTags(model, v), arguments: {} };
        render();
      }),
      h('span', { class: 'grow' })),
    declared.length
      ? declared.map((tag) => h('div', { class: 'row' },
          h('span', { class: 'muted tiny', style: 'min-width:90px' }, propertyWords(tag.name)),
          valueEditor(model, { name: tag.name, propertyType: tag.tagType, isList: false },
            ['tags', tag.name, 'tagValue'], where)))
      : h('div', { class: 'muted tiny' }, 'untagged – it reads the whole log'),
    slots.map((slot) => h('div', { class: 'row' },
      h('span', { class: 'muted tiny', style: 'min-width:90px' }, 'with ' + propertyWords(slot.name)),
      valueEditor(model, { name: slot.name, propertyType: slot.propertyType, isList: false },
        ['arguments', slot.name], where))),
    h('div', { class: 'adder', style: 'margin-top:8px' },
      h('button', {
        class: 'btn primary',
        onclick: () => {
          for (const tag of Object.values(draft.tags || {})) {
            if (tag.tagValue === undefined || tag.tagValue === '' || tag.tagValue === null) {
              return toast(`Say which ${readable(tag.tagType)} to watch it tagged by.`, true);
            }
          }
          // The draft must close before the pin repaints: `togglePinned`
          // renders, and a paint with the draft still set leaves this
          // form on screen holding a stale closure – whose resubmission
          // carries the old arguments and so *unpins* the watch it just
          // added.
          const watch = projectionWatch(draft.projection, deepClone(draft.tags || {}), { ...draft.arguments });
          state.watchDraft = null;
          togglePinned(watch);
        },
      }, 'Watch it'),
      h('button', {
        class: 'btn ghost',
        onclick: () => { state.watchDraft = null; render(); },
      }, 'Cancel')));
}

// Every identifier of a given type used so far in the run – the
// sandbox's answer to `identifiersInUse`: what the events carry and
// what the commands were given, the whole run and not only up to the
// playhead, since the next command always runs after the last event.
// Read off the payloads rather than the tags: a tag is rendered through
// its type's `tagSchema`, and the type is not reliably read back out.
function sessionIdentifiers(model, typeName) {
  const found = new Set();
  for (const event of session.log) {
    harvestIdentifiers(model, event.data, (model['event-definitions'][event.type] || {}).properties, typeName, found);
  }
  for (const step of session.steps) {
    harvestIdentifiers(model, step.args, (model['command-definitions'][step.command] || {}).properties, typeName, found);
  }
  return [...found].sort();
}

// ---------- what the involved decision models look like now ----------
//
// `sandboxDecision` is frozen at the instant the step decided; this
// moves as you scrub. An entity's "now" is its full state – the same
// card `instanceStateCard` gives a pinned instance – not only the
// properties the decision happened to touch, which is the boundary's
// story to tell, not this one's. A projection has no properties to
// enumerate, so its "now" is the same read folded again over the log
// as it stands here, with the tags and arguments the step resolved.
// Deciding the command again would not do: a refusal stops short of
// the reads after the rule that refused it.
function sandboxNow(model) {
  const position = sessionPosition();
  const step = sessionStepAt(position);
  if (!step) {
    return h('div', { class: 'card' },
      h('div', { class: 'empty' }, 'Nothing has happened yet.'));
  }

  let then;
  try {
    then = evaluateCommand(model, session.log.slice(0, step.from), step.command, step.args);
  } catch (error) {
    return h('div', { class: 'card' },
      h('div', { class: 'empty' }, 'See Reads.'));
  }

  const reads = Object.entries(then.reads || {});
  if (!reads.length) {
    return h('div', { class: 'card' }, h('div', { class: 'empty' }, 'It involved nothing.'));
  }

  return h('div', {},
    reads.map(([alias, read]) => {
      if (read.kind !== 'projection') {
        return h('div', {},
          h('div', { class: 'muted tiny' },
            alias + ' – ' + readable(read.entity)
              + (read.fanned ? ` (${read.instances.length})` : '')
              + (read.absent ? ' – bound nothing (identifier unset)' : '')),
          read.instances.map((instance) =>
            instanceStateCard(model, read.entity + ':' + instance.id)));
      }
      // Pinnable like an instance is: a numbering read by one step is
      // usually the thing you then want to follow across every other
      // one.
      const watch = projectionWatch(read.projection, read.tags, read.arguments);
      const now = foldWatch(model, watch);
      return h('div', { class: 'card sc-line' },
        pinButton(watch),
        h('span', { class: 'k' }, alias + ' – '),
        h('span', { class: 't' }, readable(read.projection)),
        now.error
          ? h('span', { class: 'k' }, '  can no longer be worked out here: ' + now.error)
          : h('span', { class: 'k' }, '  ' + initialValueWords(now.value)));
    }));
}

// ---------- the page ----------
//
// Three fixed bands, top to bottom: the header with the driver, the
// timeline, and the panel – Watched, Decision, Store. Only the panel
// scrolls – a long run must not push the timeline off the screen, which
// is what the one long column did. Below the narrow breakpoint the
// bands go back to flowing with the page.

// The step at the playhead: what it was asked, and what it appended.
// Its events past the playhead are on the page but faint – the
// position can sit inside a step, and those have not happened yet.
function sandboxAppended(model) {
  const position = sessionPosition();
  const step = sessionStepAt(position);
  if (!step) return h('div', { class: 'empty' }, '–');
  return h('div', {},
    h('div', { class: 'sc-line' },
      h('span', { class: 'ic' + fallbackIconClass(commandIcon(model, step.command)) }, commandIcon(model, step.command)),
      ' ', h('span', { class: 'c' }, readable(step.command)),
      h('span', { class: 'k' }, '  ' + payloadText(step.args))),
    h('div', { class: 'card sc-line' },
      session.log.slice(step.from, step.to).map((event, i) => h('div', {
        class: step.from + i >= position ? 'sbx-upcoming' : '',
      },
        h('span', { class: 'k' }, String(step.from + i + 1) + '  '),
        h('span', { class: 'ic' + fallbackIconClass(eventIcon(model, event.type)) }, eventIcon(model, event.type)),
        ' ', h('span', { class: 'y' }, readable(event.type)),
        h('span', { class: 'k' }, '  ' + payloadText(event.data))))));
}

// ---------- what the step asked the store ----------
//
// The step's calls to the event store, in order (_DCB queries, shown_):
// head, each read with its query and what it returned, the append with
// its condition and where it landed. Worked out again on every repaint,
// like Reads – the command decided anew against the log as it stood
// before the step – so an edit to the model shows here at once, and a
// step that would not go through now shows its calls as far as they
// got.
function sandboxHighlight(positions) {
  for (const node of document.querySelectorAll('.smark.sbx-hit')) node.classList.remove('sbx-hit');
  for (const at of positions || []) {
    for (const node of document.querySelectorAll(`.smark[data-at="${at}"]`)) node.classList.add('sbx-hit');
  }
}

// The step decided again, against the log as it stood before it, with
// every call to the store traced.
function sandboxStoreRun(model, step) {
  const trace = [];
  const outcome = handleCommand(model, sessionStore(model, session.log.slice(0, step.from)), step.command, step.args, { trace });
  return { trace, outcome };
}

function sandboxStore(model, run) {
  const step = sessionStepAt(sessionPosition());
  if (!step) return h('div', { class: 'card' }, h('div', { class: 'empty' }, 'Nothing has happened yet.'));
  const { trace, outcome } = run || sandboxStoreRun(model, step);
  const json = queryAsJson();
  const reads = [];
  let n = 0;
  const eventLine = (event, position) => h('div', { class: 'ev-line' },
    position !== undefined ? h('span', { class: 'k' }, String(position)) : null,
    h('span', { class: 'dq-type' }, event.type),
    (event.tags || []).map(queryTagChip));
  const copyable = (value) => {
    const text = queryJsonText(value);
    return h('div', {},
      jsonBlock(text),
      h('button', {
        class: 'btn tiny', type: 'button', style: 'margin-top:4px',
        onclick: (e) => { e.stopPropagation(); navigator.clipboard.writeText(text).then(() => toast('Copied.')); },
      }, 'Copy'));
  };
  const card = (entry, verb, result, rest, attrs = {}) => h('div', { class: 'sbx-call', ...attrs },
    h('span', { class: 'num' }, String(++n)),
    h('div', { class: 'body' },
      h('div', {}, h('span', { class: 'verb' }, verb), h('span', { class: 'k' }, '  → ' + result)),
      entry.failed ? h('div', { style: 'color:var(--danger)' }, 'failed: ' + entry.failed) : null,
      ...rest));
  const calls = trace.map((entry) => {
    if (entry.restart) return h('div', { class: 'k small' }, 'A second read nothing planned for: started over, with head.');
    if (entry.call === 'head') {
      return card(entry, 'head', entry.failed ? 'failed' : entry.position === undefined ? 'none – the store is empty' : String(entry.position), []);
    }
    if (entry.call === 'read') {
      reads.push(n + 1);
      const answered = entry.events || [];
      const positions = answered.map((e) => e.position);
      return card(entry, 'read', entry.failed ? 'failed' : `${answered.length} event${answered.length === 1 ? '' : 's'}`, [
        json
          ? copyable({ items: entry.query })
          : queryBox(entry.query, 'query', `${entry.query.length} item${entry.query.length === 1 ? '' : 's'}${entry.query.length > 1 ? ', ORed' : ''}`),
        ...answered.map((sequenced) => eventLine(sequenced.event, sequenced.position)),
      ], {
        class: 'sbx-call reads', tabindex: '0',
        title: 'Lights up on the timeline what this read returned',
        onmouseenter: () => sandboxHighlight(positions), onfocus: () => sandboxHighlight(positions),
        onmouseleave: () => sandboxHighlight([]), onblur: () => sandboxHighlight([]),
      });
    }
    const condition = entry.condition;
    const result = entry.failed ? 'failed'
      : entry.integrity ? 'refused – an event matching the condition came after'
        : `position ${entry.position}`;
    return card(entry, 'append', result, [
          json ? copyable(entry.events) : entry.events.map((event) => eventLine(event)),
          condition
            ? h('div', { class: 'dq-cond' },
                h('div', {}, h('b', {}, 'failIfEventsMatch'), ': ',
                  reads.length === 1 ? `the query of call ${reads[0]}` : `the items of calls ${reads.join(', ')}, as one query`),
                h('div', {}, h('b', {}, 'after'), ': ', queryAfterWords(condition.after),
                  trace.some((t) => t.call === 'head') ? h('span', { class: 'k' }, ' – head, taken first') : h('span', { class: 'k' }, ' – the last position read')))
            : h('div', { class: 'k' }, 'no condition – it read nothing, so there is nothing to be consistent with'),
        ]);
  });
  const now = outcome.outcome === 'rejected'
    ? `This went through when it was done, and would be refused now: \u201c${outcome.failedRule.rejection || outcome.failedRule.text}\u201d. These are the calls it makes now.`
    : outcome.outcome === 'error' ? `${readable(step.command)} can no longer be worked out here: ${outcome.message}` : null;
  return h('div', { class: 'sbx-calls' },
    now ? h('div', { class: 'card', style: 'border-color:var(--danger)' }, h('div', { class: 'small' }, now)) : null,
    calls.length ? calls : h('div', { class: 'card' }, h('div', { class: 'empty' }, 'It asked the store nothing.')));
}

// ---------- the panel under the timeline ----------
//
// Three things a run is looked at with, one at a time: what is watched,
// what the step at the playhead decided, and what it asked the store.
// Shown together they crowded each other out; as tabs each gets the
// whole width. Watched is the default – it is what a run is watched
// through – and its tab says how many the step changed, so a change is
// noticed from the others.
function sandboxPanel(model) {
  const step = sessionStepAt(sessionPosition());
  const current = state.sandboxTab || 'watched';
  const run = step && current === 'store' ? sandboxStoreRun(model, step) : null;
  const changed = watchesChangedByStep(model);
  const badge = (text, cls = '') => h('span', { class: 'sbx-badge' + cls }, text);
  const tab = (key, ...label) => h('button', {
    class: 'sbx-tab' + (current === key ? ' on' : ''), type: 'button', role: 'tab',
    'aria-selected': current === key ? 'true' : 'false',
    onclick: () => { state.sandboxTab = key; render(); },
  }, ...label);
  const names = Object.keys(model['projection-definitions']).sort();
  let body;
  if (current === 'watched') body = sandboxWatched(model);
  else if (!step) body = h('div', { class: 'empty' }, session.log.length ? 'Before the first step – nothing decided yet.' : 'Nothing has happened yet – run a command.');
  else if (current === 'store') body = sandboxStore(model, run);
  else {
    body = h('div', { class: 'sbx-cols' },
      h('div', { class: 'sbx-col' }, h('h4', {}, 'Append'), sandboxAppended(model)),
      h('div', { class: 'sbx-col' }, h('h4', {}, 'Reads'), sandboxDecision(model)),
      h('div', { class: 'sbx-col' }, h('h4', {}, 'Now'), sandboxNow(model)));
  }
  return h('section', { class: 'sbx-panel', 'aria-label': 'Watched, and the step at the playhead' },
    h('div', { class: 'sbx-tabs', role: 'tablist' },
      tab('watched', 'Watched ', badge(String(session.pinned.length)),
        changed ? badge(`${changed} changed`, ' changed') : null),
      tab('decision', 'Decision', step ? h('span', { class: 'muted small' }, ` step ${session.steps.indexOf(step) + 1}`) : null),
      tab('store', 'Store', run ? [' ', badge(`${run.trace.filter((t) => t.call).length} calls`)] : null),
      h('span', { class: 'grow' }),
      current === 'watched' && names.length
        ? h('button', {
            class: 'btn tiny', type: 'button', 'aria-expanded': state.watchDraft ? 'true' : 'false',
            onclick: () => {
              state.watchDraft = state.watchDraft ? null
                : { projection: names[0], tags: blankScenarioTags(model, names[0]), arguments: {} };
              render();
            },
          }, '+ Watch')
        : null,
      current === 'store' && step ? [
        hint('sandbox:store', 'Store', [
          'What the step asked the event store, call by call: head, each read with its DCB query and the events it returned, and the append with its condition.',
          'The append fails if an event matching failIfEventsMatch came after `after` – the position the decision saw.',
          'Hover a read to see its events on the timeline.',
        ], undefined, 'consistency-boundary'),
        queryViewSwitch(),
      ] : null),
    h('div', { class: 'sbx-panel-body' }, body));
}

function renderSandbox(model, main) {
  main.appendChild(h('header', {},
    h('div', { class: 'name' }, 'Sandbox',
      hint('sandbox', 'Sandbox', [
        'Run commands against each other and watch what happens. The run is kept in this tab '
        + 'across reloads; the model itself is never written to.',
        'A command always runs after the last event, wherever the playhead is.',
      ])),
    sandboxDriver(model),
    session.log.length
      ? removeButton('sandbox:reset', {
          label: 'Start over',
          title: 'Throw all of this away and start from nothing',
          confirm: 'Really start over?',
          onRemove: () => { state.sandboxDraft = null; sessionReset(); render(); },
        })
      : null));

  // Before the first command too: what a projection reads before
  // anything has happened is a real answer and often the interesting
  // one – a numbering's first value is the whole of what its initial
  // value states.
  main.appendChild(sandboxTimeline(model));
  main.appendChild(sandboxPanel(model));

  keepLanesInView();
}

// ============================================================
// Code – the whole model as text (see dsl.js), edited in place.
//
// A second surface over the same definitions rather than a page among
// the others: the toggle in the bar swaps the main area between the
// pages and the text, and the two follow each other. Opening the code
// lands on whatever definition the page was showing; going back lands
// on the page of the definition the cursor is in. The rail stays, and
// a click on a command, entity, event or projection reveals it in the
// text; a click on anything else (the sandbox, the overviews) shows
// that page, keeping whatever was typed.
//
// The text is a draft until applied – ⌘S, the Apply button, or going
// back to the pages, which applies a text that parses and keeps one
// that does not. An apply is one append (`replaceDefinitions`) and so
// one undo step. What the author typed stays in the editor after an
// apply, comments and all; it is replaced by a fresh print only when
// the model changes under a clean text (an undo, an agent, another
// page). A text with edits is never replaced – it is marked stale
// instead, since applying it now would put back what changed.
//
// Monaco is the editor when it loads (the same lazily loaded copy the
// scripted handlers use, see shared.js), with the grammar from dsl.js,
// errors and advisories as markers, an outline, a hover showing each
// command's derived boundary, and dsl.js's language service behind
// completion, go to definition, references and rename; a plain
// textarea otherwise, which is everything that is needed.
// ============================================================

const SURFACE_KEY = 'dcb-playground:surface';
function setCodeSurface(on) {
  state.code = on;
  localStorage.setItem(SURFACE_KEY, on ? 'code' : 'visual');
}

// How folded a model's text opens – nothing, its scenarios groups, or
// every definition with its scenarios folded inside – remembered per
// browser, like the surface; scenarios unless asked.
const SCENARIO_FOLD_KEY = 'dcb-playground:code-scenarios';
const CODE_FOLDS = ['open', 'scenarios', 'all'];
function storedCodeFold() {
  const stored = localStorage.getItem(SCENARIO_FOLD_KEY);
  return stored === 'open' || stored === 'all' ? stored : 'scenarios';
}

// The pages about definitions – what the code follows. Any other page
// (the Overview, the sandbox, the cross-cutting overviews) is shown as
// a page while the surface stays Code: only the Visual button leaves
// it, and a way from that page to a definition – an Overview card, a
// chip – lands on it in the code. Switching to Code on the Overview
// itself goes to the code (`enterCode`).
const CODE_FOLLOWS = ['slice', 'entity', 'events', 'projections', 'types'];
function codeShown() { return !!state.code && CODE_FOLLOWS.includes(state.view); }
// Where the toggle does something: the definition pages, and the
// Overview, whose Code always opens the code (`enterCode`).
function codeFollowsPage() { return CODE_FOLLOWS.includes(state.view) || state.view === 'overview'; }

// The definition under the cursor as the code is left, to come back to
// from the Overview.
function rememberCodePlace(model) {
  syncCodeView(model);
  const line = codeCursorLine();
  const at = line ? sourceSpanAt(analyseCode(model).parsed, line) : null;
  if (at) codeView.last = { modelId: model.id, kind: at.kind, name: at.name };
}

// A rail link to a whole kind's page; in the code, a jump to where
// that kind's definitions start – every click, not only the first.
function openKindPage(view) {
  closeForms();
  state.view = view;
  if (state.code) {
    if (view === 'events') state.openEvent = null;
    codeView.focus = undefined;
  }
  render();
}

const codeView = {
  modelId: null,
  text: '',             // what the editor holds
  base: '',             // the text the model is known to say
  printed: '',          // the model's own print at `revision`
  revision: -1,
  stale: false,         // the model moved under a text with edits
  shownView: null,      // the page state the code was last shown over
  focus: null,          // the definition last revealed for it
  section: null,        // a kind to reveal the start of, once, over the page's own
                        // – or a [kind, name] to reveal that definition
  last: null,           // { modelId, kind, name } under the cursor as the code was left
  revealedInEditor: false,
  analysis: null,       // { text, parsed, errors, advisories }
  editor: null,         // { root, editor, model } once Monaco is up
  loading: false,       // writing into Monaco, not the author typing
  timer: null,
  statusEl: null,       // the strip under the editor
  cursorEl: null,
  listEl: null,
  drafts: new Map(),    // model id → a text left unapplied on another model
  fold: storedCodeFold(),
};

function codeDirty() { return codeView.text !== codeView.base; }

// Brings the held text up to date with the model it is about.
function syncCodeView(model) {
  const now = logRevisionNow();
  if (codeView.modelId !== model.id) {
    if (codeView.modelId && codeDirty()) codeView.drafts.set(codeView.modelId, { ...codeView });
    const kept = codeView.drafts.get(model.id);
    codeView.drafts.delete(model.id);
    const printed = modelSource(model);
    Object.assign(codeView, kept
      ? { text: kept.text, base: kept.base, printed: kept.printed, revision: kept.revision }
      : { text: printed, base: printed, printed, revision: now });
    codeView.modelId = model.id;
    codeView.stale = !!kept && (kept.stale || kept.printed !== printed);
    codeView.focus = null;
    codeView.analysis = null;
    return;
  }
  if (codeView.revision === now) return;
  const printed = modelSource(model);
  codeView.revision = now;
  if (printed === codeView.printed) return; // a scenario moved; the text did not
  codeView.printed = printed;
  if (codeDirty()) { codeView.stale = true; return; }
  codeView.text = printed;
  codeView.base = printed;
  codeView.stale = false;
  codeView.analysis = null;
  writeCodeEditor(printed);
}

// Errors block an apply: what does not parse, and a scenario that
// cannot be recorded. Warnings do not: advisories, and scenarios that
// are broken or drifted against the text as written.
function analyseCode(model) {
  if (codeView.analysis && codeView.analysis.text === codeView.text) return codeView.analysis;
  const parsed = parseModelSource(codeView.text);
  let errors = parsed.diagnostics;
  let advisories = [];
  let scenarios = [];
  if (!errors.length) {
    advisories = sourceAdvisories(model, parsed);
    const report = sourceScenarioReport(model, parsed);
    errors = report.errors;
    scenarios = report.warnings;
  }
  codeView.analysis = { text: codeView.text, parsed, errors, advisories, scenarios };
  return codeView.analysis;
}

function onCodeInput(text) {
  codeView.text = text;
  clearTimeout(codeView.timer);
  codeView.timer = setTimeout(refreshCodeChrome, 250);
}

// The parts of the page that follow the text – markers, status, the
// problem list – without a repaint, which would cost the editor its
// focus on every keystroke.
function refreshCodeChrome() {
  const model = activeModel();
  if (!model || !state.code) return;
  const analysis = analyseCode(model);
  if (codeView.editor) {
    const markers = codeDiagnostics(analysis).map((d, index) => ({
      severity: d.error ? monaco.MarkerSeverity.Error : monaco.MarkerSeverity.Warning, message: d.message,
      startLineNumber: d.line, startColumn: d.col, endLineNumber: d.endLine, endColumn: d.endCol,
      // What the quick fix finds its replacement by.
      code: d.fix ? 'fix:' + index : undefined,
    }));
    // What the experimental flag keeps off the pages, said where it is
    // written – never an error, the text applies whole either way.
    if (!experimental()) {
      for (const d of sourceExperimentalMarks(codeView.text)) {
        markers.push({
          severity: monaco.MarkerSeverity.Info, message: d.message,
          startLineNumber: d.line, startColumn: d.col, endLineNumber: d.endLine, endColumn: d.endCol,
        });
      }
    }
    monaco.editor.setModelMarkers(codeView.editor.model, 'dcb', markers);
    // What each read queries, after it. A decoration, not an inlay
    // hint: this Monaco cuts those at 43 characters, and a list of
    // event types cut short drops exactly the one being looked for.
    const { editor } = codeView.editor;
    if (!codeView.editor.readHints) codeView.editor.readHints = editor.createDecorationsCollection();
    codeView.editor.readHints.set([...codeReadQueries(model), ...codeCommandQueries(model)].map((q) => ({
      range: new monaco.Range(q.end.endLine, q.end.endCol, q.end.endLine, q.end.endCol),
      options: { showIfCollapsed: true, after: { content: '\u00a0\u00a0' + q.hint, inlineClassName: 'code-read-hint' } },
    })));
    if (!codeView.editor.scenarioMarks) codeView.editor.scenarioMarks = editor.createDecorationsCollection();
    codeView.editor.scenarioMarks.set(codeScenarioMarks(analysis, codeView.editor.model));
  }
  if (codeView.statusEl) codeView.statusEl.replaceWith(codeView.statusEl = codeStrip());
  if (codeView.listEl) codeView.listEl.replaceWith(codeView.listEl = codeProblemList(analysis));
  const toggle = document.querySelector('#tools .surface');
  if (toggle) toggle.replaceWith(surfaceToggle(model));
}

// The scenarios groups, set apart from the definitions they exercise:
// a stripe in the gutter – a region, not a kind, so not a kind colour;
// a tint behind the lines was tried and was either invisible or noise –
// and on the group's first line,
// which is all a folded group shows, how many it holds and how many are
// not passing. Placed off the tokens like the folds, counted off the
// parse where the block parsed.
function codeScenarioMarks(analysis, textModel) {
  const faults = codeDiagnostics(analysis).filter((d) => d.error || d.scenario);
  return sourceFoldingRanges(textModel.getValue()).filter((r) => r.scenarios).flatMap((r) => {
    const band = {
      range: new monaco.Range(r.start, 1, r.end, 1),
      options: { isWholeLine: true, linesDecorationsClassName: 'code-scenarios-stripe' },
    };
    const group = analysis.parsed.groups.find((g) => g.span.line === r.start);
    if (!group) return [band];
    const within = faults.filter((d) => d.line >= r.start && d.line <= r.end);
    const count = (prefix) => within.filter((d) => d.scenario && d.message.startsWith(prefix)).length;
    const words = [`${group.records.length} scenario${group.records.length === 1 ? '' : 's'}`];
    if (count('Drifted')) words.push(`${count('Drifted')} drifted`);
    if (count('Broken')) words.push(`${count('Broken')} broken`);
    const errors = within.filter((d) => d.error).length;
    if (errors) words.push(`${errors} error${errors === 1 ? '' : 's'}`);
    const end = textModel.getLineMaxColumn(r.start);
    return [band, {
      range: new monaco.Range(r.start, end, r.start, end),
      options: {
        showIfCollapsed: true,
        after: { content: '\u00a0\u00a0' + words.join(' · '), inlineClassName: within.length ? 'code-scenarios-hint bad' : 'code-scenarios-hint' },
      },
    }];
  });
}

// What each `read` adds to the append condition, for the text as it
// stands: `alias course = Course[courseId]` looks like the whole entity
// and is only the properties something uses (sourceReadQueries, dsl.js).
// Cached on the analysis, so it moves with the text.
function codeReadQueries(model) {
  const analysis = analyseCode(model);
  if (analysis.readQueries === undefined) {
    try { analysis.readQueries = sourceReadQueries(model, analysis.parsed); } catch { analysis.readQueries = []; }
  }
  return analysis.readQueries;
}

// And beside each command's `{`, what it reads in all
// (sourceCommandQueries, dsl.js) – the same summary the Consistency
// boundary step leads with.
function codeCommandQueries(model) {
  const analysis = analyseCode(model);
  if (analysis.commandQueries === undefined) {
    try { analysis.commandQueries = sourceCommandQueries(model, analysis.parsed); } catch { analysis.commandQueries = []; }
  }
  return analysis.commandQueries;
}

// Everything the editor marks, in one list the markers, the quick fixes
// and the problem list index alike: errors, then scenario warnings on
// their `scenario`, then advisories on the name of the definition they
// are about. A diagnostic with a `fix` carries the edit that resolves it
// – a drift's actual outcome, an ungrouped scenario's group.
function codeDiagnostics(analysis) {
  return [
    ...analysis.errors.map((d) => ({ ...d, error: true })),
    ...analysis.scenarios.map((w) => ({ ...w, scenario: true })),
    ...codeAdvisoryAt(analysis),
  ];
}

function codeAdvisoryAt(analysis) {
  return analysis.advisories.map((a) => {
    const span = sourceSpanOf(analysis.parsed, a.kind, a.name);
    return {
      message: a.message, kind: a.kind, name: a.name,
      line: span ? span.nameLine : 1, col: span ? span.nameCol : 1,
      endLine: span ? span.nameLine : 1, endCol: span ? span.nameEndCol : 2,
    };
  });
}

// What the strip under the editor says, and how it is tinted: in step,
// edited, or blocked – by errors, or by a model that moved under the
// edits.
function codeStatus() {
  const analysis = codeView.analysis;
  const errors = analysis ? analysis.errors.length : 0;
  const advisories = analysis ? analysis.advisories.length : 0;
  const scenarios = analysis ? analysis.scenarios.length : 0;
  const parts = [];
  let tone = 'clean';
  if (codeView.stale) {
    tone = 'bad';
    parts.push('The model changed since these edits began – applying puts back what changed');
  } else if (errors) {
    tone = 'bad';
    parts.push(`${errors} error${errors === 1 ? '' : 's'} – fix ${errors === 1 ? 'it' : 'them'} to apply`);
  } else if (codeDirty()) {
    tone = 'dirty';
    parts.push('Edited, not applied');
  } else {
    parts.push('In step with the model');
  }
  if (!errors && advisories) parts.push(`${advisories} advisor${advisories === 1 ? 'y' : 'ies'}`);
  if (!errors && scenarios) parts.push(`${scenarios} scenario${scenarios === 1 ? '' : 's'} broken or drifted`);
  return { tone, words: parts.join(' · '), errors };
}

function codeCursorWords() {
  const position = codeView.editor && codeView.editor.editor.getPosition();
  return position ? `Ln ${position.lineNumber}, Col ${position.column}` : '';
}

// The first error after the cursor, wrapping round to the first one.
function revealNextCodeError() {
  const analysis = codeView.analysis;
  if (!analysis || !analysis.errors.length) return;
  const line = codeCursorLine() || 0;
  const next = analysis.errors.find((d) => d.line > line) || analysis.errors[0];
  revealCodeAt(next.line, next.col);
}

// The strip under the editor – the part of the page that follows every
// keystroke: the status, the cursor, and Revert and Apply beside the
// text they act on.
function codeStrip() {
  const { tone, words, errors } = codeStatus();
  codeView.cursorEl = h('span', { class: 'mono' }, codeCursorWords());
  return h('div', { class: 'code-strip ' + tone, role: 'status' },
    h('span', { class: 'code-dot', 'aria-hidden': 'true' }),
    h('span', { class: 'code-words' }, words),
    h('span', { class: 'grow' }),
    codeView.cursorEl,
    errors ? h('button', {
      class: 'btn tiny', type: 'button', title: 'The next error after the cursor', onclick: revealNextCodeError,
    }, 'Next error ↓') : null,
    codeDirty() ? h('button', {
      class: 'btn tiny', type: 'button', title: codeView.stale ? 'Discard these edits' : 'Put back what the model says',
      onclick: revertCode,
    }, 'Revert') : null,
    h('button', {
      class: 'btn primary tiny', type: 'button', title: `Apply – ${shortcutText('Mod+S')}`,
      disabled: !codeDirty() || errors ? true : null, onclick: applyCode,
    }, 'Apply ', kbd('Mod+S')));
}

function codeProblemList(analysis) {
  const rows = codeDiagnostics(analysis);
  if (!rows.length) return h('div', { class: 'code-problems' });
  return h('div', { class: 'code-problems' }, rows.map((d) => h('div', {
    class: 'issue', role: 'button', tabindex: '0',
    onclick: () => revealCodeAt(d.line, d.col),
  }, h('span', { class: 'diag-mark' + (d.error ? ' err' : '') }, d.error ? '✕' : '⚠'),
    h('span', { class: 'mono' }, `${d.line}:${d.col}`),
    h('span', { class: 'why' }, d.name ? `${readable(d.name)} – ${d.message}` : d.message),
    ...[d.fix, d.fixAll].filter(Boolean).map((fix) => h('button', {
      class: 'btn tiny', type: 'button', title: fix.title,
      onclick: (e) => { e.stopPropagation(); applyCodeFix(fix); },
    }, fix.label)))));
}

// A quick fix – a drift's then lines rewritten to what the model now
// does, a missing outcome written in, an ungrouped scenario wrapped in
// its group. An edit like any other – it still has to be applied. A
// fix that writes several places at once carries them as `edits`.
const codeFixEdits = (fix) => fix.edits || [fix];

function applyCodeFix(fix) {
  const edits = codeFixEdits(fix);
  if (codeView.editor) {
    const { editor } = codeView.editor;
    editor.executeEdits('fix', edits.map((e) => ({
      range: new monaco.Range(e.line, e.col, e.endLine, e.endCol), text: e.text,
    })));
    editor.focus();
    return;
  }
  const lines = codeView.text.split('\n');
  const offset = (line, col) => lines.slice(0, line - 1).reduce((sum, l) => sum + l.length + 1, 0) + col - 1;
  // Last first, so each edit's place is still where it was read.
  let text = codeView.text;
  for (const e of [...edits].sort((a, b) => offset(b.line, b.col) - offset(a.line, a.col))) {
    text = text.slice(0, offset(e.line, e.col)) + e.text + text.slice(offset(e.endLine, e.endCol));
  }
  onCodeInput(text);
  render();
}

function applyCode() {
  const model = activeModel();
  if (!model) return false;
  // A text is only ever applied to the model it was written against –
  // a model switched under it parks it as that model's draft instead.
  syncCodeView(model);
  if (!codeDirty()) return false;
  const analysis = analyseCode(model);
  if (analysis.errors.length) {
    refreshCodeChrome();
    const first = analysis.errors[0];
    toast(`Line ${first.line}: ${first.message}`, true);
    revealCodeAt(first.line, first.col);
    return false;
  }
  const text = codeView.text;
  const summary = run(() => {
    markStepVia('code');
    const out = applyModelSource(model.id, text);
    // The text is what the model now says, whatever its print would
    // be – settled before the gesture's repaint reads it.
    codeView.base = text;
    codeView.printed = modelSource(activeModel());
    codeView.revision = logRevisionNow();
    codeView.stale = false;
    return out;
  });
  if (!summary) return false;
  toast('Applied – ' + sourceApplySummary(summary));
  return true;
}

function revertCode() {
  const model = activeModel();
  if (!model) return;
  const printed = modelSource(model);
  Object.assign(codeView, { text: printed, base: printed, printed, revision: logRevisionNow(), stale: false, analysis: null });
  writeCodeEditor(printed);
  render();
}

// Into the code view, revealing what the page was about.
function enterCode() {
  // The Overview has no definition of its own to stay on, and staying
  // on it would make the toggle look like it did nothing: Code opens the
  // code – even when it is the surface already – where it was left, or
  // where the commands start, as the Overview's Commands card does.
  const fromOverview = state.view === 'overview';
  if (state.code && !fromOverview) return;
  closeForms(); // commits whatever a page had half-typed
  setCodeSurface(true);
  codeView.shownView = null;
  codeView.focus = null;
  if (fromOverview) {
    const model = activeModel();
    const last = codeView.last;
    if (model && last && last.modelId === model.id && model[DEF_COLLECTIONS[last.kind]][last.name] !== undefined) {
      codeView.section = [last.kind, last.name];
      return openDefinition(last.kind, last.name);
    }
    codeView.section = 'command-definition';
    state.view = 'slice';
  }
  render();
}

// Back to the pages: a text that parses is applied first, one that
// does not is kept for later; the page is the one for the definition
// under the cursor.
function leaveCode() {
  if (!state.code) return;
  const model = activeModel();
  const shown = codeShown();
  let at = null;
  if (model) {
    syncCodeView(model);
    const analysis = analyseCode(model);
    const line = shown ? codeCursorLine() : null;
    at = line ? sourceSpanAt(analysis.parsed, line) : null;
    const inScenario = line && analysis.parsed.scenarios.some((r) => r.block && line >= r.span.line && line <= r.span.endLine);
    if (at && inScenario) at = { ...at, scenarios: true };
    if (codeDirty() && !codeView.stale) {
      if (analysis.errors.length) {
        toast(`The code has ${analysis.errors.length} error${analysis.errors.length === 1 ? '' : 's'} and was not `
          + 'applied – it is kept as it is for when you come back.', true);
      } else if (!applyCode()) {
        return;
      }
    } else if (codeDirty()) {
      toast('Your edits were not applied – the model changed under them. They are kept for when you come back.', true);
    }
  }
  setCodeSurface(false);
  const current = activeModel();
  if (at && current && current[DEF_COLLECTIONS[at.kind]][at.name] !== undefined) {
    return openDefinition(at.kind, at.name, { scenarios: at.scenarios });
  }
  render();
}

function openDefinition(kind, name, { scenarios } = {}) {
  if (scenarios && kind === 'command-definition') {
    closeForms();
    Object.assign(state, { view: 'slice', slice: name, tab: 'scenarios' });
    return render();
  }
  if (scenarios && kind === 'projection-definition') {
    openProjection(activeModel(), name, { tab: 'checks' });
    return render();
  }
  if (kind === 'command-definition') return goToCommand(name);
  if (kind === 'entity-definition') return openEntity(name);
  if (kind === 'event-definition') return goToEvent(name);
  if (kind === 'projection-definition') return goToProjection(name);
  if (kind === 'custom-type-definition') return goToCustomType(name);
  render();
}

// The definition the page in front of the code is about, if it is
// about one.
function pageDefinition() {
  if (state.view === 'slice' && state.slice) return ['command-definition', state.slice];
  if (state.projDraft && ['entity', 'projections'].includes(state.view)) {
    return ['projection-definition', state.projDraft.name];
  }
  if (state.view === 'entity' && state.entity) return ['entity-definition', state.entity];
  if (state.view === 'events' && state.openEvent) return ['event-definition', state.openEvent];
  // A whole kind's page: where its definitions start (`sourceKindStart`).
  if (state.view === 'events') return ['event-definition', null];
  if (state.view === 'projections') return ['projection-definition', null];
  if (state.view === 'types') return ['custom-type-definition', null];
  return null;
}

// Where a kind's definitions start in the text: the first one, from
// the section comment above it when the line above is one.
function sourceKindStart(parsed, kind, text) {
  const spans = parsed.spans.filter((span) => span.kind === kind);
  if (!spans.length) return null;
  const first = spans.reduce((a, b) => (b.line < a.line ? b : a));
  const above = text.split('\n')[first.line - 2];
  const from = above !== undefined && above.trim().startsWith('//') ? first.line - 1 : first.line;
  return { ...first, line: from };
}

function codeCursorLine() {
  if (codeView.editor) {
    const position = codeView.editor.editor.getPosition();
    return position ? position.lineNumber : null;
  }
  const area = document.querySelector('.code-text');
  if (!area || typeof area.value !== 'string') return null;
  return area.value.slice(0, area.selectionStart).split('\n').length;
}

// `from` is where a whole declaration starts – its annotations – and
// is put near the top, the way a jump to a definition reads.
function revealCodeAt(line, col, from) {
  if (codeView.editor) {
    const { editor } = codeView.editor;
    if (from) editor.revealLineNearTop(from);
    else editor.revealLineInCenterIfOutsideViewport(line);
    editor.setPosition({ lineNumber: line, column: col || 1 });
    editor.focus();
    return;
  }
  const area = document.querySelector('.code-text');
  if (!area || typeof area.value !== 'string') return;
  const lines = area.value.split('\n');
  const offset = lines.slice(0, line - 1).reduce((sum, l) => sum + l.length + 1, 0) + (col || 1) - 1;
  area.focus();
  area.setSelectionRange(offset, offset);
  // A textarea scrolls to its caret only when it gains focus; put the
  // line near the top explicitly.
  area.scrollTop = Math.max(0, ((from || line) - 4) * parseFloat(getComputedStyle(area).lineHeight || '18'));
}

// A text the model put there, never one the author typed – so it is a
// fresh start for the editor's own undo, too. Were it an edit, ⌘Z in
// the editor could step back to another model's text, or to one from
// before an agent's change, and that would read as ordinary typing:
// dirty, not stale, and applied on the way back to the pages.
//
// Its view state – scroll, cursor, folds – is kept across a reprint of
// the same model and dropped for another model's text, where the folds
// would land, by line, on whatever stands there now.
function writeCodeEditor(text) {
  if (!codeView.editor) return;
  const { editor, model } = codeView.editor;
  if (model.getValue() === text) return;
  const view = codeView.editor.textFor === codeView.modelId ? editor.saveViewState() : null;
  codeView.loading = true;
  model.setValue(text);
  codeView.loading = false;
  codeView.editor.textFor = codeView.modelId;
  if (view) editor.restoreViewState(view);
}

let sourceLanguageRegistered = false;
function registerSourceLanguage() {
  if (sourceLanguageRegistered) return;
  sourceLanguageRegistered = true;
  const L = monaco.languages;
  L.register({ id: 'dcb', extensions: [SOURCE_EXTENSION] });
  L.setMonarchTokensProvider('dcb', SOURCE_MONARCH);
  const pairs = [{ open: '{', close: '}' }, { open: '[', close: ']' }, { open: '(', close: ')' }];
  L.setLanguageConfiguration('dcb', {
    comments: { lineComment: '//', blockComment: ['/*', '*/'] },
    brackets: [['{', '}'], ['[', ']'], ['(', ')']],
    autoClosingPairs: [...pairs, { open: '"', close: '"', notIn: ['string'] }],
    surroundingPairs: [...pairs, { open: '"', close: '"' }],
  });
  const parsed = () => {
    const model = activeModel();
    return model ? analyseCode(model).parsed : null;
  };
  const SYMBOL = {
    'custom-type-definition': 'TypeParameter',
    'event-definition': 'Event',
    'entity-definition': 'Class',
    'projection-definition': 'Function',
    'command-definition': 'Method',
  };
  const nameRange = (span) => new monaco.Range(span.nameLine, span.nameCol, span.nameLine, span.nameEndCol);
  const tokenRange = (token) => new monaco.Range(token.line, token.col, token.endLine, token.endCol);
  const COMPLETION_KIND = {
    keyword: 'Keyword', type: 'TypeParameter', event: 'Event', entity: 'Class', projection: 'Function',
    command: 'Method', member: 'EnumMember', field: 'Field', eventProperty: 'Field', entityProperty: 'Property',
    property: 'Property', commandProperty: 'Variable', alias: 'Variable', projectionParameter: 'Variable',
  };
  // What fits the cursor (sourceCompletions, dsl.js). A space or a
  // bracket opens the list only where something specific is expected
  // – after `require`, inside `emit E {` – never at a statement's start;
  // asked for outright where nothing is, it offers every name.
  L.registerCompletionItemProvider('dcb', {
    triggerCharacters: ['.', ' ', '(', '[', '{', ',', ':', '@'],
    provideCompletionItems: (textModel, position, context) => {
      const word = textModel.getWordUntilPosition(position);
      const range = new monaco.Range(position.lineNumber, word.startColumn, position.lineNumber, word.endColumn);
      const { items, slot } = sourceCompletions(textModel.getValue(), position.lineNumber, position.column,
        { model: activeModel(), experimental: experimental() });
      if (context.triggerKind === L.CompletionTriggerKind.TriggerCharacter && !slot) return { suggestions: [] };
      if (items.length) {
        return {
          suggestions: items.map((item, index) => ({
            label: item.label, kind: L.CompletionItemKind[COMPLETION_KIND[item.kind] || 'Text'], detail: item.detail,
            insertText: item.insert, range, sortText: item.sort + String(index).padStart(4, '0'),
            insertTextRules: item.snippet ? L.CompletionItemInsertTextRule.InsertAsSnippet : undefined,
            command: item.retrigger ? { id: 'editor.action.triggerSuggest', title: '' } : undefined,
          })),
        };
      }
      if (slot || context.triggerKind === L.CompletionTriggerKind.TriggerCharacter) return { suggestions: [] };
      const read = parsed();
      const names = read ? read.spans.map((span) => ({
        label: span.name, kind: L.CompletionItemKind[SYMBOL[span.kind]], detail: SOURCE_KEYWORD[span.kind],
        insertText: span.name, range,
      })) : [];
      const words = [...SOURCE_KEYWORDS, ...SOURCE_BASE_TYPES].map((k) => ({
        label: k, kind: L.CompletionItemKind.Keyword, insertText: k, range,
      }));
      return { suggestions: [...names, ...words] };
    },
  });
  // Names resolve as symbols (sourceSymbols, dsl.js): `status =
  // CourseStatus` goes to the projection, not the enum it shares a name
  // with, and `course.status` to the entity's property.
  const symbolAt = (position) => {
    const read = parsed();
    return read ? sourceSymbolAt(read, position.lineNumber, position.column) : null;
  };
  L.registerDefinitionProvider('dcb', {
    provideDefinition: (textModel, position) => {
      const read = parsed();
      const at = symbolAt(position);
      if (!read || !at || at.ambiguous) return null;
      return at.symbols.map((symbol) => sourceDeclarationOf(read, symbol)).filter(Boolean)
        .map((o) => ({ uri: textModel.uri, range: tokenRange(o.token) }));
    },
  });
  L.registerReferenceProvider('dcb', {
    provideReferences: (textModel, position, context) => {
      const at = symbolAt(position);
      if (!at || at.ambiguous) return [];
      return at.occurrences.filter((o) => context.includeDeclaration || !o.decl)
        .map((o) => ({ uri: textModel.uri, range: tokenRange(o.token) }));
    },
  });
  L.registerDocumentHighlightProvider('dcb', {
    provideDocumentHighlights: (textModel, position) => {
      const at = symbolAt(position);
      if (!at || at.ambiguous) return [];
      return at.occurrences.map((o) => ({
        range: tokenRange(o.token), kind: o.decl ? L.DocumentHighlightKind.Write : L.DocumentHighlightKind.Read,
      }));
    },
  });
  // F2: everywhere the symbol occurs and nowhere else, or a reason why
  // not (sourceRename, dsl.js). An edit like any other – it still has to
  // be applied.
  L.registerRenameProvider('dcb', {
    resolveRenameLocation: (textModel, position) => {
      const read = parsed();
      const target = read ? sourceRenameTarget(read, position.lineNumber, position.column) : { error: 'Nothing to rename.' };
      if (target.error) return { range: new monaco.Range(position.lineNumber, position.column, position.lineNumber, position.column), text: '', rejectReason: target.error };
      return { range: tokenRange(target.token), text: target.token.v };
    },
    provideRenameEdits: (textModel, position, newName) => {
      const result = sourceRename(textModel.getValue(), position.lineNumber, position.column, newName);
      if (result.error) return { edits: [], rejectReason: result.error };
      return {
        edits: result.edits.map((e) => ({
          resource: textModel.uri, versionId: textModel.getVersionId(),
          textEdit: { range: new monaco.Range(e.line, e.col, e.endLine, e.endCol), text: e.text },
        })),
      };
    },
  });
  L.registerDocumentSymbolProvider('dcb', {
    provideDocumentSymbols: () => {
      const read = parsed();
      return read ? read.spans.map((span) => ({
        name: span.name, detail: SOURCE_KEYWORD[span.kind], kind: L.SymbolKind[SYMBOL[span.kind]], tags: [],
        range: new monaco.Range(span.line, span.col, span.endLine, span.endCol), selectionRange: nameRange(span),
      })) : [];
    },
  });
  // Folding off the tokens (sourceFoldingRanges, dsl.js), so it holds
  // while the text does not parse. Registering any provider replaces
  // Monaco's indentation folding, so it covers every block, not only
  // the scenarios groups.
  L.registerFoldingRangeProvider('dcb', {
    provideFoldingRanges: (textModel) => sourceFoldingRanges(textModel.getValue())
      .map((r) => ({ start: r.start, end: r.end })),
  });
  // Runs after an action's edit: the cursor onto a name, and F2 there.
  monaco.editor.registerCommand('dcb.renameAt', (accessor, line, col) => {
    if (!codeView.editor) return;
    const { editor } = codeView.editor;
    editor.setPosition({ lineNumber: line, column: col });
    editor.revealPositionInCenterIfOutsideViewport({ lineNumber: line, column: col });
    editor.focus();
    editor.trigger('alias', 'editor.action.rename', null);
  });
  L.registerCodeActionProvider('dcb', {
    provideCodeActions: (textModel, range, context) => {
      const model = activeModel();
      if (!model) return { actions: [], dispose() {} };
      const analysis = analyseCode(model);
      const diagnostics = codeDiagnostics(analysis);
      const actions = context.markers
        .filter((m) => typeof m.code === 'string' && m.code.startsWith('fix:'))
        .map((m) => {
          const diagnostic = diagnostics[Number(m.code.slice('fix:'.length))];
          if (!diagnostic || !diagnostic.fix) return [];
          return [diagnostic.fix, diagnostic.fixAll].filter(Boolean).map((fix) => ({
            title: fix.title, kind: 'quickfix', diagnostics: [m], isPreferred: fix === diagnostic.fix,
            edit: { edits: codeFixEdits(fix).map((e) => ({
              resource: textModel.uri, versionId: textModel.getVersionId(),
              textEdit: { range: new monaco.Range(e.line, e.col, e.endLine, e.endCol), text: e.text },
            })) },
          }));
        })
        .flat();
      // A read in place, named by an alias (sourceIntroduceAlias, dsl.js)
      // – offered under the cursor, not on a marker, and followed by a
      // rename on the new name, so it is named as it is introduced.
      const wanted = !context.only || 'refactor.extract'.startsWith(context.only);
      const alias = wanted ? sourceIntroduceAlias(textModel.getValue(), range.startLineNumber, range.startColumn) : { error: true };
      if (!alias.error) {
        actions.push({
          title: alias.title, kind: 'refactor.extract',
          command: { id: 'dcb.renameAt', title: 'Name the alias', arguments: [alias.at.line, alias.at.col] },
          edit: { edits: alias.edits.map((e) => ({
            resource: textModel.uri, versionId: textModel.getVersionId(),
            textEdit: { range: new monaco.Range(e.line, e.col, e.endLine, e.endCol), text: e.text },
          })) },
        });
      }
      return { actions, dispose() {} };
    },
  });
  const readHover = (q) => {
    const code = (words) => words.map((w) => `\`${w}\``).join(', ');
    return {
      range: new monaco.Range(q.start.line, q.start.col, q.end.endLine, q.end.endCol),
      contents: [
        { value: `**Alias \`${q.alias}\`** – what it adds to the append condition` },
        { value: '```text\n'
          + `types  ${q.types.join(', ') || 'any type'}\n`
          + `tags   ${q.tags.join(', ') || 'none – every event of these types'}${q.fannedOut ? '  × each' : ''}\n` + '```' },
        ...(q.properties.length ? [{ value: q.properties
          .map((p) => `- \`${q.alias}.${p.name}\`: ${p.types.length ? code(p.types) : 'no events'}`).join('\n') }] : []),
        ...(q.unread.length ? [{ value: `Not read: ${code(q.unread)}` }] : []),
        { value: q.reasons.length ? `Read for: ${q.reasons.join(', ')}` : 'Read for nothing – unused' },
      ],
    };
  };
  // A command's whole boundary, on its header – the question the tool
  // exists to answer, asked of the text before it is applied: the
  // queries in the order they run, one per call to the store, as the
  // JSON a store is sent (_DCB queries, shown_), and what the command
  // appends.
  const commandHover = (q) => {
    const code = (words) => words.map((w) => `\`${w}\``).join(', ');
    const planned = plannedQueries(q);
    const many = planned.length > 1;
    const fence = (lines, lang = 'text') => '```' + lang + '\n' + lines.join('\n') + '\n```';
    // The queries alone, as JSON – what a store is asked; the page's
    // Consistency boundary step has the rest.
    const queries = planned.length
      ? [{ value: fence(planned.map((items, i) => (many ? `// query ${i + 1}\n` : '') + queryJsonText(queryItemsJson(items))).join('\n\n').split('\n'), 'json') }]
      : [{ value: 'Reads nothing: the append is unconditional.' }];
    return {
      range: new monaco.Range(q.start.line, q.start.col, q.end.endLine, q.end.endCol),
      contents: [
        { value: `**Consistency boundary** – ${q.words}` },
        ...queries,
