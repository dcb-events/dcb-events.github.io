<!DOCTYPE html>
<html lang="en">
<head>
<script>
window.DCB_PLAYGROUND_HOST = { theme: (function () {
  var KEY = "/.__palette";
  var OPTIONS = [{"media": "", "scheme": "slate", "primary": "teal", "accent": "deep-orange"}, {"media": "", "scheme": "default", "primary": "teal", "accent": "deep-orange"}];
  function kind(o) { return o.media === '(prefers-color-scheme)' ? 'system' : o.scheme === 'slate' ? 'dark' : 'light'; }
  function stored() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
  return {
    get: function () {
      var p = stored();
      if (p && OPTIONS[p.index]) return kind(OPTIONS[p.index]);
      for (var i = 0; i < OPTIONS.length; i++) if (matchMedia(OPTIONS[i].media).matches) return kind(OPTIONS[i]);
      return null;
    },
    set: function (value) {
      for (var i = 0; i < OPTIONS.length; i++) if (kind(OPTIONS[i]) === value) {
        try { localStorage.setItem(KEY, JSON.stringify({ index: i, color: OPTIONS[i] })); } catch (e) {}
        return;
      }
    },
    onChange: function (fn) { window.addEventListener('storage', function (e) { if (e.key === KEY) fn(); }); }
  };
})() };
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DCB Playground</title>
<link rel="icon" type="image/png" href="logo-mark.png">
<link rel="alternate icon" href="favicon.ico">
<link rel="stylesheet" href="shared.css">
<style>
  /* `minmax(0, …)` so a page wider than the window (Coupling's matrix,
     a lifecycle or event-model band) scrolls inside its own strip
     instead of stretching the column, and the page, to fit it.
     The body is a column so .layout fills what the bar and the footer
     leave of the window: a short page puts the footer at the bottom
     edge without making the page one footer taller than the window. */
  body { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
  .layout { flex: 1 0 auto; display: grid; grid-template-columns: 250px minmax(0, 1fr); }
  /* Nothing loaded means no rail to show – the empty page behind the
     models dialog takes the whole row rather than sitting in a column
     sized for a rail that isn't there. */
  .layout.no-rail { grid-template-columns: 1fr; }
  .rail { border-right: 1px solid var(--border); background: var(--surface); padding: 14px 0; }
  .rail-backdrop { display: none; }
  /* Below the breakpoint the rail stops being a grid column and
     becomes a drawer over the content instead – .layout falls back to
     one column so .main never sits in a column sized for a rail that
     is no longer there. Opening it is the menu button in the bar
     (`.menu-btn`); a backdrop and picking an actual link both close it
     – see `renderRail` and the delegated click listener on #rail. */
  @media (max-width: 760px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .rail {
      position: fixed; top: var(--topbar-h); bottom: 0; left: 0; z-index: 25;
      width: 82vw; max-width: 300px; overflow-y: auto;
      box-shadow: 2px 0 20px rgba(15, 23, 42, .2);
      transform: translateX(-100%); transition: transform .18s ease;
    }
    .rail.open { transform: translateX(0); }
    .rail-backdrop.open {
      display: block; position: fixed; inset: var(--topbar-h) 0 0 0;
      background: rgba(15, 23, 42, .35); z-index: 24;
    }
  }
  .rail h4 { padding: 0 16px 8px; }
  .rail a {
    display: block; padding: 6px 16px; font-size: 13px;
    color: var(--text); text-decoration: none; border-left: 3px solid transparent;
  }
  .rail a:hover { background: var(--accent-soft); }
  .rail a.on { border-left-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  /* A place, not a thing: its line icon sits flush left where the
     feature carets are, muted, and takes the accent with the row –
     see `RAIL_ICONS`. */
  .rail a.place { display: flex; align-items: center; gap: 10px; padding-left: 13px; }
  .rail-icon { display: inline-flex; width: 16px; height: 16px; flex: none; color: var(--muted); }
  .rail-icon svg { width: 16px; height: 16px; }
  .rail a.place:hover .rail-icon, .rail a.place.on .rail-icon { color: var(--accent); }
  /* Quiet until wanted, like the in-page adders below: pointing at the
     rail is the "I am about to change this list" gesture. On a touch
     screen the drawer being open is that gesture – see the hover:none
     block near the FAB styles. */
  .rail .add { padding: 10px 16px 0; display: flex; gap: 6px; opacity: 0; transition: opacity .15s ease; }
  .rail:hover .add, .rail .add:focus-within { opacity: 1; }
  .rail .loose { display: flex; align-items: center; gap: 6px; padding: 2px 16px; }
  .group .rm { display: inline-flex; }
  .group .rm .btn { visibility: hidden; padding: 0 5px; }
  .group:hover .rm .btn, .group .rm.on .btn, .group .rm .btn:focus { visibility: visible; }
  .group .gadd { visibility: hidden; padding: 0 5px; }
  .group:hover .gadd, .group .gadd:focus { visibility: visible; }

  /* Two levels: a feature, and the commands that make it up. */
  .group {
    display: flex; align-items: baseline; gap: 6px;
    padding: 9px 16px 3px; font-size: 12px; font-weight: 600;
  }
  .group .caret { cursor: pointer; color: var(--muted); font-size: 10px; width: 10px; }
  .group .gname { cursor: pointer; flex: 1; }
  .group .gname:hover { color: var(--accent); }
  .group .gcount {
    font-weight: 400; font-size: 10px; color: var(--muted);
    background: var(--bg); border-radius: 999px; padding: 0 6px;
  }
  /* The drop target while a command is dragged over a feature – its
     heading or any command row in it. Filled, not an edge line like the
     scenario cards': the command lands *in* the group, never against a
     neighbour (within a group the order is alphabetical, not chosen). */
  .group.drop-into { background: var(--accent-soft); border-radius: 6px; }
  .rail a.cmd.drop-into { background: var(--accent-soft); }
  /* The way out of a feature, shown only while a command is in the air
     and no real Ungrouped group is on screen to receive it. */
  .rail .drop-stub { display: none; }
  .rail.dragging-cmd .drop-stub { display: flex; }
  /* Ungrouped is not a feature but what is left over, so it does not
     look like one: no caret (it never folds), no adder (+ Command is
     that), a heading quiet enough to read as a label, and a rule
     between it and the features above when there are any. */
  .group.ungrouped {
    font-weight: 400; font-size: 10px; letter-spacing: .04em;
    text-transform: uppercase; color: var(--muted);
  }
  .group.ungrouped .gname, .group.ungrouped .gname:hover { cursor: default; color: var(--muted); }
  .group.ungrouped.after-features { margin: 10px 16px 0; padding: 9px 0 3px; border-top: 1px solid var(--border); }
  .group.ungrouped.drop-into { border-top-color: transparent; }
  .rail a.cmd { padding-left: 32px; display: flex; align-items: center; gap: 6px; }
  .rail a.cmd .grow { flex: 1; }
  .rail a.cmd .grip { opacity: 0; }
  .rail a.cmd:hover .grip, .rail a.cmd .grip:focus { opacity: 1; }
  .rail a.cmd.dragging { opacity: .4; }
  /* The count used to sit hard against the label – "Sandbox14". As a
     place the row is already flex (`.rail a.place`); the label grows so
     the count is held to the right. */
  .rail a.sandbox .grow { flex: 1; }
  /* A thing in the rail is in the colour things are in everywhere else,
     so the rail says which of the two lists you are in without a
     heading having to. */
  .rail a.ent:hover { background: var(--entity-soft); }
  .rail a.ent.on { border-left-color: var(--entity); background: var(--entity-soft); }
  .gempty { padding: 2px 16px 4px 32px; font-size: 11px; color: var(--muted); font-style: italic; }

  /* The stored identifier, for anyone who wants to see it. */
  .tech {
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    margin-left: 6px; font-weight: 400;
  }

  /* Inline forms, everywhere a name is needed – never a browser dialog. */
  .inline-form {
    border: 1px dashed var(--accent); border-radius: 6px;
    padding: 8px 10px; margin: 6px 0; background: var(--accent-soft);
  }
  .inline-form .q { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  /* Choosing a mark is not naming something – it belongs to the thing
     it is on, so it is dressed in that thing's colour. */
  .inline-form.icons { border-color: var(--entity); background: var(--entity-soft); }
  .inline-form.icons.event { border-color: var(--event); background: var(--event-soft); }
  .inline-form .adder { margin-top: 0; }
  .rail .inline-form { margin: 6px 16px; }

  .blank { max-width: 470px; padding: 40px 0; }
  .blank h2 { margin-bottom: 6px; }
  .blank p { margin-bottom: 14px; }

  /* A definition as a card, with its members listed under it: value
     types and projections are shown this way. */
  .ecard {
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); padding: 12px 14px; margin-bottom: 12px;
  }
  /* Wraps rather than squeezes: on a phone the facts and the revealed
     buttons go on to the next line, whole, instead of each one being
     crushed into a column a word wide. The buttons are one .reveal and
     move as one; the stored identifier is a .reveal of its own right
     after the chip, beside the name it spells. */
  .ehead { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 9px; margin-bottom: 9px; }
  .ehead > .chip { white-space: nowrap; }
  .ehead > .reveal > .tech { margin-left: 0; }
  .erows { border-top: 1px dashed var(--border); }
  .erow {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 0; border-bottom: 1px dashed var(--border); font-size: 12px;
  }
  .erow .nm { min-width: 165px; }
  /* Removing a part of a definition, from inside the chip that shows it. */
  .chip .x {
    border: 0; background: transparent; font: inherit; font-size: 11px;
    padding: 0 0 0 5px; margin: 0; color: inherit; opacity: .5; cursor: pointer;
  }
  .chip .x:hover { opacity: 1; color: var(--danger); }

  .slice { padding: 22px 30px 70px; max-width: 800px; }
  /* Pinned while its steps scroll by, so which command you are inside
     is the one thing the page never loses. The separator is always on:
     it used to appear only once the page had scrolled, but a header
     that changes shape at a scroll threshold changes the document's
     height at that same threshold, which clamps the scroll back under
     it – the page then flickers between the two states. Nothing here
     reads the scroll position any more. */
  .slice > header {
    position: sticky; top: var(--topbar-h); z-index: 10;
    background: var(--bg); margin: 0 -30px 22px; padding: 8px 30px;
    border-bottom: 1px solid var(--border); box-shadow: 0 6px 14px -12px rgba(15,23,42,.5);
  }
  .slice > header .name { font-size: 20px; font-weight: 600; }

  /* Each step of the slice, in the order you meet it. The ::before
     bottom mirrors the margin, so the connector line spans the gap. */
  .step { position: relative; padding: 0 0 0 26px; margin-bottom: 10px; }
  .step::before {
    content: ""; position: absolute; left: 7px; top: 20px; bottom: -10px;
    width: 2px; background: var(--border);
  }
  .step:last-of-type::before { display: none; }
  .step > .dot {
    position: absolute; left: 0; top: 3px;
    width: 16px; height: 16px; border-radius: 50%;
    border: 3px solid var(--surface); background: var(--border-strong);
  }
  /* The bar under a new command's last revealed step: what continuing
     means right now, and the way to the whole page. Indented like a
     step, because it stands where the next one will. */
  .wizard-bar { display: flex; align-items: center; gap: 10px;
                padding-left: 26px; margin: -2px 0 10px; }
  .step.trigger > .dot { background: var(--command); }
  .step.reads > .dot, .step.changes > .dot, .step.now > .dot { background: var(--entity); }
  .step.rules > .dot, .step.decide > .dot { background: var(--rule); }
  .card.rule { border-left: 3px solid var(--rule); }
  /* The rules are rows of one card, below the reads they use: the
     card carries the rule colour, so the rows need no stripe of their
     own. The grip sits in the card's padding left of the sentence, so
     it neither shifts the sentence nor waits for the row to be opened –
     it fades in on hover, the way a rail command's does. */
  .rule-row { position: relative; }
  .rule-row + .rule-row { margin-top: 4px; }
  .rule-row > .grip { position: absolute; left: -13px; top: 3px; opacity: 0; }
  .rule-row:hover > .grip, .rule-row > .grip:focus, .rule-row.dragging > .grip { opacity: 1; }
  /* The same edge line a scenario drop draws – see `.scenario.drop-before`. */
  .rule-row.drop-before { box-shadow: inset 0 2px 0 var(--rule); }
  .rule-row.drop-after { box-shadow: inset 0 -2px 0 var(--rule); }
  .rule-row.dragging { opacity: .4; }
  /* One question per line, so a rule being written reads as a form
     rather than as a row of pickers that happened to wrap. */
  .rule-wizard { display: flex; flex-direction: column; gap: 2px; }
  .rule-stage + .rule-stage { border-top: 1px dashed var(--border); padding-top: 4px; }
  .rule-stage > .q { font-size: 10px; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted); padding: 2px 0 0 2px; }
  .rule-stage > .adder { padding-top: 0; }
  .rejection-msg { font-style: italic; }
  .card > .adder.quiet { margin-left: 12px; }
  .step.emits > .dot { background: var(--event); }
  .step > .shead { display: flex; align-items: baseline; gap: 8px; margin-bottom: 7px; }

  /* ---------- quiet rows ----------
     A row shows the thing itself. The machinery around it – the type,
     the stored identifier, the button that removes it – waits inside a
     .reveal until the row is clicked. */
  .qrow > .reveal { display: none; align-items: center; gap: 8px; }
  .qrow.open > .reveal { display: inline-flex; }
  /* A rule's or guard's controls can be long ("Add alias: Developer
     seniority level"), so its row wraps: the controls drop to a line of
     their own rather than squeezing the sentence a word per line. */
  .qrow.wraps { flex-wrap: wrap; }
  .qrow.wraps > .reveal { flex-wrap: wrap; justify-content: flex-end; margin-left: auto; }
  .qrow:focus { outline: 1px solid var(--accent); outline-offset: 1px; }
  .qrow { cursor: pointer; }
  .qrow:hover, .qrow.open { background: var(--accent-soft); }
  /* The collapsed adder: one quiet button where a row of empty controls
     used to sit – and quieter still since the hover-reveal round: the
     folded button is invisible until the pointer is over the step (or
     card) it would add to, or the keyboard reaches it. It keeps its
     space, so nothing shifts when it appears. Touch screens have no
     hover; there the folded adders are hidden outright and the floating
     "+" collects them into a bottom sheet – see the hover:none block. */
  .adder.quiet { opacity: 0; transition: opacity .15s ease; margin-top: 3px; }
  .step:hover .adder.quiet, .ecard:hover .adder.quiet, .ident:hover .adder.quiet,
  .pdetail:hover .adder.quiet, .adder.quiet:hover, .adder.quiet:focus-within { opacity: 1; }
  /* The dashed line beside the revealed button: where the new row will go. */
  .adder.quiet .slot { flex: 1; height: 1px; border-bottom: 1px dashed var(--border-strong); }
  .adder .btn.ghost { color: var(--muted); }
  .adder .btn.ghost:hover { color: var(--accent); }

  /* ---------- touch screens ----------
     No hover means no reveal, so wherever hover cannot happen – a
     touch screen, a coarse pointer, or a window narrow enough to be
     one – the folded adders and the rail's add row simply stay
     visible, and the command grips too. Decluttering is a pointer
     luxury; a button that can never appear is not quiet, it is gone. */
  @media (hover: none), (pointer: coarse), (max-width: 760px) {
    .adder.quiet { opacity: 1; }
    .rail .add { opacity: 1; }
    .rail a.cmd .grip { opacity: 1; }
    .rule-row > .grip { opacity: 1; }
  }

  .card {
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); padding: 10px 13px; margin-bottom: 7px;
  }
  /* A step's card hugs its sentence instead of stretching to the
     slice's full width – a short fact should not trail half a page of
     card behind it. The floor keeps the timeline from looking ragged,
     and a card with an editor open inside gets the whole line back:
     forms need the room, and a card resizing under a half-filled form
     would be worse than the whitespace ever was. */
  .step .card { width: fit-content; min-width: 380px; max-width: 100%; }
  .step .card:has(input, select, textarea) { width: auto; }
  .adder.quiet .slot { min-width: 48px; }
  .card.event { border-left: 3px solid var(--event); }
  .card.entity { border-left: 3px solid var(--entity); }
  /* What the command itself is: its input, in its own colour, like
     everything else on the page. */
  .card.command { border-left: 3px solid var(--command); }
  .card.projection { border-left: 3px solid var(--projection); }
  /* Code. Set apart from everything around it on purpose: this is the
     one part of a model the tooling neither checks nor understands, and
     it should not look like the parts it does. */
  .script {
    margin: 4px 0 10px 14px; padding: 8px 10px;
    border-left: 2px dashed var(--border-strong); display: grid; gap: 6px;
  }
  .script-handler { display: grid; gap: 3px; }
  .script-handler .tiny { display: flex; align-items: center; gap: 6px; }
  .script textarea, .script-handler textarea {
    width: 100%; box-sizing: border-box; resize: vertical;
    border: 1px solid var(--border); border-radius: 5px;
    background: var(--bg); color: var(--text);
    font-family: var(--mono); font-size: 11px; line-height: 1.5; padding: 7px 9px;
  }
  .script textarea:focus, .script-handler textarea:focus {
    outline: none; border-color: var(--accent);
  }
  /* Queries. The header carries the cost – how many times this command
     goes to the log – and the note under a card carries the reason it
     could not go earlier. Neither is authored: both are read off the
     operands already written. */
  .round-head { display: flex; align-items: center; gap: 8px; margin: 10px 0 4px; }
  .round-head:first-child { margin-top: 0; }
  .round-head .rule { flex: 0 0 18px; height: 1px; background: var(--border); }
  .round-head .label { font-size: 10px; text-transform: uppercase;
                       letter-spacing: 0.06em; color: var(--muted); }
  .waits { font-size: 11px; color: var(--muted); padding: 2px 0 0 12px; }
  .waits .op { font-family: var(--mono); font-size: 10px; }
  /* A member opened for editing: the row it replaces, expanded. */
  .member-editor { padding: 4px 0 4px 8px; border-left: 2px solid var(--accent);
                   margin: 2px 0; background: var(--surface); }
  .member-editor .adder { flex-wrap: wrap; }
  .member-editor .member-type { margin-top: 4px; }
  .chip.editable { cursor: pointer; }
  .chip.editable:hover { border-color: var(--accent); color: var(--accent); }
  /* A field offered rather than authored – dashed, like the adders it
     sits beside, so it reads as "not here yet" rather than as one more
     fact about the event. */
  .chip.suggest {
    font: inherit; font-size: 11px; cursor: pointer; color: var(--muted);
    border-style: dashed; background: transparent;
  }
  .chip.suggest:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .copy-missing { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row + .row { margin-top: 6px; }
  .row .grow { flex: 1; }
  .sentence { font-size: 13px; }
  .sentence .op { font-family: var(--mono); font-size: 12px; background: var(--type-soft);
                  border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; }
  .sentence .verb { color: var(--muted); }
  /* An operation is its token, set as code. */
  .verb.tok { font-family: var(--mono); font-size: 11px; }
  /* A reference, and the row it refers to. */
  .op.ref { cursor: pointer; }
  .op.ref:hover, .op.ref:focus, .op.ref.pinned {
    border-color: var(--accent); color: var(--accent); outline: none;
  }
  /* A read in place: the projection's name, muted brackets, and each
     value a reference chip of its own. */
  .sentence .op.read { background: none; border: none; padding: 0; }
  .op.read .read-name { color: var(--projection-text); font-weight: 600; }
  .op.read .read-punct { color: var(--muted); }
  .read-alias { font-family: var(--mono); font-size: 12px; width: 150px; }
  .read-alias.invalid { border-color: var(--danger); }
  .lit { box-shadow: 0 0 0 2px var(--accent); border-radius: 5px; }
  .fields { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
  .field { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 2px 0; }
  .field .nm { min-width: 170px; }
  /* A field's type, always on the row rather than waiting in the
     reveal: small and grey so the name stays the loudest thing, but
     never a click away. Still the way into the member editor. */
  .field .type-tag {
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    background: var(--type-soft); border: 1px solid var(--border);
    border-radius: 4px; padding: 0 4px; cursor: pointer;
  }
  .field .type-tag:hover { border-color: var(--accent); color: var(--accent); }
  .adder { display: flex; gap: 9px; align-items: center; margin-top: 7px; flex-wrap: wrap; }
  .dcb { font-family: var(--mono); font-size: 11.5px; line-height: 1.75; }
  .dcb .k { color: var(--muted); }
  .dcb .t { color: var(--entity-text); }
  .dcb .y { color: var(--event-text); }
  .dcb .al { color: var(--command); }
  /* A DCB query, drawn (_DCB queries, shown_): one box per call to the
     store, its items inside, ORed; a chain is several boxes. */
  .dq { display: flex; flex-direction: column; gap: 8px; font-family: var(--mono); font-size: 11.5px; }
  .dq-box { border: 1.5px solid var(--accent); border-radius: 8px; background: var(--surface); overflow: hidden; }
  .dq-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
          padding: 4px 10px; background: var(--accent-soft); border-bottom: 1px solid var(--border);
          color: var(--accent-strong); font-weight: 600; }
  .dq-h .dq-note { font-weight: 400; color: var(--muted); }
  .dq-items { display: flex; flex-direction: column; padding: 7px; }
  .dq-item { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 3px 8px; align-items: baseline;
             padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); }
  .dq-or { display: flex; align-items: center; gap: 8px; padding: 3px 6px; color: var(--accent-strong);
           font-size: 10px; font-weight: 600; letter-spacing: 0.08em; }
  .dq-or::before, .dq-or::after { content: ""; flex: 1; border-top: 1px dashed var(--border-strong); }
  .dq-key { color: var(--muted); }
  .dq-chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: baseline; }
  .dq-type { color: var(--event-text); background: var(--event-soft); border: 1px solid var(--border);
             border-radius: 4px; padding: 0 5px; }
  .dq-tag { color: var(--text); background: var(--type-soft); border: 1px solid var(--border-strong);
            border-radius: 4px; padding: 0 5px; }
  .dq-tag i { color: var(--accent); }
  .dq-from { color: var(--command); }
  .dq-any, .dq-each { color: var(--muted); }
  .dq-link { padding: 0 0 0 16px; color: var(--muted); }
  .dq-link b { color: var(--accent); font-weight: 400; }
  .dq-head, .dq-cond { padding: 5px 10px; border: 1px dashed var(--border-strong); border-radius: 6px; line-height: 1.7; }
  .dq-cond b, .dq-head b { color: var(--accent); }
  .dq-json { margin: 0; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
             background: var(--elevated); white-space: pre; overflow-x: auto; line-height: 1.55; }
  .dq-json .jk { color: var(--json-key); }
  .dq-json .js { color: var(--json-string); }
  .dq-json .jn { color: var(--json-number); }
  .dq-json .jc { color: var(--muted); }
  .dq-seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 6px; overflow: hidden; }
  .dq-seg button { font: inherit; font-size: 11px; border: 0; padding: 2px 8px; background: var(--surface);
                   color: var(--muted); cursor: pointer; }
  .dq-seg button.on { background: var(--accent); color: var(--surface); }
  .dq-seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  /* The query glyph and its popover: a mark where a line used to be.
     Hover and focus peek; `.on` is the pinned state. */
  .qpop { position: relative; display: inline-flex; vertical-align: middle; }
  .qbtn { background: none; border: none; padding: 0 3px; cursor: pointer;
          color: var(--muted); display: inline-flex; align-items: center; }
  .qbtn:hover, .qbtn:focus-visible, .qpop.on .qbtn { color: var(--accent); }
  .qbtn .qico { display: inline-flex; }
  .qbtn .qico svg { width: 13px; height: 13px; }
  .qpop .qpanel { display: none; position: absolute; top: calc(100% + 5px); left: -10px;
                  z-index: 60; background: var(--surface);
                  border: 1px solid var(--border-strong); border-radius: 8px;
                  padding: 8px 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
                  min-width: 320px; max-width: 560px; }
  .qpop:hover .qpanel, .qpop:focus-within .qpanel, .qpop.on .qpanel { display: block; }
  .qpanel .qtitle { margin-bottom: 2px; text-transform: uppercase; font-size: 9.5px;
                    letter-spacing: 0.06em; }
  .qpanel .trip + .trip { margin-top: 6px; }

  /* The concept hint: same peek/pin behaviour as the query popover, a
     quieter mark, and it rides a heading rather than a row. */
  /* Centred on the capitals, not the lowercase: the box is 1em tall and
     its bottom sits 0.15em under the baseline, so its middle is 0.35em
     up – half a cap height. `middle` centred it on half the x-height,
     which beside an uppercase heading read a pixel and more low. */
  .hint { position: relative; display: inline-flex; vertical-align: -0.15em; }
  .hbtn { background: none; border: none; padding: 0 2px; cursor: help;
          color: var(--muted); font-size: inherit; line-height: 1;
          display: inline-flex; align-items: center; }
  .hbtn .imark, .hbtn .imark svg { display: block; width: 1em; height: 1em; }
  .hbtn:hover, .hbtn:focus-visible, .hint.on .hbtn { color: var(--accent); }
  .hint .hpanel { display: none; position: absolute; top: calc(100% + 5px); left: -10px;
                  z-index: 60; background: var(--surface);
                  border: 1px solid var(--border-strong); border-radius: 8px;
                  padding: 8px 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
                  min-width: 260px; max-width: 420px;
                  font-size: 11.5px; line-height: 1.55; color: var(--muted);
                  font-weight: 400; text-transform: none; letter-spacing: 0; }
  .hint:hover .hpanel, .hint:focus-within .hpanel, .hint.on .hpanel { display: block; }
  .hpanel .qtitle { color: var(--text); margin-bottom: 3px; }
  .hpanel .hline + .hline { margin-top: 5px; }
  .hpanel code.hl { font-size: inherit; color: var(--text); background: var(--accent-soft);
                    border-radius: 3px; padding: 0 3px; }
  .tag-sample { color: var(--text); }
  .hpanel .hlinks { display: flex; gap: 14px; margin-top: 6px; }
  .hpanel .hlink { font-size: 11px; }

  /* An entity chip is a way in: click it anywhere and the thing itself
     slides in beside what you were reading, rather than replacing it. */
  .chip.entity, .op.ent { cursor: pointer; }
  .chip.entity:hover, .op.ent:hover { outline: 1px solid var(--entity); }

  /* A chip that is a way to something else, wherever a definition
     turns up as a cross-reference rather than as itself. Its own kind
     already colours it (chip.command, chip.event, chip.projection); this
     only adds the affordance, in the same colour. */
  .chip.linkable { cursor: pointer; }
  .chip.linkable:hover { outline: 1px solid currentColor; }

  /* ---------- the ledger ----------
     Every projection is shown this way, on the Projections page and on
     an entity's own. Four facts wide, because those are the four that
     differ between one projection and the next; everything else waits
     until a row is opened. The columns are set per page rather than
     here – an entity's page already states what its rows are kept per,
     so it drops that one and passes a narrower template.
     On a phone the name is the column that gives nothing up: the tags
     fold away (the opened row still states them), the other two
     narrow, and a long name wraps rather than ellipsizes. */
  .ledger {
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); overflow: hidden;
  }
  .lhead, .lrow {
    display: grid; grid-template-columns: var(--cols);
    align-items: center; gap: 12px; padding: 0 12px;
  }
  .lhead { height: 30px; border-bottom: 1px solid var(--border); background: var(--type-soft); }
  .lhead > span {
    font-size: 10px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); font-weight: 600;
  }
  .lrow {
    min-height: 42px; border-bottom: 1px solid var(--border); cursor: pointer;
    border-left: 3px solid transparent; padding-left: 9px;
  }
  .lrow:hover { background: var(--accent-soft); }
  .lrow.on { background: var(--entity-soft); border-left-color: var(--entity); }
  .lrow.dead { opacity: .6; }
  .lrow .nm {
    font-size: 13px; font-weight: 600; min-width: 0;
    display: flex; align-items: center; gap: 7px;
  }
  .lrow .nm .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lcell {
    font-family: var(--mono); font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .lcell.ty { color: var(--type); }
  .lstart { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 760px) {
    .lhead, .lrow { grid-template-columns: minmax(0,1fr) 88px 76px; gap: 8px; }
    .ledger .lpart { display: none; }
    .lrow .nm .txt { white-space: normal; overflow-wrap: anywhere; padding: 6px 0; }
  }
  .lcaret { flex: none; width: 10px; font-size: 10px; color: var(--muted); }
  .ledger .addrow { padding: 9px 12px; }

  /* A tag, wherever a projection says what it is kept per. The entity
     green, because a tag is what an entity *is* – the identifier every
     event about one carries. */
  .chip.tag { background: var(--entity-soft); border-color: #bbf7d0; color: #166534; }
  body.f-dark .chip.tag { border-color: #166534; color: #bbf7d0; }

  /* The opened row. Two sides of one projection – what it is, and what
     pins it down – behind tabs scoped to the thing in front of you,
     which is a different gesture from navigating between things. */
  .pdetail {
    border-bottom: 1px solid var(--border); border-left: 3px solid var(--entity);
    background: var(--surface); padding: 2px 15px 13px;
  }
  .pdetail > .tabs { margin: 4px 0 8px; gap: 0; }
  .pdetail > .tabs .tab { padding: 6px 2px; margin-right: 20px; font-size: 12px; font-weight: 600; }
  .pdetail > .tabs .tab.on { color: var(--entity-text); border-bottom-color: var(--entity); }
  /* The projection editor: sections on the left, what the definition
     works out to on the right – wrapping under them where the two do
     not fit side by side (a modal, a phone). */
  .peditor { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
  .peditor .pmain { flex: 999 1 480px; min-width: 0; }
  .peditor .pusage { flex: 1 1 190px; min-width: 0; background: var(--bg); border-left: 1px solid var(--border); border-radius: 0 var(--radius) var(--radius) 0; }
  .peditor .pk { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; color: var(--muted); }
  .peditor .phead > .pk, .peditor .pusage-block > .pk { text-transform: uppercase; }
  .peditor .pbar { display: flex; align-items: center; padding: 6px 12px 0; }
  .peditor .psection { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .peditor .psection:last-child { border-bottom: 0; }
  .peditor .phead { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .peditor .phead .grow, .peditor .pbar .grow { flex: 1; }
  .peditor .pfields { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  .peditor .pfield { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .peditor .pfield select, .peditor .pfield input { width: 100%; max-width: 100%; }
  .peditor .pinitial { display: flex; gap: 6px; }
  .peditor .pinitial select { width: auto; flex: none; }
  .peditor .pinitial input { flex: 1; min-width: 0; }
  .peditor .pinitial-list { margin-top: 6px; }
  /* A handler is one line – on, event, operation, value – however long
     the event's name: the pickers give way and end in an ellipsis (the
     open list still shows each name whole) rather than the value
     dropping under the event. A phone, where that would leave a few
     letters of each, lets the row wrap again. */
  .peditor .pkinds { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; }
  .peditor .pkind { display: grid; gap: 2px; text-align: left; padding: 8px 10px; border: 1px solid var(--border-strong); border-radius: 6px; background: var(--surface); color: var(--muted); font: inherit; font-size: 12px; cursor: pointer; }
  .peditor .pkind b { color: var(--text); font-size: 13px; font-weight: 600; }
  .peditor .pkind:hover { border-color: var(--accent); }
  .peditor .pkind.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .peditor .pkind:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .peditor .pcheck { margin: 0; padding: 8px 10px; font: 11.5px/1.55 var(--mono); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; overflow-x: auto; white-space: pre; }
  .peditor .pguess { margin-top: 2px; }
  .peditor .pwizard-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 12px 4px; }
  .peditor .phandler { display: flex; flex-wrap: nowrap; align-items: center; gap: 6px; padding: 4px 6px; margin-bottom: 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); }
  .peditor .phandler > .pk, .peditor .phandler > .pop, .peditor .phandler > .btn { flex: none; }
  .peditor .phandler > .btn.danger { margin-left: auto; }
  .peditor .phandler > select { flex: 0 1 auto; min-width: 4.5em; }
  /* The event's name gives way first: the value is a path whose end is
     the part that says anything. */
  .peditor .phandler > select:first-of-type { flex-shrink: 4; }
  .peditor .phandler > input { flex: 1 1 6em; min-width: 0; }
  .peditor .phandler > select > button, .peditor .phandler selectedcontent { min-width: 0; overflow: hidden; white-space: nowrap; }
  .peditor .phandler selectedcontent > .label, .peditor .phandler selectedcontent > .token { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 560px) {
    .peditor .phandler { flex-wrap: wrap; }
  }
  .peditor .pusage-block { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .peditor .pusage-block:last-child { border-bottom: 0; }
  .peditor .pquery { font-family: var(--mono); font-size: 11px; line-height: 1.6; overflow-wrap: anywhere; }
  .peditor .linkish { background: none; border: 0; padding: 0; font: inherit; font-size: 12px; color: var(--text); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .peditor .linkish:hover { color: var(--accent); }
  .pswitch { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 4px 0; font-size: 11px; color: var(--muted); cursor: pointer; }
  .pswitch .track { position: relative; width: 26px; height: 14px; border-radius: 999px; background: var(--border-strong); }
  .pswitch .knob { position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); transition: left .12s; }
  .pswitch.on { color: var(--text); }
  .pswitch.on .track { background: var(--accent); }
  .pswitch.on .knob { left: 14px; }
  .ecard .irow { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 4px 0; font-size: 12px; }
  .ecard .irow > .nm { min-width: 96px; color: var(--muted); font-family: var(--mono); font-size: 11px;
                       display: inline-flex; align-items: center; gap: 4px; }
  .ecard .type-advanced { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
  .ecard .type-advanced:empty { display: none; }
  .seg { display: inline-flex; }
  .seg .btn { border-radius: 0; }
  .seg .btn:first-child { border-radius: 6px 0 0 6px; }
  .seg .btn:last-child { border-radius: 0 6px 6px 0; margin-left: -1px; }
  .seg .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); position: relative; }
  .kind-badge { font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
                color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 1px 6px; }
  .pswitch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  @media (max-width: 760px) {
    .peditor .pusage { border-left: 0; border-top: 1px solid var(--border); border-radius: 0 0 var(--radius) var(--radius); }
  }
  .pfoot {
    display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
    padding-top: 12px; margin-top: 10px; border-top: 1px dashed var(--border);
  }
  .pfoot .grow { flex: 1; }

  /* ---------- the index ----------
     Projections lists only what no entity binds, so this is the one
     place left that says what else exists and where it lives. It is
     deliberately not a second ledger: names, and a way to each. */
  .index { margin-top: 22px; }
  .index > .why { font-size: 11.5px; color: var(--muted); margin: 3px 0 8px; }
  .index-row {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 7px 2px; border-top: 1px dashed var(--border); font-size: 12px;
  }
  .index-row .ent {
    font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; min-width: 130px;
  }
  .index-row .ent:hover { color: var(--accent); }
  .index-row .props { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .lnk {
    font: inherit; font-family: var(--mono); font-size: 12px;
    border: 0; background: none; padding: 0; color: var(--muted); cursor: pointer;
  }
  .lnk:hover { color: var(--accent); }

  /* Identity. Set apart from the properties below it because it is a
     different kind of statement: what makes one of these one of these,
     rather than something we happen to know about it. Nobody added the
     identifier – it comes with the thing – and a page that lists it
     alongside "capacity" says otherwise. */
  .ident {
    border: 1px solid var(--entity); border-left-width: 3px;
    border-radius: var(--radius); background: var(--entity-soft);
    padding: 11px 14px 12px; margin-bottom: 22px;
  }
  .ident > h4 { color: var(--entity-text); }
  .ident .irow {
    display: flex; align-items: center; flex-wrap: wrap; gap: 7px;
    padding: 5px 0; font-size: 12px;
  }
  .ident .irow + .irow { border-top: 1px dashed var(--border); }
  .ident .irow > .nm { min-width: 110px; color: var(--muted); font-size: 11px; }
  .ident .irow > .grow { flex: 1; }

  /* The lifecycle, drawn where it is named: the Lifecycles band's own
     vocabulary – a pill per state, the event on the arrow – shrunk to
     one row, because a two-state machine is a picture that a sentence
     was standing in for. The pills name the stored *values* where the
     band names them in words: the band has room to say "does not
     exist", and a row that already carries the property chip beside
     them would only be saying `exists` twice. */
  .lctrack { display: inline-flex; align-items: center; gap: 6px; }
  .lctrack .st {
    display: inline-flex; padding: 1px 8px; border-radius: 999px; white-space: nowrap;
    border: 1.5px solid var(--entity); background: var(--surface);
    font-size: 11px; font-weight: 600;
  }
  .lctrack .st.val { font-family: var(--mono); font-size: 10.5px; font-weight: 500; }
  /* Nothing moves into it yet. Drawn as the absence it is, the way
     `.chip.unset` draws a value nobody has given. */
  .lctrack .st.unreached {
    border-style: dashed; border-color: var(--border-strong);
    background: transparent; color: var(--muted); font-weight: 400;
  }
  .lctrack .st.terminal { outline: 1.5px solid var(--entity); outline-offset: 2px; }
  /* The label hangs above the wire rather than stacking with it, so the
     wire itself is what the pills centre on – stacked, the hop's middle
     falls between label and wire and the arrow rides low. The row that
     holds a track pays for the overhang in padding (`.lcrow`). */
  .lctrack .hop { position: relative; display: inline-flex; align-items: center; }
  .lctrack .hop .ev {
    position: absolute; left: 50%; bottom: calc(100% + 1px); transform: translateX(-50%);
    font-family: var(--mono); font-size: 9.5px; color: var(--event-text); white-space: nowrap;
  }
  .ident .irow.lcrow { padding-top: 12px; }
  .lctrack .wire { display: inline-flex; align-items: center; }
  .lctrack .wire i { height: 0; border-top: 1px solid var(--border-strong); }
  .lctrack .wire b {
    width: 0; height: 0; border-left: 4px solid var(--border-strong);
    border-top: 3px solid transparent; border-bottom: 3px solid transparent;
  }
  .lctrack .hop.dead .wire i { border-top-style: dashed; }

  /* The folded lifecycle on the identifier line: a derived fact in the
     page's muted register, and the button that unfolds it. Never faded
     like the menu beside it – it is the only way to the row. */
  .lcfold {
    display: inline-flex; align-items: center; gap: 4px;
    font: inherit; font-size: 11px; color: var(--muted); cursor: pointer;
    padding: 2px 6px; border: 1px solid transparent; border-radius: 6px; background: none;
  }
  .lcfold:hover, .lcfold:focus-visible { border-color: var(--border-strong); }
  .lcfold .p { font-family: var(--mono); color: var(--text); }
  .lcfold .caret, .lcfold .caret svg { display: block; width: 8px; height: 8px; }
  .lcfold .caret { margin-left: 2px; transition: transform .12s; }
  .lcfold.on .caret { transform: rotate(180deg); }

  /* Everything that can be done to a lifecycle, behind one mark – and
     the mark itself waits for the pointer. Nobody opens an entity page
     to designate a property, but the two buttons that did it sat at
     full strength beside a fact nobody was editing. Click-only, never
     hover like the hints: these are edits, and an edit that opens
     because the pointer passed over it is a trap. */
  /* Faded rather than hidden: `visibility: hidden` would take the button
     out of the tab order, and the only other focusable thing in the row
     is the chip – so the one way to the menu would be a pointer. */
  .ident .lcmenu {
    position: relative; display: inline-flex; vertical-align: middle; opacity: 0;
  }
  .ident:hover .lcmenu, .ident .lcmenu:focus-within, .ident .lcmenu.on,
  .ident .lcmenu.lcadd { opacity: 1; }
  .lcbtn {
    font: inherit; font-size: 13px; line-height: 1.1; cursor: pointer;
    padding: 0 4px; border: 1px solid transparent; border-radius: 6px;
    background: none; color: var(--border-strong);
  }
  .lcbtn:hover, .lcbtn:focus-visible, .lcmenu.on .lcbtn {
    color: var(--muted); border-color: var(--border-strong);
  }
  .lcmenu .lcpanel {
    display: none; position: absolute; top: calc(100% + 5px); right: 0; z-index: 60;
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px;
    padding: 4px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18); min-width: 215px;
  }
  .lcmenu.on .lcpanel { display: block; }
  .lcitem {
    display: block; width: 100%; text-align: left; white-space: nowrap;
    font: inherit; font-size: 12px; padding: 6px 10px;
    border: 0; border-radius: 5px; background: none; color: var(--text); cursor: pointer;
  }
  .lcitem:hover, .lcitem:focus-visible { background: var(--accent-soft); color: var(--accent); }

  .esection { margin-bottom: 18px; }
  .esection > h4 { margin-bottom: 8px; }
  .esection > .ehead .grow { flex: 1; }

  /* The mark that stands for a thing, wherever the thing is named. */
  .ic { font-style: normal; margin-right: 5px; }
  .chip .ic { margin-right: 4px; }
  /* Unmarked is the common case: an authored mark is the exception, so
     the slot has to vanish rather than reserve itself a gutter. */
  .ic:empty { display: none; }
  /* A kind's fallback mark is a text glyph, so the colour is ours to
     give: the kind's, where the slot is not kind-coloured already. */
  .fallback-command { color: var(--command); }
  .fallback-event { color: var(--event-text); }
  .chip .fallback-command, .chip .fallback-event { color: inherit; }
  .icon-btn {
    font: inherit; font-size: 20px; line-height: 1; cursor: pointer;
    width: 34px; height: 34px; flex: none; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); border-radius: 9px; background: var(--surface);
  }
  .icon-btn:hover { border-color: var(--entity); }
  .icon-btn.event:hover { border-color: var(--event); }
  .icons .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(32px, 1fr));
    gap: 4px; margin-bottom: 8px; max-width: 460px;
  }
  .ic-opt {
    font: inherit; font-size: 17px; line-height: 1; cursor: pointer;
    height: 30px; padding: 0; border-radius: 6px;
    border: 1px solid transparent; background: var(--surface);
  }
  .ic-opt:hover { border-color: var(--entity); }
  .ic-opt.on { border-color: var(--entity); background: var(--entity-soft); }
  .icons.event .ic-opt:hover { border-color: var(--event); }
  .icons.event .ic-opt.on { border-color: var(--event); background: var(--event-soft); }

  /* ---------- settings ----------
     Everything that decides how the interface behaves rather than what
     the model says. It lives in one place so the bar at the top can go
     back to being about the model, and so the next such choice has an
     obvious home. Every other modal dims and blurs the page so it
     stands clear of it; this one's backdrop is thin on purpose (`.thin`):
     these settings change the page behind it, and you should see them
     land. */
  .overlay {
    position: fixed; inset: 0; z-index: 40;
    background: var(--scrim);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    display: flex; justify-content: center; align-items: flex-start;
    padding: 64px 16px 24px;
  }
  .overlay.thin { background: rgba(15, 23, 42, .22); -webkit-backdrop-filter: none; backdrop-filter: none; }
  .modal {
    width: 540px; max-width: 100%; max-height: calc(100vh - 100px); overflow: auto;
    background: var(--elevated); border: 1px solid var(--border-strong);
    border-radius: 12px; box-shadow: 0 24px 64px rgba(15, 23, 42, .35), 0 2px 6px rgba(15, 23, 42, .12);
    padding: 16px 20px 18px;
  }
  /* Focused so Escape and Tab start inside it, not to be pointed at. */
  .modal:focus { outline: none; }
  /* A ghost button sits on the modal's own shade, not the page's white. */
  .modal .btn.ghost { background: transparent; }
  .modal > header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 2px; }
  .modal a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .modal a:hover { text-decoration: underline; }
  .modal > header .grow { flex: 1; }
  .modal > footer { display: flex; align-items: center; gap: 8px; margin-top: 18px; }
  .modal > footer .grow { flex: 1; }
  /* On a phone every dialog is the whole screen – Settings and quick
     open included. A card with a margin round it spends width the
     content needs, and its height was 100vh, which on a phone is taller
     than what is visible; dvh is what is visible (vh stays as the
     fallback). The header holds the × and stays put while the body
     scrolls, since with no backdrop left to tap the × and Escape are
     the ways out; the footer's Close stays where the content ends. The
     thin backdrop Settings uses to show its changes landing has
     nothing to show through here – the one change worth watching, the
     theme, sits in the bar's ⋯ menu. */
  @media (max-width: 760px) {
    .overlay { padding: 0; align-items: stretch; }
    .modal {
      width: 100%; max-width: none; height: 100vh; height: 100dvh; max-height: none;
      border: 0; border-radius: 0; box-shadow: none;
    }
    .modal { padding: 0 16px 24px; }
    .modal > header {
      position: sticky; top: 0; z-index: 1; align-items: center;
      margin: 0 -16px 8px; padding: 10px 8px 10px 16px;
      background: var(--elevated); border-bottom: 1px solid var(--border);
    }
    .modal > header > .btn.ghost:last-child {
      display: inline-flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; padding: 0; font-size: 22px;
    }
  }
  /* A definition modal holds a whole editor – a projection's handlers
     run wide – so it gets more room than a dialog of choices. */
  .modal.def-modal { width: 760px; }
  .modal.def-modal .def-back { flex: none; }
  /* The pencil is drawn, not written: the button sits inside sentences
     that read as prose, and its name is its aria-label. */
  .btn.def-edit { padding: 0 4px; margin-left: 2px; color: var(--muted); }
  .btn.def-edit::before { content: '✎'; }
  .btn.def-edit:hover { color: var(--accent); }
  /* The help: a sidebar of pages and the page beside it, a fixed
     height so moving between pages does not resize the dialog, and a
     footer that stays put while the page scrolls. */
  .modal.help-modal {
    width: 820px; height: 640px; max-height: calc(100vh - 100px);
    display: flex; flex-direction: column; padding: 0; overflow: hidden;
  }
  .help-modal > header { padding: 14px 18px 12px; margin: 0; border-bottom: 1px solid var(--border); }
  .help-panes { display: flex; flex: 1; min-height: 0; }
  .help-nav {
    width: 190px; flex: none; display: flex; flex-direction: column; gap: 1px;
    padding: 12px 10px; overflow-y: auto;
    background: var(--bg); border-right: 1px solid var(--border);
  }
  .help-nav-item {
    font: inherit; font-size: 13px; text-align: left; padding: 7px 10px;
    border: 0; border-radius: 6px; background: transparent; color: var(--text); cursor: pointer;
  }
  .help-nav-item:hover { background: var(--accent-soft); color: var(--accent-strong); }
  .help-nav-item.active { background: var(--surface); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
  .help-nav hr { border: 0; border-top: 1px solid var(--border); margin: auto 4px 8px; }
  .help-body { flex: 1; min-width: 0; overflow-y: auto; padding: 20px 24px; }
  .help-body > :first-child { margin-top: 0; }
  .help-body p { font-size: 13.5px; line-height: 1.6; margin: 12px 0; }
  .help-body p code { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
  .help-body h3 { font-size: 15px; margin: 0 0 4px; }
  .help-body h4 {
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin: 18px 0 0;
  }
  .help-body .help-claim { font-size: 17px; font-weight: 600; line-height: 1.4; }
  .help-video {
    position: relative; display: flex; align-items: center; justify-content: center; width: 100%;
    aspect-ratio: 16 / 9; border: 0; padding: 0; border-radius: var(--radius); overflow: hidden;
    background: linear-gradient(135deg, #0f172a, #1e293b); cursor: pointer;
  }
  .help-video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .help-video:hover .help-play { background: #fff; }
  .help-play {
    width: 56px; height: 56px; border-radius: 50%; padding-left: 4px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255, 255, 255, .92); color: var(--accent-strong); font-size: 20px;
  }
  .help-video-caption { position: absolute; left: 12px; bottom: 10px; color: #fff; font-size: 12px; }
  .help-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0 0; }
  .help-cards > div {
    padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
  }
  .help-cards dt { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .help-cards dd { margin: 0; font-size: 12px; line-height: 1.45; color: var(--muted); }
  .help-features {
    display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px;
    margin: 6px 0 0; font-size: 12.5px; line-height: 1.5;
  }
  .help-features dt { font-weight: 600; }
  .help-features dd { margin: 0; color: var(--muted); }
  .help-modal > footer { gap: 12px; margin: 0; padding: 12px 18px; border-top: 1px solid var(--border); }
  .help-links { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; }
  /* A keyboard's shortcuts mean nothing on a phone. */
  @media (hover: none) and (pointer: coarse) {
    .help-keys { display: none; }
  }
  /* On a phone the sidebar becomes a strip of pages above the page,
     scrolling sideways, and the dialog is the whole screen like every
     other. */
  @media (max-width: 760px) {
    .modal.help-modal { width: 100%; height: 100vh; height: 100dvh; max-height: none; padding: 0; }
    .help-modal > header { margin: 0; padding: 10px 8px 10px 16px; }
    .help-panes { flex-direction: column; }
    .help-nav {
      width: auto; flex-direction: row; gap: 4px; padding: 8px 12px; overflow-x: auto;
      border-right: 0; border-bottom: 1px solid var(--border);
    }
    .help-nav-item { flex: none; white-space: nowrap; }
    .help-nav-item.active { box-shadow: inset 0 -2px 0 var(--accent); }
    .help-nav hr { display: none; }
    .help-body { padding: 16px; }
    .help-modal > footer { flex-wrap: wrap; }
    .help-links { flex-basis: 100%; }
  }
  @media (max-width: 560px) {
    .help-cards, .help-features { grid-template-columns: 1fr; }
    .help-features { gap: 2px; }
    .help-features dd { margin-bottom: 8px; }
  }
  .setting { margin-top: 18px; }
  .setting > h4 { margin-bottom: 3px; }
  .setting .why { font-size: 11.5px; color: var(--muted); margin-bottom: 8px; }
  .gate-script { border: 1px solid var(--border); border-radius: 7px; margin-bottom: 6px; }
  .gate-script > summary { cursor: pointer; padding: 6px 10px; font-family: var(--mono); font-size: 12px; }
  .gate-script > div { padding: 0 10px 8px; }
  .gate-script pre {
    margin: 2px 0 0; padding: 6px 8px; max-height: 14em; overflow: auto;
    font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap;
    background: var(--bg); border-radius: 5px;
  }
  .opt {
    display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left;
    font: inherit; color: inherit; cursor: pointer;
    border: 1px solid var(--border); border-radius: 7px;
    background: var(--surface); padding: 8px 11px; margin-bottom: 6px;
  }
  .opt:hover { border-color: var(--accent); }
  .opt.on { border-color: var(--accent); background: var(--accent-soft); }
  .opt .mark {
    flex: none; width: 13px; height: 13px; margin-top: 3px;
    border-radius: 50%; border: 1px solid var(--border-strong); background: var(--surface);
  }
  .opt.on .mark { border: 4px solid var(--accent); }
  .opt .label { font-size: 13px; font-weight: 600; }
  .opt .desc { font-size: 11.5px; color: var(--muted); }

  /* ---------- import & export ----------
     One dialog for both directions a model crosses this browser's
     boundary: pulling one in, from a URL or pasted JSON, and sending
     this one out the same two ways. Tabs rather than a picker, since
     unlike Settings there is a natural default per tab (a URL, JSON) an
     answer usually only needs one of. */
  .ie-tabs { display: flex; margin: 14px 0 16px; border-bottom: 1px solid var(--border); }
  .ie-tab {
    font: inherit; font-size: 13.5px; font-weight: 600; padding: 8px 4px; margin-right: 22px;
    border: 0; background: none; color: var(--muted); cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .ie-tab:hover { color: var(--text); }
  .ie-tab.on { color: var(--accent); border-bottom-color: var(--accent); }

  .ie-subtoggle {
    display: inline-flex; border: 1px solid var(--border-strong); border-radius: 7px;
    overflow: hidden; margin-bottom: 14px;
  }
  .ie-pill {
    font: inherit; font-size: 12.5px; padding: 6px 13px; border: 0;
    background: var(--surface); color: var(--muted); cursor: pointer;
  }
  .ie-pill + .ie-pill { border-left: 1px solid var(--border-strong); }
  .ie-pill.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .ie-pill:hover:not(.on) { color: var(--text); }

  .ie-check-row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; font-size: 12.5px; color: var(--muted); }
  .ie-check-label { font-weight: 600; }
  .ie-check { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; color: var(--text); }
  .ie-check input { margin: 0; }

  .ie-field label {
    display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); font-weight: 700; margin-bottom: 5px;
  }
  .ie-field input[type=text], .ie-field textarea {
    width: 100%; font: inherit; font-size: 13px; padding: 9px 11px;
    border: 1px solid var(--border-strong); border-radius: 6px;
    background: var(--surface); color: var(--text); resize: vertical;
  }
  .ie-field input:focus, .ie-field textarea:focus { outline: none; border-color: var(--accent); }
  .ie-field textarea.mono, .ie-field input.mono { font-family: var(--mono); font-size: 11.5px; }
  .ie-field textarea[readonly], .ie-field input[readonly] { background: #fbfcfe; color: var(--muted); }
  body.f-dark .ie-field textarea[readonly], body.f-dark .ie-field input[readonly] { background: #101827; }
  .ie-field .why { font-size: 11.5px; color: var(--muted); margin-top: 7px; line-height: 1.5; }
  .ie-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .ie-hint { font-size: 11.5px; color: var(--muted); margin-top: 12px; line-height: 1.5; }
  .ie-hint code { font-family: var(--mono); overflow-wrap: anywhere; }

  /* ---------- quick open ----------
     Everything in the model, by name, from anywhere. It sits higher and
     tighter than the settings modal because it is passed through rather
     than read. */
  .palette {
    width: 520px; max-width: 100%; background: var(--surface);
    border: 1px solid var(--border-strong); border-radius: 10px;
    box-shadow: 0 22px 60px rgba(15, 23, 42, .34); overflow: hidden;
  }
  .palette-overlay { padding-top: 14vh; }
  .palette-head { display: flex; align-items: center; border-bottom: 1px solid var(--border); }
  .palette-close { display: none; margin-right: 8px; }
  .palette input {
    flex: 1; min-width: 0; width: 100%; border: 0; border-radius: 0;
    padding: 13px 15px; font-size: 15px; background: transparent;
  }
  .palette input:focus { outline: none; }
  .palette .hits { max-height: 340px; overflow: auto; padding: 5px; }
  .palette .hit {
    display: flex; align-items: center; gap: 9px;
    padding: 6px 9px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .palette .hit.on { background: var(--accent-soft); }
  .palette .hit .what {
    flex: none; font-size: 9px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); width: 74px;
  }
  .palette .hit .where { margin-left: auto; font-size: 11px; color: var(--muted); }
  .palette .none { padding: 16px; font-size: 12px; color: var(--muted); font-style: italic; }
  .palette footer {
    border-top: 1px solid var(--border); padding: 6px 12px;
    font-size: 10.5px; color: var(--muted); display: flex; gap: 12px;
  }
  /* Fullscreen on a phone, like every dialog – see .modal. */
  @media (max-width: 760px) {
    .palette-overlay { padding: 0; }
    .palette {
      display: flex; flex-direction: column; width: 100%; max-width: none;
      height: 100vh; height: 100dvh; border: 0; border-radius: 0; box-shadow: none;
    }
    .palette .palette-close {
      display: inline-flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; padding: 0; font-size: 22px;
    }
    .palette .hits { max-height: none; flex: 1; }
    .palette .hit { min-height: 40px; }
    /* Keyboard hints, on a screen without the keys. */
    .palette footer { display: none; }
  }


  /* ---------- problems: one diagnostic dress ----------
     The Problems panel's rows and the in-page advisory banner are the
     same records, so they wear the same clothes – and deliberately NOT
     the model's: no white surface, no 3px kind border. A red-tinted
     panel with a hairline red border and a ⚠ mark reads as the tool
     talking about the model, never as one more block of it. The border
     and text colours are hardcoded like the chips' (a tint of --danger
     with no token of its own), so they are restated for dark below. */
  .issue {
    display: flex; align-items: baseline; gap: 9px; width: 100%; text-align: left;
    font: inherit; font-size: 12px; cursor: pointer;
    border: 1px solid #fca5a5; border-radius: 7px;
    background: var(--danger-soft); color: #991b1b;
    padding: 8px 11px; margin-bottom: 6px;
  }
  .issue:hover { border-color: var(--danger); }
  .issue .why { font-size: 11px; opacity: .75; }
  .badge {
    font-size: 10px; border-radius: 999px; padding: 0 6px; margin-left: 5px;
    background: var(--danger); color: #fff;
  }
  .badge.clear { background: var(--entity); }

  /* The same records, shown on the page of the definition that
     carries them. */
  .advisory {
    display: grid; gap: 4px;
    border: 1px solid #fca5a5; border-radius: 7px;
    background: var(--danger-soft); color: #991b1b;
    padding: 8px 11px; margin: 0 0 10px; font-size: 12px;
  }
  .advisory > div { display: flex; align-items: baseline; gap: 7px; }
  .xnotice {
    display: flex; align-items: baseline; gap: 10px;
    border: 1px solid var(--accent); border-radius: 7px;
    background: var(--accent-soft);
    padding: 8px 11px; margin: 0 0 14px; font-size: 12px;
  }
  .advisory .what { font-weight: 600; }
  .diag-mark { flex: none; }
  body.f-dark .issue, body.f-dark .advisory { border-color: #7f1d1d; color: #fecaca; }
  body.f-dark .issue:hover { border-color: var(--danger); }

  /* Site-wide – it sits after .layout in the document so it closes the
     page whether a model fills it or nothing is loaded yet. */
  .site-footer {
    text-align: center; font-size: 11.5px; color: var(--muted);
    padding: 16px 18px; border-top: 1px solid var(--border);
  }

  /* A row the interface just moved you to. Long enough to find it,
     short enough not to become part of the page. */
  @keyframes landed {
    from { background: var(--accent-soft); }
    to { background: transparent; }
  }
  .landed { animation: landed 1.1s ease-out; }

  /* ---------- scenarios ----------
     A scenario reads as a sentence in three parts, so its detail is
     three labelled blocks rather than a form. The status carries the
     colour: agreement is quiet, a difference is not. */
  .tabs { display: flex; gap: 4px; margin: 0 0 20px; border-bottom: 1px solid var(--border); }

  /* History – a timeline: a node per step in its kind's colour, what
     was undone dimmed above "now", an agent's steps hatched and badged. */
  .hist-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; }
  .hist-stats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .hist-stats span { font-size: 12px; padding: 1px 9px; border-radius: 999px; color: var(--muted);
    background: var(--surface); border: 1px solid var(--border); }
  .hist-stats strong { color: var(--text); font-weight: 600; }
  .hist-seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; background: var(--surface); }
  .hist-seg button { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border: 0;
    background: transparent; color: var(--text); font: inherit; font-size: 13px; cursor: pointer; }
  .hist-seg button + button { border-left: 1px solid var(--border); }
  .hist-seg button:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent-strong); }
  .hist-seg button:disabled { color: var(--muted); opacity: .5; cursor: default; }
  .hist-seg svg, .hist-acts svg { width: 15px; height: 15px; }
  .hist-banner { margin: 0 0 14px; padding: 12px 14px; border-radius: 10px; font-size: 13px;
    background: var(--changed-soft); color: var(--changed); border: 1px solid var(--border); }
  .hist-empty { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
    padding: 44px 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
  .hist-empty .muted { max-width: 420px; }
  .hist-empty-icon { display: flex; align-items: center; justify-content: center; width: 52px; height: 52px;
    border-radius: 50%; background: var(--accent-soft); color: var(--accent); margin-bottom: 4px; }
  .hist-empty-icon svg { width: 24px; height: 24px; }
  .hist-list { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 6px 0; }
  .hist-section { padding: 10px 20px 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .hist-section span { text-transform: none; letter-spacing: 0; font-size: 12px; }
  .hist-row { display: grid; grid-template-columns: 44px 34px minmax(0, 1fr) auto; column-gap: 14px;
    align-items: start; padding: 0 16px 0 14px; cursor: pointer; }
  .hist-row:hover { background: var(--elevated); }
  .hist-row.current { cursor: default; background: var(--accent-soft); }
  .hist-row.by-agent { background-image: repeating-linear-gradient(135deg, transparent 0 10px,
    color-mix(in srgb, var(--muted) 8%, transparent) 10px 11px); }
  .hist-time { font-family: var(--mono); font-size: 11.5px; color: var(--muted); padding-top: 15px; text-align: right; }
  .hist-time-inline { display: none; }
  .hist-track { position: relative; display: flex; justify-content: center; align-self: stretch; padding: 9px 0; }
  .hist-track::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--border); }
  .hist-row.last .hist-track::before { bottom: auto; height: 24px; }
  .hist-row.future .hist-track::before { background: repeating-linear-gradient(to bottom, var(--border-strong) 0 4px, transparent 4px 8px); }
  .hist-node { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid var(--border-strong);
    background: var(--elevated); color: var(--text); }
  .hist-node > svg { width: 15px; height: 15px; }
  .hist-row.k-command .hist-node { color: var(--command); border-color: var(--command); background: var(--command-soft); }
  .hist-row.k-event .hist-node { color: var(--event-text); border-color: var(--event); background: var(--event-soft); }
  .hist-row.k-entity .hist-node, .hist-row.k-projection .hist-node { color: var(--entity-text); border-color: var(--entity); background: var(--entity-soft); }
  .hist-row.k-custom-type .hist-node, .hist-row.k-scenario .hist-node { color: var(--type); border-color: var(--type); background: var(--type-soft); }
  .hist-row.k-opened .hist-node { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .hist-row.by-agent .hist-node::after { content: ''; position: absolute; inset: -5px; border-radius: 50%;
    border: 1.5px dashed var(--muted); opacity: .7; }
  .hist-badge { position: absolute; right: -7px; bottom: -6px; z-index: 2; display: flex; align-items: center; justify-content: center;
    width: 17px; height: 17px; border-radius: 50%; background: var(--text); color: var(--bg); box-shadow: 0 0 0 2px var(--surface); }
  .hist-badge svg { width: 11px; height: 11px; }
  .hist-body { padding: 10px 0; min-width: 0; }
  .hist-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
  .hist-verb { font-weight: 600; }
  .hist-line .chip { overflow-wrap: anywhere; }
  .hist-line .chip i { font-style: normal; font-family: inherit; font-size: 10px; text-transform: uppercase;
    letter-spacing: .06em; opacity: .75; margin-right: 6px; }
  .hist-agent { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600;
    padding: 1px 8px; border-radius: 999px; background: var(--text); color: var(--bg); }
  .hist-agent svg { width: 12px; height: 12px; }
  .hist-here { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--accent); color: var(--bg); }
  .hist-detail { margin-top: 2px; }
  .hist-more { display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; padding: 0; border: 0;
    background: none; font: inherit; font-size: 12.5px; color: var(--accent); cursor: pointer; }
  .hist-more:hover { color: var(--accent-strong); text-decoration: underline; }
  .hist-more svg { width: 12px; height: 12px; transition: transform .15s; }
  .hist-more.open svg { transform: rotate(90deg); }
  .hist-sub { list-style: none; margin: 6px 0 2px; padding: 6px 10px; display: flex; flex-direction: column; gap: 3px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--elevated); font-size: 12.5px; }
  .hist-sub li { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .hist-sub .muted { width: 64px; flex: none; }
  .hist-sub code { overflow-wrap: anywhere; }
  .hist-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--type); }
  .hist-dot.command { background: var(--command); }
  .hist-dot.event { background: var(--event); }
  .hist-dot.entity, .hist-dot.projection { background: var(--entity); }
  .hist-acts { display: flex; gap: 6px; padding-top: 10px; opacity: 0; transition: opacity .12s; }
  .hist-acts .btn { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .hist-row:hover .hist-acts, .hist-row:focus-within .hist-acts, .hist-row.current .hist-acts { opacity: 1; }
  .hist-row.future .hist-body, .hist-row.future .hist-time { opacity: .5; }
  .hist-row.future .hist-node { opacity: .55; border-style: dashed; }
  .hist-row.future:hover .hist-body, .hist-row.future:hover .hist-time, .hist-row.future:hover .hist-node { opacity: 1; }
  .hist-foot { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; }
  @media (hover: none), (pointer: coarse), (max-width: 760px) {
    .hist-row { grid-template-columns: 34px minmax(0, 1fr); padding-left: 10px; }
    .hist-time { display: none; }
    .hist-time-inline { display: inline; }
    .hist-acts { opacity: 1; grid-column: 2; padding: 0 0 10px; }
  }

  /* Compare */
  .cmp-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 0 16px; }
  .cmp-side { display: inline-flex; align-items: baseline; gap: 6px; min-width: 0; overflow-wrap: anywhere; }
  .cmp-mark { display: inline-flex; align-items: center; justify-content: center; flex: none;
    width: 18px; height: 18px; border-radius: 4px; font-weight: 700; font-size: 12px; line-height: 1; }
  .cmp-mark.added { background: var(--added-soft); color: var(--added); }
  .cmp-mark.removed { background: var(--removed-soft); color: var(--removed); }
  .cmp-mark.changed { background: var(--changed-soft); color: var(--changed); }
  .cmp-mark.same { color: var(--muted); }
  .cmp-totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 0 0 16px; }
  .cmp-total { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
  .cmp-total strong { font-size: 22px; }
  .cmp-total.added strong { color: var(--added); }
  .cmp-total.removed strong { color: var(--removed); }
  .cmp-total.changed strong { color: var(--changed); }
  .cmp-finding { padding: 10px 12px; margin: 0 0 12px; border-radius: var(--radius);
    background: var(--rule-soft); border: 1px solid var(--rule); }
  .cmp-problem-delta { margin: 0 0 16px; }
  .cmp-problems { margin: 4px 0; padding-left: 18px; }
  .cmp-split { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  .cmp-list { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; }
  .cmp-toggle { display: flex; align-items: center; gap: 6px; margin: 0 0 6px; }
  .cmp-group { display: flex; align-items: baseline; gap: 8px; margin: 12px 0 4px; }
  .cmp-group h4 { margin: 0; }
  .cmp-row { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; min-height: 32px;
    border: 0; border-radius: 6px; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .cmp-row:hover { background: var(--accent-soft); }
  .cmp-row.on { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
  .cmp-detail { flex: 2 1 420px; min-width: 0; padding: 12px; border: 1px solid var(--border);
    border-radius: var(--radius); background: var(--surface); }
  .cmp-detail-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 0 0 8px; }
  .cmp-code { font-family: var(--mono); font-size: 12px; line-height: 1.6; overflow-x: auto; }
  .cmp-line { display: grid; grid-template-columns: 3ch 3ch 2ch max-content; min-width: 100%; }
  .cmp-line .gut { color: var(--muted); text-align: right; padding-right: 6px; user-select: none; }
  .cmp-line .sign { color: var(--muted); text-align: center; user-select: none; }
  .cmp-line .txt { white-space: pre; padding-right: 12px; }
  .cmp-line.add { background: var(--added-soft); }
  .cmp-line.add .sign { color: var(--added); }
  .cmp-line.add .w { background: var(--added-word); border-radius: 2px; }
  .cmp-line.del { background: var(--removed-soft); }
  .cmp-line.del .sign { color: var(--removed); }
  .cmp-line.del .w { background: var(--removed-word); border-radius: 2px; }
  .cmp-command { margin: 0 0 14px; padding: 12px; border: 1px solid var(--border);
    border-radius: var(--radius); background: var(--surface); }
  .cmp-command.widened { border-color: var(--rule); }
  .cmp-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .cmp-cols h4 { margin: 0 0 6px; }
  .cmp-qi { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 5px 6px; border-radius: 6px; }
  .cmp-qi.added { background: var(--added-soft); }
  .cmp-qi.removed { background: var(--removed-soft); }
  .cmp-qi.removed .chip, .cmp-qi.removed .cmp-tag { text-decoration: line-through; }
  .cmp-tag { font-family: var(--mono); font-size: 12px; }
  .cmp-untagged { font-size: 12px; font-weight: 600; color: var(--rule); }
  .cmp-same summary { cursor: pointer; padding: 6px 0; }
  .cmp-code-kind { margin: 16px 0 8px; }
  .cmp-picker { display: flex; flex-direction: column; gap: 18px; max-width: 640px; }
  .cmp-pick-group { display: flex; flex-direction: column; gap: 4px; }
  .cmp-pick-group h4 { margin: 0 0 4px; }
  .cmp-option { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; width: 100%;
    min-height: 40px; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .cmp-option:hover, .cmp-option:focus-visible { border-color: var(--accent); }
  .cmp-option.first { border-color: var(--accent); background: var(--accent-soft); }
  .tab {
    background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); font: inherit; font-size: 13px; cursor: pointer;
    padding: 7px 12px; margin-bottom: -1px; display: flex; align-items: center; gap: 6px;
  }
  .tab:hover { color: var(--text); }
  .tab.on { color: var(--accent); border-bottom-color: var(--accent); }

  .scenarios { display: flex; flex-direction: column; gap: 7px; }
  .scenario {
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); padding: 7px 11px;
  }
  .scenario.open { border-color: var(--border-strong); }
  .scenario-row { display: flex; align-items: center; gap: 9px; font-size: 13px; cursor: pointer; }
  .scenario-row:hover .sc-name { color: var(--accent); }
  .sc-name {
    background: none; border: none; font: inherit; color: inherit;
    cursor: pointer; text-align: left; padding: 0;
  }
  .sc-mark {
    width: 18px; height: 18px; flex: none; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; border: 1px solid;
  }
  .sc-mark.s-current { color: var(--entity-text); border-color: var(--entity); background: var(--entity-soft); }
  .sc-mark.s-drifted { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); }
  /* A scenario that no longer agrees with the model is the thing on
     this tab that needs doing, so the whole card says so, not only its
     mark: drifted and broken alike wear the error colour, broken with
     the hollow mark, drifted with the filled one. */
  .scenario.s-drifted, .scenario.s-broken { border-color: var(--danger); border-left-width: 3px; }
  .scenario.s-drifted { background: var(--danger-soft); }
  .sc-status { font-size: 11px; color: var(--muted); }
  .sc-status.s-drifted, .sc-status.s-broken { color: var(--danger); font-weight: 600; }
  .sc-mark.s-broken { color: var(--danger); border-color: var(--danger); background: var(--surface); }

  /* Whether the Then a card shows is a record or a refusal – orange for
     the one, red for the other, the same two colours everything else
     here already uses for "an event" and "a rule stopped this". */
  .card.outcome-published { background: var(--event-soft); }
  .card.outcome-rejected { background: var(--danger-soft); }

  /* The drop target while dragging a scenario by its grip – a line on
     the edge the dragged one would land against, not a filled highlight,
     so it reads as "here" rather than "this one". */
  .scenario.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
  .scenario.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
  .scenario.dragging { opacity: .4; }
  /* The one grip everything draggable wears – scenario rows and rail
     commands alike. touch-action: none is what lets `gripDrag` own the
     finger: without it the browser claims the gesture for scrolling. */
  .grip { cursor: grab; color: var(--muted); padding: 0 2px; font-size: 13px;
          user-select: none; touch-action: none; flex: none; }
  .grip:active { cursor: grabbing; }

  /* Always on, unlike the rest of a row's actions – branching a
     scenario is common enough to want a permanent handle, just a quiet
     one: full opacity only once you are actually pointed at it. */
  .sc-footer { display: flex; gap: 6px; margin: -3px 0 0 26px; }
