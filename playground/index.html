          onclick: () => { closeForms(); state.slice = command; state.view = 'slice'; render(); },
        }, readable(command)))
      : h('span', { class: 'empty' }, '–')) : null,
    advanced && savedName && !entityName ? block('bound as', bound.length
      ? bound.map((b) => h('span', {
          class: 'chip entity linkable', title: 'Open ' + readable(b.entity),
          onclick: () => openEntity(b.entity),
        }, h('i', { class: 'ic' }, entityIcon(model, b.entity)),
          memberWords(readable(b.entity), b.property)))
      : h('span', { class: 'empty' }, '–')) : null);
}

// The DCB this projection derives, as the query it really runs: the
// tags it declares, each with a placeholder for the value a read gives
// it, and the events it handles. A derived draft's query is its
// operands', recursively, as the fold reads.
function projectionQueryWords(model, draft) {
  const derivedReads = draft.derived
    ? derivedOperands(draft.derived)
      .filter((o) => operandSource(o) === 'projection-read' && o.projection)
    : [];
  const tags = (draft.tags || []).filter((tag) => tag && tag.tagType).flatMap((tag) =>
    idLeavesOfType(model, tag.tagType).map((leaf) =>
      renderTag(identifierTypeOf(model, leaf.identifierType), `<${tag.name || '?'}>`)));
  const handledTypes = draft.derived
    ? uniq(derivedReads.flatMap((o) => projectionHandledTypes(model, o.projection)))
    : (draft.handlers || []).map((handler) => handler.event).filter(Boolean);
  return h('div', { class: 'dcb pquery' },
    tags.length ? h('div', {}, h('span', { class: 'k' }, 'tag '),
      ...tags.flatMap((tag, i) => [i ? h('span', { class: 'k' }, ' and ') : null, h('span', { class: 't' }, tag)])) : null,
    h('div', {}, tags.length ? h('span', { class: 'k' }, 'and ') : null,
      h('span', { class: 'y' }, handledTypes.join(', ') || '(nothing)')));
}

// Where a declared projection starts, as one picker: the values of its
// type, and `null` – no value yet, a different answer from `""` or
// `[]`, which is why it is named rather than left to an empty box. A
// type with no closed set of values picks "value…" and types it; a
// list picks "list…" and names its elements below.
const INITIAL_NULL = ' null';
const INITIAL_TYPED = ' typed';
function initialValueControl(model, draft) {
  const isNull = draft.initialValue === null || draft.initialValue === undefined;
  const members = enumMembersFor(model, draft.valueType);
  const kind = literalKindOf(model, draft.valueType);
  const nullRow = [INITIAL_NULL, 'null'];

  if (draft.isList) {
    const control = pick([[INITIAL_TYPED, 'list…'], nullRow], isNull ? INITIAL_NULL : INITIAL_TYPED, (v) => {
      draft.initialValue = v === INITIAL_NULL ? null : [];
      render();
    });
    if (isNull) return { control, below: null };
    const elements = Array.isArray(draft.initialValue) ? draft.initialValue : [];
    const below = h('div', { class: 'pinitial-list' },
      elements.length
        ? elements.map((element, i) => h('div', { class: 'adder' },
            initialValueSlot(model, draft.valueType, element, (v) => { elements[i] = v; }),
            h('button', {
              class: 'btn tiny danger', title: 'Remove this element',
              onclick: () => { elements.splice(i, 1); render(); },
            }, '×')))
        : h('div', { class: 'muted tiny mono' }, '[]'),
      h('div', { class: 'adder' }, h('button', {
        class: 'btn ghost tiny',
        onclick: () => {
          draft.initialValue = [...elements, blankSlotValue(model, draft.valueType)];
          render();
        },
      }, '+ element')));
    return { control, below };
  }

  if (members) {
    return {
      control: pick([...members.map((m) => [m, readable(m)]), nullRow],
        isNull ? INITIAL_NULL : (operandSource(draft.initialValue) === 'enum-member' ? draft.initialValue.enumMember : ''),
        (v) => { draft.initialValue = v === INITIAL_NULL ? null : { enumMember: v }; render(); }),
      below: null,
    };
  }
  if (kind === 'boolean') {
    return {
      control: pick([['false', 'false'], ['true', 'true'], nullRow],
        isNull ? INITIAL_NULL : String(draft.initialValue === true),
        (v) => { draft.initialValue = v === INITIAL_NULL ? null : v === 'true'; render(); }),
      below: null,
    };
  }
  const control = h('span', { class: 'pinitial' },
    pick([[INITIAL_TYPED, 'value…'], nullRow], isNull ? INITIAL_NULL : INITIAL_TYPED, (v) => {
      draft.initialValue = v === INITIAL_NULL ? null : blankSlotValue(model, draft.valueType);
      render();
    }),
    isNull ? null : initialValueSlot(model, draft.valueType, draft.initialValue,
      (v) => { draft.initialValue = v; }));
  return { control, below: null };
}

function renderProjections(model, main) {
  main.appendChild(h('header', {},
    h('div', { class: 'row' },
      h('div', { class: 'name' }, 'Projections'),
      h('span', { class: 'grow' }),
      state.newProjection ? null : h('button', {
        class: 'btn tiny',
        onclick: () => {
          closeForms();
          state.newProjection = true;
          render();
        },
      }, '+ new projection'))));

  const projectionAdvisories = advisoryBanner(model, 'projection-definition');
  if (projectionAdvisories) main.appendChild(projectionAdvisories);

  // Only the ones no entity binds. A projection an entity calls
  // something is that entity's property and is edited on its page, in
  // this very component – listing it twice would be the one thing this
  // page exists to stop being: two renderings of one thing.
  const names = Object.keys(model['projection-definitions']).sort();
  const free = names.filter((name) => !boundAs(model, name).length);

  main.appendChild(projectionLedger(model, {
    owner: null,
    nameHead: 'projection',
    entries: free.map((name) => ({ projection: name, label: readable(name) })),
    add: null,
  }));

  // A projection starts as a name: stored at once, opened in its row,
  // and revealed there one step at a time (`PROJECTION_WIZARD_STEPS`).
  if (state.newProjection) {
    main.appendChild(h('div', { class: 'ecard', style: 'margin-top:10px' }, inlineForm({
      question: 'New projection',
      placeholder: 'projection name',
      submitLabel: 'Create',
      onSubmit: (label) => createProjectionFromName(model, label, (name, draft) => {
        state.newProjection = null;
        state.projDraft = { name, body: draft };
        state.projTab = 'definition';
      }),
      onCancel: () => { state.newProjection = null; render(); },
    })));
  }

  // Everything the entity pages own. Not a second ledger – names, and a
  // way to each: with the list above holding only what nothing binds,
  // this is the only place left that says what else there is.
  const owned = Object.keys(model['entity-definitions']).sort()
    .map((entity) => ({ entity, properties: model['entity-definitions'][entity].properties || [] }))
    .filter((e) => e.properties.length);
  if (owned.length) {
    const index = h('section', { class: 'index' },
      h('h4', {}, 'Also defined, on their entities'),
      h('div', { class: 'why' },
        'Bound to an entity, so edited on its page – the same rows, one column fewer.'));
    for (const { entity, properties } of owned) {
      index.appendChild(h('div', { class: 'index-row' },
        h('span', {
          class: 'ent', title: 'Open ' + readable(entity),
          onclick: () => openEntity(entity),
        }, h('i', { class: 'ic' }, entityIcon(model, entity)), readable(entity)),
        h('span', { class: 'props' }, ...properties.map((binding) => h('button', {
          class: 'lnk', title: 'Open it on ' + readable(entity),
          onclick: () => goToProjection(binding.projection),
        }, propertyWords(binding.name))))));
    }
    main.appendChild(index);
  }
}

// ---------- events ----------
//
// The one place every event definition lives, recorded or not. A
// command's publish list only ever showed the events *it* records, and
// an event nothing records yet had nowhere to be shown at all – this
// page is both of those, for every event, at once. Shape – name, mark,
// fields – is owned here; a command's own page keeps only how *it*
// maps its own values into an already-declared field
// (see `eventFields`).
// ============================================================
// History
//
// The open model's undo history in this tab, as a page: every step
// since it was opened, newest on top, what was undone above a "now"
// line, and a way back – or forward – to any of them in one move
// (`travel`). It reads only what each step remembered when it was
// taken (`takeUndoMark`), never the log, so its length costs nothing.
// What a step was is read off its first change – a rename's
// follow-on updates come after it – except a text applied as code,
// which is many changes read as one. With experimental features on,
// each earlier version can be compared with the current one.
// ============================================================

const HISTORY_VERBS = { added: 'Added', updated: 'Changed', removed: 'Removed', renamed: 'Renamed', reordered: 'Reordered' };
const HISTORY_KINDS = {
  'entity-definition': 'entity', 'event-definition': 'event', 'projection-definition': 'projection',
  'command-definition': 'command', 'custom-type-definition': 'type', 'scenario-definition': 'scenario',
  'projection-scenario-definition': 'projection scenario', 'dcb-model': 'model',
};
const historyIcon = (shapes) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" '
  + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + shapes + '</svg>';
const HISTORY_ICONS = {
  added: historyIcon('<path d="M12 5v14M5 12h14"></path>'),
  updated: historyIcon('<path d="M4 20h4L19 9l-4-4L4 16v4Z"></path><path d="m13.5 6.5 4 4"></path>'),
  removed: historyIcon('<path d="M5 12h14"></path>'),
  renamed: historyIcon('<path d="M4 7h10"></path><path d="M4 12h6"></path><path d="m15 13 4 4-4 4"></path><path d="M19 17h-7"></path>'),
  reordered: historyIcon('<path d="m7 15 5 5 5-5"></path><path d="m7 9 5-5 5 5"></path>'),
  code: historyIcon('<path d="m8 7-5 5 5 5"></path><path d="m16 7 5 5-5 5"></path>'),
  opened: historyIcon('<path d="M5 21V4"></path><path d="M5 4h11l-2 4 2 4H5"></path>'),
  agent: historyIcon('<rect x="5" y="8" width="14" height="11" rx="3"></rect><path d="M12 8V5"></path>'
    + '<path d="M9.5 13h.01M14.5 13h.01"></path>'),
  back: historyIcon('<path d="M9 14 4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-3"></path>'),
  forward: historyIcon('<path d="m15 14 5-5-5-5"></path><path d="M20 9H9a5 5 0 0 0 0 10h3"></path>'),
  more: historyIcon('<path d="m9 6 6 6-6 6"></path>'),
};

function describeChange(change) {
  const parts = change.type.split('-');
  const verb = parts.pop();
  const kind = parts.join('-');
  return {
    verb, kind, name: change.name, from: change.from,
    kindLabel: HISTORY_KINDS[kind] || kind.replace(/-definition$/, '').replace(/-/g, ' '),
    colour: KIND_COLOR_CLASS[kind] || '',
  };
}

// How one step reads: its icon, verb, chip and detail, and what else
// it changed.
function describeStep(mark) {
  const changes = (mark.changes || []).map(describeChange);
  if (mark.via === 'code' || !changes.length) {
    // A step undone holds its events; one done, their count.
    const count = mark.events ? mark.events.length : mark.n;
    return {
      icon: 'code', verb: mark.via === 'code' ? 'Applied code' : mark.label, kind: '', colour: '',
      chip: mark.via === 'code' ? `${count} change${count === 1 ? '' : 's'}` : null, chipKind: '',
      detail: null, more: changes,
    };
  }
  const [first, ...rest] = changes;
  return {
    icon: HISTORY_ICONS[first.verb] ? first.verb : 'updated',
    verb: HISTORY_VERBS[first.verb] || first.verb,
    kind: first.kind, colour: first.colour,
    chipKind: first.verb === 'reordered' ? first.kindLabel + 's' : first.kindLabel,
    chip: first.verb === 'reordered' ? 'order' : first.name,
    detail: first.from ? `was ${first.from}` : null,
    more: rest,
  };
}

// Moves the open model's history and says how far, with the move itself
// one click from being taken back.
function jumpHistory(model, delta) {
  const moved = travel(model.id, delta);
  if (moved) {
    const count = Math.abs(moved);
    toast(h('span', {}, `${moved < 0 ? 'Went back' : 'Went forward'} ${count} change${count === 1 ? '' : 's'} `,
      h('button', {
        class: 'btn ghost', type: 'button',
        onclick: () => { travel(model.id, -moved); render(); },
      }, 'Undo')));
  }
  render();
}

function compareWithVersion(model, choice) {
  state.view = 'compare';
  chooseComparison(model, choice);
}

function historyRow(model, about, opts) {
  const { time, agent, future, current, last, target, compare, key } = opts;
  const step = about;
  const open = !!state.historyOpen[key];
  const stop = (fn) => (e) => { if (e && e.stopPropagation) e.stopPropagation(); fn(); };
  const jump = () => jumpHistory(model, target);
  const kindClass = step.colour ? ' k-' + step.colour : step.icon === 'opened' ? ' k-opened' : ' k-plain';
  return h('div', {
    class: 'hist-row' + kindClass + (future ? ' future' : '') + (current ? ' current' : '')
      + (agent ? ' by-agent' : '') + (last ? ' last' : ''),
    onclick: current ? null : jump,
  },
  h('div', { class: 'hist-time' }, time),
  h('div', { class: 'hist-track' },
    h('span', { class: 'hist-node' }, svg(HISTORY_ICONS[step.icon]),
      agent ? h('span', { class: 'hist-badge', 'aria-hidden': 'true' }, svg(HISTORY_ICONS.agent)) : null)),
  h('div', { class: 'hist-body' },
    h('div', { class: 'hist-line' },
      h('span', { class: 'hist-verb' }, step.verb),
      step.chip ? h('span', { class: 'chip ' + step.colour },
        step.chipKind ? h('i', {}, step.chipKind) : null, step.chip) : null,
      agent ? h('span', { class: 'hist-agent', title: 'Made by an agent, through WebMCP' },
        svg(HISTORY_ICONS.agent), 'Agent') : null,
      current ? h('span', { class: 'hist-here' }, 'You are here') : null,
      h('span', { class: 'hist-time-inline muted tiny' }, time)),
    step.detail ? h('div', { class: 'hist-detail muted small' }, step.detail) : null,
    step.more.length ? [
      h('button', {
        class: 'hist-more' + (open ? ' open' : ''), type: 'button', 'aria-expanded': open ? 'true' : 'false',
        onclick: stop(() => { state.historyOpen[key] = !open; render(); }),
      }, svg(HISTORY_ICONS.more), open
        ? 'Hide the changes'
        : step.icon === 'code' ? `Show the ${step.more.length} changes` : `and ${step.more.length} more`),
      open ? h('ul', { class: 'hist-sub' }, ...step.more.map((change) => h('li', {},
        h('span', { class: 'hist-dot ' + change.colour }),
        h('span', { class: 'muted' }, (HISTORY_VERBS[change.verb] || change.verb).toLowerCase()),
        h('code', {}, change.verb === 'reordered' ? change.kindLabel + 's' : change.name || change.kindLabel)))) : null,
    ] : null),
  h('div', { class: 'hist-acts' },
    current ? null : h('button', {
      class: 'btn primary', type: 'button', onclick: stop(jump),
    }, svg(future ? HISTORY_ICONS.forward : HISTORY_ICONS.back), future ? 'Go forward to here' : 'Go back to here'),
    compare && experimental() ? h('button', {
      class: 'btn', type: 'button', title: 'Compare with current version',
      onclick: stop(() => compareWithVersion(model, compare)),
    }, svg(RAIL_ICONS.compare), 'Compare') : null));
}

function renderHistory(model, main) {
  const log = undoLog();
  const history = log.models[model.id] || { done: [], undone: [] };
  const restarted = log.restarted && log.restarted[model.id];
  const { done, undone } = history;
  const agents = done.filter((mark) => mark.agent).length;
  const nextUndo = done[done.length - 1];
  const nextRedo = undone[undone.length - 1];

  main.appendChild(h('header', { class: 'hist-head' },
    h('div', {},
      h('div', { class: 'name' }, 'History'),
      h('div', { class: 'muted small' },
        'Changes to ', h('strong', {}, model.name), ' since you opened it in this tab. '
        + 'Pick any point to go back to it, or forward again.'),
      done.length || undone.length ? h('div', { class: 'hist-stats' },
        h('span', {}, h('strong', {}, done.length), done.length === 1 ? ' change' : ' changes'),
        undone.length ? h('span', {}, h('strong', {}, undone.length), ' undone') : null,
        agents ? h('span', {}, h('strong', {}, agents), ' by an agent') : null) : null),
    h('span', { class: 'grow' }),
    h('span', { class: 'hist-seg' },
      h('button', {
        type: 'button', disabled: !nextUndo, title: nextUndo ? 'Undo: ' + nextUndo.label : 'Nothing to undo',
        onclick: () => jumpHistory(model, -1),
      }, svg(HISTORY_ICONS.back), 'Undo ', kbd('Mod+Z')),
      h('button', {
        type: 'button', disabled: !nextRedo, title: nextRedo ? 'Redo: ' + nextRedo.label : 'Nothing to redo',
        onclick: () => jumpHistory(model, 1),
      }, 'Redo ', kbd('Shift+Mod+Z'), svg(HISTORY_ICONS.forward)))));

  if (restarted && !done.length && !undone.length) {
    main.appendChild(h('div', { class: 'hist-banner', role: 'status' },
      h('strong', {}, `${model.name} was changed elsewhere`),
      ' – undoing here would take that change too, so the history starts again from here.'));
  }

  if (!done.length && !undone.length) {
    main.appendChild(h('div', { class: 'hist-empty' },
      h('span', { class: 'hist-empty-icon' }, svg(RAIL_ICONS.history)),
      h('strong', {}, restarted ? 'No changes here since then' : 'No changes since you opened this model'),
      h('div', { class: 'muted small' },
        'Each change made here – and each one an agent makes – is listed as it happens, '
        + 'so you can go back to any point and forward again.')));
    return;
  }

  const list = h('div', { class: 'hist-list' });
  if (undone.length) {
    list.appendChild(h('div', { class: 'hist-section' }, 'Undone',
      h('span', {}, ' – still here until you make a new change')));
  }
  undone.forEach((step, k) => {
    list.appendChild(historyRow(model, describeStep(step), {
      time: timeOfStep(step), agent: step.agent, future: true, target: undone.length - k, key: step.stamp || step.base + k,
    }));
  });
  if (undone.length) list.appendChild(h('div', { class: 'hist-section' }, 'Now'));
  for (let j = done.length - 1; j >= 0; j--) {
    const mark = done[j];
    list.appendChild(historyRow(model, describeStep(mark), {
      time: timeOfStep(mark), agent: mark.agent, current: j === done.length - 1,
      target: j - (done.length - 1), key: mark.stamp,
      compare: j < done.length - 1 ? { kind: 'revision', stamp: done[j + 1].stamp } : null,
    }));
  }
  list.appendChild(historyRow(model, {
    icon: 'opened', colour: '', chip: null, more: [],
    verb: history.trimmed ? 'Earlier changes' : restarted ? 'From here' : 'Opened',
    detail: history.trimmed ? `older than the last ${HISTORY_LIMIT} are no longer kept`
      : restarted ? 'as it was when it was changed elsewhere' : 'as it was when you opened it',
  }, {
    time: '', current: !done.length, target: -done.length, last: true, key: 'opened',
    compare: done.length ? { kind: 'revision', first: true } : null,
  }));
  main.appendChild(list);

  main.appendChild(h('div', { class: 'hist-foot muted tiny' },
    h('span', {}, `Kept in this tab until it closes · the last ${HISTORY_LIMIT} changes of each model`),
    h('span', {}, 'Going back can be undone – nothing is lost until you make a new change.')));
}

// ============================================================
// Compare
//
// The open model read against another: itself earlier in this tab
// (an undo step), another stored model, or a file read for the purpose
// and never stored (`modelFromEnvelope`). Read-only – what it offers is
// the way to a definition's own page in the open model, never into the
// other side, which is often not in the log at all. The open model is
// "this model"; the other is named by what it is, not as base or head.
// Swap only turns the reading round – what reads as added reads as
// removed – it never makes the other side the one being edited.
//
// Everything shown is computed in model.js and dsl.js
// (`diffDefinitions`, `compareBoundaries`, `compareProblems`,
// `definitionSourceDiff`); this is only the page. The choice of what to
// compare with is kept per tab and per model (`COMPARE_KEY`), so a
// reload comes back to it; one that no longer resolves – a deleted
// model, an undo step gone – is dropped without a word and the picker
// opens instead. A file's scripts are printed, never compiled: nothing
// here evaluates, which is why no file waits at the import gate.
// ============================================================

const COMPARE_KEY = 'dcb-playground:compare:' + EVENT_LOG_KEY.split(':').pop();

function compareChoices() {
  try {
    const stored = JSON.parse(sessionStorage.getItem(COMPARE_KEY));
    return stored && typeof stored === 'object' ? stored : {};
  } catch { return {}; }
}
function compareChoiceFor(modelId) { return compareChoices()[modelId] || null; }
function setCompareChoice(modelId, choice) {
  const all = compareChoices();
  if (choice) all[modelId] = choice; else delete all[modelId];
  try {
    sessionStorage.setItem(COMPARE_KEY, JSON.stringify(all));
  } catch {
    toast('This comparison will not survive a reload: this tab’s storage is full.', true);
  }
}

// This model's undo steps in this tab, oldest first, each with how many
// of the model's events came after it began – each one a point to
// compare with. None once the model was changed elsewhere: the history
// no longer stands, and its next undo drops it.
function earlierVersions(model) {
  const history = undoLog().models[model.id];
  if (!history || !history.done.length) return [];
  const events = loadEvents();
  const at = modelPositions(events, model.id);
  const newest = history.done[history.done.length - 1];
  if (!at.length || eventStamp(events[at[at.length - 1]]) !== newest.stamp) return [];
  let since = 0;
  return history.done.slice().reverse().map((mark) => ({ ...mark, since: since += mark.n })).reverse();
}

function timeOfStep(mark) {
  const when = new Date(mark.time);
  return isNaN(when) ? '' : when.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

// A file is read once per choice, not once per paint: it does not
// change with the log.
let compareFileCache = null;
function compareFileModel(choice) {
  const key = JSON.stringify(choice.envelope);
  if (compareFileCache && compareFileCache.key === key) return compareFileCache.found;
  let found = null;
  try { found = modelFromEnvelope(choice.envelope); } catch { found = null; }
  compareFileCache = { key, found };
  return found;
}

// What the stored choice stands for now: `{ model, label, skipped }`,
// or null once it no longer resolves.
function resolveCompareChoice(model, choice) {
  if (!choice) return null;
  if (choice.kind === 'revision') {
    const versions = earlierVersions(model);
    const mark = choice.first ? versions[0] : versions.find((m) => m.stamp === choice.stamp);
    if (!mark) return null;
    return {
      model: modelWithoutLast(model.id, mark.since) || emptyModel(model.id, model.name),
      label: choice.first ? 'this model as you opened it' : `this model before “${mark.label}”`,
      skipped: [],
    };
  }
  if (choice.kind === 'model') {
    const other = projectState()[choice.id];
    return other && choice.id !== model.id ? { model: other, label: other.name, skipped: [] } : null;
  }
  if (choice.kind === 'file') {
    const read = compareFileModel(choice);
    return read && read.model ? { model: read.model, label: choice.label, skipped: read.skipped } : null;
  }
  return null;
}

let comparisonCache = null;
function comparison(model) {
  const choice = compareChoiceFor(model.id);
  const key = JSON.stringify([model.id, choice, state.compareSwap]);
  if (comparisonCache && comparisonCache.revision === logRevisionNow() && comparisonCache.key === key) {
    return comparisonCache.found;
  }
  const other = resolveCompareChoice(model, choice);
  if (choice && !other) setCompareChoice(model.id, null);
  let found = null;
  if (other) {
    const [older, newer] = state.compareSwap ? [model, other.model] : [other.model, model];
    found = {
      other, older, newer,
      diff: diffDefinitions(older, newer),
      boundaries: compareBoundaries(older, newer),
      problems: compareProblems(older, newer),
    };
  }
  comparisonCache = { revision: logRevisionNow(), key, found };
  return found;
}

function chooseComparison(model, choice) {
  setCompareChoice(model.id, choice);
  Object.assign(state, { comparePicking: false, compareLoading: null, compareFocus: null, compareSwap: false });
  render();
}

// A file to compare with is read whole before it is chosen, so a file
// that is not a model is refused here rather than silently dropped.
function chooseCompareFile(model, envelope, label) {
  try {
    modelFromEnvelope(envelope);
  } catch (error) {
    return toast(error && error.message ? error.message : 'That file could not be read as a DCB model.', true);
  }
  chooseComparison(model, { kind: 'file', envelope, label });
}

const COMPARE_KINDS = [
  ['custom-type-definition', 'Custom types', 'type'],
  ['event-definition', 'Events', 'event'],
  ['entity-definition', 'Entities', 'entity'],
  ['projection-definition', 'Projections', 'projection'],
  ['command-definition', 'Commands', 'command'],
  ['scenario-definition', 'Command scenarios', 'scenario'],
  ['projection-scenario-definition', 'Projection scenarios', 'scenario'],
];

// What a change is called: a scenario by its name, everything else by
// its own.
function compareLabel(found, kind, name) {
  if (!isIdKeyed(kind)) return named(name);
  const body = (found.newer[DEF_COLLECTIONS[kind]] || {})[name] || (found.older[DEF_COLLECTIONS[kind]] || {})[name] || {};
  return h('span', {}, body.name || name, h('span', { class: 'tech' }, body.command || body.projection || ''));
}

// The way from a change to its page in the open model – only when the
// open model has it.
function compareOpener(model, kind, name) {
  const body = (model[DEF_COLLECTIONS[kind]] || {})[name];
  if (body === undefined) return null;
  if (kind === 'event-definition') return () => goToEvent(name);
  if (kind === 'command-definition') return () => goToCommand(name);
  if (kind === 'projection-definition') return () => goToProjection(name);
  if (kind === 'custom-type-definition') return () => goToCustomType(name);
  if (kind === 'entity-definition') return () => { closeForms(); state.view = 'entity'; state.entity = name; render(); };
  if (kind === 'scenario-definition') {
    return () => { goToCommand(body.command); state.tab = 'scenarios'; state.openScenarios.add(name); render(); };
  }
  if (kind === 'projection-scenario-definition') return () => goToProjectionScenario(model, name);
  return null;
}

const COMPARE_MARK = { added: ['+', 'added'], changed: ['~', 'changed'], removed: ['−', 'removed'], same: ['=', 'the same'] };
function compareMark(status) {
  const [glyph, words] = COMPARE_MARK[status];
  return h('span', { class: 'cmp-mark ' + status, title: words, 'aria-label': words }, glyph);
}

// The two sides as they are read: from the older, to the newer.
function compareSides(found) {
  return state.compareSwap
    ? { older: 'this model', newer: found.other.label }
    : { older: found.other.label, newer: 'this model' };
}

function renderCompare(model, main) {
  main.appendChild(h('header', {},
    h('div', { class: 'name' }, 'Compare'),
    h('div', { class: 'muted small' },
      'This model against another, or against itself earlier: what changed, what each command '
      + 'now reads, and the text. Nothing here edits either side.')));
  const found = comparison(model);
  if (!found || state.comparePicking) return main.appendChild(comparePicker(model, found));

  const swapped = state.compareSwap;
  const sides = compareSides(found);
  main.appendChild(h('div', { class: 'cmp-strip' },
    h('span', { class: 'cmp-side' }, h('span', { class: 'muted tiny' }, 'from'), h('strong', {}, sides.older)),
    h('button', {
      class: 'btn ghost', title: 'Read the comparison the other way round', 'aria-label': 'Swap the two sides',
      onclick: () => { state.compareSwap = !swapped; render(); },
    }, '⇄'),
    h('span', { class: 'cmp-side' }, h('span', { class: 'muted tiny' }, 'to'), h('strong', {}, sides.newer)),
    h('span', { class: 'grow' }),
    h('button', { class: 'btn', onclick: () => { state.comparePicking = true; render(); } }, 'Compare with something else')));
  if (found.other.skipped.length) {
    main.appendChild(h('div', { class: 'banner' },
      `${found.other.skipped.length} definition${found.other.skipped.length === 1 ? '' : 's'} in that file could not be read and `
      + `${found.other.skipped.length === 1 ? 'is' : 'are'} left out: `
      + found.other.skipped.map((s) => s.name || s.kind).join(', ') + '.'));
  }

  const changedBoundaries = found.boundaries.filter((c) => c.status !== 'same').length;
  const tab = (key, label, count) => h('button', {
    class: 'tab' + (state.compareTab === key ? ' on' : ''),
    'aria-pressed': state.compareTab === key ? 'true' : 'false',
    onclick: () => { state.compareTab = key; render(); },
  }, label, count ? h('span', { class: 'badge clear' }, count) : null);
  main.appendChild(h('div', { class: 'tabs' },
    tab('overview', 'Overview'),
    tab('boundaries', 'Boundaries', changedBoundaries),
    tab('code', 'Code')));

  if (state.compareTab === 'boundaries') return main.appendChild(compareBoundariesPage(model, found));
  if (state.compareTab === 'code') return main.appendChild(compareCodePage(model, found));
  return main.appendChild(compareOverview(model, found));
}

function comparePicker(model, found) {
  const box = h('div', { class: 'cmp-picker' });
  const option = (label, sub, onPick, extra) => h('button', { class: 'cmp-option' + (extra || ''), onclick: onPick },
    h('span', {}, label), sub ? h('span', { class: 'muted tiny' }, sub) : null);

  const versions = earlierVersions(model);
  const earlier = h('section', { class: 'cmp-pick-group' }, h('h4', {}, 'This model, earlier'));
  if (versions.length) {
    earlier.appendChild(option('As you opened it', `before ${versions.length} change${versions.length === 1 ? '' : 's'} made here`,
      () => chooseComparison(model, { kind: 'revision', first: true }), ' first'));
    for (const mark of [...versions].reverse()) {
      earlier.appendChild(option(`Before “${mark.label}”`, timeOfStep(mark),
        () => chooseComparison(model, { kind: 'revision', stamp: mark.stamp })));
    }
  } else {
    earlier.appendChild(h('div', { class: 'muted small' },
      'Nothing changed in this tab yet – each change made here is listed as it happens.'));
  }
  box.appendChild(earlier);

  const others = Object.values(projectState()).filter((m) => m.id !== model.id).sort((a, b) => a.name.localeCompare(b.name));
  const stored = h('section', { class: 'cmp-pick-group' }, h('h4', {}, 'Another model'));
  if (others.length) for (const other of others) stored.appendChild(option(other.name, '', () => chooseComparison(model, { kind: 'model', id: other.id })));
  else stored.appendChild(h('div', { class: 'muted small' }, 'No other model is stored here.'));
  box.appendChild(stored);

  const file = h('section', { class: 'cmp-pick-group' }, h('h4', {}, 'A file'),
    h('div', { class: 'muted small' }, 'Read for comparing only – it is not added to your models.'));
  if (state.compareLoading === 'url') {
    file.appendChild(inlineForm({
      question: 'Model URL', placeholder: 'https://…', submitLabel: 'Compare',
      onSubmit: (address) => {
        const trimmed = address.trim();
        loadModelFromUrl(trimmed)
          .then((envelope) => chooseCompareFile(activeModel(), envelope, trimmed))
          .catch((error) => toast(error && error.message ? error.message : 'That file was not loaded.', true));
      },
      onCancel: () => { state.compareLoading = null; render(); },
    }));
  } else if (state.compareLoading === 'json') {
    file.appendChild(jsonLoadForm(
      (envelope) => chooseCompareFile(model, envelope, `pasted JSON “${envelope.name || 'unnamed'}”`),
      () => { state.compareLoading = null; render(); }));
  } else {
    file.appendChild(h('div', { class: 'adder' },
      h('button', { class: 'btn', onclick: () => { state.compareLoading = 'url'; render(); } }, 'From a URL…'),
      h('button', { class: 'btn', onclick: () => { state.compareLoading = 'json'; render(); } }, 'From JSON…')));
  }
  box.appendChild(file);

  if (found) {
    box.appendChild(h('div', { class: 'adder' },
      h('button', { class: 'btn ghost', onclick: () => { state.comparePicking = false; state.compareLoading = null; render(); } },
        'Keep comparing with ' + found.other.label)));
  }
  return box;
}

function compareOverview(model, found) {
  const page = h('div', { class: 'cmp-overview' });
  const totals = { added: 0, changed: 0, removed: 0, same: 0 };
  for (const entry of Object.values(found.diff.kinds)) {
    totals.added += entry.added.length;
    totals.changed += entry.changed.length;
    totals.removed += entry.removed.length;
    totals.same += entry.unchanged.length;
  }
  page.appendChild(h('div', { class: 'cmp-totals' },
    ...[['added', 'Added'], ['changed', 'Changed'], ['removed', 'Removed'], ['same', 'The same']].map(([key, label]) =>
      h('div', { class: 'cmp-total ' + key }, h('span', { class: 'muted tiny' }, label), h('strong', {}, totals[key])))));

  const widened = found.boundaries.filter((c) => c.lostTags.length);
  if (widened.length) {
    page.appendChild(h('div', { class: 'cmp-finding' },
      h('strong', {}, `${widened.length} consistency boundar${widened.length === 1 ? 'y' : 'ies'} grew to every instance`),
      h('span', {}, ' – ', ...widened.flatMap((c, i) => [i ? ', ' : '', named(c.name),
        ` now reads ${c.lostTags.flat().join(', ')} untagged`]), '. '),
      h('a', { href: '#', onclick: (e) => { e.preventDefault(); state.compareTab = 'boundaries'; render(); } }, 'See boundaries')));
  }

  const { introduced, fixed } = found.problems;
  if (introduced.length || fixed.length) {
    const problemList = (list) => h('ul', { class: 'cmp-problems' },
      ...list.map((p) => h('li', {}, named(p.name), ': ', p.message)));
    page.appendChild(h('div', { class: 'cmp-problem-delta' },
      h('h4', {}, `Problems: ${introduced.length} new, ${fixed.length} fixed`),
      introduced.length ? problemList(introduced) : null,
      fixed.length ? h('details', {}, h('summary', { class: 'muted small' }, 'Fixed'), problemList(fixed)) : null));
  }

  const rows = [];
  if (found.diff.name) {
    rows.push(h('div', { class: 'cmp-group' }, h('h4', {}, 'Model')),
      h('div', { class: 'cmp-row' }, compareMark('changed'), h('span', { class: 'muted tiny' }, 'name'),
        h('span', {}, `“${found.diff.name.from}” → “${found.diff.name.to}”`)));
  }
  let first = null;
  for (const [kind, title] of COMPARE_KINDS) {
    const entry = found.diff.kinds[kind];
    const changes = [
      ...entry.added.map((name) => ['added', name]),
      ...entry.changed.map((name) => ['changed', name]),
      ...entry.removed.map((name) => ['removed', name]),
    ];
    const same = state.compareShowSame ? entry.unchanged.map((name) => ['same', name]) : [];
    if (!changes.length && !same.length) continue;
    rows.push(h('div', { class: 'cmp-group' }, h('h4', {}, title),
      h('span', { class: 'muted tiny' }, `${changes.length} changed`
        + (entry.unchanged.length ? ` · ${entry.unchanged.length} the same` : ''))));
    for (const [status, name] of [...changes, ...same]) {
      if (!first && status !== 'same') first = { kind, name };
      const focus = state.compareFocus;
      const on = focus && focus.kind === kind && focus.name === name;
      rows.push(h('button', {
        class: 'cmp-row' + (on ? ' on' : ''),
        onclick: () => { state.compareFocus = { kind, name }; render(); },
      }, compareMark(status), compareLabel(found, kind, name)));
    }
  }
  const focus = state.compareFocus && found.diff.kinds[state.compareFocus.kind] ? state.compareFocus : first;

  const list = h('section', { class: 'cmp-list' },
    h('label', { class: 'muted small cmp-toggle' },
      h('input', {
        type: 'checkbox', checked: state.compareShowSame,
        onchange: () => { state.compareShowSame = !state.compareShowSame; render(); },
      }), ' List what is the same too'),
    ...(rows.length ? rows : [h('div', { class: 'empty' }, 'No differences – the two are the same.')]));
  page.appendChild(h('div', { class: 'cmp-split' }, list, focus ? compareDetail(model, found, focus) : null));
  return page;
}

function compareDetail(model, found, { kind, name }) {
  const open = compareOpener(model, kind, name);
  const entry = found.diff.kinds[kind];
  const status = entry.added.includes(name) ? 'added' : entry.removed.includes(name) ? 'removed'
    : entry.changed.includes(name) ? 'changed' : 'same';
  return h('aside', { class: 'cmp-detail' },
    h('div', { class: 'cmp-detail-head' }, compareMark(status), h('strong', {}, compareLabel(found, kind, name)),
      h('span', { class: 'grow' }),
      open ? h('button', { class: 'btn', onclick: open }, 'Open in this model') : null),
    compareSourceRows(definitionSourceDiff(found.older, found.newer, kind, name)));
}

function compareSourceRows(rows) {
  const SIGN = { same: ' ', add: '+', del: '−' };
  return h('div', { class: 'cmp-code', role: 'table' },
    ...rows.map((row) => h('div', { class: 'cmp-line ' + row.k, role: 'row' },
      h('span', { class: 'gut' }, row.o || ''),
      h('span', { class: 'gut' }, row.n || ''),
      h('span', { class: 'sign' }, SIGN[row.k]),
      h('span', { class: 'txt' }, ...(row.parts
        ? row.parts.map((part) => (part.changed ? h('span', { class: 'w' }, part.text) : part.text))
        : [row.text])))));
}

function compareBoundariesPage(model, found) {
  const page = h('div', { class: 'cmp-boundaries' });
  const item = (command) => (i) => h('div', { class: 'cmp-qi ' + i.mark },
    compareMark(i.mark === 'same' ? 'same' : i.mark),
    ...(i.types.length ? i.types.map((t) => h('span', { class: 'chip event' }, t)) : [h('span', { class: 'chip' }, 'any type')]),
    i.tags.length ? h('span', { class: 'muted tiny' }, 'tagged') : null,
    ...(i.tags.length ? i.tags.map((t) => h('code', { class: 'cmp-tag' }, t)) : [h('span', { class: 'cmp-untagged' }, 'untagged')]),
    command.items.some((other) => other.round > 0) ? h('span', { class: 'muted tiny' }, `query ${i.round + 1}`) : null);
  const moved = found.boundaries.filter((c) => c.status !== 'same');
  const same = found.boundaries.filter((c) => c.status === 'same');
  if (!moved.length) page.appendChild(h('div', { class: 'empty' }, 'Every command reads what it read before.'));
  for (const command of moved) {
    const open = compareOpener(model, 'command-definition', command.name);
    const before = command.items.filter((i) => i.mark !== 'added');
    const after = command.items.filter((i) => i.mark !== 'removed');
    page.appendChild(h('section', { class: 'cmp-command' + (command.lostTags.length ? ' widened' : '') },
      h('div', { class: 'cmp-detail-head' }, compareMark(command.status), h('span', { class: 'chip command' }, named(command.name)),
        h('span', { class: 'grow' }),
        open ? h('button', { class: 'btn ghost', onclick: open }, 'Open') : null),
      command.lostTags.length ? h('div', { class: 'cmp-finding' },
        `Reads ${command.lostTags.flat().join(', ')} untagged now, where it read by a tag before: `
        + 'every instance is inside its boundary, so it conflicts with every other append of those events.') : null,
      h('div', { class: 'cmp-cols' },
        h('div', {}, h('h4', {}, compareSides(found).older),
          ...(before.length ? before.map(item(command)) : [h('div', { class: 'muted small' }, command.status === 'added' ? 'not there' : 'reads nothing')])),
        h('div', {}, h('h4', {}, compareSides(found).newer),
          ...(after.length ? after.map(item(command)) : [h('div', { class: 'muted small' }, command.status === 'removed' ? 'not there' : 'reads nothing')])))));
  }
  if (same.length) {
    page.appendChild(h('details', { class: 'cmp-same' },
      h('summary', {}, `${same.length} command${same.length === 1 ? '' : 's'} read${same.length === 1 ? 's' : ''} what ${same.length === 1 ? 'it' : 'they'} read before`),
      ...same.map((command) => h('div', { class: 'cmp-row' }, compareMark('same'), named(command.name)))));
  }
  return page;
}

function compareCodePage(model, found) {
  const page = h('div', { class: 'cmp-codepage' });
  if (found.diff.name) {
    page.appendChild(h('section', { class: 'cmp-command' },
      h('div', { class: 'cmp-detail-head' }, compareMark('changed'), h('strong', {}, 'model')),
      compareSourceRows([
        { k: 'del', o: 1, n: null, text: `model ${JSON.stringify(found.diff.name.from)}` },
        { k: 'add', o: null, n: 1, text: `model ${JSON.stringify(found.diff.name.to)}` },
      ])));
  }
  let any = false;
  for (const [kind, title] of COMPARE_KINDS) {
    const entry = found.diff.kinds[kind];
    const changes = [
      ...entry.added.map((name) => ['added', name]),
      ...entry.changed.map((name) => ['changed', name]),
      ...entry.removed.map((name) => ['removed', name]),
    ];
    if (!changes.length) continue;
    any = true;
    page.appendChild(h('h4', { class: 'cmp-code-kind' }, title));
    for (const [status, name] of changes) {
      page.appendChild(h('section', { class: 'cmp-command' },
        h('div', { class: 'cmp-detail-head' }, compareMark(status), h('strong', {}, compareLabel(found, kind, name))),
        compareSourceRows(definitionSourceDiff(found.older, found.newer, kind, name))));
    }
  }
  if (!any && !found.diff.name) page.appendChild(h('div', { class: 'empty' }, 'No differences – the two are the same.'));
  return page;
}

function renderEvents(model, main) {
  main.appendChild(h('header', {},
    h('div', { class: 'name' }, 'Events'),
    h('div', { class: 'muted small' },
      'Everything that has ever happened, named and shaped. An event may be recorded by no '
      + 'command, one, or several – and read by no projection, one, or several – which is why it '
      + 'has a page of its own rather than living on any one of theirs.')));

  const eventAdvisories = advisoryBanner(model, 'event-definition');
  if (eventAdvisories) main.appendChild(eventAdvisories);

  const names = Object.keys(model['event-definitions']).sort();
  if (!names.length && !state.newEvent) {
    main.appendChild(h('div', { class: 'empty' }, 'No events yet.'));
  }

  for (const name of names) main.appendChild(eventCard(model, name));

  if (state.newEvent) {
    const draft = state.newEvent;
    const card = h('div', { class: 'ecard' });
    card.appendChild(h('div', { class: 'q', style: 'font-size:11px;color:var(--muted);margin-bottom:6px' },
      'What happened?  (past tense)'));
    card.appendChild(h('div', { class: 'row' },
      h('span', { class: 'muted tiny', style: 'min-width:90px' }, 'called'),
      h('input', {
        type: 'text', value: draft.name, placeholder: 'event name',
        oninput: (e) => { draft.name = e.target.value; },
      })));
    card.appendChild(h('div', { class: 'adder', style: 'margin-top:10px' },
      h('button', {
        class: 'btn primary',
        onclick: () => {
          const eventName = toPascal(draft.name);
          if (!eventName) return toast('Give the event a name.', true);
          run(() => {
            addDefinition('event-definition', model.id, eventName, { properties: [] });
            state.newEvent = null;
            state.openEvent = eventName;
          });
        },
      }, 'Create'),
      h('button', { class: 'btn ghost', onclick: () => { state.newEvent = null; render(); } }, 'Cancel')));
    main.appendChild(card);
  } else {
    main.appendChild(h('div', { class: 'adder', style: 'margin-top:14px' },
      h('button', {
        class: 'btn primary',
        title: 'An event does not need a command yet – record it later from any command’s '
          + '"record something already known".',
        onclick: () => { closeForms(); state.newEvent = { name: '' }; render(); },
      }, '+ New event')));
  }
}

function eventCard(model, name) {
  const event = model['event-definitions'][name];
  const open = state.openEvent === name;
  const publishers = publishersOf(model, name);
  const subscribers = [...effectsOf(model, name), ...projectionsHandling(model, name)];
  const scenarios = scenariosReferencingEvent(model, name);
  const card = h('div', { class: 'ecard' });

  // Renaming rewrites every entity handler, every projection handler,
  // every command's `publishes` and every scenario that names it, all
  // in the same append.
  if (state.renamingEvent === name) {
    card.appendChild(renameDefinitionForm(model, 'event-definition', name, {
      stateKey: 'renamingEvent',
      warn: () => warnScripted(model, name),
      after: (next) => { if (state.openEvent === name) state.openEvent = next; },
    }));
    return card;
  }

  const pickingIcon = state.eventIconPicker === name;
  card.appendChild(qrow('div', { cls: 'ehead', key: 'event:' + name },
    h('button', {
      class: 'icon-btn event' + fallbackIconClass(eventIcon(model, name)),
      title: 'Choose the mark this is shown with',
      onclick: () => {
        const wasOpen = pickingIcon;
        closeForms();
        state.eventIconPicker = wasOpen ? null : name;
        render();
      },
    }, eventIcon(model, name)),
    h('span', { class: 'chip event' }, readable(name)),
    reveal(h('span', { class: 'tech' }, name)),
    h('span', { class: 'muted tiny' },
      (event.properties || []).length + ' field' + ((event.properties || []).length === 1 ? '' : 's')),
    h('span', { class: 'muted tiny', title: 'What a query by tag finds this event by' },
      (event.tags || []).length ? 'tags ' : 'no tags',
      (event.tags || []).length ? h('code', {}, event.tags.join(', ')) : null),
    h('span', { class: 'muted tiny' }, publishers.length ? 'recorded by '
      + publishers.map((p) => readable(p.command)).join(', ') : 'recorded by nothing yet'),
    h('span', { style: 'flex:1' }),
    reveal(
      h('button', {
        class: 'btn tiny',
        onclick: () => { state.openEvent = open ? null : name; render(); },
      }, open ? 'Hide details' : 'Details'),
      h('button', {
        class: 'btn tiny',
        onclick: () => { closeForms(); state.renamingEvent = name; render(); },
      }, 'Rename'),
      removeButton('event:' + name, {
        label: 'Remove', title: 'Remove this event',
        onRemove: () => run(() => removeDefinition('event-definition', model.id, name)),
      }))));

  if (pickingIcon) card.appendChild(eventIconPicker(model, name, event));

  if (open) {
    card.appendChild(h('div', { class: 'card event' },
      eventFieldsEditor(model, name, event),
      eventTagsEditor(model, name, event),
      h('div', { class: 'refs', style: 'margin-top:12px' },
        h('div', { class: 'muted tiny' }, 'Recorded by'),
        publishers.length
          ? h('div', { class: 'row', style: 'flex-wrap:wrap;gap:6px;margin-top:4px' },
              publishers.map((p) => commandRef(model, p.command)))
          : h('div', { class: 'empty tiny' }, 'no command records this yet')),
      h('div', { class: 'refs', style: 'margin-top:10px' },
        h('div', { class: 'muted tiny' }, 'Handled by'),
        subscribers.length
          ? h('div', { class: 'row', style: 'flex-wrap:wrap;gap:6px;margin-top:4px' },
              subscribers.map((s) => s.entity
                ? entityRef(model, s.entity, { text: readable(s.entity) + ' · ' + propertyWords(s.property.name) })
                : projectionRef(model, s.projection)))
          : h('div', { class: 'empty tiny' }, 'nothing reads this yet')),
      scenarios.length ? h('div', { class: 'refs', style: 'margin-top:10px' },
        h('div', { class: 'muted tiny' }, 'Referenced by'),
        h('div', { class: 'row', style: 'flex-wrap:wrap;gap:6px;margin-top:4px' },
          scenarios.map((s) => h('span', {
            class: 'chip linkable', title: 'Open this scenario',
            onclick: () => (s.overProjections ? goToProjectionScenario(model, s.key) : goToScenario(model, s.key)),
          }, s.overProjections ? projectionScenarioName(s.body) : scenarioName(s.body, readable))))) : null));
  }

  return card;
}

// ---------- overview ----------
//
// The page a model opens on: what it holds, counted, and every command
// on one row – what it reads, how many rules guard it, what it appends.
// Read-only on purpose. A command's stored name and payload are not
// columns; they ride in the row's tooltip, because the question this
// page answers is what the model does, not how a call is spelled.
function renderOverview(model, main) {
  main.appendChild(h('header', {}, h('div', { class: 'name' }, 'Overview')));

  const commands = model['command-definitions'];
  const bodies = Object.values(commands);
  const sum = (xs) => xs.reduce((a, b) => a + b, 0);
  const plural = (n, word) => n + ' ' + word + (n === 1 ? '' : 's');
  const ruleCount = sum(bodies.map((b) => (b.conditions || []).length));
  const appended = new Set(bodies.flatMap((b) => (b.publishes || []).map((p) => p && p.name)));
  const events = Object.keys(model['event-definitions']);
  const unappended = events.filter((e) => !appended.has(e)).length;
  const entities = Object.values(model['entity-definitions']);
  const lifecycles = entities.filter((e) => e.lifecycle).length;
  const standalone = Object.keys(model['projection-definitions'])
    .filter((p) => !boundAs(model, p).length).length;
  const types = Object.keys(model['custom-type-definitions']).length;
  const scenarios = Object.keys(model['scenario-definitions'] || {}).length
    + Object.keys(model['projection-scenario-definitions'] || {}).length;
  const trouble = scenarioTrouble(model).length;
  const found = problems(model);

  // A count is the way to where those things are listed – the rail's
  // page for a kind; commands are listed right below. What has no
  // page of its own goes to the first place that shows one – an entity,
  // a command's scenarios – or to the Problems panel when something is
  // wrong with it; a count with nowhere to go stays a plain card.
  const stat = (label, kind, count, sub, go) => h(go ? 'a' : 'div', {
    class: 'overview-stat' + (kind ? ' kind' : ''), style: kind ? '--kind: var(--' + kind + ')' : null,
    href: go ? '#' : null,
    onclick: go ? (e) => { e.preventDefault(); closeForms(); go(); } : null,
  }, h('span', { class: 'label' }, label),
    h('span', { class: 'count' }, String(count)),
    sub ? h('span', { class: 'sub' }, sub) : null);
  const show = (view) => () => openKindPage(view);
  const showProblems = () => { state.problems = true; render(); };
  const withScenarios = Object.keys(commands)
    .find((name) => Object.values(model['scenario-definitions'] || {}).some((s) => s.command === name));
  const firstEntity = Object.keys(model['entity-definitions']).sort()[0];

  // The same rule the rail follows: what the experimental flag keeps out
  // of the rail it keeps out of the count, unless the model already has one.
  main.appendChild(h('div', { class: 'overview-stats' },
    // Listed right below on the page; in the code, where they start.
    stat('Commands', 'command', bodies.length, plural(ruleCount, 'rule'),
      state.code && bodies.length ? () => { codeView.section = 'command-definition'; openKindPage('slice'); } : null),
    stat('Events', 'event', events.length, unappended ? unappended + ' not appended' : null, show('events')),
    experimental() || entities.length
      ? stat('Entities', 'entity', entities.length, lifecycles ? lifecycles + ' with a lifecycle' : null,
        firstEntity ? () => openEntity(firstEntity) : null)
      : null,
    stat('Projections', 'projection', standalone, 'standalone', show('projections')),
    stat('Custom types', 'type', types, null, show('types')),
    stat('Scenarios', null, scenarios, trouble ? trouble + ' not current' : null,
      trouble ? showProblems
        : withScenarios ? () => {
          state.view = 'slice'; state.slice = withScenarios; state.tab = 'scenarios'; render();
        }
        : null),
    stat('Problems', null, found.length, null, found.length ? showProblems : null)));

  main.appendChild(h('div', { class: 'overview-section' },
    h('h2', {}, 'Commands'), h('span', { class: 'muted small' }, 'by feature')));

  const table = h('div', { class: 'overview-commands' },
    h('div', { class: 'overview-row head' },
      h('span', {}, 'Command'), h('span', {}, 'Reads'), h('span', {}, 'Rules'), h('span', {}, 'Appends')));

  for (const group of featureGroups(model).filter((g) => g.commands.length)) {
    table.appendChild(h('div', { class: 'overview-feature' }, group.name));
    for (const name of group.commands) {
      const body = commands[name];
      const payload = body.properties || [];
      const tip = [name, ...payload.map((p) => p.name + ': ' + typeLabel(p))].join('\n');

      // A read is named after what it reads; the alias is shown only
      // where it says something the name does not – `others`, `theirs`.
      const reads = (body.boundary || []).filter(Boolean).map((binding) => {
        const target = binding.projection || binding.entity;
        const plain = target ? target[0].toLowerCase() + target.slice(1) : null;
        const text = binding.alias === plain ? undefined
          : [readable(target), h('span', { class: 'tech' }, binding.alias)];
        return binding.projection
          ? projectionRef(model, binding.projection, { text })
          : entityRef(model, binding.entity, { text });
      });
      // A read in place (`require CourseStatus(courseId) …`) has no
      // binding, but reads all the same – once per projection, beside
      // the bound ones.
      const bound = new Set((body.boundary || []).map((b) => b && b.projection).filter(Boolean));
      const inPlace = new Set();
      forEachCommandOperand(body, (operand) => {
        if (operandSource(operand) === 'projection-read' && operand.projection
          && !bound.has(operand.projection)) inPlace.add(operand.projection);
      });
      for (const projection of inPlace) reads.push(projectionRef(model, projection));

      const rules = (body.conditions || []).length;
      const guards = sum((body.publishes || []).map((p) => (p && p.when ? p.when.length : 0)));
      const ruleWords = [rules ? plural(rules, 'rule') : null, guards ? plural(guards, 'guard') : null]
        .filter(Boolean).join(' · ');

      const emits = (body.publishes || []).filter((p) => p && p.name);

      table.appendChild(h('div', { class: 'overview-row' },
        h('div', {},
          h('a', {
            href: '#', class: 'overview-cmd', title: tip,
            onclick: (e) => { e.preventDefault(); goToCommand(name); },
          }, iconPrefix(commandIcon(model, name)) + readable(name))),
        h('div', { class: 'overview-chips' },
          reads.length ? reads : h('span', { class: 'empty tiny' }, '–')),
        ruleWords
          ? h('span', { class: 'overview-rules' }, ruleWords)
          : h('span', { class: 'empty tiny' }, 'always allowed'),
        h('div', { class: 'overview-chips' },
          emits.length
            ? emits.map((p) => eventRef(model, p.name))
            : h('span', { class: 'empty tiny' }, 'records nothing yet'))));
    }
  }
  main.appendChild(table);
}

// ---------- coupling ----------
//
// Every command against every event type it writes or reads back,
// gathered once into a matrix – the same boundary each command's own
// page derives one at a time (`stepConsistency`), read here across all
// of them at once rather than one command deep.
function renderCoupling(model, main) {
  main.appendChild(h('header', {},
    h('div', { class: 'name' }, 'Coupling'),
    h('div', { class: 'muted small' },
      'Every command against every event type it writes, or reads back to decide – the same '
      + 'boundary each command derives on its own page, laid out as one matrix. A filled mark '
      + 'writes the event; a ringed mark reads it back first.')));

  const matrix = couplingMatrix(model);
  if (!matrix.events.length || !matrix.groups.length) {
    main.appendChild(h('div', { class: 'empty' },
      matrix.events.length ? 'No commands yet.' : 'No events yet.'));
    return;
  }

  const orderMode = state.couplingOrder === 'coupling' ? 'coupling' : 'feature';
  const tab = (key, label) => h('button', {
    class: 'tab' + (orderMode === key ? ' on' : ''),
    'aria-pressed': orderMode === key ? 'true' : 'false',
    onclick: () => { state.couplingOrder = key; render(); },
  }, label);
  main.appendChild(h('div', { class: 'tabs', style: 'margin-bottom:16px' },
    tab('feature', 'By feature'), tab('coupling', 'By coupling')));

  main.appendChild(h('div', { class: 'coupling-legend' },
    h('span', { class: 'coupling-legend-item' }, h('span', { class: 'coupling-mark produces' }), 'produces'),
    h('span', { class: 'coupling-legend-item' }, h('span', { class: 'coupling-mark consumes' }), 'consumes'),
    h('span', { class: 'coupling-legend-item' }, h('span', { class: 'coupling-mark both' }), 'both'),
    orderMode === 'coupling'
      ? h('span', { class: 'coupling-legend-item' },
          h('span', { class: 'chip rule tiny' }, 'bridge'),
          'the one coupling still joining two clusters')
      : null));

  // A lookup from (command, event) to its cell, so either ordering can
  // read the same underlying matrix without recomputing it.
  const cellIndex = {};
  for (const group of matrix.groups) {
    for (const row of group.commands) {
      cellIndex[row.name] = {};
      row.cells.forEach((cell, i) => { cellIndex[row.name][matrix.events[i]] = cell; });
    }
  }

  let orderedEvents;
  let rows; // [{ isGroup, label }] | [{ isCommand, name, isBridge, cells }]
  let isBridgeEvent = () => false;
  let clusterStartsAt = () => false;

  if (orderMode === 'coupling') {
    const clusters = couplingClusters(matrix);
    orderedEvents = clusters.eventOrder;
    isBridgeEvent = clusters.isBridgeEvent;

    const clusterLabel = (rank) => {
      const info = clusters.clusters[rank];
      if (info.commands + info.events === 1) return 'Isolated – coupled to nothing';
      const c = info.commands + ' command' + (info.commands === 1 ? '' : 's');
      const e = info.events + ' event' + (info.events === 1 ? '' : 's');
      return 'Cluster ' + (rank + 1) + ' · ' + c + ', ' + e;
    };
    rows = [];
    let lastRank = null;
    for (const name of clusters.commandOrder) {
      const rank = clusters.clusterOfCommand(name);
      if (rank !== lastRank) { rows.push({ isGroup: true, label: clusterLabel(rank) }); lastRank = rank; }
      rows.push({
        isCommand: true, name, isBridge: clusters.isBridgeCommand(name),
        cells: orderedEvents.map((ev) => cellIndex[name][ev]),
      });
    }
    let lastEventRank = null;
    clusterStartsAt = (i) => {
      const rank = clusters.clusterOfEvent(orderedEvents[i]);
      const isStart = i > 0 && rank !== clusters.clusterOfEvent(orderedEvents[i - 1]);
      return isStart;
    };
    if (clusters.clusters.length > 1) {
      main.appendChild(h('div', { class: 'muted small', style: 'margin-bottom:14px' },
        clusters.clusters.length + ' clusters – nothing couples one to another. Splitting the model '
        + 'along those seams would leave each cluster as its own bounded context.'));
    } else {
      main.appendChild(h('div', { class: 'muted small', style: 'margin-bottom:14px' },
        'Everything here is one connected cluster – no command or event stands apart from the rest yet.'));
    }
  } else {
    orderedEvents = matrix.events;
    rows = matrix.groups.flatMap((group) => [
      { isGroup: true, label: group.name },
      ...group.commands.map((row) => ({ isCommand: true, name: row.name, isBridge: false, cells: row.cells })),
    ]);
  }

  const colWidth = 104;
  const grid = h('div', {
    class: 'coupling-grid',
    style: `grid-template-columns: 210px repeat(${orderedEvents.length}, ${colWidth}px); `
      + `width: ${210 + orderedEvents.length * colWidth}px`,
  });
  grid.appendChild(h('div', { class: 'coupling-corner' }));
  orderedEvents.forEach((event, i) => {
    const bridge = isBridgeEvent(event);
    // A non-breaking space between the icon and the first word keeps
    // them on the same line – an icon stranded alone on its own line
    // is the one wrapping outcome worth avoiding.
    const label = iconPrefix(eventIcon(model, event), '\u00a0') + readable(event);
    grid.appendChild(h('div', {
      class: 'coupling-colhead' + (clusterStartsAt(i) ? ' cluster-start' : ''),
      title: (bridge ? 'Bridge – removing this splits its cluster in two. ' : '') + 'Open ' + readable(event),
      onclick: () => goToEvent(event),
    }, h('span', { style: bridge ? 'color:var(--rule)' : '' }, label)));
  });

  for (const row of rows) {
    if (row.isGroup) { grid.appendChild(h('div', { class: 'coupling-grouprow' }, row.label)); continue; }
    grid.appendChild(h('div', {
      class: 'coupling-rowlabel', title: 'Open ' + readable(row.name), onclick: () => goToCommand(row.name),
    }, h('span', {}, readable(row.name)),
      row.isBridge ? h('span', {
        class: 'chip rule tiny', style: 'margin-left:7px',
        title: 'Bridge – removing this splits its cluster in two',
      }, 'bridge') : null));
    row.cells.forEach((cell, i) => {
      const markClass = cell.produces && cell.consumes ? 'both'
        : cell.produces ? 'produces' : cell.consumes ? 'consumes' : null;
      const label = iconPrefix(eventIcon(model, cell.event)) + readable(cell.event);
      const tip = !markClass ? null
        : cell.produces && cell.consumes
          ? label + ' – written here, read back via ' + cell.via.join(', ')
          : cell.produces ? label + ' – written here'
            : label + ' – read via ' + cell.via.join(', ');
      grid.appendChild(h('div', {
        class: 'coupling-cell' + (clusterStartsAt(i) ? ' cluster-start' : ''),
        title: tip,
      }, markClass ? h('div', { class: 'coupling-mark ' + markClass }) : null));
    });
  }
  main.appendChild(h('div', { class: 'coupling-scroll' }, grid));
}

// ---------- rule map ----------
//
// Every command, the rules guarding it, and what it records once they
// all hold – the same conditions and emissions from `stepRules` and
// `stepEmits`, read here across every command at once.
function renderRuleMap(model, main) {
  main.appendChild(h('header', {},
    h('div', { class: 'name' }, 'Rule map'),
    h('div', { class: 'muted small' },
      'Every command, the rules guarding it, and what it records once they all hold – the same '
      + 'conditions and emissions from each command’s own page, gathered across all of them.')));

  const groups = featureGroups(model).filter((g) => g.commands.length);
  if (!groups.length) {
    main.appendChild(h('div', { class: 'empty' }, 'No commands yet.'));
    return;
  }

  for (const group of groups) {
    main.appendChild(h('h3', { class: 'rulemap-feature' }, group.name));
    for (const name of group.commands) {
      const slice = sliceOf(model, name);
      const rules = slice.rules.map((condition) => ruleSentence(model, slice.body, condition));
      main.appendChild(h('div', { class: 'card command rulemap-row' },
        h('div', { class: 'rulemap-cmd' }, commandRef(model, name)),
        h('div', { class: 'rulemap-arrow' }, '→'),
        h('div', { class: 'rulemap-rules' },
          rules.length
            ? rules.map((text) => h('div', { class: 'rulemap-rule' }, text))
            : h('div', { class: 'empty tiny' }, 'always allowed')),
        h('div', { class: 'rulemap-arrow' }, '→'),
        h('div', { class: 'rulemap-events' },
          slice.emits.length
            ? slice.emits.map(({ emission }) => eventRef(model, emission.name))
            : h('div', { class: 'empty tiny' }, 'records nothing yet'))));
    }
  }
}

// ---------- event model ----------
//
// `eventModel` (shared.js) decides what goes where; this places it.
// Like a lifecycle band, the geometry is computed rather than measured
// – card heights from text length, every card in a lane as tall as the
// lane's tallest, so the wires can be drawn against it without reading
// the DOM back.

const EM = { LABEL: 140, W: 168, GAP: 44, PAD: 14, LINE: 18, SMALL: 16, CHARS: 21 };

// Lines a label wraps to in a card – a guess, not a measurement, and
// erring long: a card a line too tall is a gap, one too short clips.
function emLines(text, chars = EM.CHARS) {
  return Math.max(1, Math.ceil(String(text).length / chars));
}

function eventModelLayout(model, em) {
  const columns = [];
  let x = EM.LABEL;
  for (const column of em.columns) {
    const slots = column.kind === 'command' ? Math.max(1, column.events.length) : 1;
    const width = slots * EM.W + (slots - 1) * EM.GAP;
    const left = x;
    columns.push({ ...column, x: left, width, slotX: (i) => left + i * (EM.W + EM.GAP) });
    x += width + EM.GAP;
  }

  const commandsOnly = columns.filter((c) => c.kind === 'command');
  const reads = columns.filter((c) => c.kind === 'read');
  const payloadH = Math.max(...commandsOnly.map((c) =>
    16 + emLines(readable(c.command)) * EM.LINE + Math.max(1, c.payload.length) * 20));
  const decideH = Math.max(
    ...commandsOnly.map((c) => 16 + emLines(readable(c.command)) * EM.LINE + EM.SMALL
      + (c.reads.length ? emLines('reads ' + c.reads.join(', '), 26) * EM.SMALL : 0)),
    ...reads.map((c) => 16 + emLines(readable(c.entity || c.projection)) * EM.LINE
      + (c.properties.length ? emLines(c.properties.map(propertyWords).join(', '), 26) * EM.SMALL : 0)));
  const events = commandsOnly.flatMap((c) => c.events);
  const eventH = Math.max(52, ...events.map((e) => 16 + emLines(readable(e.name)) * EM.LINE + EM.SMALL));

  const lanes = [];
  let y = 0;
  const lane = (kind, height, tag) => { lanes.push({ kind, y, height, tag }); y += height; return lanes[lanes.length - 1]; };
  const payloadLane = lane('payload', payloadH + 2 * EM.PAD);
  const decideLane = lane('decide', decideH + 2 * EM.PAD);
  const eventLanes = em.lanes.map((tag) => lane('events', eventH + 2 * EM.PAD, tag));
  const lanesBottom = y;

  const cards = [];
  const wires = [];
  let buses = 0;
  const readCard = {};
  for (const column of columns) {
    if (column.kind === 'read') {
      const card = {
        kind: 'read', column, x: column.x, y: decideLane.y + EM.PAD, w: EM.W, h: decideH,
      };
      cards.push(card);
      (readCard[column.from] = readCard[column.from] || []).push(card);
    }
  }
  for (const column of columns) {
    if (column.kind !== 'command') continue;
    const payload = { kind: 'payload', column, x: column.x, y: payloadLane.y + EM.PAD, w: column.width, h: payloadH };
    const command = { kind: 'command', column, x: column.x, y: decideLane.y + EM.PAD, w: column.width, h: decideH };
    cards.push(payload, command);
    const cx = column.x + column.width / 2;
    wires.push({ arrow: true, d: `M ${cx} ${payload.y + payload.h} L ${cx} ${command.y - 2}` });

    column.events.forEach((event, i) => {
      const top = eventLanes[Math.min(...event.lanes)];
      const bottom = eventLanes[Math.max(...event.lanes)];
      const card = {
        kind: 'event', column, event, x: column.slotX(i), y: top.y + EM.PAD, w: EM.W,
        h: bottom.y + bottom.height - EM.PAD - (top.y + EM.PAD),
      };
      cards.push(card);
      const ex = card.x + EM.W / 2;
      wires.push({ arrow: true, d: `M ${ex} ${command.y + command.h} L ${ex} ${card.y - 2}` });

      // Out to the read models this event introduces: along the event's
      // own lane when that is clear, and along a strip under every lane
      // when a later event of the same command sits in the way.
      const targets = readCard[event.name] || [];
      if (!targets.length) return;
      const lastX = targets[targets.length - 1].x + EM.W / 2;
      const blocked = column.events.slice(i + 1)
        .some((later) => later.lanes.some((l) => l >= Math.min(...event.lanes) && l <= Math.max(...event.lanes)));
      let wireY;
      if (blocked) {
        wireY = lanesBottom + 12 + buses * 10;
        buses += 1;
        wires.push({ d: `M ${ex} ${card.y + card.h} L ${ex} ${wireY} L ${lastX} ${wireY}` });
      } else {
        wireY = top.y + top.height / 2;
        wires.push({ d: `M ${card.x + EM.W} ${wireY} L ${lastX} ${wireY}` });
      }
      for (const target of targets) {
        const tx = target.x + EM.W / 2;
        wires.push({ arrow: true, d: `M ${tx} ${wireY} L ${tx} ${target.y + target.h + 2}` });
      }
    });
  }
  return {
    lanes, cards, wires,
    width: x - EM.GAP + 24,
    height: lanesBottom + (buses ? 16 + buses * 10 : 0),
  };
}

function renderEventModel(model, main) {
  main.appendChild(h('header', {},
    h('div', { class: 'name' }, 'Event model'),
    h('div', { class: 'muted small' },
      'Every command with its payload above it and the events it appends below, time running left '
      + 'to right; after it, a read model for each piece of state those events move first. Event '
      + 'lanes are tags, so an event with two tags spans two lanes. The order follows the '
      + 'lifecycles: what creates a thing first, what ends it last.')));

  const em = eventModel(model);
  if (!em.columns.length) {
    main.appendChild(h('div', { class: 'empty' }, 'No commands yet.'));
    return;
  }
  const layout = eventModelLayout(model, em);
  const band = h('div', { class: 'em-band', style: `width:${layout.width}px; height:${layout.height}px` });

  const LANE_NAMES = { payload: 'Payload', decide: 'Commands · read models' };
  for (const lane of layout.lanes) {
    band.appendChild(h('div', { class: 'em-lane ' + lane.kind, style: `top:${lane.y}px; height:${lane.height}px` }));
    band.appendChild(h('div', { class: 'em-lane-label', style: `top:${lane.y + EM.PAD}px` },
      lane.kind === 'events'
        ? (lane.tag ? ['Events tagged', h('span', { class: 'tech' }, lane.tag)] : 'Untagged events')
        : LANE_NAMES[lane.kind]));
  }

  // Unique per page, like a lifecycle band's: two marker ids that
  // collide resolve to whichever came first.
  const ah = 'em-ah';
  let wires = `<svg viewBox="0 0 ${layout.width} ${layout.height}" preserveAspectRatio="none">`
    + `<defs><marker id="${ah}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">`
    + `<path d="M 0 0 L 10 5 L 0 10 z" fill="var(--muted)"></path></marker></defs>`;
  for (const wire of layout.wires) {
    wires += `<path d="${wire.d}" fill="none" stroke="var(--muted)" stroke-width="1.5"`
      + (wire.arrow ? ` marker-end="url(#${ah})"` : '') + '></path>';
  }
  band.appendChild(h('div', { class: 'em-wires' }, svg(wires + '</svg>')));

  const place = (card) => `left:${card.x}px; top:${card.y}px; width:${card.w}px; height:${card.h}px`;
  for (const card of layout.cards) {
    const { column } = card;
    if (card.kind === 'payload') {
      band.appendChild(h('div', { class: 'em-card payload', style: place(card) },
        h('div', {}, readable(column.command)),
        column.payload.length
          ? column.payload.map((p) => h('div', { class: 'field', title: typeLabel(p) }, p.name))
          : h('div', { class: 'line' }, '–')));
    } else if (card.kind === 'command') {
      const ruleWords = [
        column.rules ? column.rules + (column.rules === 1 ? ' rule' : ' rules') : null,
        column.guards ? column.guards + (column.guards === 1 ? ' guard' : ' guards') : null,
      ].filter(Boolean).join(' · ');
      band.appendChild(h('div', { class: 'em-card command', style: place(card) },
        h('div', { class: 'title', title: column.command, onclick: () => goToCommand(column.command) },
          iconPrefix(commandIcon(model, column.command)) + readable(column.command)),
        ruleWords ? h('div', { class: 'rules' }, ruleWords) : h('div', { class: 'line' }, 'always allowed'),
        column.reads.length ? h('div', { class: 'line' }, 'reads ' + column.reads.join(', ')) : null));
    } else if (card.kind === 'read') {
      const name = column.entity || column.projection;
      band.appendChild(h('div', { class: 'em-card read', style: place(card) },
        h('div', {
          class: 'title', title: name,
          onclick: () => (column.entity ? openEntity(column.entity) : goToProjection(column.projection)),
        }, iconPrefix(column.entity ? entityIcon(model, column.entity) : null) + readable(name)),
        column.properties.length
          ? h('div', { class: 'line' }, column.properties.map(propertyWords).join(', '))
          : null));
    } else {
      const { event } = card;
      band.appendChild(h('div', { class: 'em-card event', style: place(card) },
        h('div', { class: 'title', title: event.name, onclick: () => goToEvent(event.name) },
          iconPrefix(eventIcon(model, event.name)) + readable(event.name)),
        h('div', { class: 'line' },
          (event.tags.length ? event.tags.join(' + ') : 'untagged') + (event.guarded ? ' · guarded' : ''))));
    }
  }
  main.appendChild(h('div', { class: 'em-scroll' }, band));
}

// ---------- lifecycles ----------
//
// Each entity's lifecycle drawn as the machine `lifecycleMachines`
// derives (shared.js): state bubbles on an open band, event-labelled
// wires between them, and the commands allowed at a state kept in a
// popover until the state is hovered, focused or pinned.
//
// Two weights, because most lifecycles are the ordinary two-state
// boolean an entity's page adds in one click. A machine that is only
// existence gets one compact row; anything with three or more states
// gets the band. Filtering the two-state ones off instead would have
// been quieter and wrong: the unguarded dot is this page's most useful
// output, and a command that brings a thing into being without checking
// it does not exist yet is exactly that bug, in exactly the machine a
// filter would have hidden.

// The machine, named the way a caveat about it reads: "course · status",
// or just "student · exists".
function machineWords(machine) {
  return memberWords(readable(machine.entity).toLowerCase(), machine.property);
}

const LC_GAP = 150;   // between two nodes: an arrow and its event label
const LC_NODE_H = 46;
const LC_ROW_H = 22;  // one command row in a popover or list

// What one state's popover holds: the commands that move the status
// away (read off the transitions drawn from here, so a publisher that
// never binds the entity – a numbering-guarded DefineCourse – still
// appears), then the ones that leave it unchanged.
function lifecycleStateRows(machine, state) {
  const moves = [];
  const seen = new Set();
  for (const t of machine.transitions) {
    if (!t.sources.includes(state) || t.target === state) continue;
    for (const p of t.publishers) {
      const from = p.sources === null ? (t.conventional ? [state] : machine.states) : p.sources;
      if (!from.includes(state) || seen.has(p.command)) continue;
      seen.add(p.command);
      moves.push({ command: p.command, target: t.target, unguarded: p.sources === null });
    }
  }
  const stays = machine.perState[state]
    .filter((e) => (e.movesTo === null || e.movesTo === state) && !seen.has(e.command))
    .map((e) => ({ command: e.command, target: null, unguarded: e.unguarded }));
  return { moves, stays };
}

// Every command this machine cannot pin to a state – for the caveat an
// otherwise-empty state carries.
function lifecycleUnguarded(machine) {
  const names = new Set();
  for (const t of machine.transitions) {
    for (const p of t.publishers) if (p.sources === null) names.add(p.command);
  }
  for (const entries of Object.values(machine.perState)) {
    for (const e of entries) if (e.unguarded) names.add(e.command);
  }
  return [...names];
}

// Where everything sits – computed rather than measured: node widths
// come from label length, so the geometry is a pure function of the
// machine and the wires can be drawn against it without reading the
// DOM back. Heights include the room the popovers need, so opening
// one never grows the page under the pointer.
function lifecycleLayout(machine) {
  const order = lifecycleOrder(machine);
  const nodes = [];
  let x = 46;
  order.forEach((state, i) => {
    const label = lifecycleStateWords(machine, state);
    const w = Math.max(120, Math.min(210, 40 + label.length * 8));
    nodes.push({ state, x, y: 56 + (i % 2 ? 18 : 0), w, index: i });
    x += w + LC_GAP;
  });
  const at = {};
  for (const n of nodes) at[n.state] = n;

  const edges = [];
  const pairSeen = {};
  let hasBack = false;
  for (const t of machine.transitions) {
    for (const source of t.sources) {
      const from = at[source];
      const to = at[t.target];
      if (!from || !to) continue;
      const pairKey = source + '\u0000' + t.target;
      const lane = pairSeen[pairKey] || 0;
      pairSeen[pairKey] = lane + 1;
      const edge = { transition: t, from: source, to: t.target };
      if (to.index > from.index) {
        const x1 = from.x + from.w + 4;
        const y1 = from.y + LC_NODE_H / 2 - 4;
        const x2 = to.x - 8;
        const y2 = to.y + LC_NODE_H / 2 - 4;
        const lift = 30 + lane * 14;
        edge.path = `M ${x1} ${y1} C ${x1 + 56} ${y1 - lift}, ${x2 - 56} ${y2 - lift}, ${x2} ${y2}`;
        edge.labelX = (x1 + x2) / 2;
        edge.labelY = Math.min(y1, y2) - 40 - lane * 16;
      } else if (to.index === from.index) {
        const cx = from.x + from.w / 2;
        const top = from.y;
        edge.path = `M ${cx - 15} ${top - 2} C ${cx - 15} ${top - 28}, ${cx + 15} ${top - 28}, ${cx + 15} ${top - 6}`;
        edge.labelX = cx;
        edge.labelY = top - 46;
      } else {
        hasBack = true;
        const x1 = from.x + from.w / 2;
        const y1 = from.y + LC_NODE_H;
        const x2 = to.x + to.w / 2;
        const y2 = to.y + LC_NODE_H;
        const drop = 40 + lane * 14;
        edge.path = `M ${x1} ${y1 + 2} C ${x1} ${y1 + drop}, ${x2} ${y2 + drop}, ${x2} ${y2 + 6}`;
        edge.labelX = (x1 + x2) / 2;
        edge.labelY = Math.max(y1, y2) + 26 + lane * 16;
      }
      edges.push(edge);
    }
  }

  // The room a state's rows need, so an opened popover never spills
  // past the band.
  let maxRows = 1;
  for (const state of machine.states) {
    const { moves, stays } = lifecycleStateRows(machine, state);
    const headers = (moves.length ? 1 : 0) + (stays.length ? 1 : 0);
    maxRows = Math.max(maxRows, moves.length + stays.length + headers || 2);
  }
  const nodesBottom = Math.max(...nodes.map((n) => n.y)) + LC_NODE_H;
  return {
    nodes, at, edges,
    width: Math.max(x - LC_GAP + 46, 320),
    height: nodesBottom + (hasBack ? 58 : 14) + maxRows * LC_ROW_H + 44,
  };
}

function renderLifecycles(model, main) {
  main.appendChild(h('header', {},
    h('div', { class: 'name' }, 'Lifecycles'),
    h('div', { class: 'muted small' },
      'Each entity’s lifecycle as a machine – every state it can be in, the events that move '
      + 'it from one to the next, and the commands allowed at each state. All of it is derived '
      + 'from the property the entity designates as its lifecycle.')));
