  const modal = h('div', { class: 'modal', tabindex: '-1', role: 'dialog', 'aria-modal': 'true' },
    h('header', {},
      h('h2', {}, 'Import & Export'),
      h('span', { class: 'grow' }),
      h('button', { class: 'btn ghost', onclick: close, title: 'Close', 'aria-label': 'Close' }, '×')),
    h('div', { class: 'muted small' }, 'Bring in a model from somewhere else, or send this one out.'),
    h('div', { class: 'ie-tabs' },
      h('button', {
        class: 'ie-tab' + (state.ieTab === 'import' ? ' on' : ''),
        onclick: () => { state.ieTab = 'import'; render(); },
      }, 'Import'),
      h('button', {
        class: 'ie-tab' + (state.ieTab === 'export' ? ' on' : ''),
        onclick: () => { state.ieTab = 'export'; render(); },
      }, 'Export')),
    state.ieTab === 'import' ? importPanel : exportPanel,
    modalFooter(close));

  setTimeout(() => modal.focus(), 0);
  return overlayAround(modal, close);
}

// ============================================================
// Interface conveniences: undo, the loose-ends count, quick open, and
// row-to-row arrow keys. Each of these used to be optional; all four
// are just how the page behaves now.
// ============================================================

// ---------- undo ----------
//
// The model is an append-only log and the state is a fold over it, so a
// change is undone by taking what it appended back out of the log – not
// by a second history kept beside the first. The entries that come out
// are held so redo can put them back exactly as they were.
//
// Every model has a history of its own. The log is shared by all of
// them, but each event belongs to one model and a model's state is the
// fold over its own events only, so a model's last change can be taken
// out from the middle of the log without touching what another model
// appended after it. Undo used to cut the log back to a position instead
// – one history across every model, so undoing in model A could take
// back an edit just made in B.
//
// A step is therefore not a position but a count: the model's last `n`
// events, the newest of which still has to be the one the step ended
// with (`stamp`). Positions move whenever another model's step is taken
// out or the log is compacted; a model's own tail moves only when the
// model itself changes. That is the one case a step is refused: the
// model was changed elsewhere since – another tab, say – and undoing
// here would take that change with it.
//
// The histories are this tab's, in sessionStorage: undoing in one tab
// used to take back the other's last edit. Creating, importing and
// duplicating a model are where its history starts, not steps in it; a
// deleted model has no page to undo from, so its deletion is offered
// back once, as a toast.

// Versioned in lockstep with the event log: the histories hold raw
// events, so steps taken against one log version must never replay
// against another. Deriving the suffix keeps the two keys impossible to
// bump apart.
const UNDO_KEY = 'dcb-playground:undo:' + EVENT_LOG_KEY.split(':').pop();
// Set while a load is rendering for the first time – see `boot`.
const BOOT_KEY = 'dcb-playground:booting';
// Where the history was kept while it was shared; nothing reads it.
localStorage.removeItem(UNDO_KEY);

// Steps kept per model; the oldest falls off.
const HISTORY_LIMIT = 60;

function undoLog() {
  try {
    const stored = JSON.parse(sessionStorage.getItem(UNDO_KEY));
    // The shape before histories were per model reads as empty.
    if (stored && stored.models && typeof stored.models === 'object') return stored;
  } catch (e) { /* a corrupt history is an empty one */ }
  return { models: {} };
}
function saveUndoLog(next) {
  for (const [id, history] of Object.entries(next.models)) {
    if (!history.done.length && !history.undone.length) delete next.models[id];
  }
  try {
    sessionStorage.setItem(UNDO_KEY, JSON.stringify(next));
  } catch (e) {
    toast('This history will not survive a reload: this tab’s storage is full.', true);
  }
}
function modelHistory(log, modelId) {
  return log.models[modelId] || (log.models[modelId] = { done: [], undone: [] });
}

function changedElsewhere(modelId) {
  const model = projectState()[modelId];
  return `${model ? model.name : 'This model'} was changed elsewhere since – undoing here would take `
    + 'that change too, so the earlier changes can no longer be undone.';
}

// An event as a step remembers it – by when it was written and what it
// was, not by its sequence number, which a compaction or another
// model's undo renumbers while the event itself is kept.
function eventStamp(event) {
  return event ? `${event.timestamp} ${event.type} ${event.data && event.data.name || ''}` : '';
}
function ofModel(event, modelId) {
  return !!event.data && event.data['dcb-model-id'] === modelId;
}
// Where in the log each of a model's events sits, oldest first.
function modelPositions(events, modelId) {
  const at = [];
  events.forEach((event, i) => { if (ofModel(event, modelId)) at.push(i); });
  return at;
}

// What a change was, read off what it appended. `event-definition-updated`
// carrying `CourseDefined` becomes "updated event: Course defined".
function changeLabel(appended) {
  const last = appended[appended.length - 1];
  const parts = last.type.split('-');
  const verb = parts.pop();
  const subject = parts.join(' ').replace(/^dcb /, '').replace(/ definition$/, '');
  const name = last.data && last.data.name;
  return verb + ' ' + subject + (name ? ': ' + readable(name) : '')
    + (appended.length > 1 ? ` (+${appended.length - 1} more)` : '');
}

// Steps are taken at the append seam itself (`onAppend`, model.js):
// every edit path funnels through `appendEvents` – command functions
// behind buttons and agent tools alike – so nothing can change the log
// without becoming undoable. `run` only *batches*: however many appends
// one gesture makes, the gesture is one step per model it touched, and a
// nested `run` belongs to the gesture that opened it. `asAgent` batches
// an agent's tool call the same way and marks its steps as the agent's.
let undoBatch = null;

// What a step changed, as the History page lists it – capped, since a
// whole model applied as code can be hundreds of events.
function changesOfStep(group) {
  return group.slice(0, 40).map((event) => ({
    type: event.type, name: event.data.name || null, from: event.data['previous-name'] || null,
  }));
}

function takeUndoMark(appended, agent, via) {
  const log = undoLog();
  const byModel = new Map();
  for (const event of appended) {
    const id = event.data && event.data['dcb-model-id'];
    if (!id) continue;
    if (!byModel.has(id)) byModel.set(id, []);
    byModel.get(id).push(event);
  }
  for (const [id, group] of byModel) {
    if (group.some((event) => event.type === 'dcb-model-deleted')) {
      delete log.models[id];
      offerRestore(id, group.find((event) => event.type === 'dcb-model-deleted'));
      continue;
    }
    if (group.some((event) => event.type === 'dcb-model-created')) {
      delete log.models[id];
      continue;
    }
    const history = modelHistory(log, id);
    const last = group[group.length - 1];
    history.done.push({
      n: group.length, stamp: eventStamp(last), label: changeLabel(group),
      time: last.timestamp, agent: !!agent, via: via || null, changes: changesOfStep(group),
    });
    // Redoing after a new change would mean putting back entries the
    // model has moved on from, so the branch is dropped – on an agent's
    // append exactly as on a button's.
    history.undone = [];
    if (history.done.length > HISTORY_LIMIT) {
      history.done.shift();
      history.trimmed = true;
    }
  }
  saveUndoLog(log);
}

onAppend((at, appended) => {
  if (undoBatch) {
    if (undoBatch.at === null) undoBatch.at = at;
    undoBatch.events.push(...appended);
    return;
  }
  // An append outside any gesture is its own step; the caller repaints
  // for itself afterwards.
  takeUndoMark(appended, false);
});

// The model the address bar links to has changed: the link is stale.
onAppend((at, appended) => {
  if (addressModelId && appended.some((event) => event.data && event.data['dcb-model-id'] === addressModelId)) {
    dropAddressLink();
  }
});

// A linked copy's first change asks for a name – only while it is the
// model on screen, since the question is about what was just done.
onAppend((at, appended) => {
  const id = takeFirstChange(appended);
  if (id && id === activeModelId()) state.namePrompt = { id, draft: projectState()[id].name };
});

function batched(fn, agent, finish) {
  if (undoBatch) return fn();
  undoBatch = { at: null, events: [], via: null };
  try {
    const out = fn();
    if (undoBatch.events.length) {
      takeUndoMark(undoBatch.events, agent, undoBatch.via);
      if (finish) finish();
    }
    return out;
  } finally {
    undoBatch = null;
  }
}

const runOnce = run;
run = function (fn) {
  return batched(() => runOnce(fn), false, render);
};

// An agent's tool call (webmcp.js): one step per model it changed,
// marked as the agent's. Unlike `run` it lets a refusal through – the
// agent has to hear it.
function asAgent(fn) {
  return batched(fn, true);
}

// Says how the gesture under way changes the model, where its events
// alone do not tell – a text applied from the code view is one step of
// many changes, read as one.
function markStepVia(via) {
  if (undoBatch) undoBatch.via = via;
}

// Moves a model's history `delta` steps – back when negative, forward
// when positive – in one write of the log, however far it goes. Returns
// how many steps it moved, or null when the model was changed elsewhere
// and the history was dropped.
function travel(modelId, delta) {
  const log = undoLog();
  const history = log.models[modelId];
  if (!history) return 0;
  let events = loadEvents();
  let moved = 0;
  const refuse = () => {
    delete log.models[modelId];
    log.restarted = { ...log.restarted, [modelId]: new Date().toISOString() };
    saveUndoLog(log);
    toast(changedElsewhere(modelId), true);
    return null;
  };
  while (delta < 0 && history.done.length) {
    const mark = history.done[history.done.length - 1];
    const at = modelPositions(events, modelId);
    if (at.length < mark.n || eventStamp(events[at[at.length - 1]]) !== mark.stamp) return refuse();
    const out = new Set(at.slice(-mark.n));
    const removed = events.filter((event, i) => out.has(i));
    events = events.filter((event, i) => !out.has(i));
    const left = at.length > mark.n ? events[modelPositions(events, modelId).pop()] : null;
    history.done.pop();
    const { n, stamp, ...about } = mark;
    history.undone.push({
      events: removed.map(({ timestamp, type, data }) => ({ timestamp, type, data })),
      base: eventStamp(left), ...about,
    });
    delta++; moved--;
  }
  while (delta > 0 && history.undone.length) {
    const step = history.undone[history.undone.length - 1];
    const at = modelPositions(events, modelId);
    const now = at.length ? eventStamp(events[at[at.length - 1]]) : '';
    if (now !== step.base) return refuse();
    events = [...events, ...step.events];
    history.undone.pop();
    const { events: replayed, base, ...about } = step;
    history.done.push({ n: replayed.length, stamp: eventStamp(replayed[replayed.length - 1]), ...about });
    delta--; moved++;
  }
  if (moved) {
    writeEventLog(events.map((event, i) => ({ ...event, sequence: i })));
    dropAddressLink();
    closeForms();
  }
  saveUndoLog(log);
  return moved;
}

function undo() {
  const id = activeModelId();
  const history = id && undoLog().models[id];
  if (!history || !history.done.length) return toast('Nothing to undo.');
  const label = history.done[history.done.length - 1].label;
  if (travel(id, -1)) {
    toast('Undone – ' + label);
    render();
  }
}

function redo() {
  const id = activeModelId();
  const history = id && undoLog().models[id];
  if (!history || !history.undone.length) return toast('Nothing to redo.');
  const label = history.undone[history.undone.length - 1].label;
  if (travel(id, 1)) {
    toast('Redone – ' + label);
    render();
  }
}

// A deleted model has no history to undo from: its deletion is offered
// back once, while the toast stands. Restoring takes the deletion out
// of the log, as undo would – refused once the log no longer holds it.
function offerRestore(modelId, deleted) {
  const model = projectState()[modelId];
  const name = model ? model.name : 'the model';
  const stamp = eventStamp(deleted);
  toast(h('span', {}, `Deleted ${name} `, h('button', {
    class: 'btn ghost', type: 'button',
    onclick: () => run(() => restoreDeleted(modelId, stamp)),
  }, 'Restore')));
}

function restoreDeleted(modelId, stamp) {
  const events = loadEvents();
  const at = events.findIndex((event) => ofModel(event, modelId) && event.type === 'dcb-model-deleted'
    && eventStamp(event) === stamp);
  if (at < 0) return toast('That model can no longer be restored.', true);
  writeEventLog(events.filter((event, i) => i !== at).map((event, i) => ({ ...event, sequence: i })));
  switchToModel(modelId);
}

// Compaction (model.js) folds the log up to the oldest event any of this
// tab's histories still needs – the first of a model's oldest step, or,
// with only redo left, the event its redo has to find in place – and a
// gesture still being batched counts. Steps are counts from a model's
// end, so nothing has to move afterwards. Another tab's histories are
// not considered: a step that loses its events is refused, as after any
// change made elsewhere.
setCompactionFloor((events) => {
  const ats = [events.length];
  for (const [id, history] of Object.entries(undoLog().models)) {
    const at = modelPositions(events, id);
    const steps = history.done.reduce((sum, mark) => sum + mark.n, 0);
    if (history.done.length && at.length >= steps) ats.push(at[at.length - steps]);
    else if (history.undone.length && at.length) ats.push(at[at.length - 1]);
  }
  if (undoBatch && undoBatch.at !== null) ats.push(undoBatch.at);
  return Math.min(...ats);
});

onCompact(({ shift, events, dropped }) => {
  if (dropped) {
    // Storage was full and only folding everything made room.
    if (Object.keys(undoLog().models).length) {
      toast('The browser\'s storage for this site was full, so the history was compacted: '
        + 'every model is as it was, but undo starts again from here.');
    }
    saveUndoLog({ models: {} });
    if (undoBatch && undoBatch.at !== null) undoBatch.at = events.length;
    return;
  }
  if (undoBatch && undoBatch.at !== null) undoBatch.at += shift;
});

// Another tab wrote the log. The caches here are keyed on this tab's
// revision counter, which that write never moved – so it is moved now,
// and the page repaints from what is really stored. Nothing else is
// needed: the history here is checked against the log at undo time.
window.addEventListener('storage', (e) => {
  if (e.key !== EVENT_LOG_KEY && e.key !== null) return;
  bumpLogRevision();
  render();
});

// ---------- loose ends ----------
//
// Nothing here is an error: a model under construction is supposed to
// have ends that are not tied yet. What it is for is that they are
// findable – an event no command records is invisible from a page built
// around commands, and it is the interface's job to say so.

function looseEnds(model) {
  const found = [];
  const loose = orphans(model);
  for (const name of loose.events) {
    found.push({
      what: readable(name), why: 'no command records this event',
      go: () => goToEvent(name),
    });
  }
  for (const name of loose.entities) {
    found.push({
      what: readable(name), why: 'no command reads this',
      go: () => { state.view = 'entity'; state.entity = name; },
    });
  }
  for (const slice of allSlices(model)) {
    const open = (why) => found.push({
      what: readable(slice.name), why,
      go: () => { state.view = 'slice'; state.slice = slice.name; },
    });
    if (!slice.emits.length) open('records nothing – nothing it decides is kept');
    if (!slice.payload.length) open('takes no input');
    // Coverage gaps are advisories now – `modelAdvisories` reports
    // them with the property and the remedy, so a second, vaguer
    // entry here would say the same thing worse.
  }
  for (const [entity, body] of Object.entries(model['entity-definitions'])) {
    for (const property of body.properties || []) {
      const usage = propertyUsage(model, entity, property.name);
      if (usage.changedBy.length || usage.readBy.length) continue;
      found.push({
        what: readable(entity) + ' · ' + propertyWords(property.name),
        why: 'nothing changes it and nothing reads it',
        go: () => { state.view = 'entity'; state.entity = entity; },
      });
    }
  }
  return found;
}

// Loose ends and scenarios the model no longer agrees with, gathered
// into one list – everything wrong with this model that nobody had to
// go looking for, each one a way back to it.
//
// Memoized per log revision: the button in the bar and the open panel
// both ask during one paint, and each ask runs every scenario in the
// model. The model identity check rides on `projectState` returning
// one shared object per revision.
let problemsCache = null;

function problems(model) {
  if (problemsCache && problemsCache.revision === logRevisionNow() && problemsCache.model === model) {
    return problemsCache.found;
  }
  const found = looseEnds(model).map((end) => ({ what: end.what, why: end.why, go: end.go }));
  // The demoted validations: what a save used to refuse loads now and
  // is reported here instead, each one a way back to the definition
  // that carries it.
  const ADVISORY_GO = {
    'entity-definition': (name) => { state.view = 'entity'; state.entity = name; },
    'event-definition': (name) => goToEvent(name),
    'projection-definition': (name) => goToProjection(name),
    'command-definition': (name) => goToCommand(name),
    'custom-type-definition': (name) => goToCustomType(name),
  };
  for (const advisory of modelAdvisories(model)) {
    found.push({
      what: readable(advisory.name),
      why: advisory.message,
      go: () => (ADVISORY_GO[advisory.kind] || (() => {}))(advisory.name),
    });
  }
  for (const { key, body, result } of scenarioTrouble(model)) {
    found.push({
      what: scenarioName(body, readable),
      why: STATUS_WORDS[result.status][2],
      go: () => {
        state.view = 'slice'; state.slice = body.command;
        state.tab = 'scenarios'; state.openScenarios.add(key);
      },
    });
  }
  problemsCache = { revision: logRevisionNow(), model, found };
  return found;
}

// The marker shown where a flagged definition lives – the same
// records the Problems panel folds in, filtered to one definition (or
// to one kind, for the pages that list a whole kind). Null when there
// is nothing to say, so a clean card stays a clean card.
function advisoryBanner(model, kind, name) {
  const found = modelAdvisories(model)
    .filter((a) => a.kind === kind && (name === undefined || a.name === name));
  if (!found.length) return null;
  return h('div', { class: 'advisory' },
    found.map((a) => h('div', {},
      h('span', { class: 'diag-mark' }, '⚠'),
      name === undefined ? h('span', { class: 'what' }, readable(a.name)) : null,
      a.message)));
}

// A model may use what the flag keeps off the pages – it was imported,
// shared, or written before the flag was turned off. It still loads and
// renders whole (the flag gates authoring, never reading), and this is
// what says so, on every page, with the one control that changes it.
function experimentalNotice(model) {
  if (experimental()) return null;
  const used = [...new Set(experimentalFeatures(model).map((f) => EXPERIMENTAL_FEATURES[f.feature]))];
  if (!used.length) return null;
  return h('div', { class: 'xnotice' },
    h('span', { class: 'grow' }, 'This model uses experimental features: ', used.join(', '), '.'),
    h('button', { class: 'btn tiny', onclick: () => setExperimental(true) }, 'Enable'));
}

// Shown only when there is something to show – a clean model gets no
// badge to reassure it is clean, the way "Loose ends ✓" used to.
function problemsButton(model) {
  const found = problems(model);
  if (!found.length) return null;
  return h('button', {
    class: 'btn ghost problems-btn', title: 'Problems in this model', 'aria-label': 'Problems: ' + found.length,
    onclick: () => { closeForms(); state.problems = true; render(); },
  }, h('span', { class: 'label' }, 'Problems'), h('span', { class: 'badge' }, found.length));
}

function problemsPanel() {
  const model = activeModel();
  const found = problems(model);
  const close = () => { state.problems = false; render(); };
  const modal = h('div', { class: 'modal', tabindex: '-1', role: 'dialog', 'aria-modal': 'true' },
    h('header', {},
      h('h2', {}, 'Problems'),
      h('span', { class: 'grow' }),
      h('button', { class: 'btn ghost', onclick: close, title: 'Close', 'aria-label': 'Close' }, '×')),
    h('div', { class: 'muted small', style: 'margin-bottom:14px' },
      'Loose ends this model has not tied yet, definitions that do not hold together yet, '
      + 'and scenarios it no longer agrees with. Nothing here blocked a save – '
      + 'these are ways back to what still needs attention.'),
    found.map((p) => h('button', {
      class: 'issue',
      onclick: () => { close(); p.go(); render(); },
    }, h('span', { class: 'diag-mark' }, '⚠'),
      h('span', {}, p.what), h('span', { class: 'why' }, p.why))),
    modalFooter(close));
  const overlay = overlayAround(modal, close);
  setTimeout(() => modal.focus(), 0);
  return overlay;
}

// ---------- quick open ----------
//
// The rail lists commands. This lists everything: the features they sit
// in, the things themselves, the events, the projections, the value
// types – each with the one thing it does when chosen.
//
// It builds its own DOM once and updates only the result list as you
// type, because a repaint of the whole page under a text field is a
// repaint that takes the caret with it.

function paletteEntries(model) {
  const entries = [];
  const add = (what, label, where, go) => entries.push({ what, label, where, go, key: label + ' ' + where });

  for (const group of featureGroups(model)) {
    for (const name of group.commands) {
      add('command', iconPrefix(commandIcon(model, name)) + readable(name), group.name, () => {
        state.view = 'slice'; state.slice = name;
      });
    }
    if (group.name !== UNGROUPED) {
      add('feature', group.name, group.commands.length + ' commands', () => {
        state.collapsed[group.name] = false;
        if (group.commands.length) { state.view = 'slice'; state.slice = group.commands[0]; }
      });
    }
  }
  for (const name of Object.keys(model['entity-definitions'])) {
    add('entity', iconPrefix(entityIcon(model, name)) + readable(name), 'the things themselves', () => {
      state.entitiesCollapsed = false; state.view = 'entity'; state.entity = name;
    });
  }
  const records = {};
  for (const slice of allSlices(model)) {
    for (const emit of slice.emits) records[emit.emission.name] = slice.name;
  }
  for (const name of Object.keys(model['event-definitions'])) {
    const from = records[name];
    add('event', iconPrefix(eventIcon(model, name)) + readable(name),
      from ? 'recorded by ' + readable(from) : 'recorded by nothing', () => goToEvent(name));
  }
  for (const name of Object.keys(model['projection-definitions'])) {
    const owner = boundAs(model, name)[0];
    add('projection', readable(name),
      owner ? 'on ' + readable(owner.entity) : 'projections',
      () => goToProjection(name));
  }
  for (const name of Object.keys(model['custom-type-definitions'])) {
    add('custom type', readable(name), 'custom types', () => goToCustomType(name));
  }
  add('do', 'New command…', '', () => beginNewCommand(activeModel()));
  add('do', 'Models…', 'switch, load, or start a model', () => { state.models = true; });
  add('do', 'History', 'go back to an earlier version of this model', () => { closeForms(); state.view = 'history'; });
  if (experimental()) add('do', 'Compare with…', 'this model against another, or itself earlier', () => { closeForms(); state.view = 'compare'; });
  add('do', 'Settings', '', () => { state.settings = true; });
  add('do', isDark() ? 'Switch to light mode' : 'Switch to dark mode', '', toggleTheme);
  add('do', experimental() ? 'Disable experimental features' : 'Enable experimental features', '',
    () => setExperimental(!experimental()));
  return entries;
}

// Letters in order, anywhere in the text. A run that starts the text
// beats one that starts a word, which beats one scattered through it –
// enough ranking that typing "sub" puts "Subscribe student" first.
function fuzzyScore(query, text) {
  if (!query) return 0;
  const q = query.toLowerCase();
  const t = text.toLowerCase();
  const at = t.indexOf(q);
  if (at === 0) return 1000;
  if (at > 0) return 800 - at - (t[at - 1] === ' ' ? 0 : 100);
  let i = 0;
  let score = 400;
  for (const ch of t) {
    if (ch === q[i]) i += 1;
    if (i === q.length) return score;
    score -= 1;
  }
  return -1;
}

let paletteEl = null;

function closePalette() {
  state.palette = false;
  paletteEl = null;
  const host = document.getElementById('palette-host');
  if (host) host.innerHTML = '';
}

function openPalette() {
  closeForms();
  state.settings = false; state.problems = false; state.models = false; state.help = false;
  state.palette = true;
  render();
}

function renderPalette() {
  const host = document.getElementById('palette-host');
  if (!state.palette) { host.innerHTML = ''; paletteEl = null; return; }
  // Already up and holding the caret: nothing about a repaint of the
  // page behind it should reach in here.
  if (paletteEl) return;

  const entries = paletteEntries(activeModel());
  let hits = entries.slice(0, 12);
  let active = 0;

  const list = h('div', { class: 'hits' });

  // Which row reads as active – a class toggle on the rows `paint`
  // already built, never a rebuild. `onmouseenter` used to call `paint`
  // directly, which tears every row down and reappends fresh ones; a
  // real click or tap lands in the same beat as the hover that precedes
  // it, so the row it was about to land on was already gone by the time
  // it arrived, and the click never reached anything.
  const highlight = () => {
    [...list.children].forEach((el, i) => el.classList.toggle('on', i === active));
    const on = list.children[active];
    if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
  };

  const paint = () => {
    list.innerHTML = '';
    if (!hits.length) { list.appendChild(h('div', { class: 'none' }, 'Nothing by that name.')); return; }
    hits.forEach((hit, i) => list.appendChild(h('div', {
      class: 'hit',
      onmouseenter: () => { active = i; highlight(); },
      onclick: () => choose(hit),
    }, h('span', { class: 'what' }, hit.what), h('span', {}, hit.label),
      hit.where ? h('span', { class: 'where' }, hit.where) : null)));
    highlight();
  };

  const choose = (hit) => {
    if (!hit) return;
    closePalette();
    hit.go();
    render();
  };

  const input = h('input', {
    type: 'text', placeholder: 'Quick open…', 'aria-label': 'Quick open',
    oninput: (e) => {
      const q = e.target.value.trim();
      hits = entries
        .map((entry) => ({ entry, score: fuzzyScore(q, entry.key) }))
        .filter((x) => x.score >= 0)
        .sort((a, b) => b.score - a.score)
        .slice(0, 12)
        .map((x) => x.entry);
      active = 0;
      paint();
    },
    onkeydown: (e) => {
      if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(active + 1, hits.length - 1); highlight(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(active - 1, 0); highlight(); }
      else if (e.key === 'Enter') { e.preventDefault(); choose(hits[active]); }
      // Escape belongs to the palette while the palette is up, and the
      // handler at the bottom of this file must not also act on it.
      else if (e.key === 'Escape') { e.preventDefault(); closePalette(); render(); }
    },
  });

  // Escape and the backdrop are how quick open is left on a desktop; a
  // phone has neither once the palette fills the screen, so it gets the
  // × every other dialog carries – shown only there (shared.css).
  paletteEl = h('div', { class: 'palette', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Quick open' },
    h('div', { class: 'palette-head' }, input,
      h('button', {
        class: 'btn ghost palette-close', type: 'button', title: 'Close', 'aria-label': 'Close',
        onclick: () => { closePalette(); render(); },
      }, '×')),
    list,
    h('footer', {},
      h('span', {}, '↑↓ to move'), h('span', {}, '↵ to open'), h('span', {}, 'esc to close')));
  paint();
  host.appendChild(h('div', {
    class: 'overlay palette-overlay',
    onclick: (e) => { if (e.target === e.currentTarget) { closePalette(); render(); } },
  }, paletteEl));
  setTimeout(() => input.focus(), 0);
}

// ---------- arrow keys between rows ----------
//
// Tab reaches every button on the way down a command. The arrows reach
// only the rows, which is how the page is read rather than edited.

function rovingRows() {
  return [...document.querySelectorAll('#main .qrow[tabindex], #rail .qrow[tabindex]')];
}

function moveRow(step) {
  const rows = rovingRows();
  if (!rows.length) return false;
  const at = rows.indexOf(document.activeElement);
  const next = at < 0
    ? rows[step > 0 ? 0 : rows.length - 1]
    : rows[Math.min(Math.max(at + step, 0), rows.length - 1)];
  if (!next) return false;
  next.focus();
  next.scrollIntoView({ block: 'nearest' });
  return true;
}

// ---------- bringing a row on screen ----------
//
// Following a reference to its source, and landing on a row after the
// interface moved you somewhere.

function landOn(selector) {
  const target = document.querySelector(selector);
  if (!target) return;
  target.scrollIntoView({ block: 'center', behavior: 'smooth' });
  // Restarting an animation that may still be running: the class comes
  // off, the layout is read to make the removal take effect, and it
  // goes back on – all in this frame, so nothing depends on a callback
  // the browser is free to defer.
  target.classList.remove('landed');
  void target.offsetWidth;
  target.classList.add('landed');
}

// Whether a row's machinery is on screen outright – a row opens on
// click, and stays open until another one is clicked.
function revealed(key) {
  return state.sel === key;
}

// The part of a row that waits to be asked for.
function reveal(...children) { return h('span', { class: 'reveal' }, ...children); }

// ---------- where a value came from ----------
//
// A sentence in one step refers to something declared in another: the
// input the command was handed, the instance it read, the field its
// event carries. The reference and the row that produces it now carry
// the same key, so pointing at one lights the other – which is the only
// way to see, without reading the whole page, that the "course id" in
// this sentence is the "course id" listed further up.

function sourceKey(operand, eventName) {
  switch (operandSource(operand)) {
    case 'parameter': return 'param:' + operand.parameterName;
    case 'alias-property': return 'alias:' + operand.alias;
    case 'event-property':
      return eventName ? 'evprop:' + eventName + '.' + operand.eventProperty : null;
    default: return null;
  }
}

// A hovered key lights up for as long as the pointer is on it; a clicked
// one is pinned and survives the pointer leaving, and a repaint.
function paintLit(hovered) {
  const key = hovered || state.lit;
  for (const node of document.querySelectorAll('.lit')) node.classList.remove('lit');
  if (!key) return;
  for (const node of document.querySelectorAll(`[data-src~="${key}"]`)) node.classList.add('lit');
}

// An operand as a chip that points back at its source.
function opRef(operand, eventName, text) {
  const label = text === undefined ? operandWords(operand) : text;
  if (operandSource(operand) === 'projection-read' && label === operandWords(operand)) {
    return projectionReadRef(operand, eventName);
  }
  const key = sourceKey(operand, eventName);
  if (!key) return h('span', { class: 'op' }, label);
  return h('span', {
    class: 'op ref' + (state.lit === key ? ' pinned' : ''),
    tabindex: 0, title: 'Where this comes from',
    onmouseenter: () => paintLit(key),
    onmouseleave: () => paintLit(),
    onfocus: () => paintLit(key),
    onblur: () => paintLit(),
    onclick: (e) => {
      e.stopPropagation();
      state.lit = state.lit === key ? null : key;
      // Lighting up a source three steps further up the page is only
      // half an answer while it is off screen.
      if (state.lit) state.land = `[data-src~="${CSS.escape(key)}"]`;
      render();
    },
  }, label);
}

// A read in place, as the call it is – `Developer seniority level
// (developer)` – with the name, the brackets and each value set apart,
// and each value a reference of its own: the tag lights the input it
// came from. `name` stands in for the name when the page puts
// something there instead (the alias being typed).
function projectionReadRef(operand, eventName, name) {
  const { name: words, values } = projectionReadParts(operand);
  return h('span', { class: 'op read' },
    name || h('span', { class: 'read-name' }, words),
    values.length
      ? h('span', {}, h('span', { class: 'read-punct' }, ' ('),
          ...values.flatMap((value, i) => [
            i ? h('span', { class: 'read-punct' }, ', ') : null,
            opRef(value.operand, eventName, value.words),
          ]),
          h('span', { class: 'read-punct' }, ')'))
      : null);
}

// A row that is quiet by default: `key` names it, `src` for anything
// that refers back to it. Arrow keys always move along the page's flow
// – see `navFlow` – and Backspace removes the row when `onRemove` is
// given.
function qrow(tag, { cls = '', key, src, onRemove }, ...children) {
  const open = revealed(key);
  const toggle = () => { state.sel = state.sel === key ? null : key; render(); };
  return h(tag, {
    class: (cls ? cls + ' ' : '') + 'qrow' + (open ? ' open' : ''),
    'data-src': src || null,
    // Named in the document as well as in the state, so the keyboard
    // can be put back on the row it was on after a repaint.
    'data-key': key || null,
    tabindex: 0,
    onclick: (e) => {
      // A click meant for a control inside the row is not a click on
      // the row.
      if (e.target.closest('button, select, input, label, a, .chip.entity, .chip.linkable, .op.ent')) return;
      toggle();
    },
    onkeydown: (e) => {
      if (e.target !== e.currentTarget) return;
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); return; }
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { navFlow(e); return; }
      if ((e.key === 'Backspace' || e.key === 'Delete') && onRemove) {
        e.preventDefault();
        const at = flowStops().indexOf(e.currentTarget);
        onRemove();
        if (at >= 0) focusFlowStopNear(Math.max(0, at - 1));
      }
    },
  }, ...children);
}

// "Add another one", folded into a single button until it is wanted.
// `flow-adder` marks that button as a stop of its own – see `navFlow`
// – so the row above it and the step below it are both one arrow key
// away, exactly the way an unfolded row would be. The `quiet` class
// keeps the folded button invisible until its step or card is hovered
// or the keyboard lands on it – except where hover cannot happen; see
// the adder and touch-screens CSS.
function adderSlot(key, stepKey, label, build) {
  if (state.adder === key) return build();
  return h('div', { class: 'adder quiet' }, h('button', {
    class: 'btn ghost tiny flow-adder',
    onclick: () => { closeForms(); state.adder = key; render(); focusOpenedAdder(stepKey); },
    onkeydown: (e) => { if (e.key === 'ArrowUp' || e.key === 'ArrowDown') navFlow(e); },
  }, label), h('span', { class: 'slot' }));
}

// Opening one adder from its folded button can also fold another –
// `state.adder` holds one key for the whole page, so a reads form left
// open collapses the instant a rule form opens. That is two sections
// changing shape in the same repaint, which is more than the generic
// by-position focus restore in `render` can track: it lands wherever
// the old button's position now falls in the new page, not on the form
// that actually replaced it. Landing explicitly on the new form's own
// first control – it is always the step's last child – is what keeps
// Enter-to-submit-then-Tab reaching the *next* step reliable.
function focusOpenedAdder(stepKey) {
  if (!stepKey) return;
  const section = document.querySelector('.step.' + stepKey);
  const last = section && section.lastElementChild;
  const el = last && last.querySelector('select, input, textarea, button');
  if (el) el.focus();
}

// ---------- dragging by a grip ----------
//
// One mechanism for every ⠿ grip in the app: pointer events, never the
// HTML5 drag-and-drop API, because that API does not fire on touch
// screens and this one works the same for mouse, pen and finger. The
// grip captures the pointer, whatever is under it as it moves is found
// with `elementFromPoint` (capture does not change what is under the
// pointer), and everything until the drop is direct DOM – nothing may
// repaint mid-drag. Only the drop itself may run a command.
function gripDrag({ title, onStart, onMove, onDrop, onEnd }) {
  let dragging = false;
  const finish = (e, dropped) => {
    if (!dragging) return;
    dragging = false;
    if (onEnd) onEnd(e);
    if (dropped) onDrop(document.elementFromPoint(e.clientX, e.clientY), e);
  };
  return h('span', {
    class: 'grip', title,
    onpointerdown: (e) => {
      if (e.button) return;
      e.preventDefault();
      e.currentTarget.setPointerCapture(e.pointerId);
      dragging = true;
      if (onStart) onStart(e);
    },
    onpointermove: (e) => {
      if (dragging) onMove(document.elementFromPoint(e.clientX, e.clientY), e);
    },
    onpointerup: (e) => finish(e, true),
    onpointercancel: (e) => finish(e, false),
    // The grip often sits inside something clickable (a rail row is a
    // link); a tap that turned out not to be a drag must not follow it.
    onclick: (e) => { e.preventDefault(); e.stopPropagation(); },
  }, '⠿');
}

// The reorder drag both scenario lists share. Cards carry their key
// and kind as data attributes; the paint marks the edge the dragged
// one would land against, the drop reorders against that edge.
function scenarioGrip(model, kind, key, title) {
  let over = null;
  const clear = () => { if (over) over.classList.remove('drop-before', 'drop-after'); over = null; };
  const cardUnder = (under) => {
    const card = under && under.closest(`[data-scen][data-scen-kind="${kind}"]`);
    return card && card.getAttribute('data-scen') !== key ? card : null;
  };
  const landsBefore = (card, e) => {
    const rect = card.getBoundingClientRect();
    return (e.clientY - rect.top) < rect.height / 2;
  };
  return gripDrag({
    title,
    onMove: (under, e) => {
      const card = cardUnder(under);
      if (card !== over) { clear(); over = card; }
      if (!card) return;
      const before = landsBefore(card, e);
      card.classList.toggle('drop-before', before);
      card.classList.toggle('drop-after', !before);
    },
    onEnd: clear,
    onDrop: (under, e) => {
      const card = cardUnder(under);
      if (!card) return;
      run(() => reorderByDrag(kind, model, key, card.getAttribute('data-scen'), landsBefore(card, e)));
    },
  });
}

// Moves `list[from]` to land against `list[to]`'s edge, in place, and
// returns the index it landed at. Positions, not keys: rules have no
// name of their own, only their place in `conditions`.
function moveAgainst(list, from, to, before) {
  const [item] = list.splice(from, 1);
  const at = (to > from ? to - 1 : to) + (before ? 0 : 1);
  list.splice(at, 0, item);
  return at;
}

// The reorder drag among the rules of the rules card. Order is meaning
// here, not tidiness: rules are checked top to bottom and the first
// that fails is the one a refusal names. Everything keyed by a rule's
// index (the open row, the one being edited) follows it.
function ruleGrip(slice, i) {
  let over = null;
  const clear = () => { if (over) over.classList.remove('drop-before', 'drop-after'); over = null; };
  const rowUnder = (under) => {
    const row = under && under.closest('[data-rule]');
    return row && Number(row.getAttribute('data-rule')) !== i ? row : null;
  };
  const landsBefore = (row, e) => {
    const rect = row.getBoundingClientRect();
    return (e.clientY - rect.top) < rect.height / 2;
  };
  return gripDrag({
    title: 'Drag to reorder – rules are checked top to bottom',
    onStart: (e) => e.currentTarget.closest('.rule-row').classList.add('dragging'),
    onMove: (under, e) => {
      const row = rowUnder(under);
      if (row !== over) { clear(); over = row; }
      if (!row) return;
      const before = landsBefore(row, e);
      row.classList.toggle('drop-before', before);
      row.classList.toggle('drop-after', !before);
    },
    onEnd: (e) => { clear(); e.currentTarget.closest('.rule-row').classList.remove('dragging'); },
    onDrop: (under, e) => {
      const row = rowUnder(under);
      if (!row) return;
      const to = Number(row.getAttribute('data-rule'));
      const before = landsBefore(row, e);
      const positions = [...Array(slice.rules.length).keys()];
      moveAgainst(positions, i, to, before);
      const follow = (k) => positions.indexOf(k);
      const selected = /^rule:(\d+)$/.exec(state.sel || '');
      if (selected) state.sel = 'rule:' + follow(Number(selected[1]));
      if (state.editRule !== null) state.editRule = follow(state.editRule);
      patchSlice((b) => { moveAgainst(b.conditions, i, to, before); });
    },
  });
}

// ---------- removing things ----------
//
// Two gestures, and the difference is what is being removed.
//
// A *part* of something – a field, a rule, an instance the command
// reads, a change an event makes – goes on one click. It is a line in a
// list you are editing, the model still holds everything it was made
// of, and asking twice would make ordinary editing feel dangerous.
//
// A *definition* – a command, an event, an entity, a value type, a
// numbering, a whole model – asks once, and the button becomes its own
// confirmation rather than opening a dialog over the thing in question.
// The model refuses either way while anything still references it, so
// the question is only ever about work you meant to keep.
function removeButton(key, { label = '×', title, confirm = 'Really remove?', onRemove }) {
  if (state.confirmRemove === key) {
    return h('button', {
      class: 'btn tiny danger',
      onclick: () => { state.confirmRemove = null; onRemove(); },
    }, confirm);
  }
  // Not closeForms(): in the click-to-reveal variant that would close
  // the very row the confirmation lives in.
  return h('button', {
    class: 'btn tiny danger', title,
    onclick: () => { state.confirmRemove = key; render(); },
  }, label);
}

// An edit someone finished making is an edit, whether or not its
// button was pressed. `commitPendingField` is the whole of that rule:
// whatever row is half-way through being filled in – a field being
// named, a rule being picked, a change being described, a read being
// chosen – is committed the moment attention moves elsewhere. It rides
// `closeForms` – every gesture that leaves a row already calls it –
// rather than a blur handler, because a blur-time repaint tears the
// clicked control out from under the click that caused it, which is
// how gestures get eaten.
//
// Each kind of draft carries its own answer to "is this an edit yet?"
// as `ready()`: a field is one once it has a name; a picker row is one
// once it was *touched* and is complete – a row of untouched defaults
// is a proposal, and leaving a proposal alone is declining it, not
// accepting it. A draft that is not ready is abandoned silently,
// because backing away from a half-thought is what "never mind" looks
// like.
const PENDING_EDIT_KEYS = ['fieldDraft', 'changeDraft', 'ruleDraft'];
function commitPendingField() {
  for (const key of PENDING_EDIT_KEYS) {
    const draft = state[key];
    if (!draft || typeof draft.commit !== 'function') continue;
    if (typeof draft.ready !== 'function' || !draft.ready()) continue;
    state[key] = null;
    draft.commit();
  }
  // An open projection row saves as it is edited; whatever the short
  // typing pause has not yet flushed goes now, before any wipe closes
  // the row over it.
  autoSaveProjectionDraft();
}

// Escape's half of the bargain: every other way out commits, so the
// one that means "never mind" has to drop the pending edits *before*
// `closeForms` gets a chance to commit them.
function discardPendingEdits() {
  for (const key of PENDING_EDIT_KEYS) state[key] = null;
}

// The name / type / many / add row that four different lists all want.
// Enter anywhere in the row adds the field – the type select and the
// two checkboxes included, which is why the row itself listens rather
// than just the name field – the same as clicking the button. But the
// button is a convenience, not the gate: a named field is committed as
// soon as the row is left, however it is left – Enter, Tab out, a
// click elsewhere, or whatever gesture opens the next form (see
// `commitPendingField`). Backspace in an empty name field is the
// reverse: it pops the row just added, which is also how a commit that
// happened on the way out is taken back. Escape discards the
// half-typed name instead of committing it. An empty name field is
// where a list ends: Enter there with nothing typed means "done with
// these", which is `onEmptyEnter`'s to interpret.
//

// edit neither loses the typed text nor forgets that it is pending.
function propertyAdder(model, {
  placeholder = 'property name', label = '+ Add', type = 'string',
  onAdd, onRemoveLast, onEmptyEnter, draftKey = 'field',
  types = typeOptions, offerOptional = true, newType = null,
}) {
  const draft = state.fieldDraft && state.fieldDraft.key === draftKey
    ? state.fieldDraft
    : (state.fieldDraft = {
        key: draftKey, name: '', propertyType: type, isList: false, isOptional: false,
      });

  // current `onAdd`, not the one from a paint that no longer exists.
  draft.ready = () => !!draft.name.trim();
  draft.commit = () => {
    onAdd({
      name: toCamel(draft.name), propertyType: draft.propertyType,
      isOptional: draft.isOptional, isList: draft.isList,
    });
  };
  const add = () => {
    if (!draft.name.trim()) return toast('Give the field a name.', true);
    state.fieldDraft = null;
    draft.commit();
  };
  const input = h('input', {
    type: 'text', placeholder, class: 'flow-entry', value: draft.name,
    oninput: (e) => { draft.name = e.target.value; },
    onkeydown: (e) => {
      if (e.key === 'Backspace' && !draft.name && onRemoveLast) { e.preventDefault(); onRemoveLast(); return; }
      if (e.key === 'Escape') {
        // First Escape is about the field: drop what was typed so that
        // leaving cannot commit it, and step out. A second Escape then
        // backs out of the row, same as any other field.
        e.preventDefault();
        state.fieldDraft = null;
        e.target.value = '';
        e.target.blur();
        return;
      }
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') navFlow(e);
    },
  });
  // Self-focus only when the keyboard has nowhere better to be – on
  // first open the button this row replaced is gone, so focus has
  // fallen to the body. After a commit that happened because focus
  // went somewhere *else*, stealing it back is exactly the "focus is a
  // change of context" trap (WCAG 3.2.2), so the fresh row stays quiet.
  setTimeout(() => {
    const active = document.activeElement;
    if (!active || active === document.body) input.focus();
  }, 0);
  const root = h('div', {
    class: 'adder',
    onkeydown: (e) => {
      // Escape anywhere in the row – the type select and checkboxes
      // included – discards the pending name, so backing out through
      // any of the row's controls never commits on the way.
      if (e.key === 'Escape') { state.fieldDraft = null; return; }
      if (e.key !== 'Enter') return;
      e.preventDefault();
      if (!draft.name.trim() && onEmptyEnter) { onEmptyEnter(); return; }
      add();
    },
  },
    input,
    pick([...types(model), ...(newType ? [[NEW_DEFINITION, NEW_TYPE_LABEL]] : [])], draft.propertyType, (v) => {
      if (v === NEW_DEFINITION) return newType((typeName) => { draft.propertyType = typeName; });
      draft.propertyType = v;
    }),
    h('label', { class: 'tiny muted' },
      h('input', {
        type: 'checkbox', checked: draft.isList,
        onchange: (e) => { draft.isList = e.target.checked; },
      }), ' many'),
    offerOptional ? h('label', { class: 'tiny muted' },
      h('input', {
        type: 'checkbox', checked: draft.isOptional,
        onchange: (e) => { draft.isOptional = e.target.checked; },
      }), ' optional') : null,
    h('button', { class: 'btn', onclick: add }, label));
  // Tab reaches outside the row without any click for `closeForms` to
  // ride on, so leaving by keyboard is watched directly. The delay lets
  // a click that caused this blur finish against the DOM it started on;
  // if that click ran `closeForms`, the commit has already happened and
  // the draft is gone.
  root.onfocusout = () => setTimeout(() => {
    if (state.fieldDraft !== draft) return;
    if (root.isConnected && root.contains(document.activeElement)) return;
    commitPendingField();
  }, 100);
  return root;
}

// ---------- moving through a command's steps ----------
//
// One list, top to bottom, spanning every step on the page: the rows
// already declared – a property, a read, a rule, whatever a step
// holds – and each step's own "add another", its folded button while
// closed, its own entry field once open (see `adderSlot` and
// `propertyAdder`). Arrow keys walk it in either direction, crossing
// from one step into the next exactly where the page already draws
// the line between them – nothing here knows "trigger" from "rules",
// it only ever asks the document what comes next.
function flowStops() {
  const main = document.getElementById('main');
  if (!main) return [];
  return [...main.querySelectorAll('.qrow[tabindex], .flow-adder, .flow-entry')];
}
function navFlow(e) {
  const stops = flowStops();
  const at = stops.indexOf(document.activeElement);
  if (at < 0) return;
  const next = stops[at + (e.key === 'ArrowDown' ? 1 : -1)];
  if (next) { e.preventDefault(); next.focus(); next.scrollIntoView({ block: 'nearest' }); }
}
// Where to land after the stop at `index` is gone: whatever is now in
// its place, or the last stop if it was the very end of the list.
function focusFlowStopNear(index) {
  // The removal repaints the page, and if an adder stays open that
  // repaint mounts a fresh field which focuses itself the same way –
  // scheduled at the same 0ms delay, registered a moment later. A 0ms
  // timer of ours would lose that race every time; one tick later, its
  // self-focus has already happened and this is free to overrule it.
  setTimeout(() => {
    const stops = flowStops();
    if (!stops.length) return;
    const target = stops[Math.min(index, stops.length - 1)];
    if (target) { target.focus(); target.scrollIntoView({ block: 'nearest' }); }
  }, 1);
}

// ---------- editing a member ----------
//
// A property, a field, a payload entry, a projection parameter – all
// the same shape, all editable the same way: rename it, retype it, say
// whether there are many and whether it may be absent.
//
// Renaming goes through `renameMember`, which rewrites every reference
// in the same append; the rest is an ordinary body update. They are
// separate calls because they are separate kinds of change – a rename
// touches other definitions, a retype does not.
//
// Which member is open is held in one place, so opening a second one
// closes the first.
function editingMember(where, name) {
  return state.editMember && state.editMember.where === where && state.editMember.name === name;
}
function openMember(where, name) {
  closeForms();
  state.editMember = { where, name };
  render();
}

// A member – an event field, a command input, a composite's field, a
// projection parameter – is a name and a type and nothing else, so
// retyping one is the change itself. A projection's type is a bigger
// change, since what it starts from and how it is advanced both hang
// off it; that lives in `retypeProjection`, on the draft the editor
// holds.
function retypeMember(member, changes) {
  return { ...member, ...changes };
}

// The editable form of one member. `onReplace` receives the whole
// member back; `onRename` is given only the new name, because a rename
// is the model's job rather than a body edit.
//
// `allow` says which knobs this site has: a projection parameter is
// always a single required identifier, so it has no arity to set.
//
// `newType(choose)` adds a row to the type picker that creates a custom
// type and hands it to `choose`. `editType(typeName)`, given, offers to
// open the custom type the member is of – on a line of its own, worded
// as the type's, because changing it changes every use of the type and
// not this member. It is offered here and not on the row: on the row a
// pencil beside the type read as "edit this input".
function memberEditor(model, {
  member, where, types, allow = {}, onReplace, onRename, newType = null, editType = null,
}) {
  const close = () => { state.editMember = null; render(); };
  let name = member.name;
  const options = types || typeOptions(model);
  const doRename = () => {
    const next = toCamel(name);
    if (!next) return toast('Give it a name.', true);
    if (next === member.name) return close();
    state.editMember = { where, name: next };
    run(() => onRename(next));
  };

  return h('div', { class: 'member-editor' },
    h('div', { class: 'adder' },
      h('input', {
        type: 'text', value: member.name, style: 'width:190px',
        oninput: (e) => { name = e.target.value; },
        onkeydown: (e) => { if (e.key === 'Enter') { e.preventDefault(); doRename(); } },
      }),
      h('button', {
        class: 'btn tiny', title: 'Rename, rewriting every reference to it',
        onclick: doRename,
      }, 'Rename'),
      h('span', { class: 'muted tiny' }, 'is a'),
      pick([...options, ...(newType ? [[NEW_DEFINITION, NEW_TYPE_LABEL]] : [])], member.propertyType, (v) => {
        const retype = (typeName) => onReplace(retypeMember(member, { propertyType: typeName }));
        if (v === NEW_DEFINITION) return newType(retype);
        retype(v);
      }),
      allow.arity === false ? null : h('label', { class: 'tiny muted' },
        h('input', {
          type: 'checkbox', checked: !!member.isList,
          onchange: (e) => onReplace(retypeMember(member, { isList: e.target.checked })),
        }), ' many'),
      allow.arity === false ? null : h('label', { class: 'tiny muted' },
        h('input', {
          type: 'checkbox', checked: !!member.isOptional,
          onchange: (e) => onReplace(retypeMember(member, { isOptional: e.target.checked })),
        }), ' optional'),
      h('button', { class: 'btn ghost tiny', onclick: close }, 'Done')),
    editType && model['custom-type-definitions'][member.propertyType]
      ? h('div', { class: 'adder member-type' },
          h('span', { class: 'muted tiny' }, 'its type, ', h('span', { class: 'chip' }, readable(member.propertyType)),
            ', is a custom type –'),
          h('button', {
            class: 'btn tiny', type: 'button',
            title: 'Changes ' + readable(member.propertyType) + ' wherever it is used, not only here',
            onclick: () => editType(member.propertyType),
          }, 'Edit the type ' + readable(member.propertyType) + '…'))
      : null);
}

// Reads a typed literal out of what someone typed. `undefined` means
// it does not belong to the type, which is a refusal rather than a
// silent coercion.
function literalOfType(model, typeName, text) {
  const trimmed = (text || '').trim();
  const schema = underlyingSchema(model, typeName);
  const kind = schema && schema.type;
  if (kind === 'integer' || kind === 'number') {
    const n = Number(trimmed);
    return trimmed === '' || Number.isNaN(n) ? undefined : n;
  }
  if (kind === 'boolean') {
    if (/^(true|yes)$/i.test(trimmed)) return true;
    if (/^(false|no)$/i.test(trimmed)) return false;
    return undefined;
  }
  return trimmed;
}

// ---------- picking an operand ----------
//
// Most operands are chosen from what is in scope, but a literal is
// typed, so the picker carries one extra row for it. Choosing that row
// swaps in a text input; the text lives beside the choice in the
// draft, so a repaint between keystrokes does not lose it.
const LITERAL = ' literal';

// Reads the operand a draft field currently describes, or undefined
// when it describes nothing.
function draftOperand(draft, key) {
  const choice = draft[key];
  if (choice === undefined || choice === '') return undefined;
  if (choice !== LITERAL) return JSON.parse(choice);
  const text = (draft[key + 'Text'] || '').trim();
  if (text === '') return undefined;
  // Untyped here on purpose: the operand has no declared type of its
  // own, and the model checks it against whatever it is compared with.
  if (/^-?\d+(\.\d+)?$/.test(text)) return Number(text);
  if (/^(true|false)$/i.test(text)) return /^true$/i.test(text);
  return text;
}

// Sets a draft field from an operand that already exists, so opening
// an editor shows what is there rather than a blank.
function draftFromOperand(draft, key, operand) {
  if (operand === undefined) { draft[key] = ''; return draft; }
  if (operand !== null && typeof operand === 'object') {
    draft[key] = JSON.stringify(operand);
  } else {
    draft[key] = LITERAL;
    draft[key + 'Text'] = String(operand);
  }
  return draft;
}

// The draft a stored rule or guard opens as. An `equalsAny` right-hand
// side is a literal list; its entries seed the membership widget, not
// the picker. And a `contains` whose list is the payload's and whose
// one value is read is opened the way the wizard writes it – "is one
// of" that list – because a payload value is never what a rule is
// about, so opened as stored its left side would have nowhere to show.
function draftFromCondition(condition) {
  const { leftHandSide: left, rightHandSide: right } = condition;
  const swapped = condition.predicate === 'contains'
    && left !== null && typeof left === 'object' && 'parameterName' in left
    && right !== null && typeof right === 'object' && 'alias' in right;
  if (swapped) {
    const opened = { ...draftFromOperand({ predicate: 'equalsAny', negate: !!condition.negate }, 'left', right),
      right: '', rightList: JSON.stringify(left) };
    if (typeof condition.rejection === 'string') opened.rejection = condition.rejection;
    return opened;
  }
  const opened = draftFromOperand({ predicate: condition.predicate, negate: !!condition.negate }, 'left', left);
  if (typeof condition.rejection === 'string') opened.rejection = condition.rejection;
  if (Array.isArray(right)) {
    opened.right = '';
    opened.rightEntries = right.map((entry) => (entry !== null && typeof entry === 'object' ? entry : String(entry)));
  } else {
    draftFromOperand(opened, 'right', right);
  }
  return opened;
}

// `selected` and `intercept` are for a caller whose rows are not all
// operands – the rule editor's existence rows, which answer the
// predicate as well as the operand: it says which row is showing, and
// takes the pick when the row is one of its own.
//
// Without a placeholder the picker is not asking a question, and then
// the draft must hold whatever the closed face shows. A `<select>`
// already showing a row fires nothing when that row is picked, so a
// face showing row 0 over an empty draft is a row no one can choose –
// with one row, a dead end: "a value…" on show and no box to type in.
// So the draft takes the first row – a value before a "+ New…" door,
// the door only when it is all there is – and a lone row is not a picker at all, for the reason
// `operationControl` gives: the literal is just its box, anything else
// is the operand itself as text. Callers that pass a placeholder are
// asking, and are left to.
function operandPicker(choices, draft, key, {
  placeholder, allowLiteral = true, onNew, newLabel, selected, intercept,
} = {}) {
  const rows = [
    ...choices,
    ...(onNew ? [[NEW, newLabel || '+ New property…']] : []),
    ...(allowLiteral ? [[LITERAL, 'a value…']] : []),
  ];
  if (!placeholder) {
    const lone = rows.length === 1 && rows[0][0] !== NEW ? rows[0] : null;
    if (lone) draft[key] = lone[0];
    else if (!draft[key]) {
      const first = rows.find(([v]) => v !== NEW) || rows[0];
      if (first) draft[key] = first[0];
    }
    if (lone && lone[0] === LITERAL) return [literalInput(draft, key)];
    if (lone) {
      const [, text, icon, token] = lone;
      return [h('span', { class: token ? 'verb mono' : 'verb' }, iconPrefix(icon),
        token ? (token.before || '') + text + (token.after || '') : text)];
    }
  }
  const control = [pick(rows, selected !== undefined ? selected : draft[key], (v) => {
    if (onNew && v === NEW) return onNew();
    if (intercept && intercept(v)) return;
    draft[key] = v;
    // A pick is the modeler's hand on the row: from here on, leaving
    // it is finishing it, not declining it – see `commitPendingField`.
    draft.touched = true;
    render();
  }, placeholder)];
  if (draft[key] === LITERAL) control.push(literalInput(draft, key));
  return control;
}

function literalInput(draft, key) {
  return h('input', {
    type: 'text', style: 'width:110px', placeholder: 'a value…',
    value: draft[key + 'Text'] || '',
    oninput: (e) => { draft[key + 'Text'] = e.target.value; draft.touched = true; },
  });
}

// The right half of an `equalsAny` rule: membership over a literal
// list. Where the left side names an enum the members are checked
// off; anywhere else the list is typed, one row per value. Entries
// live in `draft.rightEntries` – enum-member references as objects,
// typed text as strings – and are coerced on save, the same way
// `draftOperand` coerces a literal.
function membershipControls(draft, enumMembers) {
  const entries = draft.rightEntries || (draft.rightEntries = []);
  if (enumMembers) {
    return enumMembers.map((member) => h('label', { class: 'tiny' },
      h('input', {
        type: 'checkbox',
        checked: entries.some((entry) =>
          entry !== null && typeof entry === 'object' && entry.enumMember === member),
        onchange: (e) => {
          const at = entries.findIndex((entry) =>
            entry !== null && typeof entry === 'object' && entry.enumMember === member);
          if (e.target.checked && at === -1) entries.push({ enumMember: member });
          if (!e.target.checked && at !== -1) entries.splice(at, 1);
          draft.touched = true;
          render();
        },
      }), ' ' + readable(member)));
  }
  return [
    ...entries.map((entry, i) => h('span', {},
      h('input', {
        type: 'text', style: 'width:110px', placeholder: 'value',
        value: entry !== null && typeof entry === 'object' ? JSON.stringify(entry) : String(entry),
        oninput: (e) => { entries[i] = e.target.value; draft.touched = true; },
      }),
      h('button', {
        class: 'btn ghost tiny',
        onclick: () => { entries.splice(i, 1); draft.touched = true; render(); },
      }, '×'))),
    h('button', {
      class: 'btn ghost tiny',
      onclick: () => { entries.push(''); draft.touched = true; render(); },
    }, '+ value'),
  ];
}

// Everything readable at a given point in a command's boundary: the
// payload, and the bindings declared *above* this one. A binding may
// only draw from what came before it, so the list is what makes that
// rule visible instead of only enforced.
function operandChoicesAbove(model, slice, index) {
  const out = [...payloadChoices(model, slice.payload)];
  // The projections this command already reads in place (8.0) – a rule
  // about one is opened again with it on offer, and a second rule may
  // read the same thing. A binding's own operands come only from above
  // it, so these stay out of that scope.
  if (index === undefined) {
    for (const { read } of inlineReads(slice.body)) {
      out.push([JSON.stringify(read), operandWords(read)]);
    }
  }
  slice.reads.slice(0, index === undefined ? undefined : index).forEach((b) => {
    if (b.projection) {
      out.push([JSON.stringify({ alias: b.alias }), propertyWords(b.alias)]);
      return;
    }
    const entity = model['entity-definitions'][b.entity];
    (entity ? entity.properties : []).forEach((p) =>
      out.push([JSON.stringify({ alias: b.alias, property: p.name }),
        memberWords(b.alias, p.name), entityIcon(model, b.entity)]));
  });
  return out;
}

// Narrows operand choices to one type, for the slots that know exactly
// what they need – an entity's identifier, a projection's parameter, an
// argument. The same rule the emission fields and the rule
// editor's right side already apply: a course is never identified by a
// student id, so the picker does not offer it. `list: true` admits
// list-typed operands alongside singular ones – on an id slot a list
// of the right type is the fan-out, not a mismatch.
function choicesOfType(model, slice, choices, propertyType, { list } = {}) {
  return choices.filter(([v]) => {
    const resolved = resolveOperandType(JSON.parse(v),
      { boundary: slice.reads, commandProperties: slice.payload, model });
    return resolved && resolved.propertyType === propertyType
      && (list || !resolved.isList);
  });
}

// The projections a rule's right side could read in place – one row
// per way of filling every tag and argument from `choices`, so "the
// developer's seniority is at least the project's required seniority"
// needs no rule about the project first. Since rules read projections
// in place, nothing else would put a second projection in scope. Those
// an entity property binds are read through the entity instead, and a
// read's values are never themselves reads.
function projectionReadChoices(model, slice, choices) {
  const MAX_ROWS = 24;
  const values = choices.filter(([v]) => operandSource(JSON.parse(v)) !== 'projection-read');
  const boundByEntity = entityBoundProjections(model);
  const out = [];
  for (const name of Object.keys(model['projection-definitions']).sort()) {
    if (boundByEntity.has(name)) continue;
    const projection = model['projection-definitions'][name];
    const slots = [
      ...projectionTagParams(projection).map((tag) => ['tags', tag.name, tag.tagType]),
      ...projectionSlots(projection).map((slot) => ['arguments', slot.name, slot.propertyType]),
    ];
    let reads = [{ projection: name }];
    for (const [key, slotName, type] of slots) {
      const offered = choicesOfType(model, slice, values, type).map(([v]) => JSON.parse(v));
      reads = reads.flatMap((read) => offered.map((operand) =>
        ({ ...read, [key]: { ...(read[key] || {}), [slotName]: operand } })));
    }
    for (const read of reads) {
      if (out.length >= MAX_ROWS) return out;
      out.push([JSON.stringify(read), 'read' + GROUP_SEP + operandWords(read)]);
    }
  }
  return out;
}

// ---------- small helpers ----------

// An event edited on the pages keeps its tags in step with its fields
// (`withEditedTags`): what an author adds of a tag type is listed, and
// a path the edit emptied is dropped – visibly, on the event's own row.
function patch(kind, name, mutate) {
  const model = activeModel();
  const previous = model[DEF_COLLECTIONS[kind]][name];
  let body = deepClone(previous);
  mutate(body);
  if (kind === 'event-definition') body = withEditedTags(model, previous, body);
  run(() => updateDefinition(kind, model.id, name, body));
}
const patchSlice = (mutate) => patch('command-definition', state.slice, mutate);

// One form for renaming any definition kind: PascalCases the input,
// clears its own state flag, routes through `renameDefinition` (which
// rewrites every reference in the same append) and repoints whatever
// view state was keyed by the old name via `after`. `warn` runs first
// for the kinds that owe one – an event read by scripted handlers.
function renameDefinitionForm(model, kind, name, { stateKey, warn, after } = {}) {
  return inlineForm({
    question: 'Rename – every reference is rewritten with it', submitLabel: 'Rename',
    value: readable(name),
    onSubmit: (v) => {
      const next = toPascal(v);
      state[stateKey] = null;
      if (next && next !== name) {
        run(() => {
          if (warn) warn(next);
          renameDefinition(kind, model.id, name, next);
          if (after) after(next);
        });
      } else render();
    },
    onCancel: () => { state[stateKey] = null; render(); },
  });
}

// A name as a modeler reads it, with the stored identifier alongside
// once they have asked to see that sort of thing.
function named(name, cls) {
  return h('span', { class: cls || '' }, readable(name),
    h('span', { class: 'tech' }, name));
}

// A thing has one page, and every mention of it is the way there. It
// replaces what it was next to rather than sliding in over it: two
// things half on screen is how the old panel got unreadable, and the
// rail keeps the way back.
function openEntity(name) {
  closeForms();
  state.entitiesCollapsed = false;
  state.view = 'entity';
  state.entity = name;
  render();
}

// Every mention of a thing, anywhere: its mark, its name, and the way
// in. One shape across all four kinds, so the mark is worth learning
// and a chip fix – a title, a keyboard affordance – lands everywhere
// at once. What varies per kind is the mark and the way in.
function refChip(name, { cls, icon, onOpen, text }) {
  return h('span', {
    class: cls, title: 'Open ' + readable(name),
    onclick: onOpen,
  }, icon ? h('i', { class: 'ic' + fallbackIconClass(icon) }, icon) : null,
    text === undefined ? readable(name) : text);
}

function entityRef(model, name, { cls = 'chip entity', text } = {}) {
  return refChip(name, { cls, icon: entityIcon(model, name), onOpen: () => openEntity(name), text });
}

// An event has its own page too, for the same reason an entity does:
// it is named from more than one place – a command's publish list, an
// entity's or a projection's handlers, a scenario's Given – and every
// one of those is the way there.
function goToEvent(name) {
  closeForms();
  state.view = 'events';
  state.openEvent = name;
  state.land = `[data-key="${CSS.escape('event:' + name)}"]`;
  render();
}
function eventRef(model, name, { cls = 'chip event linkable', text } = {}) {
  return refChip(name, { cls, icon: eventIcon(model, name), onOpen: () => goToEvent(name), text });
}

// A custom type has no page of its own – it lives as a card in Custom
// Types – so opening one means landing on that card rather than
// switching to a dedicated view the way an entity or event does.
function goToCustomType(name) {
  closeForms();
  state.view = 'types';
  state.land = `[data-key="${CSS.escape('type:' + name)}"]`;
  render();
}

function goToCommand(name) {
  closeForms();
  state.view = 'slice';
  state.slice = name;
  state.tab = 'definition';
  render();
}
function commandRef(model, name, { cls = 'chip command linkable', text } = {}) {
  return refChip(name, { cls, icon: commandIcon(model, name), onOpen: () => goToCommand(name), text });
}

function goToProjection(name) {
  openProjection(activeModel(), name);
  render();
}

// The whole machine, from the row that shows a shrunk one. Lands on the
// entity's own band rather than the top of the page – a model with six
// lifecycles would otherwise answer "it is somewhere below".
function goToLifecycles(entityName) {
  closeForms();
  state.view = 'lifecycles';
  state.land = `[data-key="${CSS.escape('lifecycle:' + entityName)}"]`;
  render();
}
// A projection has no mark of its own – nothing passes an icon.
function projectionRef(model, name, { cls = 'chip projection linkable', text } = {}) {
  return refChip(name, { cls, onOpen: () => goToProjection(name), text });
}

// A specific scenario, wherever it is shown, is always reached the
// same way – see `problems`, which this mirrors.
function goToScenario(model, key) {
  const body = model['scenario-definitions'][key];
  if (!body) return;
  closeForms();
  state.view = 'slice';
  state.slice = body.command;
  state.tab = 'scenarios';
  state.openScenarios.add(key);
  render();
}
// A projection, opened wherever it is listed: on its entity's page when
// something binds it, on Projections when nothing does. Derived rather
// than stored, so a projection moves between the two on its own when a
// binding is added or dropped.
// Does not repaint: every caller sets more state after it, and two
// repaints for one gesture is how focus gets dropped – the second one
// measures where focus went during the first rather than where it was.
function openProjection(model, projection, { tab = 'definition' } = {}) {
  const body = model['projection-definitions'][projection];
  if (!body) return false;
  // A row already open on this projection keeps whatever is half
  // written in it: arriving at one of its scenarios is not a reason to
  // discard an edit to the definition above them.
  const open = state.projDraft && state.projDraft.name === projection ? state.projDraft : null;
  closeForms();
  const bound = boundAs(model, projection)[0];
  if (bound) {
    state.view = 'entity';
    state.entity = bound.entity;
  } else {
    state.view = 'projections';
  }
  state.projDraft = open || { name: projection, body: projectionDraftFrom(body) };
  state.projTab = tab;
  return true;
}

// A scenario is opened in the Checks tab of the first projection it
// reads. Every projection it reads lists it – one Given asserting four
// values is one scenario, shown under all four – so any of them would
// do; the first is simply the one this picks.
function goToProjectionScenario(model, key) {
  const body = model['projection-scenario-definitions'][key];
  if (!body) return;
  if (!openProjection(model, body.projection, { tab: 'checks' })) return;
  state.openProjectionScenarios.add(key);
  render();
}

function typeChoices(model) {
  return allTypeNames(model);
}
function typeOptions(model) {
  return typeRows(model, typeChoices(model));
}

// Type names as picker rows. Once a custom type is among them the rows
// fall into two sections, Built-in and Custom, each custom row trailed
// by what it is; while none is, the built-ins stay one flat list – a
// heading over everything tells nothing apart.
function typeRows(model, names) {
  if (names.every((t) => SIMPLE_TYPES.includes(t))) return names.map((t) => [t, readable(t)]);
  return names.map((t) => (SIMPLE_TYPES.includes(t)
    ? [t, readable(t), null, { section: 'Built-in' }]
    : [t, readable(t), null, { section: 'Custom', hint: customTypeWord(model, t) }]));
}

// The word a custom type is created under (`newCustomTypeButtons`).
function customTypeWord(model, typeName) {
  const cls = classifyType(model, typeName);
  if (cls.kind !== 'value') return null;
  if (cls.composite) return 'record';
  if (cls.isTag) return 'tag';
  return enumMembersFor(model, typeName) ? 'enum' : 'value';
}

// An option built as "🔖 Name" reads fine, but a native <option> has
// no separate accessible label – arrow-key type-ahead searches the
// same text a screen reader gets, so it can only ever match the first
// character actually typed, which there is the icon. So a caller with
// a mark passes it as the option's third element, and `pick` puts the
// name first in the text with the mark in its own trailing span (the
// customizable-<select> CSS in shared.css puts it back in front
// visually, where the browser has one). Passed, never
// detected: an earlier design regex-matched an emoji prefix out of
// the text, which tore modifier sequences ("👮🏻‍♀️") into parts and
// let a mark that is not an emoji at all ("﹟" is one) slip past – a
// mark is whatever was typed, so only the caller knows where it ends.

// The same "alias · property" text that makes a flat list readable –
// "given · course id", "course · capacity", "status · Existent" –
// says exactly where an <optgroup> belongs: one per alias, holding
// just the properties, so a list naming three things a command read
// stops looking like nine unrelated rows. A prefix with only one
// property under it stays a plain option in its full "alias ·
// property" form – a group of one is not a group, and the context
// would otherwise be lost.
const GROUP_SEP = ' · ';

// A token option – a path into the event, not a name – is the one kind
// the text convention cannot express: it groups by what it *is*
// (`event`, `successor`) rather than by a prefix of its text, and the
// open list may show it short (`capacity`, under `event`) while
// anywhere it stands alone it must read whole (`event.data.capacity`).
// So a caller passes it as an option's fourth element,
// `{ group, before, after }`: `pick` puts the context in `.ctx` spans
// around the name, which the customizable-<select> CSS hides in the
// open list and shows in the closed face. Without that CSS the
// option's text is the whole token, which is also what type-ahead
// and a screen reader get.
//
// A section option – a fourth element `{ section, hint }` – groups by a
// heading the caller names (`typeRows`: Built-in, Custom) and may carry
// a hint, a word trailing the name in the open list (`tag`, `enum`) that
// the closed face leaves out.
//
// Three rows are not values and are drawn so: the placeholder (a
// question not answered yet) is muted in the closed face and absent from
// the open list, since choosing it would answer nothing; a row valued
// '' (`none`, `nothing` – no value, on purpose) is a real choice, muted
// and ruled off from the values; and a `NEW`/`NEW_DEFINITION` row is an
// action, ruled off and in the accent. A picker with nothing to offer is
// disabled – its placeholder says what it waits on.
function pick(options, value, onchange, placeholder) {
  const rows = options.map((o) => (Array.isArray(o) ? o : [o, o]));
  const sel = h('select', { onchange: (e) => onchange(e.target.value), disabled: !rows.length });
  // Selected outright when nothing else is: left unselected, a disabled
  // first option hands the selection to the first real one.
  if (placeholder) {
    sel.appendChild(h('option', {
      value: '', class: 'placeholder', disabled: true, hidden: true,
      selected: !rows.some(([v]) => v === value),
    }, placeholder));
  }

  const buckets = new Map(); // key -> [{v, text, icon, token, hint}]
  const sequence = []; // {row} | {prefix} | {token group} | {section}, in first-seen order
  const bucket = (key, entry) => {
    if (!buckets.has(key)) { buckets.set(key, []); sequence.push({ ...entry, key }); }
    return buckets.get(key);
  };
