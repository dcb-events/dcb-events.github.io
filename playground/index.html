  .sc-footer .btn { opacity: .55; }
  .sc-footer .btn:hover { opacity: 1; }

  .sc-body { margin-top: 9px; padding-top: 9px; border-top: 1px dashed var(--border); }
  .sc-line { font-family: var(--mono); font-size: 11.5px; line-height: 1.7; }
  .sc-line .y { color: var(--event-text); }
  .sc-line .c { color: var(--command); }
  .sc-line .k { color: var(--muted); }
  .sc-body .card { font-family: var(--mono); font-size: 11.5px; line-height: 1.7; margin-top: 4px; }
  .sc-body .card .k { color: var(--muted); }
  .sc-body .card .t { color: var(--entity-text); }
  .sc-body .card .y { color: var(--event-text); }

  /* Two outcomes side by side, because the question is which of them
     you meant – not which of them is correct. */
  .drift { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .drift .adder { grid-column: 1 / -1; }
  @media (max-width: 720px) { .drift { grid-template-columns: 1fr; } }

  .sc-editor { margin-top: 9px; }
  .sc-step { margin-top: 6px; }
  .vpayload, .vgroup { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: flex-start; }
  .vfield { display: flex; flex-direction: column; gap: 2px; }
  .vlabel { font-size: 11px; color: var(--muted); }
  .vwrap { display: inline-flex; }
  .vin {
    font: inherit; font-size: 12px; padding: 3px 7px;
    border: 1px solid var(--border); border-radius: 5px;
    background: var(--surface); color: var(--text); min-width: 110px;
  }
  .vin:focus { outline: none; border-color: var(--accent); }
  .vin.tiny-in { min-width: 70px; width: 70px; }
  .vlist { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
  .vrow { display: flex; gap: 5px; align-items: flex-start; }
  .vopt { display: inline-flex; gap: 5px; align-items: center; min-height: 25px; }
  .vopt > label { display: inline-flex; gap: 3px; align-items: center; white-space: nowrap; }
  .vgroup {
    border: 1px dashed var(--border); border-radius: 5px; padding: 5px 8px;
  }

  /* ---------- sandbox ----------
     The page is the viewport, in fixed bands: header with the driver,
     the timeline, and the panel of Watched, Decision and Store tabs (the
     one band that scrolls). See `renderSandbox`. */
  .slice.sandbox {
    max-width: none; padding: 0; display: flex; flex-direction: column;
    height: calc(100dvh - var(--topbar-h));
  }
  .slice.sandbox > * { flex: none; }
  .slice.sandbox > .xnotice { margin: 12px 24px 0; }
  .slice.sandbox > header {
    position: static; margin: 0; padding: 10px 24px; box-shadow: none;
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  }
  .slice.sandbox > header .name { display: flex; align-items: center; gap: 6px; }
  .sbx-driver {
    flex: 1 1 520px; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 5px 6px 5px 10px; border: 1px solid var(--border-strong); border-radius: var(--radius);
    background: var(--surface);
  }
  .sbx-driver .grow { flex: 1; }

  .sbx-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; align-items: start; }
  .sbx-tile { margin: 0; min-width: 0; }
  .sbx-tile.changed { border-color: var(--accent); }
  .sbx-tile .val { font-size: 15px; font-weight: 600; color: var(--text); }
  .sbx-delta { font-size: 11px; color: var(--muted); }
  .sbx-delta.changed { color: var(--accent); }
  .sbx-hist { display: block; margin-top: 6px; }
  .sbx-hist svg { display: block; width: 100%; height: 26px; overflow: visible; }
  .sbx-hist line, .sbx-hist polyline { fill: none; vector-effect: non-scaling-stroke; }
  .sbx-hist .rest { stroke: var(--border-strong); stroke-width: 1.5; }
  .sbx-hist .played { stroke: var(--projection); stroke-width: 2; }
  .sbx-hist .head { stroke: var(--accent); stroke-width: 2; }

  /* The panel under the timeline: Watched, Decision and Store as tabs,
     the body scrolling inside the rest of the page's height. */
  .slice.sandbox > .sbx-panel { flex: 1 1 auto; min-height: 140px; display: flex; flex-direction: column; }
  .sbx-tabs { display: flex; align-items: center; gap: 2px; padding: 0 20px; border-bottom: 1px solid var(--border);
              background: var(--surface); flex: none; }
  .sbx-tabs .grow { flex: 1; }
  .sbx-tab { border: 0; background: none; font: inherit; font-size: 13px; padding: 9px 12px; color: var(--muted);
             border-bottom: 2px solid transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .sbx-tab.on { color: var(--accent-strong); border-bottom-color: var(--accent); font-weight: 600; }
  .sbx-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .sbx-badge { font-size: 11px; font-weight: 600; padding: 0 7px; border-radius: 10px;
               background: var(--accent-soft); color: var(--accent-strong); }
  .sbx-badge.changed { background: var(--changed-soft); color: var(--changed); }
  .sbx-panel-body { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 14px 24px; }
  .sbx-cols { display: flex; flex-wrap: wrap; gap: 0 28px; }
  .sbx-col { flex: 1 1 300px; min-width: 0; }
  .sbx-col > h4 { margin: 0 0 8px; }
  .sbx-calls { display: flex; flex-direction: column; gap: 8px; }
  .sbx-call { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 8px 10px;
              border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  .sbx-call.reads:hover, .sbx-call.reads:focus-visible { border-color: var(--accent); outline: none;
              box-shadow: 0 0 0 3px var(--accent-soft); }
  .sbx-call .num { width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft);
                   color: var(--accent-strong); font: 600 11px/22px var(--mono); text-align: center; }
  .sbx-call .body { display: flex; flex-direction: column; gap: 6px; min-width: 0; font-family: var(--mono); font-size: 11.5px; }
  .sbx-call .verb { font-weight: 600; color: var(--accent-strong); }
  .sbx-call .ev-line { display: flex; flex-wrap: wrap; gap: 4px; align-items: baseline; }
  .smark.sbx-hit { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-strong); }
  .sbx-upcoming { opacity: .4; }

  /* The timeline. Every lane, the ruler, the band and the playhead
     place things by index times the pitch, so all of them agree on
     where event n is without measuring anything. */
  .sbx-dock { border-bottom: 1px solid var(--border-strong); background: var(--surface); }
  .sbx-transport {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 7px 24px; border-bottom: 1px solid var(--border);
  }
  .sbx-transport .grow { flex: 1; }
  .sbx-title {
    font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--accent-strong);
  }
  /* Takes the room left over and gives it up first: a long event name
     is cut short rather than pushing the lane switch onto a line of
     its own. */
  .sbx-at {
    flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 6px;
    overflow: hidden; white-space: nowrap;
  }
  .sbx-at > * { flex: none; }
  .sbx-at > :last-child { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; }
  .sbx-lanes { display: inline-flex; align-items: center; gap: 6px; }
  .sbx-transport .btn[aria-pressed="true"] {
    border-color: var(--accent); color: var(--accent); background: var(--accent-soft);
  }
  .sbx-none { padding: 12px 24px; }
  /* Scrolls both ways: down through the lanes, along through the run.
     The labels stay put on the left, over the marks scrolling under
     them; the right padding is the last column's, so the final mark is
     not flush against the edge. */
  .slanes {
    max-height: min(240px, 30vh); overflow: auto; padding: 4px 0 10px;
    cursor: grab; touch-action: pan-x pan-y; -webkit-user-select: none; user-select: none;
  }
  .slanes:active { cursor: grabbing; }
  .slanes:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .slanes-in { position: relative; --lw: 174px; width: max-content; min-width: 100%; }
  /* One lane needs no names: the label column shrinks to the gutter,
     and the room it gave back goes to bigger marks. */
  .slanes-in.compact { --lw: 24px; }
  .slanes-in.compact .slane:not(.ruler) { height: 40px; }
  .slanes-in.compact .slabel { padding: 0; }
  .slanes-in.compact .smark { width: 26px; height: 26px; border-radius: 6px; font-size: 13px; }
  .slane {
    position: relative; display: grid;
    grid-template-columns: var(--lw) calc(var(--n) * var(--pitch) + 24px);
    align-items: center; height: 22px;
  }
  .slane + .slane { border-top: 1px solid var(--border); }
  .slabel {
    position: sticky; left: 0; z-index: 2; align-self: stretch;
    display: flex; align-items: center; box-sizing: border-box; padding: 0 10px 0 24px;
    background: var(--surface); font-family: var(--mono); font-size: 11px; color: var(--muted);
    overflow: hidden; white-space: nowrap;
  }
  .slabel.watched { color: var(--text); font-weight: 600; }
  .strack { position: relative; height: 100%; }
  .stick {
    position: absolute; top: 3px; bottom: 3px; border-left: 1px solid var(--border);
    padding-left: 3px; font-family: var(--mono); font-size: 10px; line-height: 16px; color: var(--muted);
  }
  .smark {
    position: absolute; top: 50%; transform: translate(-50%, -50%);
    width: 17px; height: 17px; border-radius: 5px; box-sizing: border-box;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; line-height: 1; color: var(--text); border: 1px solid var(--event);
  }
  .smark.fallback-event { color: var(--event-text); }
  .smark.current { border-color: var(--accent); }
  .slanes-in.compact .smark.current { border-width: 2px; }
  /* In one lane, a watch's tags have no bold label to show they are
     followed – the marks carrying them get a dot instead. */
  .swatched {
    position: absolute; bottom: 2px; width: 5px; height: 5px; margin-left: -2.5px;
    border-radius: 50%; background: var(--projection); pointer-events: none;
  }
  /* Still on the timeline – scrubbing back does not shorten the run,
     it only looks away from the rest of it. */
  .smark.upcoming, .swatched.upcoming { opacity: .3; }
  .sband, .splayed, .splayhead { position: absolute; top: 0; bottom: 0; pointer-events: none; }
  /* The part of the run already played, under the band of the step. */
  .splayed {
    left: var(--lw); width: calc(var(--pitch) * var(--pos));
    background: color-mix(in srgb, var(--accent-soft) 45%, transparent);
  }
  .sband {
    left: calc(var(--lw) + var(--pitch) * var(--a));
    width: calc(var(--pitch) * var(--w)); background: var(--accent-soft);
  }
  /* Over the marks, under the labels. */
  .splayhead {
    left: calc(var(--lw) + var(--pitch) * var(--pos)); width: 2px; margin-left: -1px;
    background: var(--accent); border-radius: 2px; z-index: 1;
  }
  .splayhead::before {
    content: ""; position: absolute; top: 2px; left: 50%; width: 12px; height: 12px;
    margin-left: -6px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 2px var(--surface);
  }
  /* The page is the viewport here; the footer would be the one thing
     below it, and so the reason the page scrolls at all. */
  @media (min-width: 761px) {
    body:has(.slice.sandbox) .site-footer { display: none; }
  }
  @media (max-width: 760px) {
    .slice.sandbox { height: auto; }
    .sbx-panel-body { overflow: visible; }
    .slice.sandbox > header, .sbx-tabs, .sbx-panel-body, .sbx-transport { padding-left: 16px; padding-right: 16px; }
    .slanes-in { --lw: 108px; }
    .slanes-in.compact { --lw: 16px; }
    .slabel { padding-left: 16px; }
    .sbx-at { flex-basis: 100%; order: 1; }
  }

  .pin {
    background: none; border: none; cursor: pointer; padding: 0 5px 0 0;
    color: var(--muted); font-size: 12px;
  }
  .pin:hover { color: var(--event-text); }
  .pin.on { color: var(--event-text); }

  /* The two overview pages read across every command at once rather
     than down one of them, so they earn more width than an ordinary
     slice – capped, not unbounded, so a model with many events still
     scrolls its matrix instead of running the page edge to edge. */
  .slice.wide { max-width: 1100px; }

  /* ---------- coupling ---------- */
  .coupling-legend { display: flex; align-items: center; gap: 18px; margin-bottom: 14px; flex-wrap: wrap; }
  .coupling-legend-item { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
  .coupling-mark { display: inline-block; width: 13px; height: 13px; border-radius: 50%; box-sizing: border-box; }
  .coupling-mark.produces { background: var(--command); }
  .coupling-mark.consumes { border: 2px solid var(--event); }
  .coupling-mark.both { background: var(--command); border: 2px solid var(--event); }
  .coupling-scroll { overflow-x: auto; overflow-y: hidden; padding-bottom: 6px; }
  .coupling-grid {
    display: grid; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); overflow: hidden;
  }
  .coupling-corner { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  /* Read normally – left to right, upright – rather than rotated:
     sideways text reads slower at any length, and rotating it only
     traded a wide header for a very tall one. Wrapping across a few
     lines instead costs far less height for a typical name, and the
     row still sizes itself to the longest one – nothing here needs
     to estimate a pixel height in JS to avoid clipping. A name long
     enough to still run past a handful of lines is clamped with an
     ellipsis; the full name is always one hover away. */
  .coupling-colhead {
    position: relative; border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border); background: var(--bg); cursor: pointer;
    display: flex; align-items: flex-end; justify-content: center;
    padding: 10px 6px; text-align: center;
  }
  .coupling-colhead:hover { background: var(--event-soft); }
  .coupling-colhead.cluster-start { border-left: 2px solid var(--border-strong); }
  .coupling-colhead span {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5;
    overflow: hidden; font-family: var(--mono); font-size: 11px; line-height: 1.4;
    color: var(--text);
  }
  .coupling-grouprow {
    grid-column: 1 / -1; padding: 5px 12px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    background: var(--bg); border-bottom: 1px solid var(--border);
  }
  .coupling-rowlabel {
    display: flex; align-items: center; padding: 0 12px; font-size: 12px;
    border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
    background: var(--surface); min-height: 40px; cursor: pointer;
  }
  .coupling-rowlabel:hover { color: var(--accent); background: var(--accent-soft); }
  .coupling-cell {
    position: relative; display: flex; align-items: center; justify-content: center;
    border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
    min-height: 40px;
  }
  .coupling-cell.cluster-start { border-left: 2px solid var(--border-strong); }

  /* ---------- overview ----------
     The page a model opens on: what it holds, counted, then every
     command on one row. Nothing here edits; a count and a name are
     only the way to the page that holds them. */
  .overview-stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(124px, 1fr));
    gap: 10px; margin-bottom: 26px;
  }
  .overview-stat {
    display: flex; flex-direction: column; gap: 1px; text-align: left;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 14px; font: inherit; color: inherit;
  }
  a.overview-stat { text-decoration: none; }
  a.overview-stat:hover { border-color: var(--border-strong); }
  .overview-stat .label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  /* Only a count of one kind of definition carries that kind's colour. */
  .overview-stat.kind .label::before {
    content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--kind);
  }
  .overview-stat .count { font-size: 24px; font-weight: 600; line-height: 1.3; }
  .overview-stat .sub { font-size: 12px; color: var(--muted); }
  .overview-section { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .overview-commands {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    overflow-x: auto;
  }
  .overview-row {
    display: grid; gap: 12px; align-items: center; min-width: 640px;
    grid-template-columns: minmax(170px, 1.5fr) minmax(170px, 1.6fr) minmax(100px, .8fr) minmax(160px, 1.4fr);
    padding: 9px 16px; border-bottom: 1px solid var(--border);
  }
  .overview-row:last-child { border-bottom: 0; }
  .overview-row.head {
    padding-top: 8px; padding-bottom: 8px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
  }
  .overview-feature {
    min-width: 640px; padding: 9px 16px 5px; font-size: 12px; font-weight: 600;
    color: var(--muted); background: var(--bg); border-bottom: 1px solid var(--border);
  }
  .overview-cmd { font-weight: 600; color: var(--command); text-decoration: none; }
  .overview-cmd:hover { text-decoration: underline; }
  .overview-chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .overview-rules { font-size: 12px; font-weight: 600; color: var(--rule); }

  /* ---------- rule map ---------- */
  .rulemap-feature { margin: 22px 0 10px; font-size: 13px; color: var(--muted); }
  .rulemap-feature:first-child { margin-top: 0; }
  .rulemap-row { display: flex; align-items: flex-start; gap: 12px; }
  .rulemap-cmd { flex: 0 0 190px; padding-top: 2px; }
  .rulemap-arrow { flex: 0 0 16px; color: var(--muted); padding-top: 6px; text-align: center; }
  .rulemap-rules { flex: 1 1 auto; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .rulemap-events { flex: 0 0 180px; display: flex; flex-direction: column; gap: 6px; }
  .rulemap-rule {
    border-left: 3px solid var(--rule); background: var(--rule-soft);
    border-radius: 0 6px 6px 0; padding: 6px 10px; font-size: 12px; line-height: 1.5;
  }

  /* ---------- event model ----------
     A band of lanes like a lifecycle's: cards placed from computed
     geometry, the wires one SVG laid under them. */
  .em-scroll { overflow-x: auto; padding-bottom: 6px; }
  .em-band { position: relative; }
  .em-lane { position: absolute; left: 0; right: 0; border-top: 1px solid var(--border); }
  .em-lane.payload { background: var(--surface); }
  .em-lane.decide { background: var(--command-soft); }
  .em-lane.events { background: var(--event-soft); }
  .em-lane.events + .em-lane.events { border-top-style: dashed; }
  .em-lane-label {
    position: absolute; left: 12px; width: 120px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .07em; color: var(--muted); line-height: 1.4;
  }
  .em-lane-label .tech { display: block; margin: 2px 0 0; font-size: 11px; text-transform: none; letter-spacing: 0; }
  .em-wires, .em-wires svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .em-wires { pointer-events: none; }
  .em-card {
    position: absolute; box-sizing: border-box; padding: 8px 10px; border-radius: 6px;
    border: 1px solid var(--border); font-size: 13px; line-height: 18px; overflow: hidden;
  }
  .em-card .title { font-weight: 600; cursor: pointer; }
  .em-card .title:hover { text-decoration: underline; }
  .em-card .line { font-size: 12px; line-height: 16px; color: var(--muted); }
  .em-card.payload { background: var(--surface); border-color: var(--border-strong); }
  .em-card.payload .field { font-family: var(--mono); font-size: 11px; line-height: 20px; color: var(--muted); display: flex; gap: 6px; }
  .em-card.payload .field::after { content: ""; flex: 1; border-bottom: 1px solid var(--border-strong); margin-bottom: 5px; }
  .em-card.command { background: var(--surface); border-color: var(--command); }
  .em-card.command .title { color: var(--command); }
  .em-card.command .rules { font-size: 12px; font-weight: 600; color: var(--rule); }
  .em-card.read { background: var(--entity-soft); border-color: var(--entity); }
  /* The orange and green tokens are fills; as text on a light card they
     fall short of legible, so light mode takes the darker shade the
     chips use, and dark mode the token, which is already light. */
  .em-card.read .title { color: #15803d; }
  body.f-dark .em-card.read .title { color: var(--entity-text); }
  .em-card.event { background: var(--surface); border-color: var(--event); }
  .em-card.event .title { color: #c2410c; }
  body.f-dark .em-card.event .title { color: var(--event-text); }
  .em-card.event .line { font-family: var(--mono); font-size: 11px; }

  /* ---------- lifecycles ----------
     States as bubbles on an open band, one band per entity; the wires
     are an SVG laid under the nodes, drawn from the same computed
     geometry the nodes are placed by. The commands allowed at a state
     wait in a popover until the state is hovered, focused or pinned. */
  .lc-machine { margin-bottom: 6px; }
  .lc-cluster { display: flex; align-items: center; gap: 9px; margin: 14px 0 0; }
  .lc-cluster .lc-ename {
    display: inline-flex; align-items: center; gap: 7px;
    border: 0; background: none; padding: 0; font: inherit;
    font-size: 15px; font-weight: 600; color: inherit; cursor: pointer;
  }
  .lc-cluster .lc-ename:hover { color: var(--entity-text); }
  .lc-scroll { overflow-x: auto; }
  .lc-band { position: relative; }
  .lc-wires, .lc-wires svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .lc-wires { pointer-events: none; }

  .lc-hot { position: absolute; }
  .lc-node {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 1.5px solid var(--entity); border-radius: 999px; background: var(--surface);
    font: inherit; cursor: pointer; padding: 0 12px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, .05);
  }
  .lc-hot:hover .lc-node, .lc-hot:focus-within .lc-node, .lc-hot.on .lc-node {
    background: var(--entity-soft);
  }
  .lc-node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .lc-node .st {
    font-size: 13px; font-weight: 600; white-space: nowrap;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis;
  }
  .lc-node .cap {
    font-size: 9px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); white-space: nowrap;
  }
  .lc-hot.terminal .lc-node { outline: 1.5px solid var(--entity); outline-offset: 3px; }
  .lc-hot.terminal .lc-node:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
  .lc-badge {
    position: absolute; top: -8px; right: -6px; z-index: 1;
    min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10px; font-family: var(--mono); font-weight: 600;
    background: var(--command-soft); border: 1px solid var(--command); color: var(--command);
  }

  .lc-elabel {
    position: absolute; display: inline-flex; align-items: center; gap: 5px;
    transform: translateX(-50%); white-space: nowrap;
  }
  .lc-loop {
    position: absolute; transform: translateX(-50%);
    font-size: 10px; font-family: var(--mono); color: var(--event-text); white-space: nowrap;
  }
  .lc-dot {
    display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 50%;
    background: var(--rule-soft); border: 1.5px solid var(--rule); cursor: help;
  }

  .lc-pop {
    display: none; position: absolute; top: calc(100% + 9px); left: 50%;
    transform: translateX(-50%); z-index: 6;
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px;
    padding: 9px 12px 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, .14); min-width: 230px;
  }
  .lc-pop::before {
    content: ""; position: absolute; top: -5px; left: 50%; margin-left: -5px;
    width: 9px; height: 9px; background: var(--surface);
    border-left: 1px solid var(--border-strong); border-top: 1px solid var(--border-strong);
    transform: rotate(45deg);
  }
  .lc-hot:hover .lc-pop, .lc-hot:focus-within .lc-pop, .lc-hot.on .lc-pop { display: block; }
  .lc-rows h4 { margin: 0 0 2px; }
  .lc-rows h4 + h4, .lc-rows .lc-prow + h4 { margin-top: 8px; }
  .lc-prow {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 11.5px; line-height: 1.9; white-space: nowrap;
  }
  .lc-prow .cmd {
    font: inherit; border: 0; background: none; padding: 0; cursor: pointer;
    color: var(--command); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .lc-prow .cmd:hover { text-decoration: underline; }
  .lc-prow .to { flex: none; color: var(--event-text); font-weight: 600; }
  .lc-none { font-size: 12px; color: var(--muted); font-style: italic; white-space: nowrap; }
  .lc-warn { font-size: 10.5px; font-family: inherit; color: var(--rule); white-space: nowrap; }

  /* A compact machine is one grid row, so its caveat has to span the
     whole of it rather than sit in a column. */
  .lc-rowwarn { grid-column: 1 / -1; margin-top: 5px; }

  /* The promotion offer, and the form it opens. Both are questions
     rather than statements, which is why neither looks like a card of
     something already decided. */
  .lc-suggest { border-style: dashed; }
  .ident .lc-offer { align-items: flex-start; }
  .ident .lc-offer > .tiny { flex: 1 1 320px; }
  .lc-suggest .why { margin-bottom: 7px; }
  .fieldrow {
    display: flex; align-items: center; flex-wrap: wrap; gap: 7px;
    padding: 4px 0; font-size: 12px;
  }
  .fieldrow > .nm { min-width: 130px; color: var(--muted); font-size: 11px; }
  .fieldrow > input { flex: 0 1 200px; }

  .lc-fn { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .lc-fn .op { font-family: var(--mono); font-size: 10.5px; }
  .lc-fn .lc-dot { vertical-align: baseline; margin-right: 2px; }

  /* ---------- code ---------- */
  .surface {
    display: inline-flex; height: 30px; flex: none;
    border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
  }
  .surface button {
    display: inline-flex; align-items: center; gap: 5px; padding: 0 11px;
    font: inherit; font-size: 12.5px; border: 0; background: transparent; color: var(--muted); cursor: pointer;
  }
  .surface button + button { border-left: 1px solid var(--border); }
  .surface button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .surface.muted button { opacity: .55; }
  .surface.muted button.on { background: var(--bg); color: var(--muted); }
  .surface button:not(.on):hover { color: var(--text); background: var(--bg); }
  /* Each label is as wide as its bold self, so turning on does not
     shift the bar: a hidden bold copy holds the width. */
  .surface .label { display: inline-grid; }
  .surface .label::after { content: attr(data-text); font-weight: 600; visibility: hidden; height: 0; overflow: hidden; }
  .surface-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--event); }
  .surface-icon { display: flex; }
  .surface-icon svg { width: 14px; height: 14px; display: block; }
  /* Icons alone on a phone, and the Problems button down to its count –
     the width goes to the model's name (shared.css). */
  @media (max-width: 760px) {
    .surface { height: 40px; }
    .surface button { padding: 0 8px; }
    .surface .label, .problems-btn .label { display: none; }
    .surface-icon svg { width: 17px; height: 17px; }
  }
  /* The tools over the text, quiet and to the right; what follows the
     text – status, cursor, Revert and Apply – is the strip under it. */
  .code-bar { display: flex; align-items: center; justify-content: flex-end; gap: 2px; flex-wrap: wrap; margin: 0 0 8px; }
  .code-bar .code-tool { display: inline-flex; align-items: center; gap: 6px; background: transparent; }
  .code-bar .code-tool:hover { border-color: transparent; background: var(--elevated); }
  .code-tool-icon svg { width: 14px; height: 14px; display: block; }
  .code-bar .code-ref { color: var(--muted); padding: 4px 10px; text-decoration: none; }
  .code-bar .code-ref:hover { color: var(--accent); }
  .code-box { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
  .code-editor, .code-text {
    width: 100%; height: calc(100vh - var(--topbar-h, 90px) - 260px); min-height: 360px;
    border: 0; background: var(--surface);
  }
  .code-strip {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 4px 8px 4px 12px; min-height: 32px;
    font-size: 12px; color: var(--muted); background: var(--elevated); border-top: 1px solid var(--border);
  }
  .code-strip .grow { flex: 1; }
  .code-strip .code-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
  .code-strip.dirty { color: var(--event-text); background: var(--event-soft); }
  .code-strip.dirty .code-dot { background: var(--event); }
  .code-strip.bad { color: var(--danger); background: var(--danger-soft); }
  .code-strip.bad .code-dot { background: var(--danger); }
  .code-strip .mono { font-size: 11.5px; }
  .code-strip .btn.tiny { padding: 2px 10px; }
  .code-strip kbd { font-size: 10.5px; opacity: .7; border: 0; padding: 0; }
  .code-editor { overflow: hidden; }
  .code-editor .code-read-hint { color: var(--muted); }
  /* A scenarios group: a gutter stripe (see `codeScenarioMarks`), the
     same at the edge of the help's snippets. */
  .code-editor .code-scenarios-stripe { border-left: 2px solid var(--scenario-stripe); margin-left: 3px; }
  .code-editor .code-scenarios-hint { color: var(--muted); }
  .code-editor .code-scenarios-hint.bad { color: var(--danger); }
  .code-text {
    display: block; resize: vertical; padding: 10px 12px; color: var(--text);
    font-size: 12.5px; line-height: 19px; tab-size: 2; white-space: pre; overflow: auto;
  }
  .code-problems { margin-top: 10px; }
  .code-problems .issue .mono { color: var(--muted); font-size: 11px; }
  .code-problems .issue .why { flex: 1; white-space: pre-line; }
  .diag-mark.err { color: var(--danger); }
</style>
</head>

<script data-page>
// ============================================================
// A · Slices
//
// Two levels. A *feature* ("Course management") is a heading over the
// *commands* that make it up; a command is the unit of work, and
// everything it touches lives on one page – the events it records and
// the state those events change included.
//
// Three rules this interface holds to:
//   - names are written the way you would say them ("define course"),
//     and the PascalCase the schema wants is derived, not typed;
//   - a new command is described in the page, not in a dialog – there
//     are no browser prompts anywhere in here;
//   - what DCB is made of (types, events, projections, the derived
//     boundary) is always on screen; what the examples on dcb.events
//     never need waits behind the experimental flag (shared.js).
// ============================================================

const state = {
  view: 'overview',         // 'overview' | 'slice' | 'entity' | 'types' | 'projections' | 'events' | …
  // The main area shows the model as code instead of its pages – see
  // `renderCode`. Remembered per browser, like the other view choices;
  // the key is spelled out because SURFACE_KEY is declared further down.
  code: localStorage.getItem('dcb-playground:surface') === 'code',
  slice: null,
  sel: null,                // the row being attended to
  adder: null,              // which "add another" is unfolded
  projDraft: null,          // { name, body } – a projection being edited
  defFrames: [],            // the definition modals, bottom first – see `openDefinitionModal`
  newProjection: null,      // true while a projection is being named
  renamingProjection: null,
  newEvent: null,           // { name } – a bare event being described
  renamingEvent: null,
  renamingCommand: null,
  editMember: null,         // { where, name } – the member being edited
  editRule: null,           // index of the condition being edited

// A decoded share envelope, on its way in – from the URL fragment on
// page load, or from any of the models dialog's ways to load one.
// Scripted content is the one thing worth pausing for: everything else
// an untrusted import might get wrong either fails the structural gate
// (skipped, and said so) or loads and surfaces as advisories – the
// same regime every other edit lives under.
function beginImport(envelope) {
  if (envelopeHasScript(envelope)) { state.pendingImport = envelope; render(); return; }
  finishImport(envelope);
}

// ---------- the model link in the address bar ----------
//
// A model link – opened, or written by ⌘S or Export – stays in the
// address bar while it still says what is on screen: until that model
// changes (an append, an undo, a redo) or another one is opened. So
// the address bar is the link to copy, and a reload before then finds
// the unchanged copy (`modelMatchingEnvelope`) rather than importing a
// second one. Null while there is none, or while a link is still on
// its way in – what it stands for is not known until it lands.
let addressModelId = null;

function linkInAddressBar(id) { addressModelId = id; }

function dropAddressLink() {
  addressModelId = null;
  if (readModelLink(location.hash)) history.replaceState(null, '', location.pathname + location.search);
}

// "From a URL", in either dialog: the address becomes this page's own
// `#url=` link, and the link is what loads it (`openModelLink`) – the
// one way a hosted model comes in, typed or followed. The same link
// twice changes no fragment, so it is opened directly.
function openModelAddress(address) {
  const hash = modelUrlLink(address.trim());
  if (location.hash === hash) openModelLink(readModelLink(hash));
  else location.replace(hash);
}

// A link's import turned down at the script gate: nothing landed, so
// the address bar no longer stands for anything.
function cancelImport() {
  if (state.pendingImport && linkedEnvelopes.has(state.pendingImport)) dropAddressLink();
  state.pendingImport = null;
}

// Envelopes that came in through a link rather than the models dialog
// – what `markLinkedCopy` (shared.js) is told about once they land,
// across the script gate if there is one.
const linkedEnvelopes = new WeakSet();

// What opening a different stored model means, wherever it happens –
// the models dialog, an import, the fallback after a delete. The
// pending feature groups are browser-global, not part of any model, so
// they may not survive the crossing; the sandbox session is per model,
// so A's is put aside and B's, if it has one, comes back.
function switchToModel(id) {
  if (addressModelId && id !== addressModelId) dropAddressLink();
  setActiveModelId(id);
  loadSession(id);
  setPendingFeatures([]);
  state.namePrompt = null;
  state.slice = null;
  state.view = 'overview';
}

function finishImport(envelope) {
  run(() => {
    const { modelId, skipped } = importModelFromEnvelope(envelope);
    switchToModel(modelId);
    if (linkedEnvelopes.has(envelope)) { markLinkedCopy(modelId); linkInAddressBar(modelId); }
    // A model is now loaded, so whatever opened the models dialog – a
    // click on the bar, or entering the page without a model link – is
    // answered.
    state.models = false;
    const steps = (envelope.sandbox && envelope.sandbox.steps) || [];
    if (steps.length) {
      const model = projectState()[modelId];
      for (const step of steps) sessionRun(model, step.command, step.args);
    }
    // An import is best-effort: whatever a definition got wrong
    // semantically loaded anyway and sits in the Problems panel, but a
    // definition too malformed to store at all was skipped – and this
    // toast is the only trace of it, because the Problems panel can
    // only speak about what exists. Said once, in full, right now.
    if (skipped.length) {
      const lines = skipped.map((s) => `${humanize(s.kind)} "${s.name}": ${s.reason}`);
      toast(`Skipped on import – the rest of the model loaded. ${lines.join(' · ')}`, true);
    }
    // A newer minor loaded fine – that is what a minor promises – but
    // whatever it added is being ignored, and saying so beats letting
    // someone wonder later why part of their model did not survive.
    const warning = envelopeVersionWarning(envelope);
    if (warning) toast(warning, true);
  });
}

// ---------- which model is open ----------
//
// Every model this browser knows about, and the ways to get another
// one: a new empty model, a URL someone else hosts, or JSON pasted
// directly. The examples live on dcb.events, whose pages open each one
// here through a share link. The dialog is also where the page starts:
// it opens on entering without a `#model=` link (`boot`), over the
// model last worked on, and it cannot be closed while there is none –
// there is no page without a model, only this dialog in front of an
// empty one (`renderModals`).

function jsonLoadForm(onSubmit, onCancel) {
  let text = '';
  const textarea = h('textarea', {
    placeholder: 'Paste a shared model’s JSON here…',
    style: 'width:100%; min-height:140px; font-family:var(--mono); font-size:11px;',
    oninput: (e) => { text = e.target.value; },
    onkeydown: (e) => { if (e.key === 'Escape') { e.preventDefault(); onCancel(); } },
  });
  setTimeout(() => textarea.focus(), 0);
  return h('div', { class: 'inline-form' },
    h('div', { class: 'q' }, 'Paste the model’s JSON'),
    textarea,
    h('div', { class: 'adder', style: 'margin-top:8px' },
      h('button', {
        class: 'btn primary',
        onclick: () => {
          let envelope;
          try { envelope = JSON.parse(text); } catch { return toast('That is not valid JSON.', true); }
          onSubmit(envelope);
        },
      }, 'Load'),
      h('button', { class: 'btn ghost', onclick: onCancel }, 'Cancel')));
}

// ⌘S keeps its own quick path, unchanged: build the full link, land it
// in the address bar, copy it, done. The Import & Export modal below
// wants the same link on demand instead – see `refreshExportLink`.
async function shareCurrentModel() {
  const link = await buildShareLink(activeModel());
  history.replaceState(null, '', link);
  linkInAddressBar(activeModelId());
  try {
    await navigator.clipboard.writeText(link);
    toast('Link copied – this page\'s address now reopens this model.');
  } catch {
    toast('This page\'s address now reopens this model – copy it from the address bar.');
  }
}

// ---------- import & export modal ----------
//
// `buildShareEnvelope` (model.js) always carries everything – property
// scenarios and the recorded sandbox steps included, since ⌘S and the
// generated examples both want full fidelity. The modal offers to leave
// either out, so a model can be sent without the walkthrough that
// exercises it or the steps someone happened to be mid-sandbox on; that
// trimming is a UI concern, not something the shared builder needs to
// know about.
function exportEnvelope(model, { includeScenarios, includeSandbox }) {
  const steps = includeSandbox ? session.steps.map(({ command, args }) => ({ command, args })) : [];
  const envelope = buildShareEnvelope(model, steps);
  if (!includeScenarios) {
    envelope.scenarioDefinitions = [];
    delete envelope.projectionScenarioDefinitions;
  }
  return envelope;
}

// The same wrapping `buildShareLink` does, but around a caller-built
// envelope instead of a freshly-built full one.
async function computeExportLink(envelope) {
  const encoded = await gzipToBase64Url(JSON.stringify(envelope));
  return location.origin + location.pathname + '#model=' + encoded;
}

// Each refresh takes a fresh token and only the holder of the current
// one may land its result – toggling Include options mid-compute must
// not let a superseded envelope win the link and the address bar.
let exportLinkToken = 0;

function refreshExportLink() {
  const model = activeModel();
  const token = ++exportLinkToken;
  runAsync(async () => {
    const envelope = exportEnvelope(model, {
      includeScenarios: state.ieIncludeScenarios, includeSandbox: state.ieIncludeSandbox,
    });
    const link = await computeExportLink(envelope);
    if (token !== exportLinkToken) return;
    history.replaceState(null, '', link);
    linkInAddressBar(activeModelId());
    state.ieLink = link;
  });
}

function openImportExport() {
  state.importExport = true;
  state.ieTab = 'export';
  state.ieImportMode = 'url';
  state.ieExportMode = 'link';
  state.ieIncludeScenarios = true;
  state.ieIncludeSandbox = true;
  state.ieLink = null;
  state.ieCopiedJson = false;
  state.ieCopiedLink = false;
  render();
  refreshExportLink();
}

// Whatever is in front of the page: a dialog, the import gate, quick
// open. The same conditions `renderModals` paints by, after it has
// settled them.
function dialogOpen() {
  return !!(state.pendingImport || state.problems || state.settings || state.importExport || state.help
    || (state.defFrames.length && activeModel()) || state.models || !activeModelId() || state.palette);
}

// The page behind a dialog – everything but the two hosts.
const PAGE_BEHIND = '.topbar, .layout, .site-footer';

// A dialog is modal in fact, not only in `aria-modal`: the page behind
// it is inert while it is up, so Tab cannot walk out of the dialog into
// controls nobody can see past the overlay, and a screen reader does
// not read them.
function renderOverlays() {
  renderModals();
  renderPalette();
  const inert = dialogOpen();
  document.querySelectorAll(PAGE_BEHIND).forEach((element) => { element.inert = inert; });
}

function renderModals() {
  const host = document.getElementById('modal-host');
  host.innerHTML = '';
  // One host, one overlay: every panel here is "the page, with
  // something in front of it", and two of them at once would be a
  // stack with no way back down it. The import gate wins over
  // everything – it is not a panel someone opened, it is standing
  // between them and whatever they were about to do. The models dialog
  // comes last: when someone asked for it, and always while nothing is
  // loaded – then it is the page, and closing it has nothing to go
  // back to.
  settleDefinitionModals();
  if (state.pendingImport) { host.appendChild(renderImportGate()); return; }
  if (state.problems) { host.appendChild(problemsPanel()); return; }
  if (state.settings) { renderSettingsModal(host); return; }
  if (state.importExport) { host.appendChild(renderImportExportModal()); return; }
  if (state.help) { host.appendChild(helpModal()); return; }
  if (state.defFrames.length && activeModel()) { host.appendChild(definitionModal(activeModel())); return; }
  if (state.models || !activeModelId()) { host.appendChild(modelsModal()); return; }
}

function renderSettingsModal(host) {
  const close = () => { state.settings = false; render(); };
  const modal = h('div', { class: 'modal', tabindex: '-1', role: 'dialog', 'aria-modal': 'true' },
    h('header', {},
      h('h2', {}, 'Settings'),
      h('span', { class: 'grow' }),
      h('button', { class: 'btn ghost', onclick: close, title: 'Close', 'aria-label': 'Close' }, '×')),
    h('div', { class: 'muted small' }, 'How this interface behaves. Remembered in this browser, '
      + 'and applied as you pick – the page behind this is already showing it.'),
    UI_SETTINGS.map((setting) => h('div', { class: 'setting' },
      h('h4', {}, setting.title),
      h('div', { class: 'why' }, setting.why),
      setting.options.map(([value, label, description]) => {
        const on = setting.get() === value;
        return h('button', {
          class: 'opt' + (on ? ' on' : ''), 'aria-pressed': on ? 'true' : 'false',
          onclick: () => setting.set(value),
        }, h('span', { class: 'mark' }), h('span', {},
          h('div', { class: 'label' }, label),
          h('div', { class: 'desc' }, description)));
      }))),
    modalFooter(close));

  host.appendChild(overlayAround(modal, close, { thin: true }));
  setTimeout(() => modal.focus(), 0);
}

// A dialog is named by its heading, unless it names itself: the `h2`
// in its header gets an id, and the dialog points at it – so a screen
// reader announces "Settings, dialog" rather than "dialog".
let dialogHeadingIds = 0;
function labelDialog(modal) {
  const heading = modal.querySelector('header h2');
  if (!heading || modal.getAttribute('aria-label')) return;
  if (!heading.id) heading.id = 'dialog-heading-' + (dialogHeadingIds += 1);
  modal.setAttribute('aria-labelledby', heading.id);
}

// A modal, and the backdrop that closes it – `thin` for one whose
// changes should be seen landing on the page behind it. Clicking the
// backdrop only counts when it is the backdrop that was clicked – a
// click that started inside the modal and drifted out of it is not a
// dismissal.
// Every dialog ends the same way: whatever else it offers on the left,
// Close on the right.
function modalFooter(close, ...before) {
  return h('footer', {}, ...before, h('span', { class: 'grow' }),
    h('button', { class: 'btn', onclick: close }, 'Close'));
}

function overlayAround(modal, close, { thin = false } = {}) {
  labelDialog(modal);
  return h('div', {
    class: 'overlay' + (thin ? ' thin' : ''),
    onclick: (e) => { if (e.target === e.currentTarget) close(); },
  }, modal);
}

// ---------- definition modals ----------
//
// A command is designed in one place: the custom type an input needs
// and the projection a rule reads are created – and corrected – from
// the picker that noticed they were missing, in a modal showing the
// same editor their own pages show. Leaving the command for them
// would drop whatever rule or input was half-built when the need
// came up.
//
// Each modal is a frame. Opening one sets the page's open forms and
// drafts aside (`frameKeys`) and closing it puts them back, so the
// editors inside – which open and close their own forms through
// `closeForms` like anywhere else – never reach the command
// underneath. The page behind is painted from what was set aside, so
// the half-built rule stays visible through the backdrop.
//
// At most two frames: a projection's modal may open a custom type's,
// because a projection's value is so often a type not yet written –
// and a header that says what is underneath is the way back down.
// Nothing deeper; a stack nobody can see the bottom of is the reason
// the other dialogs never stack at all.
//
// Edits commit as they are made, as on the pages – undo takes them
// back. Creating a definition and selecting it in the picker that
// asked for it is one undo step.
// A function, not a constant: the lists it reads are declared further
// down the script.
const frameKeys = () => [
  ...FORM_KEYS.filter((key) => key !== 'pendingImport'), ...DRAFT_KEYS,
  'sel', 'adder', 'lit', 'queryPop', 'hintPop', 'lcMenu', 'projTab',
];

function takeFrameKeys() {
  const kept = {};
  for (const key of frameKeys()) { kept[key] = state[key]; state[key] = null; }
  return kept;
}
function putFrameKeys(kept) {
  for (const key of frameKeys()) state[key] = kept[key];
}

// Which page a frame was opened over. A frame outliving its page –
// something inside it navigated – has nothing to go back to.
function definitionModalPage() {
  return [state.view, state.slice, state.entity, state.code, activeModelId()].join('\0');
}

const topDefinitionFrame = () => state.defFrames[state.defFrames.length - 1] || null;

// `kind` is 'custom-type' or 'projection'; `name` an existing one to
// edit, or null to create one. `onCreated(name)` puts the new
// definition where the picker that asked for it can see it – it runs
// inside the same gesture as the creation, and again with the new
// name if the definition is renamed before the modal closes.
function openDefinitionModal(model, { kind, name = null, onCreated = null }) {
  if (state.defFrames.length >= 2) return;
  if (state.defFrames.length) autoSaveProjectionDraft();
  const frame = { kind, name, onCreated, form: null, page: definitionModalPage() };
  if (kind === 'projection') {
    const stored = name && model['projection-definitions'][name];
    frame.draft = stored
      ? { name, body: projectionDraftFrom(stored) }
      : { name: '', body: blankProjectionDraft(model) };
  }
  frame.below = takeFrameKeys();
  frame.focus = true;
  state.defFrames.push(frame);
  anchorDefinitionModal();
  render();
}

// The top modal only. Whatever is pending inside it is committed the
// way leaving a page commits it – Escape has already discarded it.
function closeDefinitionModal() {
  if (!state.defFrames.length) return;
  commitPendingField();
  const frame = state.defFrames.pop();
  putFrameKeys(frame.below);
  anchorDefinitionModal();
}

function closeAllDefinitionModals() {
  while (state.defFrames.length) closeDefinitionModal();
}

// An existing projection's modal edits through `projDraft`, which is
// what its autosave flushes; it is put back after every `closeForms`
// inside the modal, the way `keepingRowOpen` keeps a ledger row open.
function definitionModalAnchor() {
  const frame = topDefinitionFrame();
  return frame && frame.kind === 'projection' && frame.name ? frame.draft : null;
}
function anchorDefinitionModal() {
  const anchor = definitionModalAnchor();
  if (anchor) state.projDraft = anchor;
}

// Another dialog wins: the definition modal steps aside – its edits
// are already stored – rather than waiting underneath it. And one
// whose page went away (something inside navigated) is simply gone,
// with the forms of the page it was over.
function settleDefinitionModals() {
  if (!state.defFrames.length) return;
  if (state.defFrames[0].page !== definitionModalPage()) { state.defFrames = []; return; }
  if (state.pendingImport || state.problems || state.settings || state.importExport
    || state.help || state.models || state.palette) {
    closeAllDefinitionModals();
  }
}

// The page behind a modal is painted from the forms the bottom frame
// set aside, and whatever that paint does to them is set aside again.
function behindDefinitionModal(paint) {
  const bottom = state.defFrames[0];
  if (!bottom) return paint();
  const local = takeFrameKeys();
  putFrameKeys(bottom.below);
  try {
    paint();
  } finally {
    bottom.below = takeFrameKeys();
    putFrameKeys(local);
  }
}

// Every pick inside a modal repaints it, so the keyboard's place is
// kept by position, as `restoreMainFocusRank` keeps it on the page –
// and a modal that holds no focus takes it, or a field on the page
// behind would.
function definitionModalStops() {
  const modal = document.querySelector('#modal-host .def-modal');
  if (!modal) return [];
  return [...modal.querySelectorAll('a[href], button, select, input, textarea, [tabindex]')]
    .filter((el) => !el.disabled && el.tabIndex !== -1);
}
function definitionModalFocusRank() {
  if (!state.defFrames.length) return null;
  const at = definitionModalStops().indexOf(document.activeElement);
  return at < 0 ? null : at;
}
function restoreDefinitionModalFocus(rank) {
  const modal = document.querySelector('#modal-host .def-modal');
  if (!modal) return;
  const frame = topDefinitionFrame();
  if (frame && frame.focus) {
    frame.focus = false;
    const first = modal.querySelector('.def-body input, .def-body select, .def-body button');
    (first || modal).focus({ preventScroll: true });
    return;
  }
  if (modal.contains(document.activeElement)) return;
  const stops = definitionModalStops();
  if (rank !== null && stops.length) stops[Math.min(rank, stops.length - 1)].focus({ preventScroll: true });
  else modal.focus({ preventScroll: true });
}

// The picker row that opens one, and the pencil beside a reference.
const NEW_DEFINITION = ' new definition';
const NEW_TYPE_LABEL = '+ New custom type…';
const NEW_PROJECTION_LABEL = '+ New projection…';

function editDefinitionButton(model, kind, name) {
  return h('button', {
    class: 'btn ghost tiny def-edit', type: 'button',
    title: 'Edit ' + readable(name) + ' here',
    'aria-label': 'Edit ' + readable(name),
    onclick: (e) => { e.stopPropagation(); openDefinitionModal(model, { kind, name }); },
  });
}

function definitionModal(model) {
  const frame = topDefinitionFrame();
  const under = state.defFrames.length > 1 ? state.defFrames[0] : null;
  const close = () => { closeDefinitionModal(); render(); };
  const isType = frame.kind === 'custom-type';
  const collection = isType ? 'custom-type-definitions' : 'projection-definitions';
  const exists = !!frame.name && !!model[collection][frame.name];
  const noun = isType ? 'custom type' : 'projection';

  // Created, then renamed: the new name follows into the frame, the
  // projection's draft and whatever the picker below selected.
  const renamed = (next) => {
    frame.name = next;
    if (frame.draft) frame.draft.name = next;
    if (frame.selected && frame.onCreated) frame.onCreated(next);
  };
  const created = (definitionName) => {
    frame.name = definitionName;
    if (frame.onCreated) { frame.onCreated(definitionName); frame.selected = true; }
  };

  let body;
  if (frame.name && !exists) {
    // Undone, or removed elsewhere, while the modal was up.
    body = h('div', { class: 'empty' }, `This ${noun} no longer exists.`);
  } else if (isType) {
    body = exists
      ? customTypeEditor(model, frame.name, { inModal: true, onRenamed: renamed })
      : newCustomTypeQuestion(model, frame, created);
  } else {
    body = exists
      ? definitionModalProjection(model, frame, renamed)
      : newProjectionQuestion(model, frame, created);
  }

  const modal = h('div', {
    class: 'modal def-modal', tabindex: '-1', role: 'dialog', 'aria-modal': 'true',
    'aria-label': exists ? readable(frame.name) : 'New ' + noun,
  },
    h('header', {},
      under ? h('button', { class: 'btn ghost tiny def-back', onclick: close },
        '‹ Back to ' + (under.name ? readable(under.name) : 'the new projection')) : null,
      h('h2', {}, exists ? named(frame.name) : 'New ' + noun),
      h('span', { class: 'grow' }),
      h('button', { class: 'btn ghost', onclick: close, title: 'Close', 'aria-label': 'Close' }, '×')),
    h('div', { class: 'def-body' }, body),
    modalFooter(close,
      exists ? h('button', {
        class: 'btn ghost tiny', title: `Leave the command for this ${noun}’s own page`,
        onclick: () => {
          const target = frame.name;
          closeAllDefinitionModals();
          if (isType) goToCustomType(target); else goToProjection(target);
        },
      }, 'Open its page') : null));

  return overlayAround(modal, close);
}

// The Custom types page's own question, asked here: which form, then
// what it is called.
function newCustomTypeQuestion(model, frame, created) {
  if (!frame.form) {
    return h('div', { class: 'adder' },
      ...newCustomTypeButtons((form) => { frame.form = form; render(); }));
  }
  return inlineForm({
    question: 'Name',
    placeholder: NEW_TYPE_PLACEHOLDERS[frame.form],
    onSubmit: (v) => {
      const typeName = toPascal(v);
      if (!typeName) return toast('Give the type a name.', true);
      run(() => {
        addDefinition('custom-type-definition', model.id, typeName, newCustomTypeBody(frame.form));
        frame.form = null;
        created(typeName);
      });
    },
    onCancel: () => { frame.form = null; render(); },
  });
}

// What a projection's "it holds" picker offers inside a modal: a type
// of its own, in the one modal that may sit on top of this one.
function projectionNewTypeOffer(model, frame) {
  if (state.defFrames.length > 1) return null;
  return (choose) => openDefinitionModal(model, { kind: 'custom-type', onCreated: choose });
}

// The Projections page's question, asked here: a name, and the
// wizard then reveals the rest in the modal (`PROJECTION_WIZARD_STEPS`).
function newProjectionQuestion(model, frame, created) {
  // Asked from a command, the projection is most likely kept per what
  // the command is about: its one tag-typed input, when it has one.
  const command = state.view === 'slice' ? model['command-definitions'][state.slice] : null;
  const tagInputs = ((command && command.properties) || [])
    .filter((p) => p && !p.isList && classifyType(model, p.propertyType).kind === 'value'
      && !classifyType(model, p.propertyType).composite && isTagBearing(model, p.propertyType));
  const fallbackTags = tagInputs.length === 1 ? [{ name: tagInputs[0].name, tagType: tagInputs[0].propertyType }] : [];
  return inlineForm({
    question: 'New projection',
    placeholder: 'projection name',
    submitLabel: 'Create',
    onSubmit: (label) => createProjectionFromName(model, label, (name, draft) => {
      frame.draft = { name, body: draft };
      created(name);
      anchorDefinitionModal();
    }, { fallbackTags }),
    onCancel: () => closeDefinitionModal(),
  });
}

// An existing projection, as its ledger row edits it: saved as it is
// edited, renamed in place.
function definitionModalProjection(model, frame, renamed) {
  const name = frame.name;
  return h('div', {
    oninput: scheduleProjectionAutosave,
    onchange: scheduleProjectionAutosave,
  },
    state.renamingProjection === name
      ? renameDefinitionForm(model, 'projection-definition', name, {
          stateKey: 'renamingProjection', after: renamed,
        })
      : null,
    h('div', {},
      ...projectionFields(model, frame.draft.body, { onNewType: projectionNewTypeOffer(model, frame) })),
    h('div', { class: 'pfoot' },
      h('span', { class: 'muted tiny' }, 'autosaved · ', kbd('Mod+Z'), ' undoes'),
      h('span', { class: 'grow' }),
      h('button', {
        class: 'btn tiny', title: 'Rename the projection',
        onclick: () => { closeForms(); state.renamingProjection = name; render(); },
      }, 'Rename')));
}

// ---------- help ----------
//
// What the playground is, said once, in a modal: the bar's button, the
// `?` key and the models dialog's "What is this?" open it. It explains
// the playground, not the notation – that is the reference on
// dcb.events, linked from its footer in a new tab beside where to send
// feedback and issues. A sidebar of pages, not one long page: Getting
// started, the FAQ, and the shortcuts apart at the bottom, out of the
// way of someone reading about the playground.
const HELP_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" '
  + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + '<circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>'
  + '<line x1="12" y1="17" x2="12.01" y2="17"></line></svg>';

// A shortcut the way this machine's keyboard labels it. Written once,
// platform-neutral – `Mod` is ⌘ on a Mac and Ctrl everywhere else, the
// way the handlers read `metaKey || ctrlKey` – and spelled per platform:
// glyphs in Apple's order (⌃⌥⇧⌘) on a Mac, words joined by `+` in
// Ctrl, Alt, Shift order elsewhere. Asked each time rather than at load,
// so a test can play either platform.
function onMac() {
  const platform = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '';
  return /mac|iphone|ipad/i.test(platform);
}

const SHORTCUT_MODIFIERS = {
  mac: { Ctrl: '⌃', Alt: '⌥', Shift: '⇧', Mod: '⌘' },
  other: { Mod: 'Ctrl', Ctrl: 'Ctrl', Alt: 'Alt', Shift: 'Shift' },
};
const SHORTCUT_ORDER = {
  mac: ['Ctrl', 'Alt', 'Shift', 'Mod'],
  other: ['Mod', 'Ctrl', 'Alt', 'Shift'],
};

function shortcutText(combo) {
  const platform = onMac() ? 'mac' : 'other';
  const parts = combo.split('+');
  const key = parts.pop();
  const modifiers = SHORTCUT_ORDER[platform].filter((m) => parts.includes(m))
    .map((m) => SHORTCUT_MODIFIERS[platform][m]);
  if (platform === 'other') return [...modifiers, key].join('+');
  // A click is a gesture, not a key, and a Mac writes it ⌘-click.
  if (key === 'click') return modifiers.join('') + '-click';
  return modifiers.join('') + (key === 'Enter' ? '↩' : key);
}

function kbd(combo) {
  return h('kbd', {}, shortcutText(combo));
}
