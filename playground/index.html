// projection different things.
function renamePropertyField(model, entityName, property, where) {
  let name = property.name;
  const doRename = () => {
    const next = toCamel(name);
    if (!next) return toast('Give it a name.', true);
    if (next === property.name) { state.editMember = null; return render(); }
    state.editMember = { where, name: next };
    run(() => renameMember('entity-definition', model.id, entityName, 'property', property.name, next));
  };
  return h('span', { class: 'adder' },
    h('input', {
      type: 'text', value: property.name, style: 'width:190px',
      oninput: (e) => { name = e.target.value; },
      onkeydown: (e) => { if (e.key === 'Enter') { e.preventDefault(); doRename(); } },
    }),
    h('button', {
      class: 'btn tiny', title: 'Rename, rewriting every command that reads it',
      onclick: doRename,
    }, 'Rename'),
    h('span', { class: 'muted tiny' }, 'what this entity calls ',
      h('span', { class: 'chip projection' }, readable(property.projection))));
}

// The marks on offer. A grid rather than a text field, because the
// point of a mark is that it is recognised, and a modeler asked to type
// one will type the first thing that comes to hand. Anything can still
// be typed – the field is beside the grid, not instead of it.
const ICON_CHOICES = [
  '📚', '🎓', '🧑‍🎓', '👤', '👥', '🏫', '🏢', '🏬', '🏠', '🛏️',
  '📦', '🧾', '🛒', '💳', '💰', '🏷️', '🎟️', '🎫', '📄', '📋',
  '🗓️', '⏰', '⏳', '📍', '🧭', '✈️', '🚗', '🚚', '🍽️', '☕',
  '🔑', '🔒', '⚙️', '🧩', '🔧', '🧱', '🌱', '🐾', '⭐', '🔥',
  '💡', '🎯', '🧪', '🩺', '📈', '📊', '🎵', '🎬', '⚽', '♟️',
];

// One form for all three marked kinds. What varies is data – which
// state slot holds it open, which collection the patch lands in, what
// the prose promises – so it is passed in, and a fix to the grid, the
// typed input or the trim-or-delete rule lands on all three at once.
function iconForm(name, body, { stateKey, kind, current, prose, cls = '' }) {
  let typed = body.icon || '';
  const set = (icon) => {
    state[stateKey] = null;
    patch(kind, name, (b) => {
      const next = String(icon || '').trim();
      if (next) b.icon = next;
      else delete b.icon;
    });
  };
  const close = () => { state[stateKey] = null; render(); };
  return h('div', { class: 'inline-form icons' + cls },
    h('div', { class: 'q' }, prose),
    h('div', { class: 'grid' }, ICON_CHOICES.map((icon) => h('button', {
      class: 'ic-opt' + (icon === current ? ' on' : ''), title: 'Use this',
      onclick: () => set(icon),
    }, icon))),
    h('div', { class: 'adder' },
      h('input', {
        type: 'text', value: typed, placeholder: 'or type one', style: 'width:110px',
        oninput: (e) => { typed = e.target.value; },
        onkeydown: (e) => {
          if (e.key === 'Enter') { e.preventDefault(); set(typed); }
          if (e.key === 'Escape') { e.preventDefault(); close(); }
        },
      }),
      h('button', { class: 'btn', onclick: () => set(typed) }, 'Use'),
      body.icon ? h('button', {
        class: 'btn ghost', title: 'Back to the neutral mark',
        onclick: () => set(''),
      }, 'Clear') : null,
      h('button', { class: 'btn ghost', onclick: close }, 'Done')));
}

function iconPicker(model, name, entity) {
  return iconForm(name, entity, {
    stateKey: 'iconPicker', kind: 'entity-definition', current: entityIcon(model, name),
    prose: `The mark ${readable(name)} is shown with – in the rail, in every command that reads it, `
      + 'and in every change it takes.',
  });
}

function eventIconPicker(model, name, event) {
  return iconForm(name, event, {
    stateKey: 'eventIconPicker', kind: 'event-definition', current: eventIcon(model, name),
    cls: ' event',
    prose: `The mark ${readable(name)} is shown with – in the sandbox timeline, in every Given that `
      + 'records it, and everywhere it is recorded.',
  });
}

// A command's icon is also the default mark for whichever single event
// it publishes (see `eventIcon`), so clearing it back to the command
// fallback puts that event back on the event fallback too, unless the
// event has a mark of its own already.
function commandIconPicker(model, name, command) {
  return iconForm(name, command, {
    stateKey: 'commandIconPicker', kind: 'command-definition', current: commandIcon(model, name),
    prose: `The mark ${readable(name)} is shown with – and, by default, the event it records on `
      + 'success, unless that event has a mark of its own.',
  });
}

// ---------- value types ----------
//
// A value type is either one value described by a JSON Schema, or a
// record of named fields. The composite form is the one that matters
// here: because a field may be typed with an entity's identifier, a
// list of composites is what lets a single event record something that
// happened to many instances at once.
//
// Fields are offered as name-and-type only. There are no list or
// optional controls, because a composite's fields may be neither – the
// editor declines to ask rather than asking and then refusing.
function renderCustomTypes(model, main) {
  main.appendChild(h('header', {},
    h('div', { class: 'name' }, 'Custom types'),
    h('div', { class: 'muted small' },
      'Records with no identity of their own – a price, an order line – and identifiers: a '
      + 'tag type is a single value every event carrying it is tagged with. An entity’s own derived identifier lives here too, created automatically '
      + 'alongside it, and stays pinned as a tag for as long as the entity owns it.')));

  const typeAdvisories = advisoryBanner(model, 'custom-type-definition');
  if (typeAdvisories) main.appendChild(typeAdvisories);

  const names = Object.keys(model['custom-type-definitions']).sort();
  if (!names.length) {
    main.appendChild(h('div', { class: 'empty' }, 'None yet.'));
  }

  for (const name of names) main.appendChild(customTypeEditor(model, name));

  if (state.newType) {
    main.appendChild(inlineForm({
      question: 'Name',
      placeholder: NEW_TYPE_PLACEHOLDERS[state.newType],
      onSubmit: (v) => {
        const typeName = toPascal(v);
        const form = state.newType;
        state.newType = null;
        run(() => addDefinition('custom-type-definition', model.id, typeName,
          newCustomTypeBody(form)));
      },
      onCancel: () => { state.newType = null; render(); },
    }));
  } else {
    main.appendChild(h('div', { class: 'adder', style: 'margin-top:14px' },
      ...newCustomTypeButtons((form) => { closeForms(); state.newType = form; render(); })));
  }
}

// The forms a new custom type can take, offered alike on the page and
// in a definition modal. A tag type is a single value marked as a tag
// from the start: it is what a model built from scratch needs first –
// the thing its events are tagged with – and behind "single value" it
// was a checkbox away that nothing pointed at. So it comes first and is
// the primary one – first is also where a dialog puts the keyboard.
function newCustomTypeButtons(choose) {
  return [
    h('button', {
      class: 'btn primary', onclick: () => choose('tag'),
      title: 'A single value every event carrying it is tagged with – an identifier',
    }, '+ New tag type'),
    h('button', { class: 'btn', onclick: () => choose('composite') }, '+ New record'),
    h('button', { class: 'btn', onclick: () => choose('enum') }, '+ New enum'),
    h('button', { class: 'btn', onclick: () => choose('scalar') }, '+ New single value'),
  ];
}
const NEW_TYPE_PLACEHOLDERS = {
  composite: 'type name', enum: 'enum name', scalar: 'type name', tag: 'tag type name',
};

// One custom type's card: its head, its fields, members or schema, and
// its tag switch. The Custom types page lists these, and a definition
// modal shows one (`inModal`): there it offers no removal – the command
// behind it may be using the type – and no way off to the owning
// entity, and a rename tells the modal its new name (`onRenamed`).
function customTypeEditor(model, name, { inModal = false, onRenamed = null } = {}) {
  const body = model['custom-type-definitions'][name];
  const composite = Array.isArray(body.properties);
  const owner = entityOfIdType(model, name);
  const card = h('div', { class: 'ecard' });

  if (state.renamingType === name) {
    card.appendChild(renameDefinitionForm(model, 'custom-type-definition', name, {
      stateKey: 'renamingType', after: onRenamed || undefined,
    }));
  } else {
    const tags = composite
      ? idLeavesOfType(model, name).map((l) =>
          `${readable(entityOfIdType(model, l.identifierType) || l.identifierType)} (from ${readable(l.field)})`)
      : [];
    card.appendChild(qrow('div', { cls: 'ehead', key: 'type:' + name },
      h('span', { class: 'chip' }, readable(name)),
      reveal(h('span', { class: 'tech' }, name)),
      composite
        ? h('span', { class: 'muted tiny' },
            `${body.properties.length} field${body.properties.length === 1 ? '' : 's'}`)
        : body.isTag
          ? h('span', { class: 'kind-badge' }, 'tag type')
          : h('span', { class: 'muted tiny' }, 'one value'),
      owner ? h('span', inModal ? { class: 'chip entity' } : {
        class: 'chip entity', title: 'Open ' + readable(owner),
        onclick: () => openEntity(owner),
      }, h('i', { class: 'ic' }, entityIcon(model, owner)), 'identifier of ' + readable(owner)) : null,
      tags.length
        ? h('span', { class: 'muted tiny' }, ' · tags whatever carries it: ' + tags.join(', '))
        : null,
      h('span', { style: 'flex:1' }),
      composite ? null : h('button', {
        type: 'button', class: 'pswitch' + (typeAdvanced(name) ? ' on' : ''),
        'aria-pressed': typeAdvanced(name) ? 'true' : 'false',
        title: 'Show the JSON Schema, the tag schema and the form',
        onclick: () => setTypeAdvanced(name, !typeAdvanced(name)),
      }, h('span', { class: 'track' }, h('span', { class: 'knob' })), 'Advanced'),
      reveal(h('button', {
        class: 'btn tiny',
        onclick: () => { closeForms(); state.renamingType = name; render(); },
      }, 'Rename'),
      inModal ? null : owner
        ? h('button', {
            class: 'btn tiny danger', disabled: true,
            title: `Remove the ${readable(owner)} entity instead – its identifier goes with it.`,
          }, 'Remove')
        : removeButton('custom-type:' + name, {
            label: 'Remove', title: 'Remove this custom type',
            onRemove: () => run(() => removeDefinition('custom-type-definition', model.id, name)),
          }))));
  }

  if (composite) {
    const where = 'field:' + name;
    card.appendChild(h('div', { class: 'erows' }, body.properties.map((field, i) => {
      // A field is always singular and always required – that is
      // what keeps a list of records the same length as the bindings
      // fanned out over it – so arity is not offered here.
      if (editingMember(where, field.name)) {
        return memberEditor(model, {
          member: field, where, allow: { arity: false }, types: fieldTypeOptions(model),
          onReplace: (next) => patch('custom-type-definition', name, (b) => {
            b.properties[i] = { name: next.name, propertyType: next.propertyType };
          }),
          onRename: (to) => renameMember('custom-type-definition', model.id, name, 'field', field.name, to),
        });
      }
      const cls = classifyType(model, field.propertyType);
      const isId = cls.kind === 'value' && !cls.composite && cls.isTag;
      // A standalone tag-marked type has no owning entity – nothing
      // to mark it with and nothing to name in the sentence below.
      const ownerEntity = isId ? cls.ownerEntity : null;
      const enumType = isStringEnumType(model, field.propertyType) ? field.propertyType : null;
      // A record field is its type – that one stays on screen even
      // here, because with it hidden the row would say nothing.
      return [
        qrow('div', { cls: 'erow', key: 'field:' + name + '.' + field.name },
          h('span', { class: 'nm' }, propertyWords(field.name)),
          h('span', {
            class: (ownerEntity ? 'chip entity' : 'chip') + ' editable',
            title: 'Rename or retype this field',
            onclick: () => openMember(where, field.name),
          }, ownerEntity ? h('i', { class: 'ic' }, entityIcon(model, ownerEntity)) : null,
            readable(field.propertyType)),
          isId ? h('span', { class: 'tiny muted' },
            ownerEntity
              ? ('identifies a ' + iconPrefix(entityIcon(model, ownerEntity)) + readable(ownerEntity)
                + ' – every event carrying this is tagged with it')
              : 'a standalone tag – every event carrying this is tagged with it') : null,
          h('span', { style: 'flex:1' }),
          reveal(
            h('span', { class: 'tech' }, field.name),
            h('button', {
            class: 'btn tiny danger',
            onclick: () => {
              if (body.properties.length === 1) {
                return toast('A record needs at least one field. Remove the type instead.', true);
              }
              patch('custom-type-definition', name, (b) => {
                b.properties = b.properties.filter((f) => f.name !== field.name);
              });
            },
          }, '×'))),
        enumType ? h('div', { class: 'use' },
          h('span', { class: 'muted' }, 'can be '), ...enumMemberChips(model, enumType)) : null,
      ];
    })));

    let fname = '', ftype = 'string';
    card.appendChild(adderSlot('field:' + name, null, '+ field', () => h('div', { class: 'adder' },
      h('input', { type: 'text', placeholder: 'field name', oninput: (e) => { fname = e.target.value; } }),
      pick(fieldTypeOptions(model), ftype, (v) => { ftype = v; }),
      h('button', {
        class: 'btn', onclick: () => {
          if (!fname.trim()) return toast('Give the field a name.', true);
          patch('custom-type-definition', name, (b) => {
            b.properties.push({ name: toCamel(fname), propertyType: ftype });
          });
        },
      }, '+ Field'),
      h('span', { style: 'flex:1' }),
      h('span', { class: 'tiny muted' }, 'fields are single and required'))));
  } else {
    card.appendChild(singleValueEditor(model, name, body, owner));
  }

  return card;
}

// A single value's card body. By default it is what it mostly is: one
// of JSON Schema's base types, picked – or an enum's members – and, for
// a tag type, the tag it writes. Behind the Advanced switch is what
// most types never need: the raw JSON Schema, the
// tag schema, and the form – single value or tag type, which used to be
// a checkbox on every card. The switch is per card and session-only:
// every card opens collapsed, and opening one opens no other. A schema saying more than its `type` is
// mentioned with the switch off, never silently hidden, since the
// picker changes the type under it. Only `type` decides how the
// playground reads a value (`literalKindOf`); the rest travels with
// the model and is not checked here.
//
// The form is pinned to tag type for an entity's identifier: it must
// stay a tag for the entity to be bindable at all, so this is where
// that invariant is held in the UI rather than only caught afterwards
// by validation.
const SCALAR_BASE_TYPES = ['string', 'integer', 'number', 'boolean'];
function typeAdvanced(name) {
  return !!state.typeAdvanced[name];
}
function setTypeAdvanced(name, on) {
  if (on) state.typeAdvanced[name] = true; else delete state.typeAdvanced[name];
  render();
}

function singleValueEditor(model, name, body, owner) {
  const advanced = typeAdvanced(name);
  const isEnum = isStringEnumType(model, name);
  const schema = body.schema == null ? { type: 'string' } : body.schema;
  const isObject = schema && typeof schema === 'object' && !Array.isArray(schema);
  const extra = isObject && !isEnum ? Object.keys(schema).filter((key) => key !== 'type') : [];
  const setSchema = (next) => updateDefinition('custom-type-definition', model.id, name, { ...body, schema: next });
  const label = (text, info) => h('span', { class: 'nm' }, text, info || null);

  const known = isObject && SCALAR_BASE_TYPES.includes(schema.type);
  const valueRow = h('div', { class: 'irow' },
    label('value'),
    // An enum is not a distinct form of type – it is a scalar whose
    // schema carries `enum` – so its value is its members, chip-edited.
    ...(isEnum ? enumMemberChips(model, name) : [
      pick(SCALAR_BASE_TYPES.map((t) => [t, t]), known ? schema.type : '',
        (v) => run(() => setSchema({ ...(isObject ? schema : {}), type: v })),
        known ? null : 'see the schema'),
      extra.length && !advanced
        ? h('span', { class: 'muted tiny' }, '+ ', h('code', {}, extra.join(', ')), ' – see Advanced')
        : null,
    ]),
    body.isTag
      ? h('span', { class: 'muted tiny' }, 'tags every event carrying it as ',
          h('code', { class: 'tag-sample' }, renderTag({ name, tagSchema: body.tagSchema || '{type}:{value}' }, '…')))
      : null);
  if (!advanced) return valueRow;

  const rows = [];
  if (!isEnum) {
    let text = JSON.stringify(schema);
    const save = () => run(() => {
      let parsed;
      try { parsed = JSON.parse(text); }
      catch (e) { throw new DomainError('That is not valid JSON: ' + e.message); }
      setSchema(parsed);
    });
    rows.push(h('div', { class: 'irow' },
      label('JSON Schema', hint('schema:' + name, 'JSON Schema', [[
        'The value’s type plus any constraint on it – ',
        h('code', { class: 'hl' }, '{"type":"integer","minimum":0}'),
        '. Only ', h('code', { class: 'hl' }, 'type'),
        ' changes how the playground reads a value; the rest travels with the model, unchecked.',
      ]])),
      h('input', {
        type: 'text', value: text, style: 'flex:1;font-family:var(--mono);font-size:11px',
        'aria-label': 'JSON Schema',
        oninput: (e) => { text = e.target.value; },
        onkeydown: (e) => { if (e.key === 'Enter') { e.preventDefault(); save(); } },
      }),
      h('button', { class: 'btn', onclick: save }, 'Save')));
  }
  if (body.isTag) rows.push(tagSchemaField(name, body));

  const form = (isTag, text) => h('button', {
    class: 'btn tiny', type: 'button', disabled: !!owner,
    'aria-pressed': !!body.isTag === isTag ? 'true' : 'false',
    onclick: () => patch('custom-type-definition', name, (b) => {
      if (isTag) b.isTag = true; else delete b.isTag;
    }),
  }, text);
  rows.push(h('div', { class: 'irow' },
    label('form'),
    h('span', { class: 'seg', role: 'group', 'aria-label': 'Form' },
      form(false, 'single value'), form(true, 'tag type')),
    owner ? h('span', { class: 'muted tiny' }, `pinned – ${readable(owner)} is identified by it`) : null));

  return h('div', {}, valueRow, h('div', { class: 'type-advanced' }, ...rows));
}

// The body a new custom type starts with, by form.
function newCustomTypeBody(form) {
  return form === 'composite'
    // A record needs a field to exist at all, so it starts with one the
    // modeler is expected to rename rather than with an empty body the
    // model would reject.
    ? { properties: [{ name: 'value', propertyType: 'string' }] }
    : form === 'enum'
      // Same for an enum: one member to rename, rather than a
      // legal-but-useless empty list.
      ? { schema: { type: 'string', enum: ['Member'] } }
      : form === 'tag'
        ? { schema: { type: 'string' }, isTag: true }
        : { schema: { type: 'string' } };
}

// What a composite field may be typed with: anything except another
// composite, since records do not nest.
function fieldTypeOptions(model) {
  return typeRows(model, typeChoices(model)
    .filter((t) => {
      const cls = classifyType(model, t);
      return !(cls.kind === 'value' && cls.composite);
    }));
}

// ---------- projections ----------
//
// A projection is the only kind of fold in this model. It holds one
// value, starts somewhere, and is advanced by the events it handles,
// over the query `tag IN (its tags, valued by the read) AND type IN
// (handled events)`. It declares the tags it is read by (8.0), each
// named and typed, and an untagged one is what a global numbering is.
//
// An entity property is a *binding* to one of these – an entry naming
// a projection tagged by the entity's own identifier. So there
// is one editor below, `projectionFields`, and the entity page and
// this page both mount it. A second form editing the same thing is
// exactly the drift two independent editors invite, and the way to not
// have that is to have one.
//
// Numbering is not a concept here, it is a use: a value set to the
// *successor* of what an event carried holds the next number to issue
// at every point in its life.
//
// What it holds, where it starts and which events move it are one
// decision rather than three – the value type
// decides which event properties are even offerable – so this editor
// collects a change and applies it on Save instead of as you type. A
// half-edited projection would otherwise be refused by the model on
// every keystroke.

// What a projection may hold: any simple type – booleans included –
// and any scalar value type, enums among them. A composite joins the
// list only when the projection is scripted: the declared operations
// act on a single value and there is none in a record of fields, but
// code has no such limit.
function projectionTypeOptions(model, { scripted } = {}) {
  return typeRows(model, allTypeNames(model)
    .filter((t) => {
      const cls = classifyType(model, t);
      return cls.kind === 'value' ? (scripted || !cls.composite) : cls.kind === 'simple';
    }));
}

// The JSON Schema a type bottoms out in, so the first value can be read
// as the number it is rather than as a string of digits. A composite
// has no single scalar schema to bottom out in – its value is a plain
// object matching its fields – so this reads null for one, which every
// caller here already treats as "not a number".
function underlyingSchema(model, typeName) {
  const cls = classifyType(model, typeName);
  if (cls.kind === 'simple') return { type: typeName };
  if (cls.kind === 'value' && !cls.composite) {
    return model['custom-type-definitions'][typeName].schema || { type: 'string' };
  }
  return null;
}


// Where a projection starts, as a chip rather than a bare word – so
// `nothing yet` is visibly not a value someone typed, and `""` is
// visibly one they did.
function initialValueChip(body) {
  // A derived projection has no start of its own – what it derives is
  // the whole story, so the chip says it.
  if (body.derived) return h('code', {}, derivedText(body.derived));
  if (body.script) return h('code', {}, JSON.stringify(body.script.initialState));
  const value = body.initialValue;
  if (value === null || value === undefined) {
    return h('span', { class: 'chip unset', title: 'No value yet – not the empty string' }, 'null');
  }
  if (Array.isArray(value)) {
    if (!value.length) return h('span', { class: 'chip unset' }, '[]');
    return h('span', {}, ...value.flatMap((element, i) => [
      i ? ' ' : null, h('span', { class: 'chip' }, operandWords(element)),
    ]));
  }
  return h('code', {}, operandWords(value));
}

// One typed slot of an initial value – the whole thing for a scalar
// projection, one element for a list. An enum is picked from its
// members, a boolean from yes/no, and anything else is typed and
// checked on the way out: text that does not belong to the type is
// refused rather than silently coerced.
//
// `null` never appears here. It is a state of the value as a whole,
// chosen above this control, because "no value yet" is not a value of
// some type – it is the absence of one.
function initialValueSlot(model, valueType, value, onSet) {
  const members = enumMembersFor(model, valueType);
  if (members) {
    return pick(members.map((m) => [m, readable(m)]),
      operandSource(value) === 'enum-member' ? value.enumMember : '',
      (v) => onSet({ enumMember: v }), 'which one?');
  }
  if (literalKindOf(model, valueType) === 'boolean') {
    return pick([['true', 'yes'], ['false', 'no']], String(value === true),
      (v) => onSet(v === 'true'));
  }
  return h('input', {
    type: 'text', style: 'width:150px',
    value: value === undefined || value === null ? '' : String(value),
    placeholder: literalKindOf(model, valueType) === 'number' ? '0' : 'value',
    onblur: (e) => {
      const parsed = literalOfType(model, valueType, e.target.value);
      if (parsed === undefined) return toast('That is not a ' + readable(valueType) + '.', true);
      onSet(parsed);
    },
    onkeydown: (e) => { if (e.key === 'Enter') e.target.blur(); },
  });
}

// A value of this type to start a fresh slot from, so adding a list
// element or switching off "nothing yet" lands on something legal.
function blankSlotValue(model, valueType) {
  const members = enumMembersFor(model, valueType);
  if (members) return { enumMember: members[0] };
  const kind = literalKindOf(model, valueType);
  if (kind === 'number') return 0;
  if (kind === 'boolean') return false;
  return '';
}


// The types a read can be tagged by. Only a tag can narrow a query, so
// nothing else appears – an entity's own derived identifier as much as
// a standalone tag-marked type, scalar or composite (through its
// tag-marked fields) either way.
function partitionTypeOptions(model) {
  return allTypeNames(model)
    .filter((t) => classifyType(model, t).kind === 'value' && isTagBearing(model, t))
    .map((t) => [t, readable(t)]);
}

// A value the event carried, as a token option (see `pick`): short
// under its `event` heading, `event.data.capacity` once picked – the
// same path `operandWords` renders and a scripted handler writes.
function eventFieldChoice(p) {
  return [JSON.stringify({ eventProperty: p.name }), p.name, null,
    { group: 'event', before: 'event.data.' }];
}

function successorChoice(p) {
  return [JSON.stringify({ successor: { eventProperty: p.name } }), p.name, null,
    { group: 'successor', before: 'successor(event.data.', after: ')' }];
}

// A projection's handler value, offered as the small set that makes
// sense for the type it holds. `successor` is what turns a plain
// projection into a numbering, so it is a value on this list rather
// than a concept of its own.
//
// A list-typed event property of the right type is offered too: a
// list-valued projection is `set` from one whole, and `append` from a
// list adds its elements rather than nesting them.
//
// `currentValue` is not on the list, though the wire format keeps it:
// `set` to the value already held changes nothing, `increment` by it
// doubles and `append` of it repeats the list – no shipped model uses
// it, and offering it only invited the question what it was for. A
// stored one still runs and still reads as `currentValue`.
function handlerValueChoices(model, draft, event, operation) {
  const properties = (event ? (event.properties || []) : [])
    .filter((p) => p.propertyType === draft.valueType);
  // Only to `set` a numbering. Offered for any type with a next value
  // it put "the one after …" beside every text field and every
  // operation, and before that – offered unconditionally – "the one
  // after true" on a boolean fold, which stored fine and then failed
  // validation.
  const successors = operation === 'set' && !draft.isList && offersSuccessor(model, draft.valueType);
  const out = [
    ...properties.map(eventFieldChoice),
    ...(successors ? properties.filter((p) => !p.isList).map(successorChoice) : []),
  ];
  const enumMembers = enumMembersFor(model, draft.valueType);
  if (enumMembers) {
    for (const m of enumMembers) out.push([JSON.stringify({ enumMember: m }), readable(m)]);
  }
  // A boolean's two values, for the same reason an enum's members are
  // here: a closed set is picked, not typed.
  if (draft.valueType === 'boolean' && !draft.isList) {
    out.push(['true', 'true'], ['false', 'false']);
  }
  return out;
}

// ---------- the draft a projection is edited as ----------
//
// A handler's operand is *picked* – from the event, from the current
// value, from an enum – or typed as a literal, which is two controls
// rather than one and so two draft fields rather than one. That is the
// same `{value, valueText}` shape every other operand form on this
// page uses (see `draftOperand`), so the draft a projection is edited
// as is not quite the body that gets stored: it carries the picker's
// state, and `cleanProjectionBody` is where it becomes a body again.
//
// Going through a sanitiser on the way out is also what keeps a stray
// draft key from ever reaching the model. One used to: a leftover
// `advancedBy` rode out of the new-projection form into every export,
// where the schema refuses it.
// The events one handler row may claim: everything not already handled
// by a *different* row. One handler per event type is the rule the
// picker enforces by omission – an event already spoken for never
// appears, instead of appearing and being refused after the fact.
function unhandledEventChoices(eventNames, handlers, current) {
  const taken = new Set((handlers || [])
    .filter((h) => h && h !== current && h.event)
    .map((h) => h.event));
  return (eventNames || []).filter((name) => !taken.has(name));
}

function projectionDraftFrom(body) {
  const draft = deepClone(body);
  // A script's arguments, stored where 9.x kept them, are edited where
  // they belong – saving the draft moves them.
  if (draft.script && draft.script.arguments !== undefined) {
    if (draft.arguments === undefined && Array.isArray(draft.script.arguments)) draft.arguments = draft.script.arguments;
    delete draft.script.arguments;
  }
  draft.handlers = (draft.handlers || []).map((handler) =>
    (handler.code !== undefined
      ? handler
      : draftFromOperand({ event: handler.event, operation: handler.operation }, 'value', handler.value)));
  return draft;
}

// Fields are written in the order the schema declares them, not the
// order this happens to build them, so a model that goes out and comes
// back in is the same file rather than a reshuffled one.
function cleanProjectionBody(draft) {
  const handlers = (draft.handlers || []).filter((handler) => handler && handler.event);
  // The tags, always stated – an empty list is an untagged projection,
  // and a draft that has not decided yet stores as one.
  const tags = (draft.tags || []).filter((tag) => tag && tag.name && tag.tagType)
    .map((tag) => ({ name: toCamel(tag.name), tagType: tag.tagType }));
  // Its arguments, stated only when there are any – on a declared
  // projection too, where the advisories say nothing uses them.
  const args = (draft.arguments || []).filter((a) => a && a.name && a.propertyType)
    .map((a) => ({ name: toCamel(a.name), propertyType: a.propertyType }));
  const parameters = args.length ? { tags, arguments: args } : { tags };
  if (draft.derived && !draft.script) {
    // An operand passes its projection the tags and arguments it
    // declares – each one of this projection's own parameters, or a
    // literal.
    const operand = (o) => {
      if (operandSource(o) !== 'projection-read') return o;
      const cleaned = { projection: o.projection };
      for (const [key, value] of readTagEntries(o)) {
        if (value !== undefined && value !== '') (cleaned.tags = cleaned.tags || {})[key] = value;
      }
      for (const [key, value] of Object.entries(o.arguments || {})) {
        if (value !== undefined && value !== '') (cleaned.arguments = cleaned.arguments || {})[key] = value;
      }
      return cleaned;
    };
    const computes = draft.derived.operator !== undefined;
    const derived = computes
      ? {
          leftHandSide: operand(draft.derived.leftHandSide),
          operator: draft.derived.operator,
          rightHandSide: operand(draft.derived.rightHandSide),
        }
      : {
          leftHandSide: operand(draft.derived.leftHandSide),
          predicate: draft.derived.predicate,
          rightHandSide: operand(draft.derived.rightHandSide),
        };
    if (!computes && draft.derived.negate) derived.negate = true;
    return {
      ...parameters,
      // The one thing a predicate can yield is a boolean – stated here
      // rather than trusted from the draft, so a body that left derived
      // mode half-way can never store another type against it. A
      // computation holds the number its author typed it as.
      valueType: computes ? draft.valueType : 'boolean',
      isList: false,
      derived,
    };
  }
  if (draft.script) {
    const script = { initialState: draft.script.initialState };
    if (draft.script.exposes) script.exposes = draft.script.exposes;
    return {
      ...parameters,
      valueType: draft.valueType,
      isList: !!draft.isList,
      script,
      handlers: handlers.map((handler) => ({ event: handler.event, code: handler.code || 'state' })),
    };
  }
  return {
    ...parameters,
    valueType: draft.valueType,
    isList: !!draft.isList,
    initialValue: draft.initialValue === undefined ? null : draft.initialValue,
    // A handler that has an event but no value yet is a row still
    // being filled in, not a handler – the same reading an unnamed
    // field row gets. It stays in the draft, on screen, and reaches
    // the stored definition when its value does. This matters since
    // definitions save themselves: every intermediate state passes
    // through here, including the one between picking the event and
    // picking the value.
    handlers: handlers
      .filter((handler) => draftOperand(handler, 'value') !== undefined)
      .map((handler) => ({
        event: handler.event,
        operation: handler.operation,
        value: draftOperand(handler, 'value'),
      })),
  };
}

// A brand-new projection's draft. An entity's property is tagged by
// the entity's identifier, which is what binding it means; one read on
// its own has not said yet (`tags: null`) – tagged by something, or
// untagged, is the author's to decide, at the wizard's partition step;
// until then it is stored untagged.
function blankProjectionDraft(model, entityName) {
  const valueType = projectionTypeOptions(model)[0] ? projectionTypeOptions(model)[0][0] : 'string';
  const draft = { tags: entityName ? [entityTagParam(model, entityName)] : null, valueType, isList: false, handlers: [] };
  draft.initialValue = defaultInitialValue(model, draft);
  return draft;
}

// ---------- guessing from a new projection's name ----------
//
// What the wizard proposes once a projection is named – the same idea
// as `suggestEventName` for a command: a cheap guess, shown in the
// pickers it fills and changed there, never a rule. The name's words
// say a great deal: `CourseSubscriptionCount` is kept per course
// (a tag type the name starts with), holds an integer starting at 0,
// and moves on the events about subscribing.

const nameWords = (name) => String(name || '').match(/[A-Z][a-z0-9]*|[a-z0-9]+/g) || [];
const lowerFirst = (s) => s.charAt(0).toLowerCase() + s.slice(1);

// The words a tag type is named by in a projection's name: `CourseId`
// is "Course", `WeekNumber` is "WeekNumber" or "Week".
function tagTypeStems(typeName) {
  return uniq([typeName.replace(/Id$/, ''), nameWords(typeName)[0]]).filter(Boolean);
}

// The tag type a name starts with (the longest that fits), and one a
// trailing `For<X>` names – `DeveloperAllocatedHoursForWeek`.
function partitionGuess(model, name) {
  const types = partitionTypeOptions(model).map(([t]) => t)
    .filter((t) => !(classifyType(model, t).composite));
  const at = (text) => {
    let found = null;
    for (const type of types) {
      for (const stem of tagTypeStems(type)) {
        const fits = text.startsWith(stem) && (text.length === stem.length || /[A-Z]/.test(text[stem.length]));
        if (fits && (!found || stem.length > found.stem.length)) found = { type, stem };
      }
    }
    return found;
  };
  const out = [];
  const lead = at(name);
  if (lead) out.push(lead);
  const forAt = name.lastIndexOf('For');
  const trail = forAt > 0 ? at(name.slice(forAt + 3)) : null;
  if (trail && !out.some((o) => o.type === trail.type)) out.push(trail);
  return out;
}

// The guess as a draft's fields: its kind, partition and initial state.
// A numbering is untagged and holds the identifier it issues; a
// decision (`Has…`, `Can…`, `…Remaining…`, `…Left`) is derived.
function projectionGuess(model, name) {
  const words = nameWords(name);
  const last = words[words.length - 1] || '';
  const tagTypes = partitionTypeOptions(model).map(([t]) => t);
  const derived = /^(Has|Can)[A-Z]/.test(name) || /Remaining/.test(name) || last === 'Left';
  const numbering = last === 'Numbering' || (words[0] === 'Next' && last === 'Id');
  const partition = numbering ? [] : partitionGuess(model, name);
  const guess = {
    kind: derived ? 'derived' : 'declared',
    tags: partition.map(({ type }) => ({ name: lowerFirst(type), tagType: type })),
    valueType: null, isList: false, initialValue: undefined,
  };
  if (derived) {
    guess.valueType = /^(Has|Can)[A-Z]/.test(name) ? 'boolean' : 'integer';
    return guess;
  }
  const typed = (valueType, initialValue, isList = false) => Object.assign(guess, { valueType, initialValue, isList });
  if (numbering) {
    const issued = tagTypes.find((t) => tagTypeStems(t).some((stem) => name.includes(stem)));
    if (issued) {
      const numeric = literalKindOf(model, issued) === 'number';
      typed(issued, numeric ? 1 : issued.charAt(0).toLowerCase() + '1');
    }
  } else if (last === 'Count' || last === 'Total') {
    typed('integer', 0);
  } else if (last === 'Exists' || /^Is[A-Z]/.test(name)) {
    typed('boolean', false);
  } else if (last === 'Status' || last === 'State') {
    const enums = allTypeNames(model).filter((t) => enumMembersFor(model, t));
    const own = enums.find((t) => t === name) || enums.find((t) => name.endsWith(t));
    if (own) typed(own, { enumMember: enumMembersFor(model, own)[0] });
  } else if (last === 'Ids' && words.length > 1) {
    const element = words[words.length - 2] + 'Id';
    if (tagTypes.includes(element)) typed(element, [], true);
  }
  return guess;
}

// The events a draft's partition lets reach it: each carries a tag of
// every type the projection is tagged by.
function eventsReaching(model, tags) {
  const needed = uniq((tags || []).filter((t) => t && t.tagType)
    .flatMap((t) => idLeavesOfType(model, t.tagType).map((leaf) => leaf.identifierType)));
  return Object.keys(model['event-definitions']).sort().filter((name) => {
    const carried = new Set(eventTagLeaves(model, model['event-definitions'][name]).map((leaf) => leaf.identifierType));
    return needed.every((type) => carried.has(type));
  });
}

// The handlers a declared draft is proposed, as stored handlers: one
// per reaching event the name is about – an event sharing a word with
// it, beyond its partition and what it holds – the verb read off the
// event's name and the type. `StudentUnsubscribedFromCourse` takes one
// off a count; `CourseArchived` sets the status to `Archived`. A guess
// it cannot make is left out rather than made badly.
function handlerGuesses(model, name, draft) {
  if (draft.derived || draft.script) return [];
  const partitionWords = new Set((draft.tags || []).flatMap((t) => tagTypeStems(t.tagType || '').flatMap(nameWords)));
  const vocabulary = new Set(['Count', 'Total', 'Exists', 'Is', 'Status', 'State', 'Ids', 'Id', 'Numbering', 'Next', 'For']);
  const stems = nameWords(name)
    .filter((w) => w.length >= 4 && !partitionWords.has(w) && !vocabulary.has(w))
    .map((w) => w.toLowerCase().slice(0, 5));
  const reaching = eventsReaching(model, draft.tags);
  const about = stems.length
    ? reaching.filter((event) => stems.some((stem) => event.toLowerCase().includes(stem)))
    : reaching;
  const undoes = (event) => /Un[a-z]|Remov|Cancel|Withdr|Return|Delet|Archiv|Clos/.test(event.slice(1));
  const creates = (event) => /(Added|Defined|Registered|Created|Joined|Opened|Started|Catalogued)$/.test(event);
  const members = enumMembersFor(model, draft.valueType);
  const numeric = !draft.isList && literalKindOf(model, draft.valueType) === 'number' && !members;
  const out = [];
  for (const event of about) {
    const properties = (model['event-definitions'][event] || {}).properties || [];
    const carrying = (type) => properties.find((p) => p.propertyType === type && !p.isList);
    if (draft.isList) {
      const element = carrying(draft.valueType);
      if (element) out.push({ event, operation: undoes(event) ? 'remove' : 'append', value: { eventProperty: element.name } });
    } else if (members) {
      const member = members.find((m) => typeof m === 'string' && event.toLowerCase().includes(m.toLowerCase().slice(0, 5)));
      if (member) out.push({ event, operation: 'set', value: { enumMember: member } });
    } else if (draft.valueType === 'boolean') {
      if (undoes(event)) out.push({ event, operation: 'set', value: false });
      else if (stems.length || creates(event)) out.push({ event, operation: 'set', value: true });
    } else if (numeric && stems.length) {
      out.push({ event, operation: undoes(event) ? 'decrement' : 'increment', value: 1 });
    } else if (!(draft.tags || []).length && carrying(draft.valueType)) {
      out.push({ event, operation: 'set', value: { successor: { eventProperty: carrying(draft.valueType).name } } });
    }
  }
  return out;
}

// A sample value of a type, for a proposed check: a tag value named
// after its type (`c1` for a CourseId, 1 for a number), otherwise the
// blank a slot starts from.
function sampleValue(model, typeName) {
  const members = enumMembersFor(model, typeName);
  if (members) return members[0];
  const kind = literalKindOf(model, typeName);
  if (classifyType(model, typeName).kind === 'value' && isTagBearing(model, typeName)) {
    return kind === 'number' ? 1 : typeName.charAt(0).toLowerCase() + '1';
  }
  if (kind === 'number') return 0;
  if (kind === 'boolean') return false;
  return '';
}

// The first check a projection is proposed: the first event it
// handles – tagged by the same sample values its read gives – and the
// value the fold makes of it as its Then. One event, not one of each:
// a subscribe and an unsubscribe fold to where they started, which
// checks nothing. Null when it handles
// nothing, or something here has no sample (a record, a script that
// throws).
function projectionCheckGuess(model, name) {
  const projection = model['projection-definitions'][name];
  const types = projection ? projectionHandledTypes(model, name) : [];
  if (!types.length) return null;
  try {
    const tags = {};
    const read = {};
    for (const tag of projectionTagParams(projection)) {
      if (classifyType(model, tag.tagType).composite) return null;
      read[tag.name] = sampleValue(model, tag.tagType);
      tags[tag.name] = { tagType: tag.tagType, tagValue: read[tag.name] };
    }
    const args = {};
    for (const slot of projectionSlots(projection)) args[slot.name] = sampleValue(model, slot.propertyType);
    const given = types.slice(0, 1).map((event) => {
      const data = {};
      for (const p of (model['event-definitions'][event] || {}).properties || []) {
        if (classifyType(model, p.propertyType).composite) throw new Error('no sample for a record');
        data[p.name] = p.isList ? [] : sampleValue(model, p.propertyType);
      }
      return { event, data };
    });
    const then = foldProjection(model, given.map((step) => ({ type: step.event, data: step.data })), name,
      { tags: read, args });
    const body = { projection: name, tags, given, then };
    if (Object.keys(args).length) body.arguments = args;
    return body;
  } catch (error) {
    return null;
  }
}

// One side of a derived predicate or computation: another projection –
// read by whatever this one is read by – one of this projection's own
// parameters (10.0), or a typed value: on the right of a comparison, on
// either side of a computation. Enum members are offered exactly when
// the other side holds an enum, the same rule the rule editor follows.
function derivedSideEditor(model, draft, side, { allowLiteral } = {}) {
  const derived = draft.derived;
  const current = derived[side];
  const isRead = operandSource(current) === 'projection-read';
  const isParameter = operandSource(current) === 'parameter';
  // This projection's own parameters, tags then arguments, as the
  // draft has them – `{name, type}`.
  const own = [
    ...(draft.tags || []).filter((t) => t && t.name).map((t) => ({ name: t.name, type: t.tagType })),
    ...(draft.arguments || []).filter((a) => a && a.name).map((a) => ({ name: a.name, type: a.propertyType })),
  ];
  const ownChoice = (p) => [JSON.stringify({ parameterName: p.name }), propertyWords(p.name), null, { section: 'Its parameters' }];
  const options = [
    ...Object.keys(model['projection-definitions'])
      .filter((name) => !(state.projDraft && state.projDraft.name === name))
      .sort()
      .map((name) => [name, readable(name), null, own.length ? { section: 'Projections' } : undefined]),
    ...own.map(ownChoice),
  ];
  if (allowLiteral) options.push([LITERAL, 'a typed value…', null, own.length ? { section: 'Values' } : undefined]);
  const chosen = isRead ? (current.projection || '')
    : isParameter ? JSON.stringify({ parameterName: current.parameterName })
      : (current === undefined ? '' : LITERAL);

  const nodes = [pick(options, chosen, (v) => {
    if (v === LITERAL) derived[side] = '';
    else if (v.startsWith('{')) derived[side] = JSON.parse(v);
    else derived[side] = { projection: v };
    render();
  }, 'which projection?')];

  // Each tag the operand's projection declares, given one of this
  // projection's own parameters of that type – the partition flows
  // down, so a read of this one reads its operands at the same instance.
  if (isRead && current.projection) {
    for (const tag of projectionTagParams(model['projection-definitions'][current.projection])) {
      const options = own.filter((o) => o.type === tag.tagType)
        .map((o) => [JSON.stringify({ parameterName: o.name }), propertyWords(o.name)]);
      const held = (current.tags || {})[tag.name];
      const value = held === undefined ? '' : JSON.stringify(held);
      if (!held && options.length) current.tags = { ...(current.tags || {}), [tag.name]: JSON.parse(options[0][0]) };
      nodes.push(
        h('span', { class: 'muted tiny' }, `· by its ${propertyWords(tag.name)}`),
        pick(options, held === undefined && options.length ? options[0][0] : value, (v) => {
          current.tags = { ...(current.tags || {}), [tag.name]: JSON.parse(v) };
          render();
        }, options.length ? null : `this projection has no ${readable(tag.tagType)} parameter`));
    }
    // Its arguments: one of this projection's own parameters of the
    // type, passed on, or a literal.
    for (const slot of projectionSlots(model['projection-definitions'][current.projection])) {
      const held = (current.arguments || {})[slot.name];
      const passed = own.filter((o) => o.type === slot.propertyType)
        .map((o) => [JSON.stringify({ parameterName: o.name }), propertyWords(o.name)]);
      const isPassed = operandSource(held) === 'parameter';
      const set = (value) => { current.arguments = { ...(current.arguments || {}), [slot.name]: value }; };
      nodes.push(h('span', { class: 'muted tiny' }, `· with ${propertyWords(slot.name)} =`));
      if (passed.length) {
        nodes.push(pick([...passed, [LITERAL, 'a value…']], isPassed ? JSON.stringify(held) : LITERAL, (v) => {
          set(v === LITERAL ? '' : JSON.parse(v));
          render();
        }));
      }
      if (!isPassed) {
        nodes.push(h('input', {
          type: 'text', style: 'width:110px', value: held === undefined || held === null ? '' : String(held),
          onblur: (e) => set(literalOfType(model, slot.propertyType, e.target.value)),
          onkeydown: (e) => { if (e.key === 'Enter') e.target.blur(); },
        }));
      }
    }
  }

  if (!isRead && !isParameter && chosen === LITERAL) {
    const other = derived[side === 'leftHandSide' ? 'rightHandSide' : 'leftHandSide'];
    const otherType = operandSource(other) === 'projection-read' && other.projection
      ? (model['projection-definitions'][other.projection] || {}).valueType
      : operandSource(other) === 'parameter' ? (own.find((o) => o.name === other.parameterName) || {}).type : null;
    const members = otherType ? enumMembersFor(model, otherType) : null;
    if (members) {
      nodes.push(pick(members.map((m) => [m, readable(m)]),
        operandSource(current) === 'enum-member' ? current.enumMember : '',
        (v) => { derived[side] = { enumMember: v }; render(); }, 'which one?'));
    } else {
      nodes.push(h('input', {
        type: 'text', style: 'width:140px',
        value: current === undefined || current === null || typeof current === 'object'
          ? '' : String(current),
        placeholder: 'a value',
        onblur: (e) => {
          const text = e.target.value.trim();
          if (/^-?\d+(\.\d+)?$/.test(text)) derived[side] = Number(text);
          else if (/^(true|false)$/i.test(text)) derived[side] = /^true$/i.test(text);
          else derived[side] = text;
        },
        onkeydown: (e) => { if (e.key === 'Enter') e.target.blur(); },
      }));
    }
  }
  return nodes;
}

// What produces a projection's value: its handlers fold events
// (`declared`), a predicate or computation over other projections
// (`derived`), or code (`scripted`).
function projectionKindOf(draft) {
  return draft.derived ? 'derived' : draft.script ? 'scripted' : 'declared';
}

const PROJECTION_KIND_TOASTS = {
  declared: 'Declared – its handlers fold the events it reads.',
  derived: 'Now derived – worked out from other projections. The handlers are gone.',
  scripted: 'Now scripted – the declared operations are gone, the events they named are kept.',
};

// Turns a draft into another kind, in place – the Advanced switches and
// the wizard's first step alike. What the kind it leaves needed goes:
// a derived projection has no handlers and no initial value; a script
// keeps the events its handlers named, as code. Returns why it cannot,
// or null: a record is a value only code can advance, so leaving a
// script that holds one asks for the re-typing first.
function setProjectionKind(model, draft, kind) {
  const from = projectionKindOf(draft);
  if (from === kind) return null;
  if (kind === 'derived') {
    delete draft.script;
    delete draft.initialValue;
    draft.handlers = [];
    draft.valueType = 'boolean';
    draft.isList = false;
    draft.derived = {
      leftHandSide: { projection: '' },
      predicate: 'equals',
      rightHandSide: { projection: '' },
    };
    return null;
  }
  if (kind === 'scripted') {
    delete draft.derived;
    const initialState = draft.initialValue === undefined ? null : draft.initialValue;
    draft.script = { initialState };
    delete draft.initialValue;
    draft.handlers = (draft.handlers || []).map((handler) => ({ event: handler.event, code: 'state' }));
    return null;
  }
  if (from === 'scripted') {
    const cls = classifyType(model, draft.valueType);
    if (cls.kind === 'value' && cls.composite) {
      return `It holds ${readable(draft.valueType)}, a record – only code can advance one. Pick a single-value type first.`;
    }
    delete draft.script;
    draft.handlers = (draft.handlers || []).map((handler) => ({ event: handler.event, operation: 'set', value: '' }));
  } else {
    delete draft.derived;
    draft.handlers = [];
  }
  draft.initialValue = defaultInitialValue(model, draft);
  return null;
}

// ---------- the projection wizard ----------
//
// A new projection's editor, one step at a time – the command wizard's
// treatment (`WIZARD_STEPS`) for a projection's sections: what produces
// its value, its partition, its initial state, what moves it, and a
// first check. Each step is the real section, revealed once the one
// before it is answered; an empty step is skipped by name; and when the
// last is answered the page is simply the editor again. The name is
// stored at once, guesses from it already in place (`projectionGuess`),
// so everything after it edits a real definition – undo and the code
// view see it from the start. `state.projWizard` is `{name, at,
// guessed}`: the projection, the step reached, and which steps hold a
// guess, said in the step so it reads as an offer.
const PROJECTION_WIZARD_STEPS = [
  { key: 'kind' },
  {
    key: 'partition', skipWords: 'untagged – one value for the whole log',
    empty: (d) => !(d.tags || []).length && !(d.arguments || []).length,
  },
  // A derived projection has no initial state: it starts from what its
  // operands start at, and its type follows from what it derives.
  { key: 'initial', applies: (d) => !d.derived },
  {
    key: 'moves', skipWords: 'nothing moves it yet',
    empty: (d) => !d.derived && !(d.handlers || []).some((x) => x && x.event),
  },
  { key: 'check' },
];

const projectionWizardOrder = (key) => PROJECTION_WIZARD_STEPS.findIndex((step) => step.key === key);

function projectionWizardFor(name) {
  const wizard = state.projWizard;
  return wizard && name && wizard.name === name ? wizard : null;
}

// The steps a draft takes, and the one reached – the last of them at
// or before `at`, since a kind picked since may have dropped the step
// it was on.
function projectionWizardSteps(wizard, draft, { entityName } = {}) {
  const steps = PROJECTION_WIZARD_STEPS
    .filter((step) => (!step.applies || step.applies(draft)) && !(entityName && step.key === 'partition'));
  const reached = steps.filter((step) => projectionWizardOrder(step.key) <= projectionWizardOrder(wizard.at));
  return { steps, current: reached[reached.length - 1] || steps[0], shown: new Set(reached.map((s) => s.key)) };
}

// A projection named `label`, stored with what its name suggests, and
// its draft – undecided about its partition unless the name said one.
// `opened(name, draft, guessed)` runs inside the same gesture: it is
// where the caller opens the editor the wizard reveals.
//
// `fallbackTags` is a partition to propose when the name says none –
// what a command asking for the projection is about.
function createProjectionFromName(model, label, opened, { fallbackTags = [] } = {}) {
  const name = toPascal(label);
  if (!name) return toast('Give the projection a name.', true);
  const guess = projectionGuess(model, name);
  if (!guess.tags.length && guess.kind !== 'derived' && !/Numbering$/.test(name)) guess.tags = fallbackTags;
  const draft = blankProjectionDraft(model);
  const guessed = [];
  if (guess.kind === 'derived') {
    setProjectionKind(model, draft, 'derived');
    if (guess.valueType === 'integer') {
      draft.derived = { leftHandSide: { projection: '' }, operator: 'subtract', rightHandSide: { projection: '' } };
      draft.valueType = 'integer';
    }
    guessed.push('kind');
  } else if (guess.valueType) {
    draft.valueType = guess.valueType;
    draft.isList = guess.isList;
    draft.initialValue = guess.initialValue === undefined ? defaultInitialValue(model, draft) : guess.initialValue;
    guessed.push('initial');
  }
  if (guess.tags.length) {
    draft.tags = guess.tags;
    guessed.push('partition');
  }
  return run(() => {
    addDefinition('projection-definition', model.id, name, cleanProjectionBody(draft));
    state.projWizard = { name, at: 'kind', guessed };
    opened(name, draft, guessed);
    return name;
  });
}

// Answering the step reached and revealing the next. Leaving the
// partition undecided is the untagged answer; reaching the handlers
// proposes some (`handlerGuesses`) when there are none yet. The draft
// is saved first, so the check the last step proposes folds what is
// stored.
function advanceProjectionWizard(model, draft, { entityName } = {}) {
  const wizard = state.projWizard;
  if (!wizard) return;
  const { steps, current } = projectionWizardSteps(wizard, draft, { entityName });
  if (current.key === 'partition' && (draft.tags === null || draft.tags === undefined)) draft.tags = [];
  const next = steps[steps.indexOf(current) + 1];
  if (next && next.key === 'moves' && projectionKindOf(draft) === 'declared' && !(draft.handlers || []).length) {
    const guesses = handlerGuesses(model, wizard.name, draft);
    if (guesses.length) {
      draft.handlers = projectionDraftFrom({ handlers: guesses }).handlers;
      wizard.guessed = [...wizard.guessed, 'moves'];
    }
  }
  autoSaveProjectionDraft();
  if (next) wizard.at = next.key;
  else state.projWizard = null;
  render();
  if (next) focusProjectionWizardStep(next.key, next.key === 'check' || wizard.guessed.includes(next.key));
}

// Where the keyboard lands when a step is revealed: its first control,
// as in the command wizard (`focusWizardStep`) – or the bar's button,
// when the step arrives already answered (proposed handlers, the
// check) and continuing is the honest next thing to press.
function focusProjectionWizardStep(key, onBar) {
  setTimeout(() => {
    const bar = onBar && document.querySelector('.pwizard-bar button');
    if (bar) { bar.focus(); bar.scrollIntoView({ block: 'nearest' }); return; }
    const step = document.querySelector('.pstep-' + key);
    const target = step && step.querySelector('button:not(.hbtn), select, input');
    if (target) { target.focus(); target.scrollIntoView({ block: 'nearest' }); }
  }, 0);
}

// The bar under the step reached: one primary button saying what
// continuing means – an empty step is skipped by name – and the way to
// the whole editor at once. The check step's primary adds the check it
// proposes, and skipping it is the other way on.
function projectionWizardBar(model, draft, { current, check, entityName }) {
  const end = () => { state.projWizard = null; render(); };
  let primary;
  let skip = null;
  if (current.key === 'check') {
    primary = h('button', {
      class: 'btn primary',
      onclick: () => run(() => {
        if (check) {
          addDefinition('projection-scenario-definition', model.id, generateId(), check);
        }
        state.projWizard = null;
      }),
    }, check ? 'Add this check →' : 'Done');
    if (check) skip = h('button', { class: 'btn ghost', onclick: end }, 'Skip – no check yet');
  } else {
    const skipping = current.empty && current.empty(draft);
    primary = h('button', {
      class: 'btn primary',
      onclick: () => advanceProjectionWizard(model, draft, { entityName }),
    }, skipping ? `Skip – ${current.skipWords} →` : 'Continue →');
  }
  return h('div', { class: 'pwizard-bar' }, primary, skip,
    h('button', {
      class: 'btn ghost tiny', title: 'Stop revealing step by step and show the whole projection',
      onclick: end,
    }, 'Show all steps'));
}

// The wizard's first step: what produces the value, as three answers
// rather than the Advanced switches. Code is experimental, offered with
// the flag on.
function projectionKindSection(model, draft) {
  const kind = projectionKindOf(draft);
  const kinds = [
    ['declared', 'From events', 'its handlers fold the events it reads'],
    ['derived', 'From other projections', 'one comparison or computation'],
    ...(experimental() || kind === 'scripted' ? [['scripted', 'From code', 'a script – experimental']] : []),
  ];
  return projectionSection('gets its value', null, null,
    h('div', { class: 'pkinds' }, kinds.map(([key, title, words]) => h('button', {
      type: 'button', class: 'pkind' + (kind === key ? ' on' : ''),
      'aria-pressed': kind === key ? 'true' : 'false',
      onclick: () => {
        const problem = setProjectionKind(model, draft, key);
        if (problem) return toast(problem, true);
        render();
      },
    }, h('b', {}, title), h('span', {}, words)))));
}

// The proposed first check, as the code view writes it.
function projectionCheckSection(model, check) {
  let text = null;
  if (check) {
    try { text = printScenario(model, 'projection-scenario-definition', check); } catch (error) { text = null; }
  }
  return projectionSection('first check', null, null,
    text
      ? [h('pre', { class: 'pcheck' }, text),
          h('div', { class: 'muted tiny' }, 'The first event it handles, and what it folds that to – add it, and change it on the Checks tab.')]
      : h('div', { class: 'muted tiny' }, 'Nothing to check yet – it handles no event.'));
}

// The editor of a projection, wherever one is edited: this page, an
// entity's own page for the ones bound as its properties, and the
// definition modals. Sections on the left – value, tags, handlers (or
// what it is derived by), advanced – and what it works out to on the
// right, which wraps under them where there is no room. `draft` is
// mutated in place; an open row saves it as it changes, a new one on
// Create.
//
// `entityName` says the draft is an entity property's, which the "read
// by" line says: the entity reads it tagged by its identifier.
// Everything else is identical, which is the point: there is no second
// kind of thing here to edit differently.
//
// `onNewType(choose)`, given in a definition modal, adds a row to the
// type picker that creates a custom type and hands it to `choose`;
// `onChecks`, given by an open row, makes the checks count its way to
// the Checks tab.
function projectionFields(model, draft, { entityName, onNewType, onChecks } = {}) {
  const eventNames = Object.keys(model['event-definitions']).sort();
  const enumType = isStringEnumType(model, draft.valueType) ? draft.valueType : null;

  const retype = (v) => {
    draft.valueType = v;
    // Everything scoped by the type goes with it: the operand picker
    // is built from it, and a value of the old type is not a value
    // of the new one.
    for (const handler of draft.handlers || []) { handler.value = ''; handler.valueText = ''; }
    if (!draft.script) draft.initialValue = defaultInitialValue(model, draft);
  };
  const advanced = projectionAdvanced();
  const savedName = state.projDraft && state.projDraft.body === draft ? state.projDraft.name : null;
  const fieldLabel = (text, control) => h('label', { class: 'pfield' }, h('span', { class: 'pk' }, text), control);
  // A projection just named shows its sections one step at a time
  // (`PROJECTION_WIZARD_STEPS`): only those reached, each marked so the
  // keyboard can land in it, with a word on the steps its name guessed.
  const wizard = projectionWizardFor(savedName);
  const reveal = wizard ? projectionWizardSteps(wizard, draft, { entityName }) : null;
  const check = wizard && reveal.current.key === 'check' ? projectionCheckGuess(model, savedName) : null;
  const wizardSections = (pairs) => pairs.map(([key, section]) => {
    if (!section) return null;
    if (!wizard) return section;
    if (!reveal.shown.has(key)) return null;
    section.className += ' pstep-' + key;
    if (wizard.guessed.includes(key) && key !== 'kind') {
      section.appendChild(h('div', { class: 'pguess muted tiny' }, 'Guessed from its name – change anything here.'));
    }
    return section;
  });

  // ---- value: type, cardinality, initial ----

  const typePicker = pick([
    ...projectionTypeOptions(model, { scripted: !!draft.script }),
    ...(onNewType ? [[NEW_DEFINITION, NEW_TYPE_LABEL]] : []),
  ], draft.valueType, (v) => {
    if (v === NEW_DEFINITION) {
      // Picked from under the new type's modal, against a fresh model.
      return onNewType((typeName) => retype(typeName));
    }
    retype(v);
    render();
  }, 'type');

  const cardinalityPicker = pick([['single', 'single'], ['list', 'list']],
    draft.isList ? 'list' : 'single', (v) => {
      draft.isList = v === 'list';
      // A list and a single value do not start from the same shape,
      // and the operations that advance them differ, so both are
      // reset rather than left describing the arity it just left.
      if (!draft.script) {
        draft.initialValue = defaultInitialValue(model, draft);
        const allowed = operationsFor(model, draft);
        for (const handler of draft.handlers || []) {
          if (!allowed.includes(handler.operation)) handler.operation = 'set';
        }
      }
      render();
    });

  // A scripted state is any JSON – nothing outside the code reads it
  // whole, so it is not typed.
  const scriptInitial = () => h('input', {
    type: 'text', class: 'mono',
    value: JSON.stringify(draft.script.initialState),
    onblur: (e) => {
      let parsed;
      try { parsed = JSON.parse(e.target.value); }
      catch { return toast('That initial state is not valid JSON.', true); }
      draft.script.initialState = parsed;
      render();
    },
    onkeydown: (e) => { if (e.key === 'Enter') e.target.blur(); },
  });

  const initial = draft.derived || draft.script ? null : initialValueControl(model, draft);
  // What it holds before any event – what the section is about, and
  // so what it is called. A derived projection has no initial state:
  // the section says what it holds, and that it starts from its
  // operands.
  const valueSection = projectionSection(draft.derived ? 'value' : 'initial state', hint('proj-value',
    draft.derived ? 'Value' : 'Initial state', [
    'What it holds before any handled event: its type, single or a list, and the value it starts at. '
    + 'For a numbering that is the first number issued, and the only place a prefix is stated.',
    'null is no value yet – not the empty string.',
  ]), null,
    draft.derived
      ? h('div', { class: 'pfields' },
          // A comparison holds a boolean and nothing else; a computation
          // holds the number its author types it as – set from its
          // operands when the operator is picked, editable after.
          fieldLabel('type', draft.derived.operator !== undefined ? typePicker : h('span', { class: 'chip' }, 'boolean')),
          fieldLabel('starts at', h('span', { class: 'muted tiny' }, '– its operands\' start')))
      : h('div', { class: 'pfields' },
          fieldLabel('type', typePicker),
          fieldLabel('cardinality', cardinalityPicker),
          fieldLabel('starts at', draft.script ? scriptInitial() : initial.control)),
    initial ? initial.below : null,
    enumType && !draft.derived
      ? h('div', { class: 'use' }, h('span', { class: 'pk' }, 'members '), ...enumMemberChips(model, enumType))
      : null);

  // ---- parameters ----
  //
  // What a read of it gives (10.0): its tags, each named and of a tag
  // type – or none, an untagged projection folding the whole log – then
  // its arguments. An entity's property is tagged by the entity's
  // identifier and nothing else, which is what binding it means, so
  // that one is shown, not offered. A new projection has not decided
  // yet (`tags: null`) until the wizard's partition step is answered –
  // with tags, or skipped as untagged.
  const tagsHint = hint('proj-tags', 'Partition', [
    'What a read gives. A tag is what each value is kept per: it narrows the query.',
    'An argument is a value the read passes in – a script or a derived projection uses it; it narrows nothing.',
    'Untagged: one value for the whole log – a numbering is one.',
  ]);
  const tagsSection = projectionParametersEditor(model, draft, savedName, tagsHint, {
    fixedTag: entityName
      ? h('span', { class: 'chip entity' },
          h('i', { class: 'ic' }, entityIcon(model, entityName)), 'each ' + readable(entityName))
      : null,
  });

  // ---- handlers ----

  // One handler per event type is law, so an event another row already
  // claims is simply not offered – the row's own event stays, or the
  // picker could not show its current choice. An event that carries
  // none of its tags is offered too, and said as an advisory on the
  // projection (`projectionTagProblem`) rather than hidden here.
  // Those that cannot reach it – carrying no tag of a type its
  // partition names – come last, under a heading that says why, rather
  // than missing from the list with nothing to say so.
  const reaching = new Set(eventsReaching(model, draft.tags));
  const unreachedHeading = 'not tagged by ' + (draft.tags || []).filter((t) => t && t.tagType)
    .map((t) => readable(t.tagType)).join(' and ');
  const eventChoicesFor = (handler) => {
    const offered = unhandledEventChoices(eventNames, draft.handlers, handler);
    return [
      ...offered.filter((n) => reaching.has(n)).map((n) => [n, readable(n), eventIcon(model, n)]),
      ...offered.filter((n) => !reaching.has(n))
        .map((n) => [n, readable(n), eventIcon(model, n), { section: unreachedHeading }]),
    ];
  };

  const declaredHandlerRows = (draft.handlers || []).map((handler, i) => {
    const event = model['event-definitions'][handler.event];
    const operations = operationsFor(model, draft);
    if (!operations.includes(handler.operation)) handler.operation = operations[0];
    const values = handlerValueChoices(model, draft, event, handler.operation);
    const enumMembers = enumMembersFor(model, draft.valueType);
    // A value the row can no longer offer – a successor once the verb
    // is no longer `set`, a stored `currentValue` – would leave the
    // picker showing one thing and the draft saving another, so it
    // resets to the first offer, as the change adder's does.
    if (event && handler.value && handler.value !== LITERAL
      && !values.some(([v]) => v === handler.value)) {
      handler.value = values.length ? values[0][0] : (enumMembers ? '' : LITERAL);
    }
    return h('div', { class: 'phandler' },
      h('span', { class: 'pk' }, 'on'),
      pick(eventChoicesFor(handler), handler.event,
        (v) => { handler.event = v; handler.value = ''; handler.valueText = ''; render(); },
        'event'),
      h('span', { class: 'pk' }, '⇒'),
      // The verb is a word or two and keeps its width; the names
      // beside it are what give way.
      h('span', { class: 'pop' }, operationControl(operations, handler)),
      ...(event
        ? operandPicker(values, handler, 'value', { allowLiteral: !enumMembers })
        : [pick([], '', () => {}, 'pick an event first')]),
      h('button', {
        class: 'btn tiny danger', title: 'Remove this handler',
        onclick: () => { draft.handlers.splice(i, 1); render(); },
      }, '×'));
  });

  const scriptedHandlerRows = !draft.script ? [] : (draft.handlers || []).map((handler, i) => h('div', { class: 'script-handler' },
    h('div', { class: 'phandler' },
      h('span', { class: 'pk' }, 'on'),
      pick(eventChoicesFor(handler), handler.event,
        (v) => { handler.event = v; render(); }, 'event'),
      h('button', {
        class: 'btn tiny danger', title: 'Remove this handler',
        onclick: () => { draft.handlers.splice(i, 1); render(); },
      }, '×')),
    scriptCodeEditor(scriptEditorKey(draft, i), {
      code: handler.code || '',
      preamble: scriptHandlerPreamble(model, draft, handler),
      onCode: (code) => { handler.code = code; },
    })));

  const handlersSection = draft.derived ? null : projectionSection('handlers',
    hint('proj-handlers', 'Handlers', [
      'Events that move the value – one handler per event type.',
      'Without any, it keeps its initial value forever.',
      ...(draft.script ? ['Scripted: each handler is a body over state, event, args and tags '
        + '(the values it is read by, by name), returning the next state. Nothing here runs or checks it.'] : []),
    ]),
    h('button', {
      class: 'btn ghost tiny',
      onclick: () => {
        (draft.handlers = draft.handlers || []).push(draft.script
          ? { event: '', code: 'state' }
          : { event: '', operation: 'set', value: '' });
        render();
      },
    }, '+ handler'),
    (draft.handlers || []).length
      ? (draft.script ? scriptedHandlerRows : declaredHandlerRows)
      : h('div', { class: 'empty' }, '–'));

  // ---- derived: one predicate or computation over other projections ----

  // One picker, two groups: what compares (and holds a boolean) and
  // what computes (and holds a number). Picking one sets the type to
  // what it yields; a computation's stays editable.
  const computes = !!draft.derived && draft.derived.operator !== undefined;
  const derivedChoice = !draft.derived ? '' : computes ? 'o:' + draft.derived.operator : 'p:' + draft.derived.predicate;
  const derivedChoices = [
    ...DERIVED_PREDICATES.map((p) => ['p:' + p, `compare → boolean${GROUP_SEP}${p}`]),
    ...DERIVED_OPERATORS.map((o) => ['o:' + o,
      `compute → number${GROUP_SEP}${DERIVED_OPERATOR_SYMBOL[o] ? `${DERIVED_OPERATOR_SYMBOL[o]} (${o})` : `${o}(a, b)`}`]),
  ];
  const pickDerived = (v) => {
    const derived = draft.derived;
    if (v.startsWith('p:')) {
      derived.predicate = v.slice(2);
      delete derived.operator;
      draft.valueType = 'boolean';
    } else {
      derived.operator = v.slice(2);
      delete derived.predicate;
      delete derived.negate;
      draft.valueType = derivedResultBase(model, derived, draft)
        || (numericBaseOf(model, draft.valueType) ? draft.valueType : 'integer');
    }
    draft.isList = false;
    render();
  };

  const derivedSection = !draft.derived ? null : projectionSection('derived',
    hint('proj-derived', 'Derived', [
      'One comparison or computation over other projections – read by this one\'s parameters – and its own parameters.',
      'A comparison holds a boolean; a computation (+, -, *, min, max) a number, null while a side is null.',
      'Their queries are its query, so reading it guards the append exactly as reading them would.',
    ]), null,
    h('div', { class: 'adder' }, ...derivedSideEditor(model, draft, 'leftHandSide', { allowLiteral: computes })),
    h('div', { class: 'adder' },
      computes ? null : h('label', { class: 'tiny muted' }, h('input', {
        type: 'checkbox', checked: !!draft.derived.negate,
        onchange: (e) => {
          if (e.target.checked) draft.derived.negate = true;
          else delete draft.derived.negate;
        },
      }), ' not'),
      pick(derivedChoices, derivedChoice, pickDerived)),
    h('div', { class: 'adder' }, ...derivedSideEditor(model, draft, 'rightHandSide', { allowLiteral: true })));

  // ---- advanced ----
  //
  // What most projections never need sits behind the switch. A
  // projection that already uses it shows it anyway: the switch hides
  // offers, never what is stored.

  const kindToggle = (kind, label) => h('label', { class: 'tiny' }, h('input', {
    type: 'checkbox', checked: projectionKindOf(draft) === kind,
    onchange: (e) => {
      const problem = setProjectionKind(model, draft, e.target.checked ? kind : 'declared');
      if (problem) { e.target.checked = !e.target.checked; return toast(problem, true); }
      toast(PROJECTION_KIND_TOASTS[e.target.checked ? kind : 'declared']);
      render();
    },
  }), ' ' + label);
  const derivedToggle = kindToggle('derived', 'derived projection');
  // Scripted is experimental: offered with the flag on, and shown
  // regardless on a projection that already is one – so it can be
  // turned back into a declared one.
  const scriptToggle = !experimental() && !draft.script ? null : kindToggle('scripted', 'scripted projection');

  const scriptFields = draft.script ? [
    h('div', { class: 'pfields' },
      fieldLabel('exposes', h('input', {
        type: 'text', class: 'mono', value: draft.script.exposes || '',
        placeholder: 'the state itself',
        title: 'Which field of the state a rule reads, when the state is a record',
        onblur: (e) => {
          const text = toCamel(e.target.value);
          if (text) draft.script.exposes = text; else delete draft.script.exposes;
          render();
        },
      }))),
  ] : [];

  const advancedSection = advanced || draft.script || draft.derived
    ? projectionSection('advanced', null, null,
        h('div', { class: 'adder' }, scriptToggle, derivedToggle),
        ...scriptFields)
    : null;

  const editor = h('div', { class: 'pmain' },
    h('div', { class: 'pbar' },
      h('span', { class: 'grow' }),
      h('button', {
        type: 'button', class: 'pswitch' + (advanced ? ' on' : ''),
        'aria-pressed': advanced ? 'true' : 'false',
        title: 'Show scripted and derived projections, and where it is used',
        onclick: () => setProjectionAdvanced(!advanced),
      }, h('span', { class: 'track' }, h('span', { class: 'knob' })), 'Advanced')),
    ...wizardSections([
      ['kind', wizard ? projectionKindSection(model, draft) : null],
      ['partition', tagsSection],
      [draft.derived ? 'moves' : 'initial', valueSection],
      ['moves', draft.derived ? derivedSection : handlersSection],
      ['check', wizard ? projectionCheckSection(model, check) : null],
    ]),
    wizard ? null : advancedSection,
    wizard ? projectionWizardBar(model, draft, { current: reveal.current, check, entityName }) : null);

  return [h('div', { class: 'peditor' },
    editor,
    projectionUsage(model, draft, savedName, { entityName, advanced, onChecks }))];
}

// The switch behind the rarely used parts of the projection editor,
// remembered in this browser like the other view choices.
const PROJECTION_ADVANCED_KEY = 'dcb-playground:projection-advanced';
function projectionAdvanced() {
  try { return localStorage.getItem(PROJECTION_ADVANCED_KEY) === 'on'; } catch { return false; }
}
function setProjectionAdvanced(on) {
  try { localStorage.setItem(PROJECTION_ADVANCED_KEY, on ? 'on' : 'off'); } catch { /* per-viewer only */ }
  render();
}

// One section of the projection editor: a monospace heading with its
// ⓘ, an action at the right of the heading, and the body.
function projectionSection(title, info, action, ...body) {
  return h('section', { class: 'psection' },
    h('div', { class: 'phead' },
      h('span', { class: 'pk' }, title), info, h('span', { class: 'grow' }), action),
    ...body);
}

// What the definition works out to and where it is used, beside the
// editor: the query always, the checks once it is saved, who reads it
// and what binds it behind the Advanced switch.
function projectionUsage(model, draft, savedName, { entityName, advanced, onChecks }) {
  const block = (title, ...body) => h('div', { class: 'pusage-block' }, h('div', { class: 'pk' }, title), ...body);
  const checks = savedName ? projectionScenariosFor(model, savedName) : [];
  const trouble = checks.filter((e) => {
    const status = runProjectionScenario(model, e.body).status;
    return status === 'drifted' || status === 'broken';
  }).length;
  const readers = savedName ? projectionReaders(model, savedName) : [];
  const bound = savedName ? boundAs(model, savedName) : [];
  const checksWords = checks.length
    ? (trouble ? `${trouble} of ${checks.length} failing` : `${checks.length} passing`)
    : 'none';
  return h('aside', { class: 'pusage' },
    block('query', projectionQueryWords(model, draft)),
    savedName ? block('checks', onChecks
      ? h('button', { type: 'button', class: 'linkish', onclick: onChecks },
          checks.length ? h('span', { class: 'badge' + (trouble ? '' : ' clear') }, trouble || checks.length) : null,
          ' ', checksWords)
      : h('span', { class: 'tiny' }, checksWords)) : null,
    advanced && savedName ? block('read by', readers.length
      ? readers.map((command) => h('span', {
          class: 'chip command linkable', title: 'Open ' + readable(command),
