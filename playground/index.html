  const { machines, excluded } = lifecycleMachines(model);
  if (!machines.length) {
    // "Nothing to draw" and "nothing designated" are different answers,
    // and a model whose only lifecycle is scripted is the second. Saying
    // the first would be telling the author their designation did not
    // land.
    const designated = excluded.filter((e) => e.reason !== 'none');
    main.appendChild(h('div', { class: 'empty' }, designated.length
      ? 'Nothing here can be drawn as a machine, though a lifecycle is designated.'
      : 'No entity has a lifecycle yet – add one from an entity’s page (+ lifecycle), and '
        + 'its machine appears here.'));
    if (excluded.length) main.appendChild(lifecycleExclusions(excluded));
    return;
  }

  // Existence-only machines first and together: they are one line each,
  // and reading them as a list says something a row of identical
  // two-node diagrams would bury – which things this model knows only
  // whether they are there, and which command is trusted to say so.
  const compact = machines.filter((m) => m.compact);
  const full = machines.filter((m) => !m.compact);

  if (compact.length) {
    main.appendChild(h('h3', { class: 'rulemap-feature' },
      full.length ? 'Existence only' : 'Existence'));
    main.appendChild(h('div', { class: 'muted small', style: 'margin-bottom:6px' },
      'Two states, so no vocabulary – these either exist or they do not. '
      + 'Add a third state from the entity’s own page.'));
    compact.forEach((machine) => renderCompactLifecycle(model, main, machine));
  }

  if (full.length) {
    if (compact.length) main.appendChild(h('h3', { class: 'rulemap-feature' }, 'Lifecycles'));
    main.appendChild(h('div', { class: 'muted small', style: 'margin-bottom:4px' },
      'Hover or click a state for the commands allowed there.'));
    full.forEach((machine, index) => renderLifecycleMachine(model, main, machine, index));
  }

  const anyUnguarded = machines.some((m) => lifecycleUnguarded(m).length);
  if (anyUnguarded) {
    main.appendChild(h('div', { class: 'lc-fn', style: 'margin-top:14px' },
      h('span', { class: 'lc-dot' }), ' marks a command with no rule over that status – nothing '
      + 'refuses it at any state, and an arrow only it feeds starts at the initial state by '
      + 'convention.'));
  }
  const machineEntities = new Set(machines.map((m) => m.entity));
  const shared = Object.values(model['command-definitions']).some((body) =>
    new Set((body.boundary || []).filter((b) => b && machineEntities.has(b.entity))
      .map((b) => b.entity)).size > 1);
  if (shared) {
    main.appendChild(h('div', { class: 'lc-fn' },
      'A command that binds two entities counts toward both machines – each machine reads only '
      + 'the rules over its own status.'));
  }
  for (const machine of machines) {
    if (!machine.opaque.length) continue;
    main.appendChild(h('div', { class: 'lc-fn' },
      `${machineWords(machine)} is also touched by `
      + machine.opaque.map(readable).join(', ')
      + ' in a way this page cannot read (a computed value or a non-set operation).'));
  }
  if (excluded.length) main.appendChild(lifecycleExclusions(excluded));
}

// Who is not drawn, and why. Every reason here is a legitimate model,
// not a defect – only `dangling` is also an advisory – so this is a
// footnote rather than a warning.
function lifecycleExclusions(excluded) {
  const reasons = {
    none: 'designates no lifecycle',
    dangling: 'designates a property it does not declare',
    scripted: 'its lifecycle is folded by a script',
    derived: 'its lifecycle is derived',
    list: 'its lifecycle holds a list',
    stateless: 'its lifecycle is typed with something that has no states',
  };
  return h('div', { class: 'lc-fn' }, 'Not on this page: '
    + excluded.map((e) => `${readable(e.entity)} (${reasons[e.reason] || e.reason})`).join(', ')
    + '.');
}

// A boolean lifecycle in one row: what brings the thing into being, what
// is allowed once it is there, and – the reason this is on the page at
// all – the dot on anything that never checks.
function renderCompactLifecycle(model, main, machine) {
  const creators = machine.transitions.filter((t) => t.target === 'true');
  const unguarded = lifecycleUnguarded(machine);
  const guarded = (machine.perState.true || []).filter((e) => !e.unguarded);

  const row = h('div', { class: 'card command rulemap-row' },
    h('div', { class: 'rulemap-cmd' },
      h('button', {
        class: 'lc-ename', type: 'button', title: 'Open ' + readable(machine.entity),
        onclick: () => openEntity(machine.entity),
      }, h('i', { class: 'ic' }, entityIcon(model, machine.entity)), readable(machine.entity))),
    h('div', { class: 'rulemap-arrow' }, '→'),
    h('div', { class: 'rulemap-rules' },
      creators.length
        ? creators.map((t) => h('div', { class: 'rulemap-rule' },
          eventRef(model, t.event, { cls: 'chip event tiny linkable' }),
          h('span', { class: 'verb' }, ' brings one into being'),
          t.unguarded ? h('span', {
            class: 'lc-dot',
            title: t.publishers.map((p) => readable(p.command)).join(', ')
              + ' carries no rule over ' + machineWords(machine)
              + ' – it would run even for one that already exists',
          }) : null))
        : h('div', { class: 'empty tiny' }, 'nothing records one of these yet')),
    h('div', { class: 'rulemap-arrow' }, '→'),
    h('div', { class: 'rulemap-events' },
      guarded.length
        ? h('div', { class: 'tiny muted' },
          guarded.length + ' command' + (guarded.length === 1 ? '' : 's')
          + ' require one to exist')
        : h('div', { class: 'empty tiny' }, 'nothing requires one to exist')));

  if (unguarded.length) {
    row.appendChild(h('div', { class: 'lc-fn lc-rowwarn' },
      h('span', { class: 'lc-dot' }),
      ' no rule over ' + machineWords(machine) + ': '
      + unguarded.map(readable).join(', ')));
  }
  main.appendChild(row);
}

function renderLifecycleMachine(model, main, machine, index) {
  const layout = lifecycleLayout(machine);
  const unguardedNames = lifecycleUnguarded(machine);

  const cluster = h('div', { class: 'lc-cluster', 'data-key': 'lifecycle:' + machine.entity },
    h('button', {
      class: 'lc-ename', type: 'button', title: 'Open ' + readable(machine.entity),
      onclick: () => openEntity(machine.entity),
    }, h('i', { class: 'ic' }, entityIcon(model, machine.entity)), readable(machine.entity)),
    h('span', {
      class: 'chip entity tiny linkable', title: 'Open ' + readable(machine.projection),
      onclick: () => goToProjection(machine.projection),
    }, readable(machine.valueType)));
  main.appendChild(cluster);

  const band = h('div', { class: 'lc-band', style: `width:${layout.width}px; height:${layout.height}px` });

  // The wires, one SVG from the computed geometry. Marker ids are
  // scoped per machine so two bands never share one.
  const ah = `lc-ah-${index}`;
  const ahg = `lc-ahg-${index}`;
  let wires = `<svg viewBox="0 0 ${layout.width} ${layout.height}" preserveAspectRatio="none">`
    + `<defs><marker id="${ah}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">`
    + `<path d="M 0 0 L 10 5 L 0 10 z" fill="var(--event)"></path></marker>`
    + `<marker id="${ahg}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">`
    + `<path d="M 0 0 L 10 5 L 0 10 z" fill="var(--border-strong)"></path></marker></defs>`;
  const entry = machine.initial === null ? null : layout.at[machine.initial];
  if (entry) {
    const y = entry.y + LC_NODE_H / 2;
    wires += `<circle cx="24" cy="${y}" r="4" fill="var(--border-strong)"></circle>`
      + `<path d="M 28 ${y} C 34 ${y}, 38 ${y}, ${entry.x - 4} ${y}" fill="none" `
      + `stroke="var(--border-strong)" stroke-width="1.8" marker-end="url(#${ahg})"></path>`;
  }
  for (const edge of layout.edges) {
    wires += `<path d="${edge.path}" fill="none" stroke="var(--event)" stroke-width="1.8" `
      + `marker-end="url(#${ah})"></path>`;
  }
  // The quiet loop over a state whose commands leave the status where
  // it is – the count is on the band, the names are in the popover.
  for (const node of layout.nodes) {
    const stays = lifecycleStateRows(machine, node.state).stays.length;
    if (!stays) continue;
    const cx = node.x + node.w / 2;
    wires += `<path d="M ${cx - 15} ${node.y - 2} C ${cx - 15} ${node.y - 24}, `
      + `${cx + 15} ${node.y - 24}, ${cx + 15} ${node.y - 6}" fill="none" `
      + `stroke="var(--event)" stroke-width="1.5" marker-end="url(#${ah})"></path>`;
  }
  wires += '</svg>';
  band.appendChild(h('div', { class: 'lc-wires' }, svg(wires)));

  for (const edge of layout.edges) {
    const t = edge.transition;
    const via = t.publishers.map((p) => readable(p.command)).join(', ');
    band.appendChild(h('div', {
      class: 'lc-elabel', style: `left:${edge.labelX}px; top:${edge.labelY}px`,
    }, eventRef(model, t.event, { cls: 'chip event tiny linkable' }),
      t.unguarded ? h('span', {
        class: 'lc-dot',
        title: (via || 'This event’s command') + ' carries no rule over '
          + machineWords(machine),
      }) : null));
  }

  for (const node of layout.nodes) {
    const rows = lifecycleStateRows(machine, node.state);
    if (rows.stays.length) {
      band.appendChild(h('div', {
        class: 'lc-loop', style: `left:${node.x + node.w / 2}px; top:${node.y - 42}px`,
        title: rows.stays.length + ' command' + (rows.stays.length === 1 ? '' : 's')
          + ' leave it where it is',
      }, rows.stays.length + ' stay'));
    }

    const caps = [];
    if (node.state === machine.initial) caps.push('initial');
    if (machine.terminal.includes(node.state)) caps.push('terminal');
    const hot = h('div', {
      class: 'lc-hot' + (machine.terminal.includes(node.state) ? ' terminal' : ''),
      style: `left:${node.x}px; top:${node.y}px`,
    });
    hot.appendChild(h('button', {
      class: 'lc-node', type: 'button', style: `width:${node.w}px; height:${LC_NODE_H}px`,
      'aria-expanded': 'false',
      onclick: (e) => {
        const on = hot.classList.toggle('on');
        e.currentTarget.setAttribute('aria-expanded', on ? 'true' : 'false');
      },
    }, h('span', { class: 'st', title: lifecycleStateWords(machine, node.state) },
      lifecycleStateWords(machine, node.state)),
      caps.length ? h('span', { class: 'cap' }, caps.join(' · ')) : null));

    const count = rows.moves.length + rows.stays.length;
    if (count) hot.appendChild(h('span', { class: 'lc-badge' }, String(count)));

    hot.appendChild(h('div', { class: 'lc-pop lc-rows' },
      ...lifecycleRowsView(model, machine, rows, unguardedNames)));
    band.appendChild(hot);
  }

  main.appendChild(h('div', { class: 'lc-scroll' }, band));
}

// The popover's rows.
function lifecycleRowsView(model, machine, rows, unguardedNames) {
  const row = (entry) => h('div', { class: 'lc-prow' },
    h('button', {
      class: 'cmd', type: 'button', title: 'Open ' + readable(entry.command),
      onclick: () => goToCommand(entry.command),
    }, iconPrefix(commandIcon(model, entry.command)) + readable(entry.command)),
    entry.target ? h('span', { class: 'to' }, '→ ' + lifecycleStateWords(machine, entry.target)) : null,
    entry.unguarded ? h('span', {
      class: 'lc-dot',
      title: 'No rule over ' + machineWords(machine) + ' – would run at any state',
    }) : null);

  const out = [];
  if (rows.moves.length) out.push(h('h4', {}, 'Moves on'), ...rows.moves.map(row));
  if (rows.stays.length) {
    out.push(h('h4', {}, rows.moves.length ? 'Stays here' : 'Allowed here · unchanged'),
      ...rows.stays.map(row));
  }
  if (!out.length) {
    out.push(h('div', { class: 'lc-none' }, 'Nothing is guarded to run here.'));
    if (unguardedNames.length) {
      out.push(h('div', { class: 'lc-warn' },
        'only unguarded ' + unguardedNames.map(readable).join(', ') + ' would still run'));
    }
  }
  return out;
}

// The event's own shape: rename a field, retype it, remove it, add
// one. The one thing this does *not* do is say what fills it from any
// particular command – that mapping is `eventFields`' job, on the
// command's own page, because it is specific to that command's payload
// and this page is not.
// Which of an event's values are tags is said on each field's own row
// (`eventTagToggles`), the way the code view marks it in place. What is
// left for here is a listed path that no longer means anything – its
// field gone or retyped – kept in view until it is dropped, since no
// row is left to untick it on. Nothing is implied: an unticked value is
// an ordinary one, and the advisories say so.
function eventTagsEditor(model, name, event) {
  const stale = (event.tags || []).filter((path) => resolveEventTagPath(model, event, path).problem);
  if (!stale.length) return null;
  return h('div', { class: 'refs', style: 'margin-top:12px' },
    h('div', { class: 'muted tiny' }, 'Tags that tag nothing'),
    h('div', { class: 'row', style: 'flex-wrap:wrap;gap:10px;margin-top:4px' },
      stale.map((path) => h('span', { class: 'tiny', title: resolveEventTagPath(model, event, path).problem },
        h('span', { class: 'diag-mark' }, '⚠ '), h('code', {}, path), ' ',
        h('button', {
          class: 'btn tiny danger', title: 'Drop this tag',
          onclick: () => patch('event-definition', name, (b) => { b.tags = (b.tags || []).filter((p) => p !== path); }),
        }, '×')))));
}

// One field's tag toggles: `tag` for a value of a tag type, `tag each
// productId` for a tag-marked field of the records a list holds (`tag
// productId` on one record). Ticked is listed; the code view writes the
// same mark in front of the field or after its type.
function eventTagToggles(model, name, event, property) {
  const listed = event.tags || [];
  return idLeavesOfType(model, property.propertyType).map((leaf) => {
    const path = leaf.field === null ? property.name : `${property.name}.${leaf.field}`;
    const label = leaf.field === null ? 'tag' : `tag ${property.isList ? 'each ' : ''}${leaf.field}`;
    return h('label', { class: 'tiny muted', title: listed.includes(path)
      ? 'A tag of this event – a query by it finds the event' : 'An ordinary value – no query by tag finds the event by it' },
      h('input', {
        type: 'checkbox', checked: listed.includes(path),
        onchange: (e) => patch('event-definition', name, (b) => {
          b.tags = e.target.checked ? [...(b.tags || []), path] : (b.tags || []).filter((p) => p !== path);
        }),
      }), ' ', label);
  });
}

function eventFieldsEditor(model, name, event) {
  const where = 'event:' + name;
  const rows = (event.properties || []).map((p, i) => {
    if (editingMember(where, p.name)) {
      // An event property has no initial value – nothing projects it,
      // it is simply carried.
      return memberEditor(model, {
        member: p, where,
        editType: (typeName) => openDefinitionModal(model, { kind: 'custom-type', name: typeName }),
        onReplace: (next) => patch('event-definition', name, (b) => { b.properties[i] = next; }),
        onRename: (newName) => {
          warnScripted(model, name);
          return renameMember('event-definition', model.id, name, 'property', p.name, newName);
        },
      });
    }
    const enumType = isStringEnumType(model, p.propertyType) ? p.propertyType : null;
    const dropField = () => removeEventField(model, name, i, p.name);
    return [
      qrow('div', {
        cls: 'field', key: 'evown:' + name + ':' + p.name,
        onRemove: dropField,
      },
        h('span', { class: 'nm' }, propertyWords(p.name)),
        ...eventTagToggles(model, name, event, p),
        h('span', { class: 'grow', style: 'flex:1' }),
        reveal(
          h('span', {
            class: 'chip editable', title: 'Rename or retype this field',
            onclick: () => openMember(where, p.name),
          }, readable(typeLabel(p))),
          h('span', { class: 'tech' }, p.name),
          h('button', {
            class: 'btn tiny', title: 'Rename or retype this field',
            onclick: () => openMember(where, p.name),
          }, 'Edit'),
          h('button', {
            class: 'btn tiny danger', title: 'Remove this field',
            onclick: dropField,
          }, '×'))),
      enumType ? h('div', { class: 'use' },
        h('span', { class: 'muted' }, 'can be '), ...enumMemberChips(model, enumType)) : null,
    ];
  });

  return h('div', { class: 'fields' },
    rows.length ? rows : h('div', { class: 'empty' }, 'Carries nothing yet.'),
    adderSlot('evown:' + name, null, '+ field', () => propertyAdder(model, {
      placeholder: 'field name', label: '+ Add field', draftKey: 'evown:' + name,
      onAdd: (property) => patch('event-definition', name, (b) => b.properties.push(property)),
      onRemoveLast: rows.length
        ? () => removeEventField(model, name, event.properties.length - 1,
            event.properties[event.properties.length - 1].name)
        : undefined,
    })));
}

function stepConsistency(model, slice) {
  // The queries, open, in the order they run (_DCB queries, shown_):
  // one per call to the store, each item a tag set and the reads that
  // brought it. A chained boundary cannot be one query – a later
  // query's tags are answers from an earlier one – so it is one box per
  // level of the chain, and the append condition is all of them in one.
  // The layout is `boundarySummary`'s, which the code view's command
  // line speaks from too.
  const summary = boundarySummary(model, slice.body);
  const planned = plannedQueries(summary);
  return step('consistency', 'Consistency boundary',
    h('div', { class: 'card' },
      summary.items.length
        ? [
            h('div', { class: 'row', style: 'justify-content:space-between;margin-bottom:8px' },
              h('span', { class: 'k small' }, summary.words), queryViewSwitch()),
            dcbQueries(planned, {
              key: 'dcb:' + slice.name, from: true,
              condition: { after: planned.length > 1 ? 'head' : 'read' },
            }),
          ]
        : h('div', { class: 'empty' }, 'Unguarded.'),
      h('div', { class: 'dq-chips', style: 'margin-top:8px' },
        h('span', { class: 'k small' }, 'appends '),
        slice.dcb.writes.length ? slice.dcb.writes.map(queryTagChip) : h('span', { class: 'k small' }, 'no tags'))),
    slice.coverage.length
      ? h('div', { class: 'card', style: 'border-color:var(--danger)' },
          h('span', { class: 'small' }, 'Writes a tag it never consulted: '
            + slice.coverage.map((c) => readable(c.entity)).join(', ')))
      : null);
}


// ============================================================
// C · Scenarios
//
// One command, exercised. A Given of events written by hand, a When
// naming the arguments, and a Then nobody types – it is derived from
// the definitions and frozen beside the other two, so the next run
// either agrees with it or reports that something changed.
//
// Accepting a difference is the whole gesture this interface exists
// for. It is the same move as approving a diff: you are not told the
// model is wrong, you are shown what it now does and asked whether that
// is what you meant.
//
// Three statuses, and they are not degrees of one thing. **Current** is
// agreement. **Drifted** has two outcomes to compare, and is answered by
// reading the difference. **Broken** has one – the command deleted, an
// event gone, a property added since – and is answered by repairing the
// scenario. A count that merged the last two would say less the more of
// them there were.
// ============================================================

// ---------- running them ----------
//
// Every scenario runs on every repaint, the way the whole model is
// already reprojected on every repaint – scripted reads included.
// What keeps a script that loops forever from hanging the page on
// every reload is not a gate here but safe mode: `?safe` on the URL,
// or a reload after a load that never finished (`boot`), compiles
// script handlers to throwers (see `setScriptsDisabled` in
// evaluate.js), so the model loads and the script can be fixed.
// The placement switch itself sits with the other interface switches
// near the top of this file. Everything below is what it chooses
// between.

// The two scenario kinds – command scenarios and projection scenarios
// – run through one mechanism. What differs is data: which definition
// kind, which evaluator, which body field groups them under a
// subject, which state slot holds the draft and which set holds the
// open rows, and how "current" and "drifted" read. That lives here,
// so the staleness rule, the save path and the status ladder exist
// once and cannot drift apart.
// Writes the explicit null into every unset optional property of one
// payload – the canonical stored spelling, so "one entry per property,
// all of them" stays true on disk while the evaluator reads an absent
// key the same way. The empty string is untouched: it is a value.
function fillUnsetOptionals(values, properties) {
  for (const property of properties || []) {
    if (!property.isOptional || property.isList) continue;
    if (values[property.name] === undefined) values[property.name] = null;
  }
}

function fillGivenOptionals(model, body) {
  for (const step of body.given || []) {
    step.data = step.data || {};
    fillUnsetOptionals(step.data, (model['event-definitions'][step.event] || {}).properties);
  }
}

const SCENARIO_KINDS = {
  'scenario-definition': {
    subjectField: 'command',
    run: (model, body) => runScenario(model, body),
    deriveThen: (model, body) => deriveThen(model, body),
    canonicalize: (model, body) => {
      fillGivenOptionals(model, body);
      body.when = body.when || {};
      body.when.arguments = body.when.arguments || {};
      fillUnsetOptionals(body.when.arguments, (model['command-definitions'][body.command] || {}).properties);
    },
    draftKey: 'scenarioDraft',
    openSet: () => state.openScenarios,
    words: {
      current: ['✓', 'Current', 'What this command does is what this scenario says it does'],
      drifted: ['≠', 'Drifted', 'This command behaves differently now than when this was accepted'],
      broken: ['!', 'Broken', 'This could not be run at all – something it names is gone'],
    },
  },
  'projection-scenario-definition': {
    subjectField: 'projection',
    run: (model, body) => runProjectionScenario(model, body),
    deriveThen: (model, body) => deriveProjectionScenarioThen(model, body),
    canonicalize: (model, body) => fillGivenOptionals(model, body),
    draftKey: 'projectionScenarioDraft',
    openSet: () => state.openProjectionScenarios,
    words: {
      current: ['✓', 'Current', 'What this projection folds to is what this scenario says it does'],
      drifted: ['≠', 'Drifted', 'It folds differently now than when this was accepted'],
      broken: ['!', 'Broken', 'This could not be run at all – something it names is gone'],
    },
  },
};

// Every scenario of one kind about one subject – a command's, or a
// projection's.
function scenariosAbout(kind, model, subject) {
  const k = SCENARIO_KINDS[kind];
  return Object.entries(model[DEF_COLLECTIONS[kind]] || {})
    .filter(([, body]) => body[k.subjectField] === subject)
    .map(([key, body]) => ({ key, body }));
}

// Derives the Then off today's definitions, stores the scenario, and
// opens its row – the one save path both kinds go through.
function saveScenarioOf(kind, model) {
  const k = SCENARIO_KINDS[kind];
  const draft = state[k.draftKey];
  const body = deepClone(draft.body);
  k.canonicalize(model, body);
  let then;
  try {
    then = k.deriveThen(model, body);
  } catch (error) {
    return toast(evaluationFailure(error), true);
  }
  body.then = then;
  run(() => {
    const key = draft.key || generateId();
    if (draft.key) {
      updateDefinition(kind, model.id, key, body);
    } else {
      addDefinition(kind, model.id, key, body);
      if (draft.insertAfter) insertAfterSibling(kind, model.id, key, draft.insertAfter);
    }
    state[k.draftKey] = null;
    k.openSet().add(key);
  });
}

function patchScenarioDraftOf(kind, mutate) {
  const draft = state[SCENARIO_KINDS[kind].draftKey];
  if (!draft) return;
  mutate(draft.body);
  render();
}

// A copy of a scenario, stored right after the original. What happens
// to the view afterwards differs per place – a panel closes forms, a
// ledger row must stay open – so the caller passes it in.
function copyScenarioOf(kind, model, afterKey, thenOpen) {
  run(() => {
    const copyKey = generateId();
    const copyBody = deepClone(model[DEF_COLLECTIONS[kind]][afterKey]);
    addDefinition(kind, model.id, copyKey, copyBody);
    insertAfterSibling(kind, model.id, copyKey, afterKey);
    thenOpen(copyKey, copyBody);
  });
}

const STATUS_WORDS = SCENARIO_KINDS['scenario-definition'].words;

function scenariosOf(model, commandName) {
  return scenariosAbout('scenario-definition', model, commandName);
}

// Splices an already-added member right after another one – what a
// duplicate or a positional "+ new" needs once `addDefinition` has put
// it at the end of the collection, since nothing else ever inserts
// anywhere but there. Shared by both scenario kinds and by the "+ copy" /
// "+ new" footer, since the move is identical either way.
function insertAfterSibling(kind, modelId, key, afterKey) {
  const fresh = projectState()[modelId];
  const order = Object.keys(fresh[DEF_COLLECTIONS[kind]]).filter((k) => k !== key);
  order.splice(order.indexOf(afterKey) + 1, 0, key);
  reorderDefinitions(kind, modelId, order);
}

// Drops `fromKey` right against `toKey`'s edge – the drag gesture's
// equivalent of the old up/down swap, against any edge rather than just
// one neighbor at a time. Everything outside the two keys involved keeps
// its place, the same as every other reorder here. Shared by both
// scenario kinds, the same way `insertAfterSibling` above is: the
// collection comes from the kind, never from a second copy.
function reorderByDrag(kind, model, fromKey, toKey, before) {
  if (fromKey === toKey) return;
  const order = Object.keys(model[DEF_COLLECTIONS[kind]]).filter((k) => k !== fromKey);
  order.splice(order.indexOf(toKey) + (before ? 0 : 1), 0, fromKey);
  reorderDefinitions(kind, model.id, order);
}

// What each of this command's scenarios currently derives – judged
// against the live definitions, not what a scenario was last saved as: a
// scenario that used to refuse by one rule can stop covering it the
// moment something upstream drifts.
function currentScenarioThens(model, commandName) {
  return scenariosOf(model, commandName)
    .map(({ body: scenario }) => runScenario(model, scenario).actual)
    .filter(Boolean);
}

// A message this command can be refused with that no scenario currently
// demonstrates – the gap between a rule being present and a rule being
// proven to matter. A rule only ever seen holding true could be removed
// tomorrow and nothing here would notice. Counted by message, the way a
// refusal is known: rules sharing one are one outcome, covered together.
function uncoveredRejections(model, commandName) {
  const covered = new Set();
  for (const then of currentScenarioThens(model, commandName)) {
    if (then.outcome === 'rejected') covered.add(then.rejection);
  }
  return commandRejections(model['command-definitions'][commandName])
    .filter(({ rejection }) => !covered.has(rejection));
}

// Whether any scenario currently shows this command succeeding – every
// rule can be individually proven to refuse and the happy path still go
// untested, which is its own gap: nothing here says the rules, taken
// together, ever let the command through at all.
function happyPathUntested(model, commandName) {
  return !currentScenarioThens(model, commandName).some((then) => then.outcome === 'published');
}

// Every scenario in the model that is not saying "current" – what
// `problems` folds in alongside loose ends.
function scenarioTrouble(model) {
  const out = [];
  for (const [key, body] of Object.entries(model['scenario-definitions'] || {})) {
    const result = runScenario(model, body);
    if (result.status === 'current') continue;
    out.push({ key, body, result });
  }
  return out;
}

// ---------- values ----------
//
// A payload is written rather than chosen, which is the one place in
// this interface where a modeler types a value the model will act on.
// Identifiers get the strongest help available short of picking from a
// list that does not exist yet: every identifier of the same type
// already written anywhere in this scenario (or, in the sandbox, used
// so far in the run) is offered as you type. A new instance is still
// just typed, because before the first event mentions one there is
// nothing to have picked. "Of the same type" is the tag type, not the
// entity: a model without entities has identifiers all the same.

let suggestionSeq = 0;

// A value is addressed by where it sits in the draft, never by a copy
// of what it was when the field was drawn.
//
// Two things follow, and both are bugs this shape does not have. A
// field that closed over the payload as it was at paint time would
// undo the edit before it the moment two fields were filled between
// repaints. And a repaint under a text field takes the caret with it –
// which is why filling one does not cause one: the inputs are
// uncontrolled and the draft is the only copy, so there is nothing to
// bring back into agreement. Only a change of *shape* – another list
// element, a different event – redraws.

function atPath(root, path) {
  return path.reduce((node, key) => (node === null || node === undefined ? undefined : node[key]), root);
}

function setAtPath(root, path, value) {
  let node = root;
  for (let i = 0; i < path.length - 1; i++) {
    if (node[path[i]] === null || node[path[i]] === undefined) {
      node[path[i]] = typeof path[i + 1] === 'number' ? [] : {};
    }
    node = node[path[i]];
  }
  node[path[path.length - 1]] = value;
  return root;
}

// Whether a field of this type is offered the identifiers in use: a
// tag type, or an entity's identifier.
function suggestsIdentifiers(model, typeName) {
  return entityOfIdType(model, typeName) !== null
    || idLeavesOfType(model, typeName).some((leaf) => leaf.field === null);
}

// Every value of identifier type `typeName` in a payload of
// `properties` – a record's tag fields and a list's elements included –
// added to `found`.
function harvestIdentifiers(model, values, properties, typeName, found) {
  for (const property of properties || []) {
    const value = (values || {})[property.name];
    if (value === undefined || value === null) continue;
    const elements = property.isList ? (Array.isArray(value) ? value : []) : [value];
    for (const leaf of idLeavesOfType(model, property.propertyType)) {
      if (leaf.identifierType !== typeName) continue;
      for (const element of elements) {
        const held = leaf.field === null ? element : (element || {})[leaf.field];
        if (held !== undefined && held !== null && held !== '') found.add(String(held));
      }
    }
  }
}

// Every identifier of a given type already written anywhere in a
// scenario. Read at the moment the field is used rather than the moment
// it was drawn, so an id typed into the Given is offered in the When
// without anything having to repaint in between.
function identifiersInUse(model, body, typeName) {
  const found = new Set();
  for (const step of body.given || []) {
    harvestIdentifiers(model, step.data, (model['event-definitions'][step.event] || {}).properties, typeName, found);
  }
  harvestIdentifiers(model, (body.when || {}).arguments,
    (model['command-definitions'][body.command] || {}).properties, typeName, found);
  return [...found].sort();
}

// One value of one declared type, at one place in the draft. Lists
// repeat it, composites nest it, and everything else is a field with
// the type's own vocabulary behind it.
function valueEditor(model, property, path, where) {
  const draft = where.root;
  // A composite value's fields – whether the type is tag-bearing (an
  // entity's own derived identifier, say) or an ordinary record – are
  // one shape, `{name, propertyType}`, so the recursion below does not
  // have to know which kind it is nesting into.
  const fields = compositeFieldsOf(model, property.propertyType);

  const scalar = (at) => {
    const held = atPath(draft(), at);
    const enumMembers = enumMembersFor(model, property.propertyType);
    if (enumMembers) {
      return h('span', { class: 'vwrap' },
        pick(enumMembers.map((m) => [m, readable(m)]),
          held === undefined || held === null ? '' : String(held),
          (v) => setAtPath(draft(), at, v), 'choose'));
    }
    const listId = suggestsIdentifiers(model, property.propertyType) ? `sug-${++suggestionSeq}` : null;
    const options = () => where.suggest(property.propertyType);
    return h('span', { class: 'vwrap' },
      h('input', {
        class: 'vin', value: held === undefined || held === null ? '' : String(held),
        placeholder: readable(property.propertyType), list: listId,
        // Rebuilt as the field is reached, not as it is drawn: an
        // identifier typed a moment ago is offered here without a
        // repaint having to carry it over.
        onfocus: listId ? (e) => {
          const list = document.getElementById(listId);
          if (!list) return;
          list.innerHTML = '';
          for (const value of options()) list.appendChild(h('option', { value }));
        } : null,
        onchange: (e) => {
          const parsed = literalOfType(model, property.propertyType, e.target.value);
          if (parsed === undefined) {
            return toast('That is not a ' + readable(property.propertyType) + '.', true);
          }
          setAtPath(draft(), at, parsed);
        },
      }),
      listId ? h('datalist', { id: listId }) : null);
  };

  const composite = (at) => h('span', { class: 'vgroup' },
    fields.map((field) => h('span', { class: 'vfield' },
      h('span', { class: 'vlabel' }, propertyWords(field.name)),
      valueEditor(model, { ...field, isList: false }, [...at, field.name], where))));

  const one = fields ? composite : scalar;

  // An optional property makes "no value" a state of its own, distinct
  // from the empty string. Unticked holds the explicit null and shows
  // no input at all – nothing to conflate; ticking it opens the
  // ordinary editor on a blank. Optional *lists* stay plain lists (the
  // advisories point that combination out): empty already means none.
  if (property.isOptional && !property.isList) {
    const held = atPath(draft(), path);
    const isSet = held !== undefined && held !== null;
    return h('span', { class: 'vopt' },
      h('label', { class: 'tiny muted', title: 'Optional – unticked means no value (null), which is not the empty string' },
        h('input', {
          type: 'checkbox', checked: isSet,
          onchange: (e) => {
            setAtPath(draft(), path, e.target.checked ? (fields ? {} : '') : null);
            render();
          },
        }),
        isSet ? null : ' no value'),
      isSet ? one(path) : null);
  }

  if (!property.isList) return one(path);

  const elements = atPath(draft(), path);
  const held = Array.isArray(elements) ? elements : [];
  return h('span', { class: 'vlist' },
    held.map((element, index) => h('span', { class: 'vrow' },
      one([...path, index]),
      h('button', {
        class: 'btn tiny danger', title: 'Remove this one',
        onclick: () => {
          setAtPath(draft(), path, held.filter((e, i) => i !== index));
          render();
        },
      }, '×'))),
    h('button', {
      class: 'btn tiny',
      onclick: () => {
        setAtPath(draft(), path, [...held, fields ? {} : '']);
        render();
      },
    }, '+ one more'));
}

// The payload of one event or one command call: every property it
// declares, in the order it declares them.
function payloadEditor(model, properties, path, where) {
  if (!(properties || []).length) {
    return h('span', { class: 'muted tiny' }, 'nothing to fill in');
  }
  return h('span', { class: 'vpayload' },
    (properties || []).map((property) => h('span', { class: 'vfield' },
      h('span', { class: 'vlabel' }, propertyWords(property.name)),
      valueEditor(model, property, [...path, property.name], where))));
}

// Where a payload being written lives, and what it can be helped with.
// A scenario suggests the identifiers written elsewhere in itself,
// because nothing else exists yet. The sandbox suggests the ones that
// actually do – every instance its log has mentioned – which is a
// stronger answer and only available because a session has a history.
function scenarioWhere(model) {
  return {
    root: () => state.scenarioDraft.body,
    suggest: (type) => identifiersInUse(model, state.scenarioDraft.body, type),
  };
}

function sandboxWhere(model) {
  return {
    root: () => state.sandboxDraft,
    suggest: (type) => sessionIdentifiers(model, type),
  };
}

// ---------- reading one back ----------

function payloadText(values) {
  const entries = Object.entries(values || {});
  if (!entries.length) return 'nothing';
  return entries.map(([k, v]) => `${propertyWords(k)} ${JSON.stringify(v)}`).join(', ');
}

// Which rule refused a scenario's command, and what it read – from a
// run, since a scenario keeps only the message. Null when the command
// is not refused, or the scenario cannot run.
function liveRefusal(model, scenario) {
  try {
    const run = evaluateCommand(model, scenarioLog(scenario), scenario.command, (scenario.when || {}).arguments);
    return run.outcome === 'rejected' ? run.failedRule : null;
  } catch {
    return null;
  }
}

// `run`, when given, is a live refusal (`liveRefusal`): shown as detail
// under the message it refused with, never as part of the outcome.
function outcomeCard(model, outcome, title, run) {
  if (!outcome) return h('div', { class: 'card' }, h('div', { class: 'empty' }, 'nothing'));
  const rule = run && run.rejection === outcome.rejection ? run : null;
  const cls = 'card ' + (outcome.outcome === 'rejected' ? 'outcome-rejected' : 'outcome-published');
  return h('div', { class: cls },
    title ? h('div', { class: 'muted tiny' }, title) : null,
    outcome.outcome === 'rejected'
      ? h('div', {},
          h('span', { class: 'k' }, 'refused: '),
          h('span', { class: 't' }, outcome.rejection || 'by a rule'),
          rule ? h('span', { class: 'k' }, `  – ${rule.text}, read ${JSON.stringify(rule.leftValue)}`
            + (rule.rightValue !== null ? ` against ${JSON.stringify(rule.rightValue)}` : '')
            + (rule.atInstance !== null && rule.atInstance !== undefined ? ` (at ${ordinal(rule.atInstance + 1)})` : ''))
            : null)
      : (outcome.events || []).length
        ? outcome.events.map((event) => h('div', {},
            h('span', { class: 'y' }, readable(event.type)),
            h('span', { class: 'k' }, '  ' + payloadText(event.data))))
        : h('div', { class: 'empty' }, 'accepted, recording nothing'));
}

function ordinal(n) {
  const suffix = n % 100 >= 11 && n % 100 <= 13 ? 'th'
    : ['th', 'st', 'nd', 'rd'][n % 10] || 'th';
  return n + suffix;
}


// ---------- the list ----------

// The key being dragged, module-level rather than on `state`: a
// dragover fires continuously while the pointer moves, and routing that
// through `render()` would repaint the whole app many times a second.
// Only `drop` – once, at the end – goes through `run()`.
// A scenario card is a reorder target for grips of its own kind –
// the attributes `scenarioGrip` hit-tests as it drags.
function scenarioDropTarget(kind, key) {
  return { 'data-scen': key, 'data-scen-kind': kind };
}

// The row a scenario card folds to, shared by both kinds. The whole row
// unfolds it, not only the name: the card is drawn as one target, and
// a hit area the width of the name was a card that looked clickable and
// mostly was not – which, with every card folded after a reload, read
// as no way in at all. The name stays a button so the keyboard has a
// stop; its click bubbles here. `actions` is the reveal on the right,
// whose own buttons (and grip) are not a click on the row.
function scenarioHead(openSet, key, status, [mark, word, why], name, actions) {
  return h('div', {
    class: 'row scenario-row',
    onclick: (e) => {
      if (e.target.closest('.reveal')) return;
      if (openSet.has(key)) openSet.delete(key); else openSet.add(key);
      render();
    },
  },
    h('span', { class: 'sc-mark s-' + status, title: why }, mark),
    h('button', { class: 'sc-name' }, name),
    h('span', { class: 'grow' }),
    status !== 'current' ? h('span', { class: 'sc-status s-' + status, title: why }, word) : null,
    actions);
}

function scenarioRow(model, entry) {
  const { key, body } = entry;
  const result = runScenario(model, body);
  const [mark, word, why] = STATUS_WORDS[result.status];
  const open = state.openScenarios.has(key);

  const head = scenarioHead(state.openScenarios, key, result.status, [mark, word, why],
    scenarioName(body, readable),
    reveal(
      scenarioGrip(model, 'scenario-definition', key,
        'Drag to reorder among this command\'s scenarios'),
      h('button', {
        class: 'btn tiny', title: 'Rename, change, or remove this scenario',
        onclick: () => editScenario(key, body),
      }, 'Edit')));

  const card = h('div', {
    class: 'scenario s-' + result.status + (open ? ' open' : ''),
    ...scenarioDropTarget('scenario-definition', key),
  }, head);

  if (!open) return card;

  card.appendChild(h('div', { class: 'sc-body' },
    h('div', { class: 'muted tiny' }, 'Given'),
    (body.given || []).length
      ? (body.given || []).map((step) => h('div', { class: 'sc-line' },
          h('span', { class: 'y' }, readable(step.event)),
          h('span', { class: 'k' }, '  ' + payloadText(step.data))))
      : h('div', { class: 'empty' }, 'nothing had happened yet'),
    h('div', { class: 'muted tiny', style: 'margin-top:8px' }, 'When'),
    h('div', { class: 'sc-line' },
      h('span', { class: 'c' }, readable(body.command)),
      h('span', { class: 'k' }, '  ' + payloadText((body.when || {}).arguments))),
    h('div', { class: 'muted tiny', style: 'margin-top:8px' }, 'Then'),
    result.status === 'broken'
      ? h('div', { class: 'card', style: 'border-color:var(--danger)' },
          h('div', { class: 'small' }, result.reason),
          h('div', { class: 'muted tiny', style: 'margin-top:6px' },
            'What it used to expect is kept below, so nothing is lost while you repair it.'),
          outcomeCard(model, result.expected, 'was'))
      : result.status === 'drifted'
        ? h('div', { class: 'drift' },
            outcomeCard(model, result.expected, 'this scenario says'),
            outcomeCard(model, result.actual, 'the model now does', liveRefusal(model, body)),
            h('div', { class: 'adder' },
              h('button', {
                class: 'btn primary',
                title: 'Store what the model now does as what this scenario expects',
                onclick: () => run(() => {
                  updateDefinition('scenario-definition', model.id, key,
                    { ...deepClone(body), then: result.actual });
                }),
              }, 'Accept this'),
              h('span', { class: 'muted tiny' },
                'Nothing changes in the model – only what this scenario expects of it.')))
        : outcomeCard(model, result.expected, null, liveRefusal(model, body))));
  return card;
}

// The always-on pair under every scenario: start a fresh one, or branch
// this one, each landing directly below the row it hangs from. Together
// they cover what a bottom-of-list "+ New scenario" button used to –
// see `scenarioPanel` for the one case nothing hangs a footer off of.
function scenarioFooter(model, commandName, afterKey) {
  return h('div', { class: 'sc-footer' },
    h('button', {
      class: 'btn tiny ghost', title: 'Start a new scenario, placed right after this one',
      onclick: () => startScenario(model, commandName, afterKey),
    }, '+ new'),
    h('button', {
      class: 'btn tiny ghost', title: 'Add a copy of this scenario, placed right after it, open to tweak',
      onclick: () => copyScenarioOf('scenario-definition', model, afterKey, (copyKey, copyBody) => {
        closeForms();
        state.scenarioDraft = { key: copyKey, insertAfter: null, body: copyBody };
      }),
    }, '+ copy'));
}

// ---------- writing one ----------

function editScenario(key, body) {
  closeForms();
  state.tab = 'scenarios';
  state.scenarioDraft = { key, insertAfter: null, body: deepClone(body) };
  render();
}

function startScenario(model, commandName, insertAfter) {
  closeForms();
  state.tab = 'scenarios';
  state.scenarioDraft = {
    key: null,
    insertAfter: insertAfter || null,
    body: { command: commandName, given: [], when: { arguments: {} } },
  };
  render();
}

function patchScenarioDraft(mutate) {
  patchScenarioDraftOf('scenario-definition', mutate);
}

function scenarioEditor(model) {
  const draft = state.scenarioDraft;
  const body = draft.body;
  const command = model['command-definitions'][body.command];
  const eventNames = Object.keys(model['event-definitions']).sort();

  const givenRows = (body.given || []).map((step, index) => {
    const definition = model['event-definitions'][step.event] || {};
    return h('div', { class: 'card sc-step' },
      h('div', { class: 'row' },
        pick(eventNames.map((n) => [n, readable(n)]), step.event, (v) => patchScenarioDraft((b) => {
          b.given[index] = { event: v, data: {} };
        })),
        h('span', { class: 'grow' }),
        h('button', {
          class: 'btn tiny danger',
          onclick: () => patchScenarioDraft((b) => { b.given.splice(index, 1); }),
        }, '×')),
      payloadEditor(model, definition.properties, ['given', index, 'data'], scenarioWhere(model)));
  });

  return h('div', { class: 'card sc-editor' },
    h('h4', {}, draft.key ? 'Edit this scenario' : 'A new scenario'),
    h('div', { class: 'muted small' },
      'Write what had already happened, then the call. What it does with the two is worked out '
      + 'here – you are never asked to predict it.'),

    h('div', { class: 'muted tiny', style: 'margin-top:12px' }, 'Given'),
    givenRows.length ? givenRows : h('div', { class: 'empty' }, 'nothing has happened yet'),
    h('div', { class: 'adder' },
      h('button', {
        class: 'btn tiny',
        onclick: () => patchScenarioDraft((b) => {
          b.given = [...(b.given || []), { event: eventNames[0], data: {} }];
        }),
      }, '+ an event that had happened')),

    h('div', { class: 'muted tiny', style: 'margin-top:12px' }, 'When'),
    h('div', { class: 'card sc-step' },
      h('div', { class: 'row' }, h('span', { class: 'y' }, readable(body.command))),
      payloadEditor(model, (command || {}).properties, ['when', 'arguments'], scenarioWhere(model))),

    h('div', { class: 'adder', style: 'margin-top:14px' },
      h('button', { class: 'btn primary', onclick: () => saveScenario(model) },
        draft.key ? 'Save' : 'Work out what happens'),
      h('button', {
        class: 'btn ghost',
        onclick: () => { state.scenarioDraft = null; render(); },
      }, 'Cancel'),
      draft.key
        ? removeButton('scenario:' + draft.key, {
            label: 'Remove', title: 'Remove this scenario. Nothing else is touched.',
            onRemove: () => run(() => {
              removeDefinition('scenario-definition', model.id, draft.key);
              state.openScenarios.delete(draft.key);
              state.scenarioDraft = null;
            }),
          })
        : null));
}

// Deriving the Then is the save. A scenario that cannot be evaluated
// cannot be created either – there would be nothing to freeze – and the
// message says which part of it did not resolve.
function saveScenario(model) {
  saveScenarioOf('scenario-definition', model);
}

// ---------- where they are shown ----------

// What this command's scenarios leave untested – an untested happy path
// (see `happyPathUntested`) plus the rules no scenario demonstrates
// refusing (see `uncoveredRejections`). Shown ahead of the scenarios
// themselves, since it is read before writing the scenario that would
// close a gap.
function coverageGapsCard(model, commandName) {
  const missing = uncoveredRejections(model, commandName);
  const noHappyPath = happyPathUntested(model, commandName);
  if (!missing.length && !noHappyPath) return null;
  return h('div', { class: 'card uncovered-rules' },
    noHappyPath
      ? h('div', { class: 'muted tiny' }, 'No scenario here shows this command succeeding')
      : null,
    missing.length
      ? h('div', { class: 'muted tiny' },
          missing.length === 1
            ? 'One refusal no scenario here shows yet'
            : missing.length + ' refusals no scenario here shows yet')
      : null,
    missing.map(({ rejection }) => h('div', { class: 'rulemap-rule' }, rejectionQuote(rejection))));
}

function scenarioPanel(model, commandName) {
  const entries = scenariosOf(model, commandName);
  const draft = state.scenarioDraft;
  const draftHere = !!draft && draft.body.command === commandName;

  const rows = [];
  for (const entry of entries) {
    if (draftHere && draft.key === entry.key) {
      rows.push(scenarioEditor(model));
    } else {
      rows.push(scenarioRow(model, entry));
      if (!draftHere) rows.push(scenarioFooter(model, commandName, entry.key));
    }
    if (draftHere && !draft.key && draft.insertAfter === entry.key) {
      rows.push(scenarioEditor(model));
    }
  }
  // A draft with no key and no position goes at the end – rendered
  // whether or not the list is empty, so a draft started while the
  // list changed underneath it never silently vanishes. Same rule as
  // projectionScenarioList, which learned it the hard way.
  const standaloneDraft = draftHere && !draft.key && !draft.insertAfter;

  return h('div', { class: 'scenarios' },
    coverageGapsCard(model, commandName),
    rows.length ? rows : null,
    standaloneDraft ? scenarioEditor(model) : null,
    !entries.length && !standaloneDraft
      ? h('div', { class: 'blank small' },
          h('p', { class: 'muted small' },
            'Nothing exercises this command yet. A scenario is what had already happened, the '
            + 'call, and what the model makes of the two – and it is the only thing here that '
            + 'notices when an edit somewhere else changes what this command does.'))
      : null,
    !entries.length && !standaloneDraft
      ? h('div', { class: 'adder' },
          h('button', { class: 'btn primary', onclick: () => startScenario(model, commandName) },
            '+ New scenario'))
      : null);
}

function scenarioTabs(model, slice) {
  const entries = scenariosOf(model, slice.name);
  const trouble = entries.filter((e) => {
    const status = runScenario(model, e.body).status;
    return status === 'drifted' || status === 'broken';
  }).length;
  const tab = (key, label, extra) => h('button', {
    class: 'tab' + (state.tab === key ? ' on' : ''),
    'aria-pressed': state.tab === key ? 'true' : 'false',
    onclick: () => { state.tab = key; state.scenarioDraft = null; render(); },
  }, label, extra);
  return h('div', { class: 'tabs' },
    tab('definition', 'Definition'),
    tab('scenarios', 'Scenarios',
      entries.length
        ? h('span', { class: 'badge' + (trouble ? '' : ' clear') }, trouble || entries.length)
        : null));
}

// ============================================================
// C2 · Projection scenarios
//
// Scenarios, one level down: a Given of events written by hand, a list
// of projections to fold it into, and a Then nobody types – derived
// from the projections' own handlers and frozen beside the Given, so
// the next run either agrees with it or reports that something
// changed. There is no When: nothing is called, a value is simply
// folded from what happened.
//
// **The subject is not written down twice.** A scenario names the one
// projection it is about, and its Then is that projection's value –
// there is nothing to alias and nothing to tick, because there is only
// ever one thing being checked. Asserting four properties of a course
// over one Given is four scenarios sharing that Given, each answerable
// on its own and each drifting on its own.
//
// Nothing here knows whether an entity binds the projection. That is
// what decides which page lists the scenario, and it is read off the
// bindings at the moment of asking – so a rebinding moves it without
// anything being migrated.
//
// Everything else – the statuses, the drift diff, "Accept this" – is
// the same mechanism Scenarios already has, reused rather than
// reinvented.
// ============================================================

// The mechanism lives in SCENARIO_KINDS with the command-scenario
// machinery; these are its projection-scenario faces.
const PROJECTION_SCENARIO_STATUS_WORDS = SCENARIO_KINDS['projection-scenario-definition'].words;

// Every scenario about a projection.
function projectionScenariosFor(model, projectionName) {
  return scenariosAbout('projection-scenario-definition', model, projectionName);
}

// Where a projection scenario's Given lives, and what it can be helped
// with – the same identifiers-already-written suggestion Scenarios'
// Given gets. `identifiersInUse` reads `body.given`/`body.when`
// generically; a projection scenario simply has no `when`; there is
// nothing to harvest.
function specWhere(model) {
  return {
    root: () => state.projectionScenarioDraft.body,
    suggest: (type) => identifiersInUse(model, state.projectionScenarioDraft.body, type),
  };
}

// A projection scenario's Then, one read per line – the analogue of
// outcomeCard, shaped around `{alias: value}` rather than
// `{outcome, events}`.
// What a projection folded to. One value – `null` and `[]` included,
// which is why it is rendered through the same words the initial value
// is: "nothing yet" and "an empty list" are answers, not blanks.
function projectionOutcomeCard(value, title) {
  return h('div', { class: 'card' },
    title ? h('div', { class: 'muted tiny' }, title) : null,
    h('div', { class: 'k' }, initialValueWords(value)));
}

function projectionScenarioRow(model, entry) {
  const { key, body } = entry;
  const result = runProjectionScenario(model, body);
  const [mark, word, why] = PROJECTION_SCENARIO_STATUS_WORDS[result.status];
  const open = state.openProjectionScenarios.has(key);

  const head = scenarioHead(state.openProjectionScenarios, key, result.status, [mark, word, why],
    projectionScenarioName(body),
    reveal(
      scenarioGrip(model, 'projection-scenario-definition', key,
        'Drag to reorder among the scenarios listed here'),
      h('button', {
        class: 'btn tiny', title: 'Rename, change, or remove this scenario',
        onclick: () => editProjectionScenario(model, key, body),
      }, 'Edit')));

  const card = h('div', {
    class: 'scenario s-' + result.status + (open ? ' open' : ''),
    ...scenarioDropTarget('projection-scenario-definition', key),
  }, head);

  if (!open) return card;

  card.appendChild(h('div', { class: 'sc-body' },
    h('div', { class: 'muted tiny' }, 'Given'),
    (body.given || []).length
      ? (body.given || []).map((step) => h('div', { class: 'sc-line' },
          h('span', { class: 'y' }, readable(step.event)),
          h('span', { class: 'k' }, '  ' + payloadText(step.data))))
      : h('div', { class: 'empty' }, 'nothing had happened yet'),
    h('div', { class: 'muted tiny', style: 'margin-top:8px' }, 'Reading'),
    h('div', { class: 'sc-line' },
      h('span', { class: 't' }, readable(body.projection)),
      Object.keys(body.arguments || {}).length
        ? h('span', { class: 'k' }, '  for ' + payloadText(body.arguments))
        : h('span', { class: 'k' }, '  the whole log')),
    h('div', { class: 'muted tiny', style: 'margin-top:8px' }, 'Then'),
    result.status === 'broken'
      ? h('div', { class: 'card', style: 'border-color:var(--danger)' },
          h('div', { class: 'small' }, result.reason),
          h('div', { class: 'muted tiny', style: 'margin-top:6px' },
            'What it used to expect is kept below, so nothing is lost while you repair it.'),
          projectionOutcomeCard(result.expected, 'was'))
      : result.status === 'drifted'
        ? h('div', { class: 'drift' },
            projectionOutcomeCard(result.expected, 'this scenario says'),
            projectionOutcomeCard(result.actual, 'the model now does'),
            h('div', { class: 'adder' },
              h('button', {
                class: 'btn primary',
                title: 'Store what the model now does as what this scenario expects',
                onclick: () => run(() => {
                  updateDefinition('projection-scenario-definition', model.id, key,
                    { ...deepClone(body), then: result.actual });
                }),
              }, 'Accept this'),
              h('span', { class: 'muted tiny' },
                'Nothing changes in the model – only what this scenario expects of it.')))
        : projectionOutcomeCard(result.expected, null)));
  return card;
}

// The projection-scenario analogue of `scenarioFooter`. `start` is
// whatever a fresh one on this page should begin as – an entity page
// passes an instance to read, a projection's card passes itself.
function projectionScenarioFooter(model, start, afterKey) {
  return h('div', { class: 'sc-footer' },
    h('button', {
      class: 'btn tiny ghost', title: 'Start a new scenario, placed right after this one',
      onclick: () => startProjectionScenario(model, start, afterKey),
    }, '+ new'),
    h('button', {
      class: 'btn tiny ghost',
      title: 'Add a copy of this scenario, placed right after it, open to tweak',
      onclick: () => copyProjectionScenario(model, afterKey),
    }, '+ copy'));
}

// A copy of this scenario, stored right after it and opened to tweak.
//
// These are drawn inside an open ledger row, so the copy must not go
// through `closeForms` – that would fold away the very row this button
// sits in, taking the button, and the focus on it, with it.
function copyProjectionScenario(model, afterKey) {
  copyScenarioOf('projection-scenario-definition', model, afterKey, (copyKey, copyBody) => {
    keepingRowOpen(() => {
      state.projectionScenarioDraft = { key: copyKey, insertAfter: null, body: copyBody };
      state.openProjectionScenarios.add(copyKey);
    });
  });
}

function editProjectionScenario(model, key, body) {
  if (!openProjection(model, body.projection, { tab: 'checks' })) closeForms();
  state.projectionScenarioDraft = { key, insertAfter: null, body: deepClone(body) };
  render();
}

// A fresh scenario's arguments: one blank per argument its script
// takes, and none at all for a declared projection.
function blankScenarioArguments(model, projectionName) {
  const args = {};
  for (const slot of projectionSlots(model['projection-definitions'][projectionName])) args[slot.name] = '';
  return args;
}

// A fresh scenario reads the projection by the tags it declares, each
// a typed literal with its value still blank.
function blankScenarioTags(model, projectionName) {
  const out = {};
  for (const tag of projectionTagParams(model['projection-definitions'][projectionName])) {
    out[tag.name] = { tagType: tag.tagType, tagValue: '' };
  }
  return out;
}

function startProjectionScenario(model, start, insertAfter) {
  const body = {
    projection: start.projection,
    tags: blankScenarioTags(model, start.projection),
    arguments: blankScenarioArguments(model, start.projection),
    given: [],
  };
  openProjection(model, start.projection, { tab: 'checks' });
  state.projectionScenarioDraft = { key: null, insertAfter: insertAfter || null, body };
  render();
}

function patchProjectionScenarioDraft(mutate) {
  patchScenarioDraftOf('projection-scenario-definition', mutate);
}

// How the projection under test is read: a value for each tag it
// declares – none at all for an untagged one, which reads the whole
// log – and the arguments it takes. A scenario is about one
// projection, and its Then is that projection's value. The draft is
// kept in step with the declaration, so a tag the projection gained
// since is asked for rather than missing.
function scenarioArgumentRows(model, body) {
  const projection = model['projection-definitions'][body.projection];
  const slots = projectionSlots(projection);
  const declared = projectionTagParams(projection);
  const held = body.tags && typeof body.tags === 'object' && !Array.isArray(body.tags) ? body.tags : {};
  body.tags = {};
  for (const tag of declared) {
    const value = held[tag.name];
    body.tags[tag.name] = { tagType: tag.tagType, tagValue: value && value.tagValue !== undefined ? value.tagValue : '' };
  }
  const tagRows = declared.map((tag) => h('div', { class: 'row' },
    h('span', { class: 'muted tiny', style: 'min-width:90px' }, propertyWords(tag.name)),
    valueEditor(model, { name: tag.name, propertyType: tag.tagType, isList: false },
      ['tags', tag.name, 'tagValue'], specWhere(model))));
  return [
    ...(tagRows.length ? tagRows : [h('div', { class: 'muted tiny' }, 'untagged – it reads the whole log')]),
    ...slots.map((slot) => h('div', { class: 'row' },
    h('span', { class: 'muted tiny', style: 'min-width:90px' }, propertyWords(slot.name)),
    // The full path to the value, not to the object holding it:
    // `valueEditor` reads and writes exactly where it is pointed, the
    // way `payloadEditor` points it at `[...path, property.name]`.
    valueEditor(model, { name: slot.name, propertyType: slot.propertyType, isList: false },
      ['arguments', slot.name], specWhere(model)))),
  ];
}

function projectionScenarioEditor(model) {
  const draft = state.projectionScenarioDraft;
  const body = draft.body;
  const eventNames = Object.keys(model['event-definitions']).sort();

  const givenRows = (body.given || []).map((step, index) => {
    const definition = model['event-definitions'][step.event] || {};
    return h('div', { class: 'card sc-step' },
      h('div', { class: 'row' },
        pick(eventNames.map((n) => [n, readable(n)]), step.event, (v) => patchProjectionScenarioDraft((b) => {
          b.given[index] = { event: v, data: {} };
        })),
        h('span', { class: 'grow' }),
        h('button', {
          class: 'btn tiny danger',
          onclick: () => patchProjectionScenarioDraft((b) => { b.given.splice(index, 1); }),
        }, '×')),
      payloadEditor(model, definition.properties, ['given', index, 'data'], specWhere(model)));
  });

  return h('div', { class: 'card sc-editor' },
    h('h4', {}, draft.key ? 'Edit this scenario' : 'A new scenario'),
    h('div', { class: 'muted small' },
      'Write what had already happened. What ', h('b', {}, readable(body.projection)),
      ' ends up being is worked out here – you are never asked to predict it, and there is '
      + 'nothing to choose: this scenario is about that projection, and nothing else.'),

    h('div', { class: 'muted tiny', style: 'margin-top:12px' }, 'Given'),
    givenRows.length ? givenRows : h('div', { class: 'empty' }, 'nothing has happened yet'),
    h('div', { class: 'adder' },
      h('button', {
        class: 'btn tiny',
        onclick: () => patchProjectionScenarioDraft((b) => {
          b.given = [...(b.given || []), { event: eventNames[0], data: {} }];
        }),
      }, '+ an event that had happened')),

    h('div', { class: 'muted tiny', style: 'margin-top:12px' }, 'Reading'),
    h('div', { class: 'card sc-step' },
      h('div', { class: 'row' },
        h('span', { class: 'chip projection' }, readable(body.projection)),
        h('span', { class: 'muted tiny' }, 'what this scenario is about')),
      ...scenarioArgumentRows(model, body)),

    h('div', { class: 'adder', style: 'margin-top:14px' },
      h('button', { class: 'btn primary', onclick: () => saveProjectionScenario(model) },
        draft.key ? 'Save' : 'Work out what happens'),
      h('button', {
        class: 'btn ghost',
        onclick: () => { state.projectionScenarioDraft = null; render(); },
      }, 'Cancel'),
      draft.key
        ? removeButton('projection-scenario:' + draft.key, {
            label: 'Remove', title: 'Remove this scenario. Nothing else is touched.',
            onRemove: () => run(() => {
              removeDefinition('projection-scenario-definition', model.id, draft.key);
              state.openProjectionScenarios.delete(draft.key);
              state.projectionScenarioDraft = null;
            }),
          })
        : null));
}

// Deriving the Then is the save, exactly as it is for a scenario – see
// saveScenario. Which reads a modeler ticked lives in `assert` only on
// the draft; the saved body keeps just their folded values, under
// `then`, which is also what re-opening this for editing reads the
// ticked set back from.
function saveProjectionScenario(model) {
  saveScenarioOf('projection-scenario-definition', model);
}

// The list of scenarios shown in one place, with its editor folded in
// wherever the draft belongs. `entries` is whichever set that place
// shows; `start` is what a fresh one there begins as; `blank` is what
// to say when there are none.
function projectionScenarioList(model, { entries, start, blank }) {
  const draft = state.projectionScenarioDraft;
  const here = new Set(entries.map((e) => e.key));
  // A draft with no key yet belongs wherever it was started, which is
  // the place whose `start` matches what it reads.
  const draftHere = !!draft && (draft.key ? here.has(draft.key) : draftStartedAt(model, draft, start));

  const rows = [];
  for (const entry of entries) {
    if (draftHere && draft.key === entry.key) {
      rows.push(projectionScenarioEditor(model));
    } else {
      rows.push(projectionScenarioRow(model, entry));
      if (!draftHere) rows.push(projectionScenarioFooter(model, start, entry.key));
    }
    if (draftHere && !draft.key && draft.insertAfter === entry.key) {
      rows.push(projectionScenarioEditor(model));
    }
  }
  // A draft with no key and no position goes at the end. It used to be
  // rendered only when the list was empty, which meant a draft started
  // any other way simply vanished – reachable from code before it was
  // reachable from the page, but wrong either way.
  const standaloneDraft = draftHere && !draft.key && !draft.insertAfter;

  return h('div', { class: 'scenarios' },
    rows.length ? rows : null,
    standaloneDraft ? projectionScenarioEditor(model) : null,
    !entries.length && !standaloneDraft
      ? h('div', { class: 'blank small' }, h('p', { class: 'muted small' }, blank))
      : null,
    !entries.length && !standaloneDraft
      ? h('div', { class: 'adder' },
          h('button', { class: 'btn primary', onclick: () => startProjectionScenario(model, start) },
            '+ New scenario'))
      : null);
}

// Whether an unsaved draft belongs in this list – which is simply
// whether it is about this projection.
function draftStartedAt(model, draft, start) {
  return draft.body.projection === start.projection;
}


// ============================================================
// D · Sandbox
//
// The other way to try a model: not one command against a written
// Given, but a run of them against each other, with the events piling
// up and the state responding as they go.
//
// It is not part of the model: driving a command here appends to
// `session.log`, never to the event log the playground stores its own
// definitions in, and an export carries it only when asked. But a
// reload loses nothing, so the session is kept per tab and per model
// in sessionStorage (`SANDBOX_KEY`), like the undo histories: the
// run, the playhead, the watches and the driver's draft. It used to
// live in this variable alone and be gone on reload – and a reload is
// rarely a decision to throw a run away. Switching models puts the
// session aside rather than discarding it.
//
// **Scrubbing replays from zero.** Every position is a fold of the
// events up to it, computed fresh. An incremental fold would only help
// going forwards and would need a snapshot regime to come back, and
// nothing measured says it is needed – the same ground the worker was
// dropped on.
//
// **A refusal is shown and not recorded.** The timeline is what
// happened; a command that was refused did not happen. It is said out
// loud at the moment you try it, and then it is gone.
// ============================================================

const session = {
  log: [],        // events so far – the shape `evaluate.js` reads
  steps: [],      // one per command that went through: { command, args, from, to }
  at: null,       // how many events are visible; null means all of them
  // What to show wherever you are on the timeline. Two shapes, because
  // there are two things worth following: `{kind:'entity', tag}` for
  // one instance's whole state, and `{kind:'projection', projection,
  // arguments}` for one fold – a numbering, a running total, anything
  // no command in view happens to have read.
  pinned: [],
  model: null,    // the id of the model this session belongs to
};

// Versioned with the event log: the session holds events in the shape
// the model's definitions give them, and a new log version starts from
// models that no longer exist.
const SANDBOX_KEY = 'dcb-playground:sandbox:' + EVENT_LOG_KEY.split(':').pop();

function storedSessions() {
  try {
    const stored = JSON.parse(sessionStorage.getItem(SANDBOX_KEY));
    return stored && typeof stored === 'object' ? stored : {};
  } catch { return {}; }
}

// Called after every change to the session; the draft, edited in place
// by the value editors, is caught up on `pagehide` too. Sessions of
// models deleted since are dropped here.
function saveSession() {
  if (!session.model) return;
  const all = storedSessions();
  const models = projectState();
  for (const id of Object.keys(all)) if (!models[id]) delete all[id];
  const draft = typeof state === 'object' && state ? state.sandboxDraft : null;
  if (!models[session.model]) delete all[session.model];
  else if (session.log.length || session.pinned.length || draft) {
    all[session.model] = { log: session.log, steps: session.steps, at: session.at, pinned: session.pinned, draft };
  } else delete all[session.model];
  try {
    sessionStorage.setItem(SANDBOX_KEY, JSON.stringify(all));
  } catch {
    toast('This sandbox will not survive a reload: this tab’s storage is full.', true);
  }
}

// Makes `modelId`'s session the one on screen, from where it was put
// aside – a no-op when it already is. `render` asks on every paint, so
// a model deleted in another tab cannot leave its session showing
// against the one this tab falls back to.
function loadSession(modelId) {
  if (session.model === modelId) return;
  saveSession();
  const stored = (modelId && storedSessions()[modelId]) || {};
  const list = (value) => (Array.isArray(value) ? value : []);
  session.log = list(stored.log);
  session.steps = list(stored.steps);
  session.at = Number.isInteger(stored.at) && stored.at >= 0 && stored.at < session.log.length ? stored.at : null;
  session.pinned = list(stored.pinned);
  session.model = modelId;
  if (typeof state === 'object' && state) state.sandboxDraft = stored.draft || null;
}
window.addEventListener('pagehide', saveSession);

function sessionReset() {
  session.log = [];
  session.steps = [];
  session.at = null;
  session.pinned = [];
  saveSession();
}

// A watch, as a string – its identity for pinning and unpinning.
function watchKey(watch) {
  return watch.kind === 'entity'
    ? 'entity:' + watch.tag
    : 'projection:' + watch.projection + ':' + JSON.stringify(watch.tags || {}) + ':' + JSON.stringify(watch.arguments || {});
}

function isPinned(watch) {
  const key = watchKey(watch);
  return session.pinned.some((w) => watchKey(w) === key);
}

function togglePinned(watch) {
  const key = watchKey(watch);
  session.pinned = isPinned(watch)
    ? session.pinned.filter((w) => watchKey(w) !== key)
    : [...session.pinned, watch];
  saveSession();
  render();
}

function sessionPosition() {
  return session.at === null ? session.log.length : session.at;
}

function sessionVisible() {
  return session.log.slice(0, sessionPosition());
}

// The step the current position sits inside – the command whose
// events were the last to arrive, all of them or, scrubbed into the
// middle of a step, some. Nothing at position zero: before the first
// command there is no decision to look at.
function sessionStepAt(position) {
  return session.steps.find((s) => position > s.from && position <= s.to) || null;
}

// The log as a DCB event store (`memoryStore`, evaluate.js): each
// event at its position, tagged as the model tags it.
function sessionStore(model, log) {
  return memoryStore(log.map((event) => ({ type: event.type, data: event.data, tags: tagsOfEvent(model, event.type, event.data) })));
}

// Drives a command against everything recorded so far – the one seam
// the driver button, an import's recorded steps and the agent tools
// all go through. It runs what dcb-runtime runs: the cycle against an
// event store (`handleCommand`), here one in memory over the log. A
// refusal changes nothing – not the log, not the position – and comes
// back as the ordinary outcome it is; only a run that cannot be
// evaluated at all throws. Nothing else writes to the store, so it
// never loses a race.
function sessionDrive(model, commandName, args) {
  loadSession(model.id);
  const result = handleCommand(model, sessionStore(model, session.log), commandName, args);
  if (result.outcome === 'rejected') return { outcome: 'rejected', failedRule: result.failedRule, reads: result.reads };
  if (result.outcome !== 'published') throw new EvaluationError(result.message || 'The decision lost a race nothing ran.');
  const events = result.events.map(({ type, data }) => ({ type, data }));
  const from = session.log.length;
  session.log.push(...events);
  session.steps.push({ command: commandName, args, from, to: session.log.length });
  session.at = null;
  saveSession();
  return { outcome: 'published', events, reads: result.reads };
}

function sessionRun(model, commandName, args) {
  let result;
  try {
    result = sessionDrive(model, commandName, args);
  } catch (error) {
    return toast(evaluationFailure(error), true);
  }
  if (result.outcome === 'rejected') {
    const rule = result.failedRule;
    return toast(`${readable(commandName)} was refused: ${rule.rejection || rule.text}`, true);
  }
  render();
}

// One instance, projected over what is visible. A scripted property
// folds the same way a declared one does: the binding's one
// identifier-typed argument is the instance itself, which is all this
// card has to give it.
function sessionInstanceState(model, tag, log = sessionVisible()) {
  const [entityName, id] = [tag.slice(0, tag.indexOf(':')), tag.slice(tag.indexOf(':') + 1)];
  const entity = model['entity-definitions'][entityName];
  if (!entity) return null;
  return {
    entity: entityName,
    id,
    properties: (entity.properties || []).map((property) => {
      try {
        return {
          name: property.name,
          value: foldEntityProperty(model, log, entityName, property.name, id),
        };
      } catch (error) {
        return { name: property.name, error: evaluationFailure(error) };
      }
    }),
  };
}


// ---------- driving one ----------
//
// Always on screen, in the page's header. A session is driven one
// command after another, and a driver that had to be opened for each
// one cost a click per step; the draft outlives a run for the same
// reason – the next step is usually the same command with one
// identifier changed.
function sandboxDriver(model) {
  const names = Object.keys(model['command-definitions']);
  if (!names.length) return h('span', { class: 'muted small' }, 'This model has no commands to drive yet.');
  if (!state.sandboxDraft || !names.includes(state.sandboxDraft.command)) {
    state.sandboxDraft = { command: names[0], arguments: {} };
  }
  const draft = state.sandboxDraft;
  const command = model['command-definitions'][draft.command];
  const run = () => sessionRun(model, state.sandboxDraft.command, state.sandboxDraft.arguments);
  // Not a <form>: the value editors carry buttons of their own (a
  // list's `+`), and any of them would submit it. Enter in a field
  // runs instead – after the field has handed its value over, which
  // it otherwise does only on `change`.
  return h('div', {
    class: 'sbx-driver',
    onkeydown: (e) => {
      if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
      e.preventDefault();
      e.target.dispatchEvent(new Event('change', { bubbles: true }));
      run();
    },
  },
    pick(names.map((n) => [n, readable(n), commandIcon(model, n)]), draft.command, (v) => {
      state.sandboxDraft = { command: v, arguments: {} };
      render();
    }),
    payloadEditor(model, (command || {}).properties, ['arguments'], sandboxWhere(model)),
    h('span', { class: 'grow' }),
    h('button', { class: 'btn primary', type: 'button', onclick: run }, 'Run'));
}

// ---------- the timeline ----------
//
// Under the header, over everything it moves: the watches and the step
// below are what the playhead shows, so it is read first. Compact by
// default – the whole run on one lane, in order, which is how most
// people think of a log. By tag is one lane per tag: a run is read as
// which instances were busy when, and a lane is the events a query for
// that tag would get back – the same thing a boundary asks the store
// for. An event with several tags is on several lanes, which is the
// point. By event type is the third reading, for a model whose tags say
// little. Every event is one fixed pitch wide, at its index, so the
// lanes, the ruler and the playhead share one axis – and a long run
// scrolls sideways instead of squeezing its marks until they blur.

const SANDBOX_PITCH = 22;          // px per event when there are lanes
const SANDBOX_PITCH_COMPACT = 34;  // px per event on the one compact lane
const SANDBOX_RULER = 5;           // events between ruler labels

function sandboxPitch() {
  return state.sandboxLanes === 'compact' ? SANDBOX_PITCH_COMPACT : SANDBOX_PITCH;
}

function sandboxLanes(model, mode) {
  if (mode === 'compact') return [{ key: '', label: '', events: session.log.map((event, i) => i) }];
  const lanes = new Map();
  const add = (key, label, i) => {
    if (!lanes.has(key)) lanes.set(key, { key, label, events: [] });
    lanes.get(key).events.push(i);
  };
  session.log.forEach((event, i) => {
    if (mode === 'type') {
      const icon = eventIcon(model, event.type);
      return add(event.type, [h('span', { class: 'ic' + fallbackIconClass(icon) }, icon), ' ', readable(event.type)], i);
    }
    const tags = tagsOfEvent(model, event.type, event.data);
    if (!tags.length) add('', 'untagged', i);
    for (const tag of tags) add(tag, tag, i);
  });
  const list = [...lanes.values()];
