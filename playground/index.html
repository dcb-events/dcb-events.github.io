        { value: `appends ${q.writes.length ? code(q.writes) : 'no tags'}` },
        ...(q.coverage.length ? [{ value: `⚠ Writes a tag it never consulted: ${q.coverage.map((c) => readable(c.entity)).join(', ')}` }] : []),
      ],
    };
  };
  // On a read, that read's share of the boundary; on a command's
  // header, the whole of it. Anywhere on either, the summary beside
  // them included – so no word under the cursor is required.
  L.registerHoverProvider('dcb', {
    provideHover: (textModel, position) => {
      const model = activeModel();
      if (!model) return null;
      const within = (q) => new monaco.Range(q.start.line, q.start.col, q.end.endLine, q.end.endCol)
        .containsPosition(position);
      const read = codeReadQueries(model).find(within);
      if (read) return readHover(read);
      const command = codeCommandQueries(model).find(within);
      return command ? commandHover(command) : null;
    },
  });
}

function createCodeEditor() {
  registerSourceLanguage();
  const root = h('div', { class: 'code-editor' });
  const uri = monaco.Uri.parse('inmemory://model/model' + SOURCE_EXTENSION);
  const model = monaco.editor.getModel(uri) || monaco.editor.createModel(codeView.text, 'dcb', uri);
  const editor = monaco.editor.create(root, {
    model,
    automaticLayout: true,
    minimap: { enabled: false },
    fontSize: 12.5,
    lineHeight: 19,
    fontFamily: scriptEditorFont(),
    tabSize: 2,
    scrollBeyondLastLine: false,
    wordBasedSuggestions: 'off',
    fixedOverflowWidgets: true,
    renderLineHighlight: 'line',
    padding: { top: 8, bottom: 8 },
    scrollbar: { alwaysConsumeMouseWheel: false },
  });
  editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, applyCode);
  editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, applyCode);
  model.onDidChangeContent(() => { if (!codeView.loading) onCodeInput(model.getValue()); });
  editor.onDidChangeCursorPosition(() => { if (codeView.cursorEl) codeView.cursorEl.textContent = codeCursorWords(); });
  // Escape belongs to the editor's own widgets, never to the page.
  root.addEventListener('keydown', (e) => { if (e.key === 'Escape') e.stopPropagation(); });
  return { root, editor, model, textFor: codeView.modelId };
}

function codeEditorElement() {
  if (scriptEditorPhase !== 'ready') {
    ensureScriptEditorLoaded();
    return h('textarea', {
      class: 'code-text mono', spellcheck: 'false', value: codeView.text,
      oninput: (e) => onCodeInput(e.target.value),
      onkeydown: (e) => {
        if (e.key === 'Escape') { e.stopPropagation(); return; }
        const key = e.key.toLowerCase();
        if ((e.metaKey || e.ctrlKey) && (key === 's' || key === 'enter')) {
          e.preventDefault();
          e.stopPropagation();
          applyCode();
        }
      },
    });
  }
  if (!codeView.editor) codeView.editor = createCodeEditor();
  writeCodeEditor(codeView.text);
  monaco.editor.setTheme(isDark() ? 'vs-dark' : 'vs');
  // A model's text opens the way the toggle says; after that, what the
  // author folds by hand stays folded across repaints and applies.
  if (codeView.editor.foldedFor !== codeView.modelId) {
    codeView.editor.foldedFor = codeView.modelId;
    applyCodeFold(codeView.fold);
  }
  return codeView.editor.root;
}

// The lines to fold for a mode, as 1-based starts of
// `sourceFoldingRanges`: the scenarios groups, then – for 'all' – every
// outermost block, so a definition opened by hand still shows its
// scenarios folded. A block holding a fault – an error, a broken or
// drifted scenario – is left open: a fault is not folded away, though
// a hand may still fold it.
function codeFoldLines(text, mode, faults) {
  if (mode === 'open') return [];
  const ranges = sourceFoldingRanges(text);
  const keep = (r) => !faults.some((line) => line >= r.start && line <= r.end);
  const groups = ranges.filter((r) => r.scenarios && keep(r)).map((r) => r.start);
  if (mode !== 'all') return groups;
  const inside = (r, o) => o !== r && o.start <= r.start && o.end >= r.end;
  const outermost = ranges.filter((r) => keep(r) && !ranges.some((o) => inside(r, o)));
  return [...groups, ...outermost.map((r) => r.start)];
}

// Everything open first, then folded the way the mode says, inner
// groups before the blocks around them. The fold action waits for the
// folding ranges of the text just loaded.
function applyCodeFold(mode) {
  if (!codeView.editor) return;
  const { editor, model: textModel } = codeView.editor;
  const model = activeModel();
  const faults = model
    ? codeDiagnostics(analyseCode(model)).filter((d) => d.error || d.scenario).map((d) => d.line)
    : [];
  editor.trigger('fold', 'editor.unfoldAll', null);
  for (const line of codeFoldLines(textModel.getValue(), mode, faults)) {
    editor.trigger('fold', 'editor.fold', { selectionLines: [line - 1], levels: 1, direction: 'up' });
  }
}

const CODE_FOLD_WORDS = { open: 'Nothing folded', scenarios: 'Scenarios folded', all: 'All folded' };
const CODE_FOLD_ICONS = {
  open: '<polyline points="7 15 12 20 17 15"></polyline><polyline points="7 9 12 4 17 9"></polyline>',
  scenarios: '<polyline points="7 20 12 15 17 20"></polyline><polyline points="7 4 12 9 17 4"></polyline>',
  all: '<polyline points="7 20 12 15 17 20"></polyline><polyline points="7 4 12 9 17 4"></polyline><path d="M4 12h16"></path>',
};

// One button through the three modes; it names the one in force.
function codeFoldToggle() {
  const mode = codeView.fold;
  const next = CODE_FOLDS[(CODE_FOLDS.indexOf(mode) + 1) % CODE_FOLDS.length];
  return h('button', {
    class: 'btn ghost tiny code-tool', type: 'button',
    title: `${CODE_FOLD_WORDS[mode]} – click for ${CODE_FOLD_WORDS[next].toLowerCase()}`,
    onclick: (e) => {
      codeView.fold = next;
      localStorage.setItem(SCENARIO_FOLD_KEY, next);
      applyCodeFold(next);
      e.currentTarget.replaceWith(codeFoldToggle());
    },
  }, codeToolIcon(CODE_FOLD_ICONS[mode]), CODE_FOLD_WORDS[mode]);
}

function codeToolIcon(paths) {
  return h('span', { class: 'code-tool-icon' },
    svg('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" '
      + 'stroke-linejoin="round" aria-hidden="true">' + paths + '</svg>'));
}

// The exported JSON as a file – named like the code's download, so the
// two sit together – for a gist or a bucket to take as it is.
function downloadModelJson(model, text) {
  const blob = new Blob([text], { type: 'application/json' });
  const link = h('a', {
    href: URL.createObjectURL(blob),
    download: (toCamel(model.name) || 'model') + SOURCE_EXTENSION + '.json',
  });
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}

function downloadCode(model) {
  const blob = new Blob([codeView.text], { type: 'text/plain' });
  const link = h('a', {
    href: URL.createObjectURL(blob),
    download: (toCamel(model.name) || 'model') + SOURCE_EXTENSION,
  });
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}

function renderCode(model, main) {
  syncCodeView(model);
  main.appendChild(h('header', {},
    h('div', { class: 'name' }, 'Code',
      hint('code', 'The model as code', [
        ['Every type, event, entity, projection and command on the other pages, as one text. '
          + 'Edit it and apply with ', kbd('Mod+S'), '; going back to the pages applies it too. An apply is one undo step.'],
        'Scenarios sit in a scenarios group at the end of the command or projection they exercise, '
          + 'folded to one line until opened. The fold button steps through nothing folded, scenarios folded, '
          + 'and every definition folded with its scenarios still folded inside. Leave a then out and '
          + 'applying records what the model does; a drifted one is marked, with a fix that accepts it. '
          + 'Comments are not stored – they last as long as the text in this editor.',
        ['Hover a command\'s name for the consistency boundary it derives; ', kbd('Mod+click'),
          ' a name to go to it; ', kbd('Mod+Shift+O'), ' lists every definition. ', kbd('Ctrl+Space'),
          ' suggests what fits where the cursor is; ', kbd('F2'), ' renames a name everywhere it means '
          + 'the same thing, and ', kbd('Shift+F12'), ' lists where it is used.'],
      ], NOTATION_GUIDE_URL, 'notation')),
    h('div', { class: 'muted small' }, 'The same definitions as the pages, written out.')));

  const editorElement = codeEditorElement();
  main.appendChild(h('div', { class: 'code-bar' },
    // Monaco folds; the textarea it falls back to cannot.
    codeView.editor && editorElement === codeView.editor.root ? codeFoldToggle() : null,
    h('button', {
      class: 'btn ghost tiny code-tool', type: 'button',
      onclick: () => runAsync(async () => { await navigator.clipboard.writeText(codeView.text); toast('Copied.'); }),
    }, codeToolIcon('<rect x="9" y="9" width="12" height="12" rx="2"></rect>'
      + '<path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"></path>'), 'Copy'),
    h('button', { class: 'btn ghost tiny code-tool', type: 'button', onclick: () => downloadCode(model) },
      codeToolIcon('<path d="M12 3v12"></path><polyline points="7 10 12 15 17 10"></polyline><path d="M5 21h14"></path>'),
      'Download ' + SOURCE_EXTENSION),
    h('a', { class: 'small code-ref', href: NOTATION_REFERENCE_URL, target: '_blank', rel: 'noopener' }, 'Notation reference ↗')));

  codeView.statusEl = codeStrip();
  main.appendChild(h('div', { class: 'code-box' }, editorElement, codeView.statusEl));
  const analysis = analyseCode(model);
  codeView.listEl = codeProblemList(analysis);
  main.appendChild(codeView.listEl);

  // Follow the page state: reveal the definition it is about whenever
  // that changed since the code was last shown.
  // A section asked for once (`codeView.section`) is revealed over the
  // page's own definition, which is then taken as shown – so the next
  // paint stays where the section put the text.
  const page = pageDefinition();
  const target = Array.isArray(codeView.section) ? codeView.section
    : codeView.section ? [codeView.section, null] : page;
  codeView.section = null;
  const key = target ? target.join(':') : null;
  const shown = codeView.shownView;
  codeView.shownView = state.view;
  // Monaco loads behind the first paint, which is the textarea; the
  // paint that brings it in reveals again, in the editor that stays.
  const intoEditor = !!codeView.editor && !codeView.revealedInEditor;
  if (key !== codeView.focus || shown === null || intoEditor) {
    codeView.focus = page ? page.join(':') : null;
    codeView.revealedInEditor = !!codeView.editor;
    const span = !target ? null : target[1] === null
      ? sourceKindStart(analysis.parsed, target[0], codeView.text)
      : sourceSpanOf(analysis.parsed, target[0], target[1]);
    // After this paint has attached the editor – a timeout rather than
    // a frame, which a background tab never gets.
    setTimeout(() => {
      if (span) revealCodeAt(span.nameLine, span.nameCol, span.line);
      else if (codeView.editor) codeView.editor.editor.focus();
    }, 0);
  }
  setTimeout(refreshCodeChrome, 0);
}

// Escape backs out of one layer, wherever the focus happens to be, and
// the layers are the order in which they were opened: the settings sit
// over the page, a form sits over the row that opened it, and a
// selected row sits under both. Nothing here reaches the model – every
// layer it closes is a decision not yet made.
window.addEventListener('keydown', (e) => {
  // A field that handles Escape itself has already handled it: the
  // inline forms cancel on it, and cancelling once should not also
  // throw away the selection underneath.
  if (e.key !== 'Escape' || e.defaultPrevented) return;

  // Quick open handles its own Escape and stops it there, so reaching
  // this while it is up means it is already gone.
  if (state.palette) { closePalette(); return render(); }
  if (state.queryPop) { state.queryPop = null; return render(); }
  if (state.hintPop) { state.hintPop = null; return render(); }
  if (state.lcMenu) { state.lcMenu = null; return render(); }
  if (state.moreOpen) { state.moreOpen = false; return render(); }
  if (state.pendingImport) { cancelImport(); return render(); }
  if (state.importExport) { state.importExport = false; return render(); }
  if (state.help) { state.help = false; return render(); }
  if (state.problems) { state.problems = false; return render(); }
  if (state.settings) { state.settings = false; return render(); }
  if (state.models) {
    state.models = false;
    state.newModel = false; state.loadingUrl = false; state.loadingJson = false;
    return render();
  }

  // A definition modal is layered the way the page is – a field, then
  // a form inside it, then a selected row – and only once those are
  // gone does Escape close the modal itself, the top one only.
  if (state.defFrames.length) {
    const inField = e.target instanceof Element && e.target.closest('input, textarea, select');
    if (inField) { inField.blur(); return; }
    discardPendingEdits();
    if (formOpen() || state.sel || state.adder || state.lit) {
      closeForms();
      return render();
    }
    closeDefinitionModal();
    return render();
  }

  // Inside a free text field, Escape is about the field: it steps out
  // and leaves everything else where it is. A second press then backs
  // out of the row the field was in.
  const field = e.target instanceof Element
    && e.target.closest('input, textarea, select');
  if (field) { field.blur(); return; }

  // Escape is the one way out that never commits: whatever edit was
  // half-made is dropped *before* `closeForms` runs, because
  // `closeForms` commits pending edits for every other gesture and
  // "never mind" must not be the exception that adds something.
  if (formOpen()) { discardPendingEdits(); closeForms(); return render(); }

  // A selected row, an adder unfolded under a list, a reference pinned
  // to its source: whichever of these is on, Escape puts it back.
  if (state.sel || state.adder || state.lit) {
    const key = state.sel;
    // An open adder folds back to a single button, which is fewer tab
    // stops than the form it replaces – closing it shifts everything
    // after it up the page, so the generic by-position focus restore in
    // `render` overshoots into whatever now sits where the keyboard
    // used to be. Noting which step the keyboard was in before the
    // repaint is what lets it land on that step's own folded button
    // instead, the same way opening one does.
    const openStep = document.activeElement instanceof Element
      ? document.activeElement.closest('.step')
      : null;
    const openStepKind = openStep
      && [...openStep.classList].find((c) => c !== 'step');
    state.sel = null; state.adder = null; state.lit = null;
    discardPendingEdits();     // Escape discards, always – see above
    render();
    // Deselecting must not also lose the keyboard's place on the page.
    if (key) {
      const row = document.querySelector(`.qrow[data-key="${CSS.escape(key)}"]`);
      if (row) row.focus();
    } else if (openStepKind) {
      const btn = document.querySelector('.step.' + openStepKind + ' .flow-adder');
      if (btn) btn.focus();
    }
  }
});

// ⌘K, ⌘S and ⌘Z: quick open, sharing and undo, all reachable from
// anywhere in the page.
window.addEventListener('keydown', (e) => {
  if (e.defaultPrevented) return;
  const command = e.metaKey || e.ctrlKey;
  if (!command) return;
  const key = e.key.toLowerCase();

  if (key === 'k') {
    if (!activeModelId()) return;
    e.preventDefault();
    if (state.palette) { closePalette(); render(); } else openPalette();
  } else if (key === 's') {
    if (!activeModelId()) return;
    e.preventDefault();
    runAsync(shareCurrentModel);
  } else if (key === 'z') {
    // Inside a field ⌘Z is the field's own undo, and taking it would
    // make a half-typed name unrecoverable.
    const inField = e.target instanceof Element
      && e.target.closest('input, textarea, select');
    if (inField) return;
    e.preventDefault();
    run(() => (e.shiftKey ? redo() : undo()));
  }
});

// `?` opens the help – the convention, and the one key a field never
// needs to give up, since inside one it is only ever typed.
window.addEventListener('keydown', (e) => {
  if (e.defaultPrevented || e.key !== '?' || e.metaKey || e.ctrlKey || e.altKey) return;
  const inField = e.target instanceof Element
    && e.target.closest('input, textarea, select, [contenteditable]');
  if (inField || state.palette || state.pendingImport) return;
  e.preventDefault();
  openHelp();
});

// Arrow keys move between rows. Reading a command is walking down its
// rows – Tab visits every button on the way, the arrows visit only the
// rows.
window.addEventListener('keydown', (e) => {
  if (e.defaultPrevented) return;
  const inField = e.target instanceof Element
    && e.target.closest('input, textarea, select');
  if (!inField && !dialogOpen() && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    if (moveRow(e.key === 'ArrowDown' ? 1 : -1)) e.preventDefault();
  }
});

// The disclaimer wraps to two lines on a narrow-enough screen, which
// changes .topbar's real height – everything sticky beneath it reads
// `--topbar-h` rather than a guessed constant, so it stays measured
// instead of drifting out of sync on resize or rotation.
function syncTopbarHeight() {
  const topbar = document.querySelector('.topbar');
  if (topbar) document.documentElement.style.setProperty('--topbar-h', topbar.offsetHeight + 'px');
}
window.addEventListener('resize', syncTopbarHeight);

// Set once at load – a copyright year has no reason to change again
// before the next reload, unlike the topbar height above.
function setFooterYear() {
  document.getElementById('footer-year').textContent = new Date().getFullYear();
}

// The rail drawer closes itself once a link in it is actually followed
// – on a narrow screen there is no other way back to the content it
// was covering. Delegated once, on the rail's own element (which
// `renderRail` never replaces, only refills), rather than threaded
// through every one of its many links.
document.getElementById('rail').addEventListener('click', (e) => {
  if (state.railOpen && e.target.closest('a')) { state.railOpen = false; render(); }
});

// A `#model=…` or `#url=…` fragment never reaches the server (there is
// none), so it is read here and on a change of it (`readModelLink`,
// `openModelLink`). One that loads stays in the address bar until its
// model changes or another is opened (`addressModelId`); one that does
// not is cleared at once. A `#url=` link fetches its file anew on every
// open; the copy it makes is of the file as it is then. A link may add `&surface=code` (or
// `visual`) to say which surface the model opens on – dcb.events does
// on the pages explaining the notation, whose reader came for the text –
// and `&experimental` to show experimental features for this session.
async function boot() {
  // Safe mode – the way back into a model whose script hangs the page
  // on load, now that scripts run unprompted like everything else.
  // Typing `?safe` into the address is the gesture (the import gate
  // names it), and every script handler then compiles to a thrower
  // instead of running (see evaluate.js). A reload after a load that
  // never painted takes it unasked: the flag below is set before the
  // first render and cleared once that render has returned, so finding
  // it still set means the last load hung. That lasts one load – a
  // plain reload runs scripts again, so a reload that merely
  // interrupted a slow page costs nothing more. A tab closed instead
  // of reloaded loses the flag with its sessionStorage; the gate's
  // mention of `?safe` is for that case.
  let lastLoadHung = false;
  try {
    lastLoadHung = sessionStorage.getItem(BOOT_KEY) !== null;
    sessionStorage.setItem(BOOT_KEY, '1');
  } catch { /* no sessionStorage: no detection, ?safe still works */ }
  // Not requestAnimationFrame: a tab opened in the background paints
  // nothing until shown, and would read as hung. Boot runs the first
  // render synchronously below, so this timer fires only after it.
  setTimeout(() => {
    try { sessionStorage.removeItem(BOOT_KEY); } catch { /* as above */ }
  }, 0);
  if (new URLSearchParams(location.search).has('safe')) {
    setScriptsDisabled(true);
    toast('Safe mode – scripts are off. Remove "?safe" from the address to run them.', true);
  } else if (lastLoadHung) {
    setScriptsDisabled(true);
    toast('The last load did not finish, so scripts are off for this one. Reload to run them again.', true);
  }
  const link = readModelLink(location.hash);
  // Entering without a model link starts at the models dialog, over
  // whatever was open last – see `modelsModal`.
  if (!link) state.models = true;
  render();
  syncTopbarHeight();
  setFooterYear();
  if (link) await openModelLink(link);
}

// A link pasted into the address bar of a page already open changes
// only the fragment, which reloads nothing – so the fragment is read
// on its change too, not only on boot.
async function openModelLink(link) {
  addressModelId = null;
  const surface = link.options.get('surface');
  if (surface === 'code' || surface === 'visual') setCodeSurface(surface === 'code');
  if (link.options.has('experimental')) enableExperimentalForSession();
  let envelope;
  try {
    envelope = link.kind === 'model' ? await decodeShareLink(link.value) : await loadModelFromUrl(link.value);
  } catch (error) {
    // Nothing came in, so the page is where entering without a link
    // leaves it: the models dialog.
    toast(link.kind === 'model' ? 'That share link could not be read: ' + error.message
      : error instanceof DomainError ? error.message
        : 'That model URL could not be loaded: ' + error.message, true);
    dropAddressLink();
    state.models = true;
    render();
    return;
  }
  // Opened before and unchanged since: back to that copy rather than a
  // second one beside it (`modelMatchingEnvelope`). The script gate is
  // not asked again for code it already let in. Unchanged, it is still
  // a linked copy waiting on its first change – even one opened before
  // copies were marked at all.
  const existing = modelMatchingEnvelope(envelope);
  if (existing) {
    markLinkedCopy(existing);
    switchToModel(existing);
    linkInAddressBar(existing);
    state.models = false;
    render();
    toast('This model was opened before – switched to it.');
    return;
  }
  linkedEnvelopes.add(envelope);
  beginImport(envelope);
}

window.addEventListener('DOMContentLoaded', boot);
window.addEventListener('hashchange', () => {
  const link = readModelLink(location.hash);
  if (link) openModelLink(link);
});
</script>
</body>
</html>
